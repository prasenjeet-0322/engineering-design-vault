<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI 08 Part 13 — Form Performance & Optimization Simulator</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(26, 34, 52, 0.75);
      --card-border: rgba(99, 102, 241, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 75%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1250px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      padding: 24px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    header h1 {
      font-size: 1.5rem;
      background: linear-gradient(135deg, #a5b4fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
    }

    @media (max-width: 950px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      padding: 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: rgba(51, 65, 85, 0.8);
      color: #cbd5e1;
      border: 1px solid #475569;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #475569;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.6);
      font-family: monospace;
      font-size: 0.85rem;
    }

    .field-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .field-card.render-flash {
      animation: flashRed 0.3s ease-out;
    }

    @keyframes flashRed {
      0% { border-color: #ef4444; background: rgba(239, 68, 68, 0.25); }
      100% { border-color: #334155; background: rgba(15, 23, 42, 0.8); }
    }

    input {
      background: #090d16;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.85rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    .pill {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .pill-green { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .pill-red { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .pill-yellow { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }

    .gauge-bar {
      height: 10px;
      border-radius: 5px;
      background: #334155;
      overflow: hidden;
      margin-top: 4px;
    }

    .gauge-fill {
      height: 100%;
      transition: width 0.15s ease, background-color 0.15s ease;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useMemo, useCallback, useSyncExternalStore } = React;

    // --- External Subscription Store Implementation ---
    class FormStore {
      constructor(initialValues) {
        this.values = { ...initialValues };
        this.listeners = new Set();
        this.fieldListeners = new Map();
      }

      subscribeField(field, listener) {
        if (!this.fieldListeners.has(field)) {
          this.fieldListeners.set(field, new Set());
        }
        this.fieldListeners.get(field).add(listener);
        return () => this.fieldListeners.get(field)?.delete(listener);
      }

      getFieldValue(field) {
        return this.values[field];
      }

      setFieldValue(field, value) {
        if (this.values[field] === value) return;
        this.values[field] = value;
        this.fieldListeners.get(field)?.forEach(l => l());
      }
    }

    // --- Isolated Field Component (Mode: Optimized) ---
    const OptimizedField = React.memo(function OptimizedField({ store, fieldKey, label, onRender }) {
      const renderCount = useRef(0);
      renderCount.current++;
      onRender(fieldKey);

      const value = useSyncExternalStore(
        useCallback((cb) => store.subscribeField(fieldKey, cb), [store, fieldKey]),
        useCallback(() => store.getFieldValue(fieldKey), [store, fieldKey])
      );

      return (
        <div className="field-card render-flash">
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: "0.75rem" }}>
            <span style={{ color: "#94a3b8" }}>{label}</span>
            <span style={{ color: "#38bdf8", fontWeight: "bold" }}>Renders: {renderCount.current}</span>
          </div>
          <input
            type="text"
            value={value || ""}
            onChange={(e) => store.setFieldValue(fieldKey, e.target.value)}
          />
        </div>
      );
    });

    // --- Monolithic Field Component (Mode: Unoptimized) ---
    function MonolithicField({ fieldKey, label, value, onChange, onRender }) {
      const renderCount = useRef(0);
      renderCount.current++;
      onRender(fieldKey);

      return (
        <div className="field-card render-flash">
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: "0.75rem" }}>
            <span style={{ color: "#94a3b8" }}>{label}</span>
            <span style={{ color: "#f87171", fontWeight: "bold" }}>Renders: {renderCount.current}</span>
          </div>
          <input
            type="text"
            value={value || ""}
            onChange={(e) => onChange(fieldKey, e.target.value)}
          />
        </div>
      );
    }

    // --- Expensive Sibling Component ---
    const ExpensiveSibling = React.memo(function ExpensiveSibling({ heavyLoadMs, isCoupled, triggerTick }) {
      const renderCount = useRef(0);
      renderCount.current++;

      // Artificial Heavy CPU Computation
      if (heavyLoadMs > 0 && (isCoupled || renderCount.current === 1)) {
        const start = performance.now();
        while (performance.now() - start < heavyLoadMs) {
          // Block Main Thread
        }
      }

      return (
        <div style={{ background: "rgba(15, 23, 42, 0.7)", border: "1px solid #334155", padding: "12px", borderRadius: "8px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "4px" }}>
            <span style={{ fontSize: "0.85rem", fontWeight: 600, color: "#cbd5e1" }}>
              📊 Heavy Live Calculation / Preview Sibling
            </span>
            <span className="pill pill-yellow">Renders: {renderCount.current}</span>
          </div>
          <p style={{ fontSize: "0.8rem", color: "#94a3b8" }}>
            Workload: <strong>{heavyLoadMs}ms</strong> CPU block per render | Coupling: <strong>{isCoupled ? "Synchronous" : "Isolated"}</strong>
          </p>
        </div>
      );
    });

    function App() {
      const [mode, setMode] = useState("optimized"); // 'optimized' | 'monolithic'
      const [heavyLoadMs, setHeavyLoadMs] = useState(0);
      const [coupledSibling, setCoupledSibling] = useState(false);
      const [lastDuration, setLastDuration] = useState(0);
      const [totalRendersThisKeystroke, setTotalRendersThisKeystroke] = useState(0);

      const renderCounterRef = useRef(0);

      // 30 Field Grid Initial Values
      const initialData = useMemo(() => {
        const data = {};
        for (let i = 1; i <= 30; i++) {
          data[`field_${i}`] = `Data ${i}`;
        }
        return data;
      }, []);

      // Monolithic State
      const [monolithicValues, setMonolithicValues] = useState(initialData);

      // Subscription Store
      const storeRef = useRef(null);
      if (!storeRef.current) {
        storeRef.current = new FormStore(initialData);
      }

      const handleRenderTrack = useCallback((fieldKey) => {
        renderCounterRef.current++;
      }, []);

      const handleMonolithicChange = (field, val) => {
        const t0 = performance.now();
        renderCounterRef.current = 0;

        setMonolithicValues(prev => ({ ...prev, [field]: val }));

        requestAnimationFrame(() => {
          const t1 = performance.now();
          setLastDuration(t1 - t0);
          setTotalRendersThisKeystroke(renderCounterRef.current);
        });
      };

      const handleOptimizedTyping = () => {
        const t0 = performance.now();
        renderCounterRef.current = 0;

        requestAnimationFrame(() => {
          const t1 = performance.now();
          setLastDuration(t1 - t0);
          setTotalRendersThisKeystroke(renderCounterRef.current || 1);
        });
      };

      const keys = Object.keys(initialData);

      return (
        <div className="container">
          <header>
            <div>
              <h1>KPI 08 Part 13 — Form Performance & Optimization Architecture</h1>
              <p style={{ color: "#94a3b8", fontSize: "0.85rem", marginTop: "4px" }}>
                Fine-Grained Subscriptions, Render Blast Radius Pruning, and Keystroke Frame Budgets
              </p>
            </div>
            <div className="badge">Level 06 — React Fundamentals</div>
          </header>

          <div className="grid">
            {/* Left Column: 30-Input Interactive Grid */}
            <div className="card">
              <div className="card-title">
                <span>30-Input Interactive Form Grid</span>
                <span className={`pill ${mode === "optimized" ? "pill-green" : "pill-red"}`}>
                  {mode === "optimized" ? "O(1) SUBSCRIPTION ISOLATED" : "O(N) MONOLITHIC BROADCAST"}
                </span>
              </div>

              {/* Mode Toggle Controls */}
              <div style={{ display: "flex", gap: "10px" }}>
                <button
                  className={`btn ${mode === "optimized" ? "btn-primary" : "btn-secondary"}`}
                  style={{ flex: 1 }}
                  onClick={() => setMode("optimized")}
                >
                  ⚡ Optimized Subscription Store
                </button>
                <button
                  className={`btn ${mode === "monolithic" ? "btn-primary" : "btn-secondary"}`}
                  style={{ flex: 1 }}
                  onClick={() => setMode("monolithic")}
                >
                  🐢 Monolithic useState (Anti-Pattern)
                </button>
              </div>

              {/* Expensive Sibling Component */}
              <ExpensiveSibling
                heavyLoadMs={heavyLoadMs}
                isCoupled={coupledSibling && mode === "monolithic"}
                triggerTick={monolithicValues}
              />

              {/* Field Grid */}
              <div
                style={{
                  display: "grid",
                  gridTemplateColumns: "1fr 1fr",
                  gap: "10px",
                  maxHeight: "380px",
                  overflowY: "auto",
                  paddingRight: "6px"
                }}
                onInput={mode === "optimized" ? handleOptimizedTyping : undefined}
              >
                {keys.map((k) => (
                  mode === "optimized" ? (
                    <OptimizedField
                      key={k}
                      store={storeRef.current}
                      fieldKey={k}
                      label={`Field #${k.replace("field_", "")}`}
                      onRender={handleRenderTrack}
                    />
                  ) : (
                    <MonolithicField
                      key={k}
                      fieldKey={k}
                      label={`Field #${k.replace("field_", "")}`}
                      value={monolithicValues[k]}
                      onChange={handleMonolithicChange}
                      onRender={handleRenderTrack}
                    />
                  )
                ))}
              </div>
            </div>

            {/* Right Column: Performance Telemetry & Profiler */}
            <div className="card">
              <div className="card-title">
                <span>Keystroke Profiler & Frame Telemetry</span>
                <span className="badge">16.6ms Budget Target</span>
              </div>

              {/* Workload Simulators */}
              <div style={{ display: "flex", flexDirection: "column", gap: "12px", background: "rgba(15, 23, 42, 0.6)", padding: "14px", borderRadius: "10px", border: "1px solid #334155" }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: "0.85rem" }}>
                  <span>Expensive Sibling Workload: <strong>{heavyLoadMs}ms</strong></span>
                  <input
                    type="range"
                    min="0"
                    max="50"
                    step="5"
                    value={heavyLoadMs}
                    onChange={(e) => setHeavyLoadMs(Number(e.target.value))}
                    style={{ width: "120px" }}
                  />
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: "8px", fontSize: "0.85rem" }}>
                  <input
                    type="checkbox"
                    id="coupled-check"
                    checked={coupledSibling}
                    onChange={(e) => setCoupledSibling(e.target.checked)}
                  />
                  <label htmlFor="coupled-check" style={{ color: "#cbd5e1" }}>
                    Couple Sibling Synchronously to Typing
                  </label>
                </div>
              </div>

              {/* Performance Metrics */}
              <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
                <div className="telemetry-row">
                  <span style={{ color: "#94a3b8" }}>Component Rerenders / Keypress:</span>
                  <span style={{ fontWeight: 600, color: totalRendersThisKeystroke > 5 ? "#f87171" : "#34d399" }}>
                    {totalRendersThisKeystroke} of 30 inputs
                  </span>
                </div>

                <div className="telemetry-row">
                  <span style={{ color: "#94a3b8" }}>JS Execution Duration:</span>
                  <span style={{ fontWeight: 600, color: lastDuration > 16.6 ? "#f87171" : "#38bdf8" }}>
                    {lastDuration.toFixed(2)} ms
                  </span>
                </div>

                <div>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: "0.8rem", color: "#94a3b8" }}>
                    <span>Frame Budget (16.6ms max for 60 FPS):</span>
                    <span>{Math.min(100, (lastDuration / 16.6) * 100).toFixed(0)}%</span>
                  </div>
                  <div className="gauge-bar">
                    <div
                      className="gauge-fill"
                      style={{
                        width: `${Math.min(100, (lastDuration / 16.6) * 100)}%`,
                        backgroundColor: lastDuration > 16.6 ? "#ef4444" : lastDuration > 8 ? "#f59e0b" : "#10b981"
                      }}
                    />
                  </div>
                </div>
              </div>

              {/* Architectural Insights */}
              <div style={{ background: "#0f172a", border: "1px solid #1e293b", padding: "14px", borderRadius: "8px", fontSize: "0.85rem" }}>
                <h4 style={{ color: "#38bdf8", marginBottom: "6px" }}>Senior Optimization Takeaways:</h4>
                <ul style={{ margin: "0 0 0 16px", color: "#94a3b8", display: "flex", flexDirection: "column", gap: "4px" }}>
                  <li><strong>Mode A (Monolithic):</strong> Every keystroke triggers 30 component executions, re-diffing the entire tree and blocking the main thread.</li>
                  <li><strong>Mode B (Subscription):</strong> <code>useSyncExternalStore</code> localizes updates to O(1) input renders.</li>
                  <li><strong>Sibling Decoupling:</strong> Heavy computations are kept outside high-frequency typing render loops.</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
