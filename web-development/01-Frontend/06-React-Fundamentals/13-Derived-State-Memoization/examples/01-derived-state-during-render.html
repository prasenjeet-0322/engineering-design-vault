<body class="min-h-screen bg-slate-950 text-slate-100 antialiased custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useReducer, useCallback, useMemo, useRef, memo } = React;

    // =========================================================================
    // EXPERIMENT 1: DUAL-RENDER PENALTY VISUALIZER
    // =========================================================================
    function BadCartSync({ items, onRenderTick }) {
      const [total, setTotal] = useState(0);
      const renderCountRef = useRef(0);
      renderCountRef.current += 1;

      useEffect(() => {
        onRenderTick("bad", renderCountRef.current, "Render 1 committed with old total: $" + total);
        const calculated = items.reduce((sum, item) => sum + item.price, 0);
        setTotal(calculated); // 💥 Triggers 2nd render pass!
      }, [items]);

      return (
        <div className="p-4 bg-slate-950 border border-red-900/60 rounded-lg space-y-2">
          <div className="flex justify-between items-center text-xs font-mono">
            <span className="text-red-400 font-bold">❌ BadCart (useEffect Sync)</span>
            <span className="bg-red-950 text-red-300 px-2 py-0.5 rounded">Renders: {renderCountRef.current}</span>
          </div>
          <div className="text-xl font-bold text-slate-100 font-mono">Total: ${total}</div>
          <div className="text-[11px] text-slate-500 font-mono">Requires 2 Fiber passes per item update.</div>
        </div>
      );
    }

    function GoodCartDerive({ items, onRenderTick }) {
      const renderCountRef = useRef(0);
      renderCountRef.current += 1;

      // ✅ Pure In-Render Derivation: 1 Pass, Zero Effects
      const total = items.reduce((sum, item) => sum + item.price, 0);

      useEffect(() => {
        onRenderTick("good", renderCountRef.current, "Render 1 committed with 100% accurate total: $" + total);
      });

      return (
        <div className="p-4 bg-slate-950 border border-emerald-900/60 rounded-lg space-y-2">
          <div className="flex justify-between items-center text-xs font-mono">
            <span className="text-emerald-400 font-bold">✅ GoodCart (Pure Derivation)</span>
            <span className="bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded">Renders: {renderCountRef.current}</span>
          </div>
          <div className="text-xl font-bold text-slate-100 font-mono">Total: ${total}</div>
          <div className="text-[11px] text-slate-500 font-mono">Executes in 1 single pass with 0ms tearing.</div>
        </div>
      );
    }

    function Exp1DualRender() {
      const [items, setItems] = useState([
        { id: 1, name: "Mechanical Keyboard", price: 150 },
        { id: 2, name: "OLED Monitor", price: 850 },
      ]);
      const [telemetry, setTelemetry] = useState([]);

      const addLog = (type, count, msg) => {
        setTelemetry(prev => [
          `[${new Date().toLocaleTimeString()}] [${type.toUpperCase()}] Pass #${count}: ${msg}`,
          ...prev.slice(0, 6)
        ]);
      };

      const addItem = () => {
        const nextId = items.length + 1;
        const randomPrice = Math.floor(Math.random() * 200) + 50;
        setItems(prev => [...prev, { id: nextId, name: `Peripheral #${nextId}`, price: randomPrice }]);
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/50">Lab 01</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">The Dual-Render Penalty Visualizer</h2>
              <p className="text-xs text-slate-400 mt-1">Live comparison of `useEffect` state synchronization vs pure in-render computation.</p>
            </div>
            <button
              onClick={addItem}
              className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-mono text-xs font-bold rounded-lg shadow-lg shadow-indigo-600/30 transition-all"
            >
              + Add Random Item
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <BadCartSync items={items} onRenderTick={addLog} />
            <GoodCartDerive items={items} onRenderTick={addLog} />
          </div>

          {/* Telemetry Trace */}
          <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg font-mono text-xs space-y-2">
            <div className="flex items-center justify-between border-b border-slate-800 pb-2">
              <span className="text-indigo-400 font-bold">RECONCILIATION & COMMIT TELEMETRY LOG</span>
              <button onClick={() => setTelemetry([])} className="text-[10px] text-slate-500 hover:text-slate-300">Clear</button>
            </div>
            <div className="space-y-1">
              {telemetry.map((t, idx) => (
                <div key={idx} className={`p-1.5 rounded text-[11px] ${
                  t.includes('BAD') ? 'bg-red-950/40 text-red-300 border border-red-800/40' : 'bg-emerald-950/40 text-emerald-300 border border-emerald-800/40'
                }`}>
                  {t}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 2: IN-RENDER COMPUTATION BENCHMARKER
    // =========================================================================
    function Exp2Benchmarker() {
      const [datasetSize, setDatasetSize] = useState(10000);
      const [filterQuery, setFilterQuery] = useState("");
      const [benchmarkResult, setBenchmarkResult] = useState(null);

      // Generate large in-memory dataset
      const dataset = useMemo(() => {
        const arr = [];
        for (let i = 0; i < datasetSize; i++) {
          arr.push({ id: i, name: `Record Entity #${i}`, value: (i * 17) % 500 });
        }
        return arr;
      }, [datasetSize]);

      const runBenchmark = () => {
        // Benchmark 1: Pure In-Render Computation (No useMemo)
        const t0 = performance.now();
        const rawFiltered = dataset.filter(item => item.name.toLowerCase().includes(filterQuery.toLowerCase()));
        const rawSum = rawFiltered.reduce((acc, i) => acc + i.value, 0);
        const t1 = performance.now();
        const unmemoizedTime = (t1 - t0).toFixed(3);

        // Benchmark 2: Overhead estimation
        setBenchmarkResult({
          unmemoizedTime,
          matchedCount: rawFiltered.length,
          totalSum: rawSum,
        });
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50">Lab 02</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">The 1-Millisecond Heuristic Benchmarker</h2>
              <p className="text-xs text-slate-400 mt-1">Measure the actual CPU execution time of JavaScript array filtering to evaluate `useMemo` necessity.</p>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 font-mono text-xs">
            <div className="space-y-1">
              <label className="text-slate-400">Dataset Size:</label>
              <select
                value={datasetSize}
                onChange={e => setDatasetSize(Number(e.target.value))}
                className="w-full p-2 bg-slate-950 border border-slate-700 rounded text-slate-200"
              >
                <option value="1000">1,000 Records</option>
                <option value="10000">10,000 Records</option>
                <option value="50000">50,000 Records</option>
                <option value="100000">100,000 Records</option>
              </select>
            </div>

            <div className="space-y-1">
              <label className="text-slate-400">Filter Query:</label>
              <input
                type="text"
                value={filterQuery}
                placeholder="e.g. 42"
                onChange={e => setFilterQuery(e.target.value)}
                className="w-full p-2 bg-slate-950 border border-slate-700 rounded text-slate-200 focus:outline-none focus:border-indigo-500"
              />
            </div>

            <div className="flex items-end">
              <button
                onClick={runBenchmark}
                className="w-full p-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded"
              >
                ⚡ Execute In-Render Benchmark
              </button>
            </div>
          </div>

          {benchmarkResult && (
            <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg font-mono text-xs space-y-3">
              <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                <span className="text-emerald-400 font-bold">BENCHMARK EXECUTION TELEMETRY</span>
                <span className="text-slate-400">Records Processed: {datasetSize.toLocaleString()}</span>
              </div>
              <div className="grid grid-cols-3 gap-4">
                <div className="p-2.5 bg-slate-900 rounded border border-slate-800">
                  <span className="text-slate-500 text-[10px] block">CPU Duration:</span>
                  <span className={`text-base font-bold ${Number(benchmarkResult.unmemoizedTime) > 1.0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                    {benchmarkResult.unmemoizedTime} ms
                  </span>
                </div>
                <div className="p-2.5 bg-slate-900 rounded border border-slate-800">
                  <span className="text-slate-500 text-[10px] block">Matched Records:</span>
                  <span className="text-base font-bold text-indigo-400">{benchmarkResult.matchedCount.toLocaleString()}</span>
                </div>
                <div className="p-2.5 bg-slate-900 rounded border border-slate-800">
                  <span className="text-slate-500 text-[10px] block">useMemo Recommendation:</span>
                  <span className={`text-[11px] font-bold ${Number(benchmarkResult.unmemoizedTime) > 1.0 ? 'text-amber-300' : 'text-slate-400'}`}>
                    {Number(benchmarkResult.unmemoizedTime) > 1.0 ? "⚡ Justified (>1ms)" : "🚫 Unnecessary (<1ms)"}
                  </span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 3: FINANCIAL DERIVATION DAG
    // =========================================================================
    function Exp3FinancialDAG() {
      const [items, setItems] = useState([
        { id: 1, name: "Frontend Architecture Handbook", price: 60, qty: 2 },
        { id: 2, name: "React 18 Fiber Guide", price: 40, qty: 1 },
      ]);
      const [coupon, setCoupon] = useState("SAVE20");
      const [country, setCountry] = useState("IN");

      // Pure In-Render Derivation DAG
      const subtotal = items.reduce((sum, item) => sum + item.price * item.qty, 0);
      const discount = coupon === "SAVE20" ? subtotal * 0.2 : 0;
      const taxableAmount = Math.max(0, subtotal - discount);
      const taxRate = country === "IN" ? 0.18 : country === "US" ? 0.08 : 0.05;
      const tax = taxableAmount * taxRate;
      const shipping = subtotal > 150 ? 0 : 15;
      const total = taxableAmount + tax + shipping;

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="border-b border-slate-800 pb-4">
            <span className="text-xs font-mono uppercase tracking-widest text-cyan-400 bg-cyan-950/60 px-2 py-0.5 rounded border border-cyan-800/50">Lab 03</span>
            <h2 className="text-xl font-bold text-slate-100 mt-1">Multi-Tier Financial Calculation DAG</h2>
            <p className="text-xs text-slate-400 mt-1">Seven synchronous derived values flowing through a single pure functional pipeline without intermediate states.</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 font-mono text-xs">
            {/* Input Controls */}
            <div className="lg:col-span-5 p-4 bg-slate-950 border border-slate-800 rounded-lg space-y-4">
              <span className="text-slate-400 font-bold block">SOURCE INPUT CONTROLS:</span>
              
              <div className="space-y-2">
                <label className="text-slate-500 block">Coupon Code:</label>
                <input
                  type="text"
                  value={coupon}
                  onChange={e => setCoupon(e.target.value.toUpperCase())}
                  className="w-full p-2 bg-slate-900 border border-slate-700 rounded text-slate-200"
                />
              </div>

              <div className="space-y-2">
                <label className="text-slate-500 block">Destination Country:</label>
                <select
                  value={country}
                  onChange={e => setCountry(e.target.value)}
                  className="w-full p-2 bg-slate-900 border border-slate-700 rounded text-slate-200"
                >
                  <option value="IN">India (18% GST)</option>
                  <option value="US">USA (8% Sales Tax)</option>
                  <option value="EU">European Union (5% VAT)</option>
                </select>
              </div>

              <div className="pt-2">
                <span className="text-slate-500 block mb-1">Item Quantities:</span>
                {items.map(item => (
                  <div key={item.id} className="flex justify-between items-center p-1.5 bg-slate-900 rounded mb-1">
                    <span className="truncate">{item.name}</span>
                    <input
                      type="number"
                      min="1"
                      value={item.qty}
                      onChange={e => {
                        const nextQty = Math.max(1, Number(e.target.value));
                        setItems(prev => prev.map(i => i.id === item.id ? { ...i, qty: nextQty } : i));
                      }}
                      className="w-14 p-1 bg-slate-950 border border-slate-700 rounded text-center"
                    />
                  </div>
                ))}
              </div>
            </div>

            {/* Derived Pipeline Visualization */}
            <div className="lg:col-span-7 bg-slate-950 border border-slate-800 rounded-lg p-4 space-y-3">
              <span className="text-cyan-400 font-bold block border-b border-slate-800 pb-2">
                SYNCHRONOUS DERIVATION GRAPH (Zero useState)
              </span>

              <div className="space-y-2">
                <div className="p-2 bg-slate-900 rounded border border-slate-800 flex justify-between">
                  <span className="text-slate-400">1. Subtotal:</span>
                  <span className="font-bold text-slate-200">${subtotal.toFixed(2)}</span>
                </div>
                <div className="p-2 bg-slate-900 rounded border border-slate-800 flex justify-between">
                  <span className="text-slate-400">2. Discount ({coupon === "SAVE20" ? "20%" : "0%"}):</span>
                  <span className="font-bold text-emerald-400">-${discount.toFixed(2)}</span>
                </div>
                <div className="p-2 bg-slate-900 rounded border border-slate-800 flex justify-between">
                  <span className="text-slate-400">3. Taxable Amount:</span>
                  <span className="font-bold text-slate-200">${taxableAmount.toFixed(2)}</span>
                </div>
                <div className="p-2 bg-slate-900 rounded border border-slate-800 flex justify-between">
                  <span className="text-slate-400">4. Tax ({taxRate * 100}%):</span>
                  <span className="font-bold text-amber-400">${tax.toFixed(2)}</span>
                </div>
                <div className="p-2 bg-slate-900 rounded border border-slate-800 flex justify-between">
                  <span className="text-slate-400">5. Shipping:</span>
                  <span className="font-bold text-slate-200">${shipping.toFixed(2)}</span>
                </div>
                <div className="p-3 bg-slate-900 border border-cyan-500 rounded-lg flex justify-between items-center text-sm">
                  <span className="text-cyan-300 font-bold">6. Grand Total:</span>
                  <span className="font-black text-cyan-400 text-lg">${total.toFixed(2)}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 4: SENIOR CERTIFICATION EXAM
    // =========================================================================
    function Exp4SeniorExam() {
      const questions = [
        {
          id: 1,
          q: "Why is synchronizing derived state via `useEffect` an anti-pattern?",
          options: [
            "Because useEffect was deprecated in React 18",
            "Because it forces a dual-render penalty, creates a 1-frame visual tearing window, and increases risk of infinite reconciliation loops",
            "Because useEffect cannot access component props",
            "Because JavaScript arrays do not support effects"
          ],
          correct: 1,
          explanation: "Syncing derived state via useEffect renders stale state on Pass 1, paints to the DOM, runs the effect, and forces an immediate Pass 2 re-render."
        },
        {
          id: 2,
          q: "What is the cleanest way to reset a form editor component's state when the selected user ID changes?",
          options: [
            "Add an effect with setDraft(user.name)",
            "Supply a domain key `<UserEditor key={user.id} user={user} />` to force React to mount a pristine Fiber instance",
            "Use Math.random() as the component key",
            "Mutate user.name directly inside the input"
          ],
          correct: 1,
          explanation: "Providing key={user.id} tells React that a new entity identity exists, cleanly unmounting the old Fiber and mounting a fresh one with pristine initial state."
        },
        {
          id: 3,
          q: "When is wrapping a derived calculation in `useMemo` mathematically justified?",
          options: [
            "For all string concatenations and simple arithmetic",
            "Only when profiling proves the calculation takes >1ms / >10k items, or when its reference identity is passed to memoized children",
            "Always, memoization is completely free",
            "Only on the Node.js server"
          ],
          correct: 1,
          explanation: "useMemo introduces Fiber linked list memory allocations and per-render Object.is dependency comparison costs; it should only be used when justified by measurement."
        }
      ];

      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const score = Object.keys(answers).reduce((acc, qId) => {
        const q = questions.find(item => item.id === Number(qId));
        return q && answers[qId] === q.correct ? acc + 1 : acc;
      }, 0);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-fuchsia-400 bg-fuchsia-950/60 px-2 py-0.5 rounded border border-fuchsia-800/50">Lab 04</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Senior Derived State Certification Exam</h2>
              <p className="text-xs text-slate-400 mt-1">Validate your architectural mastery of pure in-render derivation and state synchronization avoidance.</p>
            </div>
            {submitted && (
              <div className="text-right font-mono">
                <span className="text-2xl font-black text-fuchsia-400">{score} / {questions.length}</span>
                <span className="text-xs text-slate-400 block">{score === questions.length ? "🎖️ Senior Certified!" : "Review below"}</span>
              </div>
            )}
          </div>

          <div className="space-y-6 font-mono text-xs">
            {questions.map(q => (
              <div key={q.id} className="p-4 bg-slate-950 border border-slate-800/80 rounded-lg space-y-3">
                <h3 className="text-sm font-semibold text-slate-200">
                  <span className="text-fuchsia-400 mr-2">Q{q.id}.</span>
                  {q.q}
                </h3>

                <div className="space-y-2">
                  {q.options.map((opt, optIdx) => {
                    const isSelected = answers[q.id] === optIdx;
                    const isCorrect = q.correct === optIdx;
                    let borderClass = 'border-slate-800 hover:border-slate-700 bg-slate-900/60';
                    if (submitted) {
                      if (isCorrect) borderClass = 'border-emerald-500 bg-emerald-950/40 text-emerald-200';
                      else if (isSelected && !isCorrect) borderClass = 'border-red-500 bg-red-950/40 text-red-200';
                    } else if (isSelected) {
                      borderClass = 'border-fuchsia-500 bg-fuchsia-950/40 text-fuchsia-200';
                    }

                    return (
                      <button
                        key={optIdx}
                        disabled={submitted}
                        onClick={() => setAnswers(prev => ({ ...prev, [q.id]: optIdx }))}
                        className={`w-full text-left p-2.5 rounded-lg border transition-all flex items-center justify-between ${borderClass}`}
                      >
                        <span>{opt}</span>
                        {submitted && isCorrect && <span className="text-emerald-400 font-bold">✓ CORRECT</span>}
                        {submitted && isSelected && !isCorrect && <span className="text-red-400 font-bold">✗ INCORRECT</span>}
                      </button>
                    );
                  })}
                </div>

                {submitted && (
                  <div className="p-3 bg-slate-900/90 border border-slate-800 rounded text-[11px] text-slate-300">
                    <span className="font-bold text-fuchsia-400 block mb-1">Analysis:</span>
                    {q.explanation}
                  </div>
                )}
              </div>
            ))}

            <div className="flex justify-end gap-3 pt-2">
              {submitted ? (
                <button
                  onClick={() => { setAnswers({}); setSubmitted(false); }}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded"
                >
                  Reset Exam
                </button>
              ) : (
                <button
                  onClick={() => setSubmitted(true)}
                  disabled={Object.keys(answers).length < questions.length}
                  className="px-6 py-2 bg-fuchsia-600 hover:bg-fuchsia-500 disabled:opacity-40 text-white text-xs font-bold rounded shadow-lg shadow-fuchsia-600/30"
                >
                  Submit & Evaluate
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MAIN LAB HARNESS
    // =========================================================================
    function App() {
      const [activeTab, setActiveTab] = useState("dual");

      return (
        <div className="max-w-6xl mx-auto px-4 py-8 space-y-8">
          <header className="border-b border-slate-800 pb-6 space-y-2">
            <div className="flex items-center gap-2">
              <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                Level 06 · React Fundamentals
              </span>
              <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-purple-500/10 text-purple-400 border border-purple-500/20">
