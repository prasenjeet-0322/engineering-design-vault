<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI 13 Part 04 — React.memo & Bailout Comparators Lab</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    pre, code { font-family: 'Fira Code', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef, memo, createContext, useContext } = React;

    // --- CONTEXT DEFINITION ---
    const ThemeContext = createContext({ theme: 'dark', toggleTheme: () => {} });

    // --- HEAP REGISTRY ---
    let heapIdCounter = 3000;
    const heapRegistry = new WeakMap();
    function getHeapId(obj) {
      if (typeof obj !== 'object' && typeof obj !== 'function') return null;
      if (obj === null) return null;
      if (!heapRegistry.has(obj)) {
        heapRegistry.set(obj, `0x${(++heapIdCounter).toString(16).toUpperCase()}`);
      }
      return heapRegistry.get(obj);
    }

    // --- HEADER COMPONENT ---
    function Header({ activeTab, setActiveTab }) {
      const tabs = [
        { id: 'shallow-sandbox', label: '1. Default Shallow Bailout' },
        { id: 'custom-comparator', label: '2. Custom Comparator Engine' },
        { id: 'three-channels', label: '3. The 3 Update Channels' },
        { id: 'children-trap', label: '4. Children Prop Trap' },
        { id: 'benchmark', label: '5. Comparator Cost Benchmark' },
        { id: 'exam', label: '6. Senior Certification' },
      ];

      return (
        <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
          <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <span className="px-2.5 py-0.5 rounded text-xs font-semibold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                    KPI 13 · Part 04
                  </span>
                  <span className="text-xs text-slate-400 font-mono">React 18.3 Internals</span>
                </div>
                <h1 className="text-2xl font-bold text-white tracking-tight mt-1">
                  React.memo, Bailout Semantics & Comparators Lab
                </h1>
                <p className="text-sm text-slate-400 mt-0.5">
                  Explore Reconciler Bailouts, Custom arePropsEqual Contracts, Context Bypassing & Cost Equations
                </p>
              </div>
              <div className="flex items-center gap-2">
                <a 
                  href="../04-react-memo-component-caching.md" 
                  className="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
                >
                  📖 Read Masterclass Guide
                </a>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="flex gap-2 overflow-x-auto mt-4 pt-2 border-t border-slate-800/60 pb-1">
              {tabs.map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-all ${
                    activeTab === tab.id
                      ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30'
                      : 'bg-slate-800/60 hover:bg-slate-800 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </div>
        </header>
      );
    }

    // --- TAB 1: DEFAULT SHALLOW BAILOUT SANDBOX ---
    const DefaultMemoCard = memo(function DefaultMemoCard({ user, count, title }) {
      const renderCount = useRef(0);
      renderCount.current += 1;

      return (
        <div className="bg-slate-900 border border-slate-700 rounded-xl p-5 space-y-3">
          <div className="flex items-center justify-between">
            <span className="text-sm font-bold text-indigo-400 font-mono">&lt;DefaultMemoCard /&gt;</span>
            <span className="px-2.5 py-0.5 rounded text-xs font-mono font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
              Renders: {renderCount.current}
            </span>
          </div>

          <div className="grid grid-cols-2 gap-2 text-xs font-mono text-slate-300">
            <div>User Prop: <span className="text-emerald-400">{user.name}</span></div>
            <div>User Heap: <span className="text-amber-300">{getHeapId(user)}</span></div>
            <div>Title Prop: <span className="text-slate-200">"{title}"</span></div>
            <div>Count Prop: <span className="text-indigo-400">{count}</span></div>
          </div>

          <div className="p-2.5 bg-slate-950 rounded border border-slate-800 text-[11px] text-slate-400">
            Shallow compares: <code>Object.is(prev.user, next.user) && Object.is(prev.count, next.count) && Object.is(prev.title, next.title)</code>
          </div>
        </div>
      );
    });

    function ShallowBailoutSandbox() {
      const [parentCount, setParentCount] = useState(0);
      const [propMode, setPropMode] = useState('literal'); // 'literal' vs 'stable'
      const [userState] = useState({ id: 'u1', name: 'Alice Smith' });
      const [title, setTitle] = useState('Senior Architect');
      const [childCount, setChildCount] = useState(10);

      // Determine user prop
      const passedUser = propMode === 'literal' ? { ...userState } : userState;

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
            <h2 className="text-lg font-bold text-white mb-2">Default React.memo Shallow Bailout Sandbox</h2>
            <p className="text-sm text-slate-400 mb-6">
              Observe how <code className="text-indigo-400">React.memo</code> shallow comparison successfully bails out when props are referentially stable vs how inline object literals defeat bailout checks on every parent render.
            </p>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              {/* Parent Controller */}
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="text-sm font-bold text-amber-400 font-mono">&lt;ParentContainer /&gt;</span>
                  <span className="text-xs font-mono font-bold bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30">
                    Parent Renders: {parentCount}
                  </span>
                </div>

                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-2">User Prop Passing Strategy:</label>
                  <div className="space-y-2">
                    <label className="flex items-center gap-2 p-3 rounded-lg border border-slate-800 bg-slate-900 hover:bg-slate-850 cursor-pointer text-xs">
                      <input
                        type="radio"
                        name="propMode"
                        value="literal"
                        checked={propMode === 'literal'}
                        onChange={() => setPropMode('literal')}
                        className="text-indigo-600 focus:ring-0"
                      />
                      <div>
                        <div className="font-mono text-rose-300">user=&#123;&#123; ...user &#125;&#125; (New Object Literal)</div>
                        <div className="text-[11px] text-slate-500">Unstable pointer: 100% bailout failure on every parent render</div>
                      </div>
                    </label>

                    <label className="flex items-center gap-2 p-3 rounded-lg border border-slate-800 bg-slate-900 hover:bg-slate-850 cursor-pointer text-xs">
                      <input
                        type="radio"
                        name="propMode"
                        value="stable"
                        checked={propMode === 'stable'}
                        onChange={() => setPropMode('stable')}
                        className="text-indigo-600 focus:ring-0"
                      />
                      <div>
                        <div className="font-mono text-emerald-300">user=&#123;user&#125; (Stable Heap Reference)</div>
                        <div className="text-[11px] text-slate-500">Optimal: Reuses identical memory address, enabling full bailout</div>
                      </div>
                    </label>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button
                    onClick={() => setParentCount(c => c + 1)}
                    className="py-2.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold transition shadow-lg shadow-amber-600/20"
                  >
                    ⚡ Trigger Parent Re-render
                  </button>

                  <button
                    onClick={() => setChildCount(c => c + 1)}
                    className="py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition"
                  >
                    Mutate Child Prop (+1)
                  </button>
                </div>
              </div>

              {/* Memoized Child */}
              <div className="space-y-4">
                <DefaultMemoCard
                  user={passedUser}
                  title={title}
                  count={childCount}
                />

                <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-2 text-xs">
                  <div className="font-bold text-slate-300">Bailout Diagnostic Verdict:</div>
                  <div className={`font-mono font-semibold ${propMode === 'stable' ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {propMode === 'stable' 
                      ? '✅ Subtree Bailout Active: Child only re-renders when child props actually change.'
                      : '💥 Bailout Defeated: Child re-renders on EVERY parent click due to fresh object literal.'}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- TAB 2: CUSTOM COMPARATOR ENGINE ---
    // Flawed comparator: only checks ID
    const FlawedRow = memo(
      function FlawedRow({ user, selected }) {
        const renderCount = useRef(0);
        renderCount.current += 1;
        return (
          <tr className={`border-b border-slate-800 ${selected ? 'bg-indigo-950/40 text-indigo-300' : 'text-slate-300'}`}>
            <td className="p-3 font-mono">{user.id}</td>
            <td className="p-3 font-semibold">{user.name}</td>
            <td className="p-3 font-mono text-xs">{selected ? 'SELECTED ✅' : 'IDLE ⚪'}</td>
            <td className="p-3 font-mono text-xs text-rose-400">{renderCount.current}</td>
          </tr>
        );
      },
      (prev, next) => prev.user.id === next.user.id // 💥 Flawed: Ignores name and selected!
    );

    // Correct comparator: checks all render-relevant props
    const CorrectRow = memo(
      function CorrectRow({ user, selected }) {
        const renderCount = useRef(0);
        renderCount.current += 1;
        return (
          <tr className={`border-b border-slate-800 ${selected ? 'bg-emerald-950/40 text-emerald-300' : 'text-slate-300'}`}>
            <td className="p-3 font-mono">{user.id}</td>
            <td className="p-3 font-semibold">{user.name}</td>
            <td className="p-3 font-mono text-xs">{selected ? 'SELECTED ✅' : 'IDLE ⚪'}</td>
            <td className="p-3 font-mono text-xs text-emerald-400">{renderCount.current}</td>
          </tr>
        );
      },
      (prev, next) => (
        prev.user.id === next.user.id &&
        prev.user.name === next.user.name &&
        prev.selected === next.selected
      )
    );

    function CustomComparatorEngine() {
      const [users, setUsers] = useState([
        { id: 'u1', name: 'Alice Smith' },
        { id: 'u2', name: 'Bob Jones' },
      ]);
      const [selectedId, setSelectedId] = useState('u1');

      const handleRenameFirstUser = () => {
        const names = ['Alice (Updated)', 'Alice (Lead)', 'Alice (Architect)'];
        const newName = names[Math.floor(Math.random() * names.length)];
        setUsers(prev => [
          { ...prev[0], name: newName },
          prev[1]
        ]);
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
            <h2 className="text-lg font-bold text-white mb-2">Custom Comparator (arePropsEqual) Stale UI Detector</h2>
            <p className="text-sm text-slate-400 mb-6">
              Compare a <strong>Flawed Comparator</strong> (which only inspects <code className="text-rose-400">user.id</code>) against a <strong>Correct Comparator</strong>. Notice how flawed comparators cause severe <strong>Stale UI bugs</strong> when names or selections change!
            </p>

            <div className="flex flex-wrap items-center gap-3 mb-6">
              <button
                onClick={handleRenameFirstUser}
                className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition shadow-lg shadow-indigo-600/30"
              >
                ✏️ Rename User u1 (Mutate Name)
              </button>

              <button
                onClick={() => setSelectedId(id => id === 'u1' ? 'u2' : 'u1')}
                className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold transition shadow-lg shadow-amber-600/30"
              >
                🔄 Toggle Selected Row
              </button>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              {/* Flawed Comparator Table */}
              <div className="bg-slate-950 border border-rose-900/40 rounded-xl p-5">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-xs font-bold text-rose-400 uppercase tracking-wider font-mono">
                    💥 Flawed: arePropsEqual (id only)
                  </span>
                  <span className="text-[10px] px-2 py-0.5 rounded bg-rose-950 text-rose-300 border border-rose-800">
                    STALE UI HAZARD
                  </span>
                </div>

                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-slate-800 text-slate-400">
                      <th className="p-3 font-mono">ID</th>
                      <th className="p-3">Name</th>
                      <th className="p-3">Selected</th>
                      <th className="p-3">Renders</th>
                    </tr>
                  </thead>
                  <tbody>
                    {users.map(u => (
                      <FlawedRow
                        key={u.id}
                        user={u}
                        selected={u.id === selectedId}
                      />
                    ))}
                  </tbody>
                </table>
                <div className="mt-3 p-2.5 bg-rose-950/20 border border-rose-800/40 rounded text-[11px] text-rose-300">
                  ⚠️ When you rename u1 or toggle selection, the UI <strong>FAILS TO UPDATE</strong> because the comparator claimed <code className="font-mono">prev.id === next.id</code>!
                </div>
              </div>

              {/* Correct Comparator Table */}
              <div className="bg-slate-950 border border-emerald-900/40 rounded-xl p-5">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider font-mono">
                    ✅ Correct: arePropsEqual (All Props)
                  </span>
                  <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800">
                    100% SYNCHRONIZED
                  </span>
                </div>

                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-slate-800 text-slate-400">
                      <th className="p-3 font-mono">ID</th>
                      <th className="p-3">Name</th>
                      <th className="p-3">Selected</th>
                      <th className="p-3">Renders</th>
                    </tr>
                  </thead>
                  <tbody>
                    {users.map(u => (
                      <CorrectRow
                        key={u.id}
                        user={u}
                        selected={u.id === selectedId}
                      />
                    ))}
                  </tbody>
                </table>
                <div className="mt-3 p-2.5 bg-emerald-950/20 border border-emerald-800/40 rounded text-[11px] text-emerald-300">
                  ✅ The UI updates instantly on name changes or selection toggles while still skipping renders when unrelated parent updates occur.
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- TAB 3: THE 3 UPDATE CHANNELS ---
    const DynamicContextConsumer = memo(function DynamicContextConsumer({ staticProp }) {
      const { theme, toggleTheme } = useContext(ThemeContext);
      const [localState, setLocalState] = useState(0);
      const renderCount = useRef(0);
      renderCount.current += 1;

      return (
        <div className="bg-slate-900 border border-slate-700 rounded-xl p-5 space-y-4">
          <div className="flex items-center justify-between">
            <span className="text-sm font-bold text-indigo-400 font-mono">&lt;MemoizedConsumer /&gt;</span>
            <span className="px-2.5 py-0.5 rounded text-xs font-mono font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
              Total Renders: {renderCount.current}
            </span>
          </div>

          <div className="grid grid-cols-3 gap-3 text-xs">
            <div className="p-3 bg-slate-950 rounded border border-slate-800">
              <div className="text-slate-400 mb-1 font-mono">1. Props Channel</div>
              <div className="font-bold text-slate-200 truncate">{staticProp}</div>
              <div className="text-[10px] text-emerald-400 mt-1">Guarded by React.memo</div>
            </div>

            <div className="p-3 bg-slate-950 rounded border border-slate-800">
              <div className="text-slate-400 mb-1 font-mono">2. State Channel</div>
              <div className="font-bold text-indigo-400">localState: {localState}</div>
              <div className="text-[10px] text-amber-400 mt-1">Bypasses React.memo</div>
            </div>

            <div className="p-3 bg-slate-950 rounded border border-slate-800">
              <div className="text-slate-400 mb-1 font-mono">3. Context Channel</div>
              <div className="font-bold text-amber-300">theme: {theme}</div>
              <div className="text-[10px] text-rose-400 mt-1">Bypasses React.memo</div>
            </div>
          </div>

          <div className="flex gap-2 pt-2">
            <button
              onClick={() => setLocalState(s => s + 1)}
              className="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-semibold transition"
            >
              Dispatch Local State (+1)
            </button>
            <button
              onClick={toggleTheme}
              className="flex-1 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded text-xs font-semibold transition"
            >
              Toggle Context Provider
            </button>
          </div>
        </div>
      );
    });

    function ThreeChannelsDemo() {
      const [parentCount, setParentCount] = useState(0);
      const [theme, setTheme] = useState('dark');

      const toggleTheme = useCallback(() => {
        setTheme(t => t === 'dark' ? 'emerald' : 'dark');
      }, []);

      const contextValue = useMemo(() => ({ theme, toggleTheme }), [theme, toggleTheme]);

      return (
        <ThemeContext.Provider value={contextValue}>
          <div className="space-y-6">
            <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
              <h2 className="text-lg font-bold text-white mb-2">The 3 Component Update Channels</h2>
              <p className="text-sm text-slate-400 mb-6">
                Understand how <code className="text-indigo-400">React.memo</code> only guards against the <strong>Props Channel</strong>. Dispatching local state or modifying an upstream React Context will force the memoized component to re-render.
              </p>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                {/* Parent Container */}
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 space-y-4">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-bold text-amber-400 font-mono">&lt;ParentScope /&gt;</span>
                    <span className="text-xs font-mono font-bold bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30">
                      Parent Renders: {parentCount}
                    </span>
                  </div>

                  <p className="text-xs text-slate-400">
                    Clicking this button triggers a parent re-render. Because the props passed to the child are stable, the child <strong>bails out completely (0 re-renders)</strong>.
                  </p>

                  <button
                    onClick={() => setParentCount(c => c + 1)}
                    className="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold transition shadow-lg shadow-amber-600/20"
                  >
                    ⚡ Trigger Parent Re-render (Props Channel Bailout)
                  </button>
                </div>

                {/* Child Consumer */}
                <div>
                  <DynamicContextConsumer staticProp="Static Stable String" />
                </div>
              </div>
            </div>
          </div>
        </ThemeContext.Provider>
      );
    }

    // --- TAB 4: CHILDREN PROP TRAP ---
    const MemoCardWithChildren = memo(function MemoCardWithChildren({ children, title }) {
      const renderCount = useRef(0);
      renderCount.current += 1;

      return (
        <div className="bg-slate-900 border border-slate-700 rounded-xl p-5 space-y-2">
          <div className="flex items-center justify-between">
            <span className="text-sm font-bold text-indigo-400 font-mono">&lt;MemoCardWithChildren /&gt;</span>
            <span className="px-2.5 py-0.5 rounded text-xs font-mono font-bold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
              Renders: {renderCount.current}
            </span>
          </div>
          <div className="text-xs text-slate-400">Title: <span className="text-white font-bold">{title}</span></div>
          <div className="p-3 bg-slate-950 rounded border border-slate-800 text-xs">
            {children}
          </div>
        </div>
      );
    });

    function ChildrenPropTrapDemo() {
      const [parentTick, setParentTick] = useState(0);
      const [mode, setMode] = useState('inline'); // 'inline' vs 'memoized'

      // Memoized JSX Element
      const stableChildElement = useMemo(() => (
        <div className="text-emerald-300 font-mono">🔒 Memoized JSX Children Element</div>
      ), []);

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
            <h2 className="text-lg font-bold text-white mb-2">The JSX Children Element Identity Trap</h2>
            <p className="text-sm text-slate-400 mb-6">
              In React JSX, passing nested elements like <code className="text-rose-400">&lt;Card&gt;&lt;span&gt;...&lt;/span&gt;&lt;/Card&gt;</code> passes a new Virtual DOM object literal as <code className="text-rose-400">props.children</code> on every render!
            </p>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <span className="text-sm font-bold text-amber-400 font-mono">&lt;Parent /&gt;</span>
                  <span className="text-xs font-mono font-bold bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30">
                    Parent Renders: {parentTick}
                  </span>
                </div>

                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-2">Children Strategy:</label>
                  <div className="space-y-2">
                    <label className="flex items-center gap-2 p-3 rounded-lg border border-slate-800 bg-slate-900 hover:bg-slate-850 cursor-pointer text-xs">
                      <input
                        type="radio"
                        name="childMode"
                        value="inline"
                        checked={mode === 'inline'}
                        onChange={() => setMode('inline')}
                        className="text-indigo-600 focus:ring-0"
                      />
                      <div>
                        <div className="font-mono text-rose-300">&lt;Card&gt;&lt;span&gt;Inline&lt;/span&gt;&lt;/Card&gt;</div>
                        <div className="text-[11px] text-slate-500">Unstable: Re-creates React.createElement object every render</div>
                      </div>
                    </label>

                    <label className="flex items-center gap-2 p-3 rounded-lg border border-slate-800 bg-slate-900 hover:bg-slate-850 cursor-pointer text-xs">
                      <input
                        type="radio"
                        name="childMode"
                        value="memoized"
                        checked={mode === 'memoized'}
                        onChange={() => setMode('memoized')}
                        className="text-indigo-600 focus:ring-0"
                      />
                      <div>
                        <div className="font-mono text-emerald-300">&lt;Card&gt;&#123;useMemo(() =&gt; ..., [])&#125;&lt;/Card&gt;</div>
                        <div className="text-[11px] text-slate-500">Optimal: Preserves identical JSX element reference across renders</div>
                      </div>
                    </label>
                  </div>
                </div>

                <button
                  onClick={() => setParentTick(t => t + 1)}
                  className="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold transition shadow-lg shadow-amber-600/20"
                >
                  ⚡ Trigger Parent Re-render
                </button>
              </div>

              <div className="space-y-4">
                <MemoCardWithChildren title="Card Container Shell">
                  {mode === 'inline' ? (
                    <div className="text-rose-300 font-mono">💥 Inline JSX Children Element</div>
                  ) : (
                    stableChildElement
                  )}
                </MemoCardWithChildren>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- TAB 5: COMPARATOR COST BENCHMARK ---
    function ComparatorBenchmark() {
      const [depth, setDepth] = useState(2500);
      const [benchmarkResult, setBenchmarkResult] = useState(null);
      const [isRunning, setIsRunning] = useState(false);

      function shallowEqual(a, b) {
        if (Object.is(a, b)) return true;
        if (typeof a !== 'object' || a === null || typeof b !== 'object' || b === null) return false;
        const kA = Object.keys(a);
        const kB = Object.keys(b);
        if (kA.length !== kB.length) return false;
        for (let i = 0; i < kA.length; i++) {
          const k = kA[i];
          if (!Object.prototype.hasOwnProperty.call(b, k) || !Object.is(a[k], b[k])) return false;
        }
        return true;
      }

      function deepEqual(a, b) {
        if (Object.is(a, b)) return true;
        if (typeof a !== 'object' || a === null || typeof b !== 'object' || b === null) return false;
        const kA = Object.keys(a);
        const kB = Object.keys(b);
        if (kA.length !== kB.length) return false;
        for (let k of kA) {
          if (!Object.prototype.hasOwnProperty.call(b, k) || !deepEqual(a[k], b[k])) return false;
        }
        return true;
      }

      const runBenchmark = () => {
        setIsRunning(true);
        setTimeout(() => {
          const treeA = {
            id: 'root',
            records: Array.from({ length: depth }, (_, i) => ({
              id: `rec-${i}`,
              title: `Record #${i}`,
              metrics: { cpu: Math.random() * 100 }
            }))
          };

          const treeB = {
            ...treeA,
            records: treeA.records.map((r, i) => i === depth - 1 ? { ...r, title: r.title + '!' } : r)
          };

          // Benchmark Shallow
          const t0 = performance.now();
          for (let i = 0; i < 50; i++) shallowEqual(treeA, treeB);
          const t1 = performance.now();
          const shallowMs = ((t1 - t0) / 50).toFixed(4);

          // Benchmark Deep
          const t2 = performance.now();
          for (let i = 0; i < 10; i++) deepEqual(treeA, treeB);
          const t3 = performance.now();
          const deepMs = ((t3 - t2) / 10).toFixed(4);

          setBenchmarkResult({
            shallow: parseFloat(shallowMs),
            deep: parseFloat(deepMs),
            ratio: (parseFloat(deepMs) / (parseFloat(shallowMs) || 0.0001)).toFixed(1)
          });
          setIsRunning(false);
        }, 50);
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
            <h2 className="text-lg font-bold text-white mb-2">Comparator CPU Overhead vs Render Cost Inversion</h2>
            <p className="text-sm text-slate-400 mb-6">
              Benchmark the raw latency of running recursive deep comparators in <code className="text-rose-400">arePropsEqual</code> against native <code className="text-emerald-400">shallowEqual</code>.
            </p>

            <div className="flex flex-wrap items-center gap-4 mb-6">
              <div>
                <label className="block text-xs text-slate-400 mb-1">Nested Node Count</label>
                <select
                  value={depth}
                  onChange={e => setDepth(Number(e.target.value))}
                  className="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white font-mono"
                >
                  <option value={1000}>1,000 Nodes</option>
                  <option value={2500}>2,500 Nodes</option>
                  <option value={10000}>10,000 Nodes</option>
                </select>
              </div>

              <button
                onClick={runBenchmark}
                disabled={isRunning}
                className="mt-5 px-5 py-2 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-lg text-xs font-bold transition shadow-lg shadow-indigo-600/30"
              >
                {isRunning ? 'Benchmarking...' : '🚀 Execute Comparator Benchmark'}
              </button>
            </div>

            {benchmarkResult && (
              <div className="bg-slate-950 border border-slate-800 rounded-xl p-6 space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-900 p-4 rounded-lg border border-slate-800">
                    <div className="text-xs text-slate-400 font-mono">Native shallowEqual</div>
                    <div className="text-2xl font-bold font-mono text-emerald-400 mt-1">{benchmarkResult.shallow} ms</div>
                    <div className="text-xs text-slate-500 mt-1">O(keys) top-level check</div>
                  </div>

                  <div className="bg-slate-900 p-4 rounded-lg border border-slate-800">
                    <div className="text-xs text-slate-400 font-mono">Custom deepEqual</div>
                    <div className="text-2xl font-bold font-mono text-rose-400 mt-1">{benchmarkResult.deep} ms</div>
                    <div className="text-xs text-slate-500 mt-1">O(N) recursive tree scan</div>
                  </div>

                  <div className="bg-slate-900 p-4 rounded-lg border border-slate-800">
                    <div className="text-xs text-slate-400 font-mono">Cost Penalty Ratio</div>
                    <div className="text-2xl font-bold font-mono text-amber-400 mt-1">{benchmarkResult.ratio}x SLOWER</div>
                    <div className="text-xs text-slate-500 mt-1">Comparator overhead</div>
                  </div>
                </div>

                <div className="p-4 bg-amber-500/10 border border-amber-500/30 rounded-lg text-xs text-amber-300">
                  ⚠️ <strong>Senior Rule:</strong> If a custom comparator takes {benchmarkResult.deep}ms to run on every frame to skip a 0.5ms render, you are paying a massive <strong>performance tax</strong>. Always prefer narrow primitive props!
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- TAB 6: SENIOR CERTIFICATION EXAM ---
    function SeniorExam() {
      const questions = [
        {
          id: 1,
          q: 'What does arePropsEqual(prev, next) returning TRUE signify in React.memo?',
          options: [
            'It forces the component to immediately re-render',
            'It instructs React that props are equivalent and to SKIP rendering (Bailout)',
            'It throws a React reconciler error',
            'It instructs React to unmount and remount the Fiber'
          ],
          answer: 1,
          explanation: 'In React.memo, returning true bails out (skips the render). In legacy class shouldComponentUpdate, returning true forced a re-render.'
        },
        {
          id: 2,
          q: 'Does React.memo prevent a component from re-rendering when an upstream React Context value updates?',
          options: [
            'Yes, React.memo completely isolates the component from all context updates',
            'No, useContext subscriptions bypass React.memo and force the component to re-render',
            'Only if the context contains primitive numbers',
            'Only in React 17, but fixed in React 18'
          ],
          answer: 1,
          explanation: 'useContext registers a direct dependency in the Fiber node, bypassing the props-level React.memo boundary.'
        },
        {
          id: 3,
          q: 'Why does passing `<Card><span>Hello</span></Card>` defeat React.memo bailout on Card?',
          options: [
            'Because React.memo only supports self-closing elements',
            'Because JSX creates a brand new React.createElement object literal for children on every parent render',
            'Because `span` elements cannot be memoized',
            'Because children are passed via context'
          ],
          answer: 1,
          explanation: 'JSX children compile to new object literals on every render pass, causing shallowEqual(prev.children, next.children) to return false.'
        },
        {
          id: 4,
          q: 'What is the primary danger of writing a custom comparator that only checks `prev.user.id === next.user.id`?',
          options: [
            'It causes stack overflow exceptions',
            'It creates Stale UI bugs when other user fields (like user.name or selection) update in state',
            'It converts the component to a class component',
            'It prevents the browser Garbage Collector from collecting user objects'
          ],
          answer: 1,
          explanation: 'If the user name changes but ID remains identical, the flawed comparator returns true, skipping the render needed to display the new name.'
        },
        {
          id: 5,
          q: 'When should a senior architect recommend narrowing props instead of writing a custom comparator?',
          options: [
            'Always, as narrowing props simplifies the TypeScript interface and lets native O(1) shallowEqual operate cleanly',
            'Never, custom comparators are always faster than passing multiple props',
            'Only when the component is rendered on mobile Safari',
            'Only when using Redux Toolkit'
          ],
          answer: 0,
          explanation: 'Narrowing props (e.g. passing userId and userName as primitives) makes dependencies explicit and avoids human error in custom comparison logic.'
        }
      ];

      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const score = useMemo(() => {
        return Object.keys(selectedAnswers).reduce((acc, qId) => {
          const q = questions.find(item => item.id === Number(qId));
          return q && selectedAnswers[qId] === q.answer ? acc + 1 : acc;
        }, 0);
      }, [selectedAnswers, questions]);

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
            <div className="flex items-center justify-between mb-4">
              <div>
                <h2 className="text-lg font-bold text-white">Senior React.memo & Comparators Certification</h2>
                <p className="text-sm text-slate-400">Validate your mastery of Fiber bailouts, custom comparators & context boundaries.</p>
              </div>
              {submitted && (
                <div className={`px-4 py-2 rounded-xl text-sm font-bold font-mono ${
                  score >= 4 ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'
                }`}>
                  Score: {score} / {questions.length} ({Math.round((score / questions.length) * 100)}%)
                </div>
              )}
            </div>

            <div className="space-y-6">
              {questions.map((q, idx) => (
                <div key={q.id} className="bg-slate-950 border border-slate-800 rounded-xl p-5">
                  <div className="text-sm font-bold text-slate-200 mb-3 font-mono">
                    {idx + 1}. {q.q}
                  </div>

                  <div className="space-y-2">
                    {q.options.map((opt, oIdx) => {
                      const isSelected = selectedAnswers[q.id] === oIdx;
                      const isCorrect = q.answer === oIdx;

                      let btnStyle = 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-850';
                      if (submitted) {
                        if (isCorrect) btnStyle = 'bg-emerald-950/60 border-emerald-500 text-emerald-300';
                        else if (isSelected) btnStyle = 'bg-rose-950/60 border-rose-500 text-rose-300';
                      } else if (isSelected) {
                        btnStyle = 'bg-indigo-950/60 border-indigo-500 text-indigo-300';
                      }

                      return (
                        <button
                          key={oIdx}
                          disabled={submitted}
                          onClick={() => setSelectedAnswers(prev => ({ ...prev, [q.id]: oIdx }))}
                          className={`w-full text-left p-3 rounded-lg border text-xs transition flex items-center justify-between ${btnStyle}`}
                        >
                          <span>{opt}</span>
                          {submitted && isCorrect && <span className="font-bold text-emerald-400">✓ Correct</span>}
                          {submitted && isSelected && !isCorrect && <span className="font-bold text-rose-400">✗ Wrong</span>}
                        </button>
                      );
                    })}
                  </div>

                  {submitted && (
                    <div className="mt-3 p-3 bg-slate-900 rounded border border-slate-800 text-xs text-slate-400">
                      💡 <strong>Explanation:</strong> {q.explanation}
                    </div>
                  )}
                </div>
              ))}
            </div>

            <div className="mt-6 flex justify-end gap-3">
              {!submitted ? (
                <button
                  onClick={() => setSubmitted(true)}
                  disabled={Object.keys(selectedAnswers).length < questions.length}
                  className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-lg text-xs font-bold transition shadow-lg shadow-indigo-600/30"
                >
                  Submit Certification Exam
                </button>
              ) : (
                <button
                  onClick={() => {
                    setSubmitted(false);
                    setSelectedAnswers({});
                  }}
                  className="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold transition"
                >
                  Retake Exam
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN APP ---
    function App() {
      const [activeTab, setActiveTab] = useState('shallow-sandbox');

      return (

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8">
            {activeTab === 'shallow-sandbox' && <ShallowBailoutSandbox />}
            {activeTab === 'custom-comparator' && <CustomComparatorEngine />}
            {activeTab === 'three-channels' && <ThreeChannelsDemo />}
            {activeTab === 'children-trap' && <ChildrenPropTrapDemo />}
            {activeTab === 'benchmark' && <ComparatorBenchmark />}
            {activeTab === 'exam' && <SeniorExam />}
          </main>

          <footer className="border-t border-slate-800 bg-slate-900/40 py-6 text-center text-xs text-slate-500">
            <p>React 18 Architecture Masterclass · Level 06 — KPI 13 · Engineering Design Vault</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
