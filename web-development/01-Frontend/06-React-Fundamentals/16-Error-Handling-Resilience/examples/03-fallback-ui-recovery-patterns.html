<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI 16 — Part 03 Companion Lab: Error Recovery, Reset Semantics & Retry Policies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #080c16;
      color: #f1f5f9;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, Component, useRef } = React;

    // ==========================================
    // PRODUCTION AUTO-RESET BOUNDARY WITH BOUNDED RETRY
    // ==========================================
    class ResilientAutoResetBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = {
          hasError: false,
          error: null,
          attempts: 0,
          isRecovering: false,
        };
        this.retryTimer = null;
      }

      static getDerivedStateFromError(error) {
        return {
          hasError: true,
          error: error instanceof Error ? error : new Error(String(error)),
          isRecovering: false,
        };
      }

      componentDidCatch(error, errorInfo) {
        const { attempts } = this.state;
        const { onLog, boundaryName = "Boundary", maxRetries = 3 } = this.props;

        if (onLog) {
          onLog(
            boundaryName,
            `Intercepted crash (Attempt #${attempts + 1}): "${error.message}"`,
            "error"
          );
        }
      }

      componentDidUpdate(prevProps) {
        const { hasError } = this.state;
        const { resetKeys } = this.props;

        if (hasError && prevProps.resetKeys && resetKeys) {
          const changed = resetKeys.some((k, i) => !Object.is(k, prevProps.resetKeys[i]));
          if (changed) {
            if (this.props.onLog) {
              this.props.onLog("Identity Reset", `Detected semantic resetKeys change: [${prevProps.resetKeys}] ──► [${resetKeys}]. Resetting boundary!`, "success");
            }
            this.reset();
          }
        }
      }

      componentWillUnmount() {
        if (this.retryTimer) clearTimeout(this.retryTimer);
      }

      reset = () => {
        if (this.retryTimer) clearTimeout(this.retryTimer);
        this.setState({
          hasError: false,
          error: null,
          isRecovering: false,
        });
        if (this.props.onReset) this.props.onReset();
      };

      handleRetry = () => {
        const { attempts } = this.state;
        const maxRetries = this.props.maxRetries || 3;

        if (attempts >= maxRetries) {
          if (this.props.onLog) {
            this.props.onLog("Retry Policy", `Recovery attempts exhausted (${attempts}/${maxRetries}). Bounded lock engaged.`, "error");
          }
          return;
        }

        const nextAttempt = attempts + 1;
        this.setState({ attempts: nextAttempt, isRecovering: true });

        if (this.props.onLog) {
          this.props.onLog("Retry Initiated", `Scheduled retry attempt #${nextAttempt} with 600ms backoff...`, "info");
        }

        this.retryTimer = setTimeout(() => {
          this.reset();
        }, 600);
      };

      render() {
        const { hasError, error, attempts, isRecovering } = this.state;
        const maxRetries = this.props.maxRetries || 3;
        const isExhausted = attempts >= maxRetries;

        if (hasError) {
          return (
            <div role="alert" className="min-h-[220px] flex flex-col justify-center p-5 bg-rose-950/40 border border-rose-800 rounded-xl space-y-3">
              <div className="flex justify-between items-center text-xs font-mono">
                <span className="text-rose-400 font-bold uppercase tracking-wider">
                  ⚠️ {this.props.boundaryName || "Component"} Failure
                </span>
                <span className="px-2 py-0.5 bg-slate-900 border border-slate-800 text-slate-400 rounded">
                  Attempts: <strong className={isExhausted ? "text-rose-400" : "text-amber-400"}>{attempts} / {maxRetries}</strong>
                </span>
              </div>

              <p className="text-xs font-mono text-rose-300/90">{error?.message}</p>

              {isExhausted ? (
                <div className="p-3 bg-slate-950 rounded border border-rose-900 text-xs font-mono text-rose-300 space-y-2">
                  <div className="font-bold text-rose-400">🛑 RECOVERY EXHAUSTED</div>
                  <p className="text-[11px] text-slate-400">
                    Deterministic failure detected. Manual retries disabled to prevent retry storms. Please contact customer support.
                  </p>
                </div>
              ) : (
                <div className="flex gap-2 pt-1">
                  <button
                    disabled={isRecovering}
                    onClick={this.handleRetry}
                    className="px-4 py-2 bg-rose-800 hover:bg-rose-700 disabled:opacity-50 text-white rounded-lg text-xs font-mono font-semibold transition shadow"
                  >
                    {isRecovering ? "Re-mounting Subtree..." : `Retry Recovery (Attempt ${attempts + 1})`}
                  </button>
                  <button
                    onClick={this.reset}
                    className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-mono transition"
                  >
                    Direct State Reset
                  </button>
                </div>
              )}
            </div>
          );
        }

        return this.props.children;
      }
    }

    // ==========================================
    // CRASHABLE WORKSPACE COMPONENTS
    // ==========================================
    function CrashableVitalsWidget({ shouldCrash, patientId }) {
      if (shouldCrash) {
        throw new Error(`CorruptedVitalsStream: Sensor parity error for Patient #${patientId}`);
      }

      return (
        <div className="p-4 bg-slate-900/90 border border-slate-800 rounded-xl space-y-3">
          <div className="flex justify-between items-center text-xs font-mono">
            <span className="text-slate-300 font-bold">Real-time Vitals (ECG Telemetry)</span>
            <span className="text-emerald-400">● 72 BPM</span>
          </div>
          <div className="grid grid-cols-3 gap-2 text-center text-xs font-mono">
            <div className="p-2 bg-slate-950 rounded border border-slate-800">
              <div className="text-slate-500 text-[10px]">Heart Rate</div>
              <div className="text-lg font-bold text-emerald-400 mt-0.5">72 bpm</div>
            </div>
            <div className="p-2 bg-slate-950 rounded border border-slate-800">
              <div className="text-slate-500 text-[10px]">Blood Pressure</div>
              <div className="text-lg font-bold text-cyan-400 mt-0.5">120/80</div>
            </div>
            <div className="p-2 bg-slate-950 rounded border border-slate-800">
              <div className="text-slate-500 text-[10px]">SpO2</div>
              <div className="text-lg font-bold text-amber-400 mt-0.5">99%</div>
            </div>
          </div>
        </div>
      );
    }

    function ClinicalNotesEditor({ patientId }) {
      const [notes, setNotes] = useState("Patient exhibits normal cardiovascular rhythm. Scheduled for follow-up evaluation in 2 weeks.");

      return (
        <div className="p-4 bg-slate-900/90 border border-slate-800 rounded-xl space-y-2">
          <div className="flex justify-between items-center text-xs font-mono">
            <span className="text-slate-300 font-bold">Clinical Notes (Active User Draft)</span>
            <span className="text-cyan-400 text-[11px]">Auto-saved 10s ago</span>
          </div>
          <textarea
            value={notes}
            onChange={(e) => setNotes(e.target.value)}
            rows={3}
            className="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-slate-200 focus:outline-none focus:border-cyan-500 transition"
          />
          <div className="text-[10px] text-slate-500 font-mono">
            ⚠️ Notice: Form draft state survives even when sibling Vitals Widget crashes!
          </div>
        </div>
      );
    }

    // ==========================================
    // MAIN INTERACTIVE LAB COMPONENT
    // ==========================================
    function App() {
      const [activePatient, setActivePatient] = useState("Jane Doe (ID: 1042)");
      const [crashVitals, setCrashVitals] = useState(false);
      const [logs, setLogs] = useState([]);

      const addLog = (tag, message, type = "info") => {
        setLogs(prev => [
          {
            id: Math.random().toString(36).substring(2, 9),
            time: new Date().toLocaleTimeString() + "." + Math.floor(performance.now() % 1000).toString().padStart(3, "0"),
            tag,
            message,
            type
          },
          ...prev.slice(0, 30)
        ]);
      };

      const handlePatientSwitch = (patientName) => {
        setActivePatient(patientName);
        setCrashVitals(false);
        addLog("Navigation", `Switched active patient context to: ${patientName}`, "info");
      };

      return (
        <div className="max-w-7xl mx-auto space-y-6">
          {/* Header */}
          <header className="glass-panel p-6 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-2xl border-cyan-500/20">
            <div>
              <div className="flex items-center gap-3">
                <span className="px-3 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-full text-xs font-semibold uppercase tracking-wider">
                  Level 06 — KPI 16 / Part 03
                </span>
                <span className="px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-full text-xs font-semibold">
                  Recovery & Reset Simulator
                </span>
              </div>
              <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight mt-2 text-white">
                Error Recovery, Reset Semantics & Bounded Retry Policies
              </h1>
              <p className="text-slate-400 text-sm mt-1">
                Explore declarative resetKeys, bounded exponential retry backoffs, state preservation, and recovery exhaustion limits.
              </p>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => handlePatientSwitch("Jane Doe (ID: 1042)")}
                className={`px-3 py-1.5 rounded-lg text-xs font-mono font-semibold transition ${
                  activePatient.includes("1042") ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-400"
                }`}
              >
                Patient: Jane Doe
              </button>
              <button
                onClick={() => handlePatientSwitch("John Smith (ID: 1043)")}
                className={`px-3 py-1.5 rounded-lg text-xs font-mono font-semibold transition ${
                  activePatient.includes("1043") ? "bg-cyan-600 text-white" : "bg-slate-800 text-slate-400"
                }`}
              >
                Patient: John Smith
              </button>
            </div>
          </header>

          {/* Fault Control Toolbar */}
          <div className="glass-panel p-4 rounded-xl flex flex-wrap gap-2 items-center justify-between">
            <div className="flex flex-wrap gap-2">
              <button
                onClick={() => setCrashVitals(true)}
                className="px-3.5 py-2 bg-rose-950/60 hover:bg-rose-900 border border-rose-800 text-rose-200 rounded-lg text-xs font-mono font-semibold transition"
              >
                💥 Crash Vitals Widget (Render Exception)
              </button>
              <button
                onClick={() => setCrashVitals(false)}
                className="px-3.5 py-2 bg-emerald-950/60 hover:bg-emerald-900 border border-emerald-800 text-emerald-200 rounded-lg text-xs font-mono font-semibold transition"
              >
                ✓ Fix Underlying Vitals Data Sensor
              </button>
            </div>
            <button
              onClick={() => { setCrashVitals(false); setLogs([]); }}
              className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-300 rounded-xl text-xs font-mono font-bold transition"
            >
              🔄 Reset Lab State
            </button>
          </div>

          {/* Main Layout */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Workspace (2 Cols) */}
            <div className="lg:col-span-2 space-y-4">
              <div className="glass-panel p-6 rounded-2xl space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <div className="text-xs font-bold text-white font-mono flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
                    EHR Clinical Workspace — Active: <strong className="text-cyan-400">{activePatient}</strong>
                  </div>
                  <span className="text-[10px] font-mono text-slate-500">resetKeys: [{activePatient}]</span>
                </div>

                {/* Vitals Feature Boundary with Bounded Retry */}
                <ResilientAutoResetBoundary
                  boundaryName="VitalsFeatureBoundary"
                  resetKeys={[activePatient]}
                  maxRetries={3}
                  onLog={addLog}
                  onReset={() => setCrashVitals(false)}
                >
                  <CrashableVitalsWidget shouldCrash={crashVitals} patientId={activePatient} />
                </ResilientAutoResetBoundary>

                {/* Sibling Form Draft (Unaffected!) */}
                <ClinicalNotesEditor patientId={activePatient} />
              </div>
            </div>

            {/* Diagnostic Telemetry Log (1 Col) */}
            <div className="glass-panel p-5 rounded-2xl flex flex-col h-[650px] shadow-xl">
              <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <div className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></div>
                  <h3 className="font-bold text-sm text-slate-200">Recovery Telemetry Stream</h3>
                </div>
                <button
                  onClick={() => setLogs([])}
                  className="text-[10px] text-slate-400 hover:text-white font-mono"
                >
                  Clear
                </button>
              </div>

              <div className="flex-1 overflow-y-auto space-y-2.5 pt-4 pr-1">
                {logs.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-center text-slate-600">
                    <svg className="w-10 h-10 mb-2 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    <p className="text-xs font-mono">Trigger fault and recovery buttons to view telemetry events.</p>
                  </div>
                ) : (
                  logs.map(log => (
                    <div
                      key={log.id}
                      className={`p-3 rounded-xl border text-xs font-mono space-y-1 ${
                        log.type === "error"
                          ? "bg-rose-950/40 border-rose-800/60 text-rose-200"
                          : log.type === "warn"
                          ? "bg-amber-950/40 border-amber-800/60 text-amber-200"
                          : log.type === "success"
                          ? "bg-emerald-950/40 border-emerald-800/60 text-emerald-200"
                          : "bg-slate-900 border-slate-800 text-slate-300"
                      }`}
                    >
                      <div className="flex justify-between items-center text-[10px] opacity-70">
                        <span className="font-bold uppercase tracking-wider text-cyan-400">{log.tag}</span>
                        <span>{log.time}</span>
                      </div>
                      <p className="leading-relaxed">{log.message}</p>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
