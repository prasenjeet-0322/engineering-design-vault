<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI 16 — Part 12: Fallback UX, Accessibility & Progressive Degradation Lab</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Custom Focus Rings for WCAG 2.1 AA Compliance */
    *:focus-visible {
      outline: 2px solid #6366f1;
      outline-offset: 2px;
    }

    .focus-ring-danger:focus-visible {
      outline: 2px solid #ef4444;
      outline-offset: 2px;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col selection:bg-indigo-500 selection:text-white">

  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useReducer, createContext, useContext, Component } = React;

    // ============================================================================
    // 1. Accessibility & Screen Reader Live Region Announcer
    // ============================================================================
    const A11yContext = createContext(null);

    const A11yProvider = ({ children }) => {
      const [announcements, setAnnouncements] = useState([]);
      const [focusedElementInfo, setFocusedElementInfo] = useState({ tag: 'BODY', id: '', role: '' });

      const announce = (message, priority = 'polite') => {
        const id = 'ann_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        setAnnouncements(prev => [{ id, message, priority, timestamp: new Date().toLocaleTimeString() }, ...prev.slice(0, 15)]);
      };

      useEffect(() => {
        const handleFocusChange = () => {
          const el = document.activeElement;
          if (el) {
            setFocusedElementInfo({
              tag: el.tagName,
              id: el.id || el.getAttribute('data-testid') || el.name || 'unnamed',
              role: el.getAttribute('role') || el.tagName.toLowerCase(),
              text: el.innerText ? el.innerText.slice(0, 30) : ''
            });
          }
        };
        document.addEventListener('focusin', handleFocusChange);
        return () => document.removeEventListener('focusin', handleFocusChange);
      }, []);

      return (
        <A11yContext.Provider value={{ announce, announcements, focusedElementInfo }}>
          {children}
          {/* Accessible off-screen live regions for assistive technology */}
          <div aria-live="polite" aria-atomic="true" className="sr-only" id="a11y-polite-region">
            {announcements.filter(a => a.priority === 'polite')[0]?.message}
          </div>
          <div aria-live="assertive" aria-atomic="true" className="sr-only" id="a11y-assertive-region">
            {announcements.filter(a => a.priority === 'assertive')[0]?.message}
          </div>
        </A11yContext.Provider>
      );
    };

    const useA11y = () => useContext(A11yContext);

    // ============================================================================
    // 2. Production Resilient Boundary with WCAG Focus & Bounded Retry
    // ============================================================================
    class ResilientBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = {
          hasError: false,
          error: null,
          correlationId: null,
          retryCount: 0,
          isRetrying: false,
          isCircuitOpen: false,
          cooldownSec: 0
        };
        this.headingRef = React.createRef();
        this.retryBtnRef = React.createRef();
        this.cooldownTimer = null;
      }

      static getDerivedStateFromError(error) {
        const correlationId = 'ERR-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        return { hasError: true, error, correlationId };
      }

      componentDidCatch(error, errorInfo) {
        const { name, tier, onA11yAnnounce, onTelemetry, autoFocusStrategy = 'smart' } = this.props;
        
        // Log telemetry
        if (onTelemetry) {
          onTelemetry({
            name,
            tier,
            correlationId: this.state.correlationId,
            error: error.message,
            timestamp: new Date().toLocaleTimeString()
          });
        }

        // Screen reader announcement
        if (onA11yAnnounce) {
          const priority = tier === 'ROOT' ? 'assertive' : 'polite';
          onA11yAnnounce(`${name} failed. ${tier === 'WIDGET' ? 'Feature degraded.' : 'Action required.'} Reference: ${this.state.correlationId}`, priority);
        }

        // Focus Management Strategy
        setTimeout(() => {
          if (autoFocusStrategy === 'heading' || tier === 'ROUTE' || tier === 'ROOT') {
            if (this.headingRef.current) {
              this.headingRef.current.focus();
            }
          } else if (autoFocusStrategy === 'retry' && this.retryBtnRef.current) {
            this.retryBtnRef.current.focus();
          }
        }, 50);
      }

      componentDidUpdate(prevProps) {
        if (this.state.hasError && this.props.resetKeys && prevProps.resetKeys) {
          const changed = this.props.resetKeys.some((k, i) => k !== prevProps.resetKeys[i]);
          if (changed) {
            this.handleReset();
          }
        }
      }

      handleReset = () => {
        if (this.state.isCircuitOpen) return;
        this.setState({
          hasError: false,
          error: null,
          correlationId: null,
          isRetrying: false
        });
        if (this.props.onReset) this.props.onReset();
      };

      handleBoundedRetry = () => {
        const maxRetries = this.props.maxRetries || 3;
        const currentRetries = this.state.retryCount + 1;

        if (currentRetries >= maxRetries) {
          // Trip Circuit Breaker
          this.setState({
            retryCount: currentRetries,
            isCircuitOpen: true,
            cooldownSec: 6
          });
          if (this.props.onA11yAnnounce) {
            this.props.onA11yAnnounce(`Retry limit reached for ${this.props.name}. Circuit open for 6 seconds.`, 'assertive');
          }

          let remaining = 6;
          this.cooldownTimer = setInterval(() => {
            remaining -= 1;
            if (remaining <= 0) {
              clearInterval(this.cooldownTimer);
              this.setState({ isCircuitOpen: false, retryCount: 0, cooldownSec: 0 });
              if (this.props.onA11yAnnounce) {
                this.props.onA11yAnnounce(`Cooldown complete. Retry re-enabled for ${this.props.name}.`, 'polite');
              }
            } else {
              this.setState({ cooldownSec: remaining });
            }
          }, 1000);
          return;
        }

        this.setState({ isRetrying: true, retryCount: currentRetries });
        // Exponential backoff simulation
        const delay = Math.min(1000 * Math.pow(1.5, currentRetries - 1), 3000);
        setTimeout(() => {
          this.handleReset();
        }, delay);
      };

      componentWillUnmount() {
        if (this.cooldownTimer) clearInterval(this.cooldownTimer);
      }

      render() {
        const { hasError, error, correlationId, isRetrying, isCircuitOpen, cooldownSec, retryCount } = this.state;
        const { name, tier, fallback, children, customHeading } = this.props;

        if (hasError && error) {
          if (fallback) {
            return fallback({
              error,
              correlationId,
              reset: this.handleReset,
              retry: this.handleBoundedRetry,
              isRetrying,
              isCircuitOpen,
              cooldownSec,
              retryCount,
              headingRef: this.headingRef,
              retryBtnRef: this.retryBtnRef
            });
          }

          // Default WCAG AA Accessible Fallback Card
          return (
            <section 
              aria-labelledby={`fallback-heading-${correlationId}`}
              className="p-5 border border-rose-900/50 bg-rose-950/20 rounded-xl relative overflow-hidden flex flex-col justify-between"
            >
              <div>
                <div className="flex items-center justify-between gap-2 mb-2">
                  <span className="text-xs font-semibold px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-800/40">
                    {tier} BULKHEAD
                  </span>
                  <span className="text-[11px] font-mono text-slate-400">
                    Ref: <strong className="text-slate-200">{correlationId}</strong>
                  </span>
                </div>
                
                <h3 
                  id={`fallback-heading-${correlationId}`}
                  ref={this.headingRef}
                  tabIndex="-1"
                  className="text-sm font-bold text-rose-200 mb-1 focus:outline-none focus:ring-1 focus:ring-rose-400 rounded"
                >
                  {customHeading || `${name} is temporarily unavailable`}
                </h3>
                
                <p className="text-xs text-slate-300 mb-3 leading-relaxed">
                  Your other dashboard features remain operational. {error.message}
                </p>
              </div>

              <div className="pt-3 border-t border-rose-900/30 flex items-center justify-between gap-3">
                {isCircuitOpen ? (
                  <div className="text-xs font-semibold text-amber-400 flex items-center gap-1.5 animate-pulse">
                    <span>⚠️ Limit reached. Cooldown:</span>
                    <span className="font-mono px-1.5 py-0.5 bg-amber-950/80 rounded border border-amber-800">{cooldownSec}s</span>
                  </div>
                ) : (
                  <button
                    ref={this.retryBtnRef}
                    onClick={this.handleBoundedRetry}
                    disabled={isRetrying}
                    className="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 disabled:bg-slate-800 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 transition focus:ring-2 focus:ring-rose-400"
                  >
                    {isRetrying ? (
                      <>
                        <span className="w-2.5 h-2.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        <span>Retrying ({retryCount}/3)...</span>
                      </>
                    ) : (
                      <>
                        <span>↻ Retry Component</span>
                        {retryCount > 0 && <span className="text-[10px] opacity-75 font-mono">({retryCount}/3)</span>}
                      </>
                    )}
                  </button>
                )}

                <span className="text-[10px] text-slate-500 font-mono">Preserved State: OK</span>
              </div>
            </section>
          );
        }

        return children;
      }
    }

    // ============================================================================
    // 3. Demo Feature Components
    // ============================================================================

    // A. Revenue Sparkline with WebGL/Canvas Crash simulation
    const RevenueSparkline = ({ shouldCrash, dataset }) => {
      if (shouldCrash) {
        throw new Error('WebGL Matrix Desync: Float32Array NaN calculation failure');
      }
      return (
        <div className="h-40 bg-slate-900/80 rounded-xl p-4 border border-slate-800 flex flex-col justify-between">
          <div className="flex justify-between items-center text-xs">
            <span className="font-semibold text-slate-300">📈 Live Revenue Acceleration</span>
            <span className="text-emerald-400 font-mono font-bold">+24.8% vs last week</span>
          </div>
          {/* Simulated Vector Graph */}
          <div className="flex items-end gap-2 h-20 pt-2 px-1">
            {dataset.map((val, i) => (
              <div key={i} className="flex-1 flex flex-col items-center gap-1">
                <div 
                  className="w-full bg-indigo-500 rounded-t transition-all hover:bg-indigo-400" 
                  style={{ height: `${val}%` }}
                ></div>
                <span className="text-[9px] text-slate-500">D{i+1}</span>
              </div>
            ))}
          </div>
          <div className="text-[11px] text-slate-400 flex justify-between items-center">
            <span>Hardware Accelerated (Canvas 2D/WebGL)</span>
            <span className="text-indigo-400 font-mono">$128,450.00</span>
          </div>
        </div>
      );
    };

    // B. Critical Payment Form with Unsaved Draft State
    const PaymentDraftForm = ({ formDraft, onUpdateDraft, onSubmitForm }) => {
      return (
        <div className="bg-slate-900/80 rounded-xl p-5 border border-slate-800 flex flex-col gap-3">
          <div className="flex justify-between items-center pb-2 border-b border-slate-800">
            <h4 className="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
              <span>💳 Secure Transaction Draft</span>
              <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                Session Synced
              </span>
            </h4>
            <span className="text-[11px] text-slate-500">Auto-saved draft</span>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label htmlFor="payer-name" className="block text-xs font-medium text-slate-300 mb-1">
                Account Holder Name
              </label>
              <input
                id="payer-name"
                name="payerName"
                type="text"
                value={formDraft.name}
                onChange={e => onUpdateDraft('name', e.target.value)}
                placeholder="e.g. Sarah Connor"
                className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 placeholder-slate-600 focus:border-indigo-500"
              />
            </div>
            <div>
              <label htmlFor="invoice-id" className="block text-xs font-medium text-slate-300 mb-1">
                Invoice Reference #
              </label>
              <input
                id="invoice-id"
                name="invoiceId"
                type="text"
                value={formDraft.invoice}
                onChange={e => onUpdateDraft('invoice', e.target.value)}
                placeholder="INV-90210"
                className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 placeholder-slate-600 focus:border-indigo-500 font-mono"
              />
            </div>
          </div>

          <div>
            <label htmlFor="payment-memo" className="block text-xs font-medium text-slate-300 mb-1">
              Wire Instructions Memo
            </label>
            <input
              id="payment-memo"
              name="paymentMemo"
              type="text"
              value={formDraft.memo}
              onChange={e => onUpdateDraft('memo', e.target.value)}
              placeholder="Add confidential transaction note..."
              className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 placeholder-slate-600 focus:border-indigo-500"
            />
          </div>

          <div className="flex justify-between items-center pt-2">
            <span className="text-[11px] text-slate-400">
              Draft length: <strong className="text-indigo-400 font-mono">{formDraft.name.length + formDraft.memo.length}</strong> chars
            </span>
            <button
              type="button"
              onClick={onSubmitForm}
              className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition shadow-lg shadow-indigo-600/20"
            >
              Authorize Wire Transfer ($42,000)
            </button>
          </div>
        </div>
      );
    };

    // C. Live Event Log Widget
    const LiveAuditLogWidget = ({ shouldCrash }) => {
      if (shouldCrash) {
        throw new Error('WebSocket Desync: Packet sequence mismatch in audit stream');
      }
      return (
        <div className="bg-slate-900/80 rounded-xl p-4 border border-slate-800 flex flex-col justify-between h-40">
          <div className="flex justify-between items-center text-xs pb-2 border-b border-slate-800">
            <span className="font-semibold text-slate-300">📡 Real-Time Security Audit Bus</span>
            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
          </div>
          <div className="space-y-1.5 text-[11px] font-mono overflow-auto py-1">
            <div className="text-emerald-400 flex items-center gap-1.5">
              <span>●</span> <span>[12:44:02] HMAC Key Validated (200 OK)</span>
            </div>
            <div className="text-slate-400 flex items-center gap-1.5">
              <span>●</span> <span>[12:44:09] SSE Heartbeat Received (12ms)</span>
            </div>
            <div className="text-indigo-400 flex items-center gap-1.5">
              <span>●</span> <span>[12:44:18] KYC Verification Complete</span>
            </div>
          </div>
          <div className="text-[10px] text-slate-500 flex justify-between">
            <span>Cluster: us-east-2</span>
            <span>Uptime: 99.998%</span>
          </div>
        </div>
      );
    };

    // ============================================================================
    // 4. Main Interactive Diagnostic Sandbox App
    // ============================================================================
    const App = () => {
      const { announce, announcements, focusedElementInfo } = useA11y();

      // State Controls
      const [activeScenario, setActiveScenario] = useState('A');
      const [currentRoute, setCurrentRoute] = useState('/dashboard');
      const [telemetryLogs, setTelemetryLogs] = useState([]);
      
      // Fault Injection Flags
      const [crashSparkline, setCrashSparkline] = useState(false);
      const [crashAuditLog, setCrashAuditLog] = useState(false);
      const [crashRoute, setCrashRoute] = useState(false);
      const [useBroadBoundary, setUseBroadBoundary] = useState(false);
      const [focusStrategy, setFocusStrategy] = useState('smart');

      // User Draft State (Should survive widget crashes!)
      const [formDraft, setFormDraft] = useState({
        name: 'Alexander Hamilton',
        invoice: 'INV-2026-X88',
        memo: 'Enterprise Treasury Liquidity Allocations Q3'
      });

      const handleUpdateDraft = (field, val) => {
        setFormDraft(prev => ({ ...prev, [field]: val }));
      };

      const handleLogTelemetry = (payload) => {
        setTelemetryLogs(prev => [payload, ...prev.slice(0, 19)]);
      };

      // Scenario Presets
      const loadScenario = (key) => {
        setActiveScenario(key);
        setCrashSparkline(false);
        setCrashAuditLog(false);
        setCrashRoute(false);

        switch (key) {
          case 'A': // Healthy
            setUseBroadBoundary(false);
            announce('Loaded Scenario A: Healthy Full Dashboard', 'polite');
            break;
          case 'B': // Widget Crash
            setUseBroadBoundary(false);
            setCrashSparkline(true);
            announce('Loaded Scenario B: Widget Bulkhead Failure. Sparkline crashed, Form and Sibling intact.', 'assertive');
            break;
          case 'C': // Route Crash
            setUseBroadBoundary(false);
            setCrashRoute(true);
            announce('Loaded Scenario C: Route-level crash. Navigation shell preserved, focus shifted to route outage heading.', 'assertive');
            break;
          case 'D': // Focus Strategy Comparison
            setUseBroadBoundary(false);
            setCrashSparkline(true);
            setFocusStrategy('heading');
            announce('Loaded Scenario D: Focus Management demonstration. Inspect active element panel.', 'polite');
            break;
          case 'E': // Bounded Retry
            setUseBroadBoundary(false);
            setCrashSparkline(true);
            announce('Loaded Scenario E: Bounded retry policy with exponential backoff & circuit breaker.', 'polite');
            break;
          case 'F': // Broad Boundary (Anti-pattern)
            setUseBroadBoundary(true);
            setCrashSparkline(true);
            announce('Loaded Scenario F: Broad boundary anti-pattern! Form state wiped on widget failure.', 'assertive');
            break;
          case 'G': // Progressive Degradation
            setUseBroadBoundary(false);
            setCrashSparkline(true);
            setCrashAuditLog(true);
            announce('Loaded Scenario G: Multi-widget progressive degradation. Dashboard remains operational.', 'polite');
            break;
        }
      };

      const resetAllFaults = () => {
        setCrashSparkline(false);
        setCrashAuditLog(false);
        setCrashRoute(false);
        announce('All fault injections cleared. Application returned to healthy state.', 'polite');
      };

      return (
        <div className="flex-1 flex flex-col min-h-screen bg-slate-950 text-slate-100">
          
          {/* Top Persistent App Navigation Shell */}
          <header className="h-16 border-b border-slate-800 bg-slate-900/60 backdrop-blur px-6 flex items-center justify-between sticky top-0 z-30">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-600/30">
                12
              </div>
              <div>
                <h1 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                  <span>Fallback UX & Progressive Degradation Lab</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/30">
                    WCAG 2.1 AA
                  </span>
                </h1>
                <p className="text-[11px] text-slate-400">KPI 16 • Senior Error Handling Masterclass</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setCurrentRoute('/dashboard')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  currentRoute === '/dashboard' ? 'bg-slate-800 text-indigo-400 border border-indigo-500/30' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                📊 Dashboard
              </button>
              <button
                onClick={() => setCurrentRoute('/billing')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  currentRoute === '/billing' ? 'bg-slate-800 text-indigo-400 border border-indigo-500/30' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                💳 Billing ($42k)
              </button>
              <button
                onClick={() => setCurrentRoute('/settings')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                  currentRoute === '/settings' ? 'bg-slate-800 text-indigo-400 border border-indigo-500/30' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                ⚙️ Settings
              </button>
              <button
                onClick={resetAllFaults}
                className="ml-3 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-emerald-600/20"
              >
                <span>↺ Clear All Faults</span>
              </button>
            </div>
          </header>

          {/* Scenario Selector Ribbon */}
          <nav aria-label="Scenario Selection" className="bg-slate-900/40 border-b border-slate-800/80 px-6 py-2.5 overflow-x-auto">
            <div className="flex items-center gap-2 min-w-max">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2">Scenarios:</span>
              {[
                { key: 'A', label: 'A: Healthy View' },
                { key: 'B', label: 'B: Widget Bulkhead Crash' },
                { key: 'C', label: 'C: Route Sandboxed Crash' },
                { key: 'D', label: 'D: Focus Management' },
                { key: 'E', label: 'E: Bounded Retry Policy' },
                { key: 'F', label: 'F: Broad Boundary (Anti-pattern)' },
                { key: 'G', label: 'G: Progressive Degradation' }
              ].map(s => (
                <button
                  key={s.key}
                  onClick={() => loadScenario(s.key)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${
                    activeScenario === s.key
                      ? 'bg-indigo-600 text-white font-semibold shadow-md shadow-indigo-600/30'
                      : 'bg-slate-800/60 hover:bg-slate-800 text-slate-300 border border-slate-700/50'
                  }`}
                >
                  {s.label}
                </button>
              ))}
            </div>
          </nav>

          {/* Main Layout: 2 Columns (Interactive UI + Diagnostic Telemetry Rail) */}
          <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 overflow-hidden">
            
            {/* Left 8 Cols: Interactive Application Viewport */}
            <div className="lg:col-span-8 flex flex-col gap-6">

              {/* Top Route Boundary */}
              <ResilientBoundary
                name={`Route:${currentRoute}`}
                tier="ROUTE"
                resetKeys={[currentRoute]}
                autoFocusStrategy={focusStrategy}
                onA11yAnnounce={announce}
                onTelemetry={handleLogTelemetry}
                fallback={({ error, correlationId, reset, headingRef }) => (
                  <div className="p-8 border border-rose-900/50 bg-rose-950/20 rounded-2xl text-center my-6 max-w-xl mx-auto">
                    <div className="text-4xl mb-3">🚧</div>
                    <h2
                      ref={headingRef}
                      tabIndex="-1"
                      className="text-lg font-bold text-rose-200 mb-2 focus:outline-none focus:ring-2 focus:ring-rose-400 rounded"
                    >
                      Route Unavailable: <span className="font-mono text-slate-300">{currentRoute}</span>
                    </h2>
                    <p className="text-xs text-slate-300 mb-4 max-w-md mx-auto leading-relaxed">
                      This page could not be rendered. Navigation shell, global authentication, and sibling routes remain healthy.
                    </p>
                    <div className="p-2.5 bg-slate-950 rounded-lg text-left text-[11px] font-mono text-rose-400 mb-5 border border-slate-800 overflow-auto max-h-24">
                      {error.message}
                    </div>
                    <div className="flex justify-center gap-3">
                      <button
                        onClick={reset}
                        className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-semibold transition"
                      >
                        ↻ Re-attempt Route Render
                      </button>
                      <button
                        onClick={() => setCurrentRoute('/dashboard')}
                        className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-semibold transition"
                      >
                        Return to Safe Dashboard
                      </button>
                    </div>
                  </div>
                )}
              >
                {/* Route Crash Trigger Simulation */}
                {crashRoute && currentRoute === '/dashboard' ? (
                  (() => { throw new Error('Route Loader Exception: Chunk resolution timeout on /dashboard'); })()
                ) : (
                  <>
                    {/* Scenario F Demonstrator: Broad Boundary Wrapping Entire View */}
                    {useBroadBoundary ? (
                      <ResilientBoundary
                        name="MonolithicDashboardBoundary"
                        tier="ROOT"
                        onA11yAnnounce={announce}
                        onTelemetry={handleLogTelemetry}
                      >
                        <div className="space-y-6">
                          <div className="p-3 bg-amber-950/40 border border-amber-800/60 rounded-xl text-xs text-amber-300 flex items-center justify-between">
                            <span>⚠️ <strong>ANTI-PATTERN ACTIVE:</strong> Monolithic Boundary wraps Sparkline AND Form together!</span>
                            <span className="font-mono text-[11px]">Draft will be WIPED on crash</span>
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <RevenueSparkline shouldCrash={crashSparkline} dataset={[30, 45, 60, 55, 80, 95, 100]} />
                            <PaymentDraftForm 
                              formDraft={formDraft} 
                              onUpdateDraft={handleUpdateDraft} 
                              onSubmitForm={() => announce('Transfer submitted for $42,000!', 'polite')}
                            />
                          </div>
                        </div>
                      </ResilientBoundary>
                    ) : (
                      /* Resilient Granular Bulkheads (Standard Pattern) */
                      <div className="space-y-6">
                        
                        {/* Status Ribbon */}
                        <div className="p-3 bg-slate-900/60 border border-slate-800 rounded-xl flex items-center justify-between text-xs">
                          <div className="flex items-center gap-2">
                            <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                            <span className="font-medium text-slate-300">Active Viewport: <strong className="text-white font-mono">{currentRoute}</strong></span>
                          </div>
                          <div className="text-slate-400">
                            Resilience Model: <strong className="text-indigo-400">4-Tier Granular Bulkhead</strong>
                          </div>
                        </div>

                        {/* Top Row: Analytics & Payment Draft Form */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          
                          {/* Widget Bulkhead 1: Sparkline */}
                          <ResilientBoundary
                            name="AnalyticsSparkline"
                            tier="WIDGET"
                            autoFocusStrategy={focusStrategy}
                            onA11yAnnounce={announce}
                            onTelemetry={handleLogTelemetry}
                            fallback={({ error, correlationId, retry, isRetrying, isCircuitOpen, cooldownSec, retryCount, headingRef, retryBtnRef }) => (
                              <div className="h-40 border border-amber-900/50 bg-amber-950/20 rounded-xl p-4 flex flex-col justify-between">
                                <div>
                                  <div className="flex justify-between items-center text-xs pb-1 border-b border-amber-900/30">
                                    <span className="font-bold text-amber-400 flex items-center gap-1.5">
                                      <span>⚠️ 2D Fallback Table</span>
                                    </span>
                                    <span className="font-mono text-[10px] text-slate-400">Ref: {correlationId}</span>
                                  </div>
                                  <h4 
                                    ref={headingRef} 
                                    tabIndex="-1" 
                                    className="text-xs font-semibold text-slate-200 mt-1 focus:outline-none"
                                  >
                                    Hardware acceleration unavailable
                                  </h4>
                                  <div className="overflow-auto max-h-16 my-1 text-[11px] font-mono text-slate-400">
                                    <table className="w-full text-left">
                                      <tbody>
                                        <tr><td>Day 1-3</td><td className="text-indigo-400 font-bold">$42,100</td></tr>
                                        <tr><td>Day 4-7</td><td className="text-emerald-400 font-bold">$86,350</td></tr>
                                      </tbody>
                                    </table>
                                  </div>
                                </div>
                                <div className="flex items-center justify-between pt-1 border-t border-amber-900/30">
                                  {isCircuitOpen ? (
                                    <span className="text-[11px] text-amber-400 font-bold">🚨 Circuit Open ({cooldownSec}s)</span>
                                  ) : (
                                    <button
                                      ref={retryBtnRef}
                                      onClick={retry}
                                      disabled={isRetrying}
                                      className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-[11px] font-semibold flex items-center gap-1 transition"
                                    >
                                      {isRetrying ? 'Retrying...' : `↺ Retry GPU (${retryCount}/3)`}
                                    </button>
                                  )}
                                  <span className="text-[10px] text-slate-500">Accessible tabular view</span>
                                </div>
                              </div>
                            )}
                          >
                            <RevenueSparkline shouldCrash={crashSparkline} dataset={[30, 45, 60, 55, 80, 95, 100]} />
                          </ResilientBoundary>

                          {/* Protected Payment Draft Form */}
                          <PaymentDraftForm 
                            formDraft={formDraft} 
                            onUpdateDraft={handleUpdateDraft} 
                            onSubmitForm={() => announce('Transfer authorized for $42,000!', 'polite')}
                          />
                        </div>

                        {/* Bottom Row: Real-time Audit Bus */}
                        <ResilientBoundary
                          name="RealTimeAuditStream"
                          tier="WIDGET"
                          autoFocusStrategy={focusStrategy}
                          onA11yAnnounce={announce}
                          onTelemetry={handleLogTelemetry}
                        >
                          <LiveAuditLogWidget shouldCrash={crashAuditLog} />
                        </ResilientBoundary>

                      </div>
                    )}
                  </>
                )}
              </ResilientBoundary>

              {/* Interactive Fault Injection Trigger Console */}
              <div className="bg-slate-900/90 rounded-2xl p-5 border border-slate-800">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center justify-between">
                  <span>⚡ Interactive Fault Injection Matrix</span>
                  <span className="text-[11px] font-normal text-slate-500">Inject crashes into target subtrees</span>
                </h3>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <button
                    onClick={() => { setCrashSparkline(prev => !prev); announce(`Toggled Sparkline crash state to ${!crashSparkline}`, 'polite'); }}
                    className={`p-3 rounded-xl text-xs font-semibold transition text-left flex flex-col justify-between h-20 ${
                      crashSparkline ? 'bg-rose-600/30 border border-rose-500 text-rose-200' : 'bg-slate-800/80 hover:bg-slate-800 text-slate-300 border border-slate-700/50'
                    }`}
                  >
                    <span className="text-sm">💥 WebGL NaN Error</span>
                    <span className="text-[10px] font-mono">{crashSparkline ? 'Active (Crashed)' : 'Healthy'}</span>
                  </button>

                  <button
                    onClick={() => { setCrashAuditLog(prev => !prev); announce(`Toggled Audit Log crash state to ${!crashAuditLog}`, 'polite'); }}
                    className={`p-3 rounded-xl text-xs font-semibold transition text-left flex flex-col justify-between h-20 ${
                      crashAuditLog ? 'bg-rose-600/30 border border-rose-500 text-rose-200' : 'bg-slate-800/80 hover:bg-slate-800 text-slate-300 border border-slate-700/50'
                    }`}
                  >
                    <span className="text-sm">📡 WebSocket Desync</span>
                    <span className="text-[10px] font-mono">{crashAuditLog ? 'Active (Crashed)' : 'Healthy'}</span>
                  </button>

                  <button
                    onClick={() => { setCrashRoute(prev => !prev); announce(`Toggled Route crash state to ${!crashRoute}`, 'assertive'); }}
                    className={`p-3 rounded-xl text-xs font-semibold transition text-left flex flex-col justify-between h-20 ${
                      crashRoute ? 'bg-rose-600/30 border border-rose-500 text-rose-200' : 'bg-slate-800/80 hover:bg-slate-800 text-slate-300 border border-slate-700/50'
                    }`}
                  >
                    <span className="text-sm">🚧 Route Outlet 500</span>
                    <span className="text-[10px] font-mono">{crashRoute ? 'Active (Crashed)' : 'Healthy'}</span>
                  </button>

                  <button
                    onClick={() => { setUseBroadBoundary(prev => !prev); announce(`Toggled Broad Boundary mode to ${!useBroadBoundary}`, 'polite'); }}
                    className={`p-3 rounded-xl text-xs font-semibold transition text-left flex flex-col justify-between h-20 ${
                      useBroadBoundary ? 'bg-amber-600/30 border border-amber-500 text-amber-200' : 'bg-slate-800/80 hover:bg-slate-800 text-slate-300 border border-slate-700/50'
                    }`}
                  >
                    <span className="text-sm">📦 Monolithic Wrap</span>
                    <span className="text-[10px] font-mono">{useBroadBoundary ? 'Broad (Data Loss)' : 'Granular'}</span>
                  </button>
                </div>
              </div>

            </div>

            {/* Right 4 Cols: Live Accessibility, Focus & Telemetry Inspectors */}
            <div className="lg:col-span-4 flex flex-col gap-6 overflow-hidden">
              
              {/* 1. Accessibility & Focus State Inspector */}
              <div className="bg-slate-900/90 rounded-2xl p-4 border border-slate-800 flex flex-col gap-3">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="text-xs font-bold text-indigo-400 uppercase tracking-wider flex items-center gap-1.5">
                    <span>👁️ Focus & A11y Inspector</span>
                  </h3>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300">
                    WCAG AA Live
                  </span>
                </div>

                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-1.5 text-xs font-mono">
                  <div className="flex justify-between">
                    <span className="text-slate-500">Active Element:</span>
                    <span className="text-emerald-400 font-bold">&lt;{focusedElementInfo.tag}&gt;</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">ID / TestID:</span>
                    <span className="text-indigo-300 truncate max-w-[140px]">{focusedElementInfo.id}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">ARIA Role:</span>
                    <span className="text-amber-300">{focusedElementInfo.role}</span>
                  </div>
                </div>

                {/* Focus Strategy Toggle */}
                <div className="pt-2">
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1.5">
                    Fallback Focus Strategy:
                  </label>
                  <div className="grid grid-cols-3 gap-1.5 text-[11px]">
                    {['smart', 'heading', 'retry'].map(st => (
                      <button
                        key={st}
                        onClick={() => { setFocusStrategy(st); announce(`Focus strategy set to ${st}`, 'polite'); }}
                        className={`py-1 rounded font-medium transition capitalize ${
                          focusStrategy === st ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        {st}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* 2. Screen Reader Live Region Feed */}
              <div className="bg-slate-900/90 rounded-2xl p-4 border border-slate-800 flex flex-col flex-1 min-h-[180px]">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800 mb-2">
                  <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                    📢 Screen Reader Announcements
                  </h3>
                  <span className="text-[10px] text-slate-500">aria-live feed</span>
                </div>
                <div className="flex-1 overflow-auto space-y-2 max-h-48 pr-1">
                  {announcements.length === 0 ? (
                    <div className="text-xs text-slate-500 italic py-4 text-center">No announcements yet. Trigger a fault!</div>
                  ) : (
                    announcements.map(ann => (
                      <div key={ann.id} className="p-2 rounded-lg bg-slate-950 border border-slate-800 text-[11px] leading-relaxed">
                        <div className="flex justify-between text-[9px] font-mono text-slate-500 mb-1">
                          <span className={ann.priority === 'assertive' ? 'text-rose-400 font-bold' : 'text-indigo-400'}>
                            [{ann.priority.toUpperCase()}]
                          </span>
                          <span>{ann.timestamp}</span>
                        </div>
                        <p className="text-slate-300">{ann.message}</p>
                      </div>
                    ))
                  )}
                </div>
              </div>

              {/* 3. Distributed Telemetry Bus */}
              <div className="bg-slate-900/90 rounded-2xl p-4 border border-slate-800 flex flex-col flex-1 min-h-[180px]">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800 mb-2">
                  <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                    📡 Distributed Error Telemetry
                  </h3>
                  <span className="text-[10px] font-mono text-indigo-400">{telemetryLogs.length} events</span>
                </div>
                <div className="flex-1 overflow-auto space-y-2 max-h-48 pr-1 font-mono text-[10px]">
                  {telemetryLogs.length === 0 ? (
                    <div className="text-xs text-slate-500 italic py-4 text-center font-sans">No errors logged to Sentry bus.</div>
                  ) : (
                    telemetryLogs.map((log, idx) => (
                      <div key={idx} className="p-2 rounded bg-slate-950 border border-slate-800 text-slate-300">
                        <div className="flex justify-between text-slate-500 mb-1">
                          <span className="text-rose-400 font-bold">{log.tier}:{log.name}</span>
                          <span className="text-indigo-400">{log.correlationId}</span>
                        </div>
                        <div className="text-slate-400 truncate">{log.error}</div>
                      </div>
                    ))
                  )}
                </div>
              </div>

            </div>

          </main>

          {/* Persistent Footer */}
          <footer className="h-10 border-t border-slate-800 bg-slate-950 px-6 flex items-center justify-between text-[11px] text-slate-500">
            <div>
              Level 06 • KPI 16: Error Handling, Boundaries & Resilience
            </div>
            <div className="flex items-center gap-3">
              <span>Section 12: Fallback UX & Accessibility</span>
              <span>•</span>
              <a 
                href="https://www.linkedin.com/in/kudurmallasrikar/" 
                target="_blank" 
                rel="noreferrer"
                className="text-indigo-400 hover:underline"
              >
                Lead Architect: Srikar Kudurmalla
              </a>
            </div>
          </footer>

        </div>
      );
    };

    // Mount Root with A11y Provider
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <A11yProvider>
        <App />
      </A11yProvider>
    );
  </script>
</body>
</html>
