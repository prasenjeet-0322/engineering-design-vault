    // =========================================================================
    // 1. ASYNC RESOURCE REDUCER WITH OPERATION CURRENTNESS GUARDS
    // =========================================================================
    function asyncResourceReducer(state, action) {
      switch (action.type) {
        case "START_FETCH": {
          const hasExistingData = state.resource.data !== null;
          return {
            ...state,
            activeOpId: action.opId,
            resource: hasExistingData
              ? {
                  status: "REFRESHING",
                  data: state.resource.data,
                  opId: action.opId,
                  startedAt: action.timestamp,
                  fetchedAt: state.resource.fetchedAt || action.timestamp,
                }
              : {
                  status: "EMPTY_LOADING",
                  data: null,
                  opId: action.opId,
                  startedAt: action.timestamp,
                },
          };
        }

        case "FETCH_SUCCESS": {
          // 🛡️ ZOMBIE GUARD: Reject obsolete operation completions!
          if (action.opId !== state.activeOpId) {
            return {
              ...state,
              droppedEvents: [
                {
                  type: "DROPPED_STALE_SUCCESS",
                  opId: action.opId,
                  activeOpId: state.activeOpId,
                  timestamp: action.timestamp,
                },
                ...state.droppedEvents.slice(0, 10),
              ],
            };
          }

          return {
            ...state,
            resource: {
              status: "READY",
              data: action.data,
              fetchedAt: action.timestamp,
            },
          };
        }

        case "FETCH_FAILURE": {
          // 🛡️ ZOMBIE GUARD: Reject obsolete operation failures!
          if (action.opId !== state.activeOpId) {
            return {
              ...state,
              droppedEvents: [
                {
                  type: "DROPPED_STALE_ERROR",
                  opId: action.opId,
                  activeOpId: state.activeOpId,
                  error: action.error,
                  timestamp: action.timestamp,
                },
                ...state.droppedEvents.slice(0, 10),
              ],
            };
          }

          const hasExistingData = state.resource.data !== null;
          return {
            ...state,
            resource: hasExistingData
              ? {
                  status: "REFRESH_ERROR",
                  data: state.resource.data, // 🎯 PRESERVED!
                  error: action.error,
                  opId: action.opId,
                  fetchedAt: state.resource.fetchedAt || action.timestamp,
                }
              : {
                  status: "INITIAL_ERROR",
                  data: null,
                  error: action.error,
                  opId: action.opId,
                },
          };
        }

        case "INVALIDATE": {
          return {
            ...state,
            activeOpId: null,
            resource: {
              status: "INITIAL_ERROR",
              data: null,
              error: "Cache purged by manual invalidation.",
              opId: "invalidation",
            },
          };
        }

        default:
          return state;
      }
    }

    // =========================================================================
    // EXPERIMENT A: INITIAL LOAD FAILURE
    // =========================================================================
    function ExperimentInitialLoad({ onTelemetry }) {
      const [state, dispatch] = useReducer(asyncResourceReducer, {
        resource: { status: "INITIAL_ERROR", data: null, error: "HTTP 504 Gateway Timeout: Initial cold fetch failed.", opId: "init_1" },
        activeOpId: "init_1",
        droppedEvents: [],
      });

      const handleSimulateColdFetch = (shouldSucceed) => {
        const opId = `op_${Math.random().toString(36).substring(2, 7)}`;
        dispatch({ type: "START_FETCH", opId, timestamp: Date.now() });

        setTimeout(() => {
          if (shouldSucceed) {
            const data = [
              { id: "1", name: "Contract 2026-A", value: "$450,000" },
              { id: "2", name: "Securities Agreement", value: "$1,200,000" },
            ];
            dispatch({ type: "FETCH_SUCCESS", opId, data, timestamp: Date.now() });
            onTelemetry({
              category: "ASYNC_LIFECYCLE_EVENT",
              type: "INITIAL_FETCH_SUCCESS",
              opId,
              message: "Initial cold fetch succeeded. Transitioned to READY.",
            });
          } else {
            dispatch({
              type: "FETCH_FAILURE",
              opId,
              error: "HTTP 504: Gateway service unreachable.",
              timestamp: Date.now(),
            });
            onTelemetry({
              category: "ASYNC_OPERATIONAL_FAILURE",
              type: "INITIAL_FETCH_FAILED",
              opId,
              message: "Initial cold fetch failed. Rendered full-card fallback (no prior data in memory).",
            });
          }
        }, 800);
      };

      return (
        <div className="glass-panel p-6 rounded-2xl space-y-5">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-bold font-mono px-2 py-0.5 rounded bg-blue-950/80 border border-blue-800 text-blue-300">
                EXPERIMENT A: COLD FETCH
              </span>
              <h2 className="text-lg font-bold text-white mt-1">Initial Load Failure State</h2>
            </div>
            <span className="text-xs font-mono text-slate-400">Status: {state.resource.status}</span>
          </div>

          <p className="text-xs text-slate-400">
            When there is zero prior data in memory (`data: null`), an operational failure must render a full-resource fallback card with an explicit retry button.
          </p>

          <div className="p-6 bg-slate-950 rounded-2xl border border-slate-800">
            {state.resource.status === "EMPTY_LOADING" && (
              <div className="space-y-3 animate-pulse">
                <div className="h-6 bg-slate-800 rounded-lg w-1/3" />
                <div className="h-12 bg-slate-900 rounded-xl" />
                <div className="h-12 bg-slate-900 rounded-xl" />
              </div>
            )}

            {state.resource.status === "INITIAL_ERROR" && (
              <div className="p-8 text-center space-y-4">
                <div className="text-4xl">📡💥</div>
                <h3 className="font-bold text-white text-base">Unable to Connect to Workspace</h3>
                <p className="text-xs text-red-300 font-mono max-w-sm mx-auto">{state.resource.error}</p>
                <button
                  onClick={() => handleSimulateColdFetch(true)}
                  className="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-red-600/30"
                >
                  Retry Connection
                </button>
              </div>
            )}

            {state.resource.status === "READY" && (
              <div className="space-y-3">
                <h3 className="text-xs font-bold text-emerald-400 uppercase tracking-wider font-mono">
                  ✅ Active Workspace Agreements (Cold Fetch Ready)
                </h3>
                {state.resource.data.map((item) => (
                  <div key={item.id} className="flex justify-between items-center p-3 bg-slate-900 rounded-xl border border-slate-800 text-xs">
                    <span className="font-bold text-white">{item.name}</span>
                    <span className="font-mono text-emerald-400">{item.value}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="flex gap-3">
            <button
              onClick={() => handleSimulateColdFetch(false)}
              className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl transition"
            >
              Simulate Failed Cold Fetch
            </button>
            <button
              onClick={() => handleSimulateColdFetch(true)}
              className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition"
            >
              Simulate Successful Cold Fetch
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT B: BACKGROUND REFRESH FAILURE (SWR DATA RETENTION)
    // =========================================================================
    function ExperimentBackgroundRefresh({ onTelemetry }) {
      const initialData = [
        { id: "101", title: "Project Phoenix Alpha", budget: "$850,000", status: "On Track" },
        { id: "102", title: "Cloud Infrastructure Migration", budget: "$1,200,000", status: "In Review" },
        { id: "103", title: "Compliance SOC-2 Audit", budget: "$340,000", status: "Synchronized" },
      ];

      const [state, dispatch] = useReducer(asyncResourceReducer, {
        resource: { status: "READY", data: initialData, fetchedAt: Date.now() - 180000 },
        activeOpId: "init_b",
        droppedEvents: [],
      });

      const handleSimulateBackgroundRefresh = (shouldSucceed) => {
        const opId = `poll_${Math.random().toString(36).substring(2, 7)}`;
        dispatch({ type: "START_FETCH", opId, timestamp: Date.now() });

        setTimeout(() => {
          if (shouldSucceed) {
            const updated = [
              { id: "101", title: "Project Phoenix Alpha", budget: "$920,000", status: "Revisions Active" },
              { id: "102", title: "Cloud Infrastructure Migration", budget: "$1,200,000", status: "Approved" },
              { id: "103", title: "Compliance SOC-2 Audit", budget: "$340,000", status: "Synchronized" },
            ];
            dispatch({ type: "FETCH_SUCCESS", opId, data: updated, timestamp: Date.now() });
            onTelemetry({
              category: "ASYNC_LIFECYCLE_EVENT",
              type: "BACKGROUND_REFRESH_SUCCESS",
              opId,
              message: "Background revalidation succeeded. UI smoothly updated.",
            });
          } else {
            dispatch({
              type: "FETCH_FAILURE",
              opId,
              error: "HTTP 504 Gateway Timeout: Upstream microservice delayed.",
              timestamp: Date.now(),
            });
            onTelemetry({
              category: "ASYNC_OPERATIONAL_FAILURE",
              type: "BACKGROUND_REFRESH_FAILED_DATA_PRESERVED",
              opId,
              message: "Background refresh failed. Preserved cached data and mounted non-blocking banner.",
            });
          }
        }, 1000);
      };

      return (
        <div className="glass-panel p-6 rounded-2xl space-y-5">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-bold font-mono px-2 py-0.5 rounded bg-emerald-950/80 border border-emerald-800 text-emerald-300">
                EXPERIMENT B: SWR RETENTION
              </span>
              <h2 className="text-lg font-bold text-white mt-1">Background Refresh Failure</h2>
            </div>
            <span className="text-xs font-mono text-slate-400">Status: {state.resource.status}</span>
          </div>

          <p className="text-xs text-slate-400">
            Notice that when background refresh fails, the existing projects remain 100% visible and interactive. Only an unobtrusive top banner appears!
          </p>

          <div className="p-6 bg-slate-950 rounded-2xl border border-slate-800 space-y-4">
            {/* Stale Non-Blocking Warning Banner */}
            {state.resource.status === "REFRESH_ERROR" && (
              <div className="p-4 rounded-xl bg-amber-950/40 border border-amber-800 text-amber-200 flex items-center justify-between animate-fade-in">
                <div className="flex items-center gap-3">
                  <span className="text-xl">⚠️</span>
                  <div>
                    <h4 className="font-bold text-xs">Background Revalidation Failed (HTTP 504)</h4>
                    <p className="text-[11px] text-amber-300">
                      Displaying cached version from {new Date(state.resource.fetchedAt).toLocaleTimeString()}.
                    </p>
                  </div>
                </div>
                <button
                  onClick={() => handleSimulateBackgroundRefresh(true)}
                  className="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-bold transition shadow-lg shadow-amber-600/30"
                >
                  Retry Refresh
                </button>
              </div>
            )}

            {/* Refreshing Pulse Badge */}
            {state.resource.status === "REFRESHING" && (
              <div className="flex items-center gap-2 text-xs font-mono text-blue-400">
                <span className="animate-spin">⏳</span>
                <span>Contacting server for newest revisions (content preserved)...</span>
              </div>
            )}

            {/* Project List */}
            <div className="space-y-3">
              {state.resource.data &&
                state.resource.data.map((proj) => (
                  <div key={proj.id} className="flex justify-between items-center p-4 bg-slate-900 rounded-xl border border-slate-800 text-xs">
                    <div>
                      <h4 className="font-bold text-white text-sm">{proj.title}</h4>
                      <p className="text-slate-400 font-mono mt-0.5">Budget: {proj.budget}</p>
                    </div>
                    <span className="px-2.5 py-1 bg-slate-950 border border-slate-700 rounded-full font-mono text-emerald-400">
                      {proj.status}
                    </span>
                  </div>
                ))}
            </div>
          </div>

          <div className="flex gap-3">
            <button
              onClick={() => handleSimulateBackgroundRefresh(false)}
              disabled={state.resource.status === "REFRESHING"}
              className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl transition"
            >
              Simulate 504 Timeout During Poll
            </button>
            <button
              onClick={() => handleSimulateBackgroundRefresh(true)}
              disabled={state.resource.status === "REFRESHING"}
              className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition"
            >
              Simulate Successful Revalidation
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT C: STALE ERROR ZOMBIE RACE CONDITION
    // =========================================================================
    function ExperimentZombieError({ onTelemetry }) {
      const [state, dispatch] = useReducer(asyncResourceReducer, {
        resource: { status: "READY", data: { balance: "$450,000.00", version: "v1 (Initial)" }, fetchedAt: Date.now() },
        activeOpId: "op_initial",
        droppedEvents: [],
      });

      const [raceActive, setRaceActive] = useState(false);

      const triggerZombieRace = () => {
        setRaceActive(true);

        // 1. Slow Request #1 (Dispatched first, delayed 2000ms, will FAIL)
        const op1 = "op_1_SLOW_FAIL";
        dispatch({ type: "START_FETCH", opId: op1, timestamp: Date.now() });
        onTelemetry({
          category: "CONCURRENCY_RACE_EVENT",
          type: "OP1_DISPATCHED",
          opId: op1,
          latency: "2000ms",
          outcome: "Destined to FAIL with 504 Timeout",
        });

        // 2. Fast Request #2 (Dispatched 200ms later, completes in 400ms, will SUCCEED)
        setTimeout(() => {
          const op2 = "op_2_FAST_SUCCESS";
          dispatch({ type: "START_FETCH", opId: op2, timestamp: Date.now() });
          onTelemetry({
            category: "CONCURRENCY_RACE_EVENT",
            type: "OP2_DISPATCHED",
            opId: op2,
            latency: "400ms",
            outcome: "Destined to SUCCEED with fresh $480,000 data",
          });

          // Op2 completes quickly at t = 600ms
          setTimeout(() => {
            dispatch({
              type: "FETCH_SUCCESS",
              opId: op2,
              data: { balance: "$480,000.00", version: "v2 (Fresh from Op #2)" },
              timestamp: Date.now(),
            });
            onTelemetry({
              category: "CONCURRENCY_RACE_EVENT",
              type: "OP2_COMPLETED_SUCCESS",
              opId: op2,
              message: "Op #2 succeeded. State updated to $480,000.",
            });
          }, 400);
        }, 200);

        // Op1 finally completes late at t = 2000ms with a failure
        setTimeout(() => {
          dispatch({
            type: "FETCH_FAILURE",
            opId: op1,
            error: "504 Gateway Timeout on Op #1",
            timestamp: Date.now(),
          });
          onTelemetry({
            category: "CONCURRENCY_RACE_EVENT",
            type: "OP1_LATE_FAILURE_ARRIVED",
            opId: op1,
            message: "Op #1 failure arrived late. Guard rejected it because activeOpId was Op #2!",
          });
          setRaceActive(false);
        }, 2000);
      };

      return (
        <div className="glass-panel p-6 rounded-2xl space-y-5">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-bold font-mono px-2 py-0.5 rounded bg-purple-950/80 border border-purple-800 text-purple-300">
                EXPERIMENT C: ZOMBIE GUARD
              </span>
              <h2 className="text-lg font-bold text-white mt-1">Zombie Error Race Condition</h2>
            </div>
            <span className="text-xs font-mono text-purple-300">Active Op: {state.activeOpId}</span>
          </div>

          <p className="text-xs text-slate-400">
            This experiment dispatches a slow request (Op #1) that fails after 2000ms, and a fast request (Op #2) that succeeds after 600ms. Watch how the reducer drops the late Op #1 error and protects the fresh Op #2 state!
          </p>

          <div className="p-6 bg-slate-950 rounded-2xl border border-slate-800 space-y-4 font-mono">
            <div className="flex justify-between items-center">
              <div>
                <p className="text-xs text-slate-400">Securities Portfolio Balance</p>
                <h3 className="text-3xl font-extrabold text-white mt-1">{state.resource.data.balance}</h3>
                <p className="text-xs text-purple-400 mt-1">{state.resource.data.version}</p>
              </div>
              <span className="px-3 py-1 bg-slate-900 border border-slate-800 rounded-full text-xs text-emerald-400">
                {state.resource.status}
              </span>
            </div>

            {/* Dropped Events Audit Log */}
            {state.droppedEvents.length > 0 && (
              <div className="p-3 bg-purple-950/30 border border-purple-800 rounded-xl space-y-1 text-xs">
                <div className="font-bold text-purple-300">🛡️ Dropped Stale Events (Race Guard Active):</div>
                {state.droppedEvents.map((evt, i) => (
                  <div key={i} className="text-slate-300 text-[11px]">
                    Dropped <strong>{evt.opId}</strong> because active operation is <strong>{evt.activeOpId}</strong>.
                  </div>
                ))}
              </div>
            )}
          </div>

          <div>
            <button
              onClick={triggerZombieRace}
              disabled={raceActive}
              className="px-5 py-2.5 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-purple-600/30 flex items-center gap-2"
            >
              <span>⚡</span> {raceActive ? "Simulating Concurrent Race..." : "Trigger Zombie Error Race Condition"}
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT D: BOUNDED FULL JITTER EXPONENTIAL BACKOFF
    // =========================================================================
    function ExperimentJitterRetries({ onTelemetry }) {
      const [retryLogs, setRetryLogs] = useState([]);
      const [attemptCount, setAttemptCount] = useState(0);
      const [isRunning, setIsRunning] = useState(false);

      const runJitterRetryLoop = () => {
        setRetryLogs([]);
        setAttemptCount(0);
        setIsRunning(true);

        let attempt = 0;
        const maxRetries = 3;
        const baseDelayMs = 400;

        const attemptNext = () => {
          if (attempt >= maxRetries) {
            setIsRunning(false);
            onTelemetry({
              category: "RETRY_POLICY_EVENT",
              type: "RETRY_HARD_CAP_REACHED",
              attempts: maxRetries,
              message: "Bounded retry reached 3 attempts. Stopped automated retry to prevent self-DDoS.",
            });
            return;
          }

          const exponentialDelay = Math.min(10000, baseDelayMs * Math.pow(2, attempt));
          const jitterDelay = Math.floor(Math.random() * exponentialDelay);

          setTimeout(() => {
            const entry = {
              attempt: attempt + 1,
              calculatedBound: `${exponentialDelay}ms`,
              actualJitterDelay: `${jitterDelay}ms`,
              timestamp: new Date().toLocaleTimeString(),
            };
            setRetryLogs((prev) => [...prev, entry]);
            setAttemptCount(attempt + 1);

            onTelemetry({
              category: "RETRY_POLICY_EVENT",
              type: "EXPONENTIAL_JITTER_RETRY",
              attempt: attempt + 1,
              jitterDelay: `${jitterDelay}ms`,
              message: `Attempt #${attempt + 1} dispatched after ${jitterDelay}ms full jitter delay.`,
            });

            attempt++;
            attemptNext();
          }, jitterDelay);
        };

        attemptNext();
      };

      return (
        <div className="glass-panel p-6 rounded-2xl space-y-5">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-bold font-mono px-2 py-0.5 rounded bg-indigo-950/80 border border-indigo-800 text-indigo-300">
                EXPERIMENT D: RETRY JITTER
              </span>
              <h2 className="text-lg font-bold text-white mt-1">Full Jitter Exponential Backoff</h2>
            </div>
            <span className="text-xs font-mono text-indigo-300">Attempts: {attemptCount} / 3</span>
          </div>

          <p className="text-xs text-slate-400">
            Full Jitter computes `random(0, min(Max, Base * 2^n))`. Notice how retry timing randomizes to avoid synchronizing client traffic during outages.
          </p>

          <div className="p-6 bg-slate-950 rounded-2xl border border-slate-800 space-y-3 font-mono text-xs">
            {retryLogs.length === 0 ? (
              <p className="text-slate-500 text-center py-4">Click below to launch automated retry loop simulation...</p>
            ) : (
              retryLogs.map((log) => (
                <div key={log.attempt} className="flex justify-between items-center p-3 bg-slate-900 rounded-xl border border-slate-800">
                  <div>
                    <span className="font-bold text-indigo-400">Attempt #{log.attempt}</span>
                    <span className="text-slate-400 text-[11px] ml-2">Bound: {log.calculatedBound}</span>
                  </div>
                  <div className="text-emerald-400 font-bold">Jitter Delay: {log.actualJitterDelay}</div>
                </div>
              ))
            )}
          </div>

          <div>
            <button
              onClick={runJitterRetryLoop}
              disabled={isRunning}
              className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-indigo-600/30"
            >
              {isRunning ? "Running Bounded Retry Loop..." : "Execute Bounded Jitter Retry Loop"}
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT E: CACHE INVALIDATION VS REVALIDATION
    // =========================================================================
    function ExperimentInvalidation({ onTelemetry }) {
      const [state, dispatch] = useReducer(asyncResourceReducer, {
        resource: { status: "READY", data: { token: "AUTH_BEARER_9981", secret: "SEC_KEY_ALPHA_77" }, fetchedAt: Date.now() },
        activeOpId: "op_sec",
        droppedEvents: [],
      });

      const handleInvalidate = () => {
        dispatch({ type: "INVALIDATE" });
        onTelemetry({
          category: "DOMAIN_SECURITY_EVENT",
          type: "CACHE_PURGED_ON_LOGOUT",
          message: "Security-sensitive cryptographic keys purged immediately from React memory (data: null).",
        });
      };

      const handleRevalidate = () => {
        const opId = `op_${Math.random().toString(36).substring(2, 7)}`;
        dispatch({ type: "START_FETCH", opId, timestamp: Date.now() });

        setTimeout(() => {
          dispatch({
            type: "FETCH_SUCCESS",
            opId,
            data: { token: "AUTH_BEARER_1042", secret: "SEC_KEY_ALPHA_99" },
            timestamp: Date.now(),
          });
          onTelemetry({
            category: "ASYNC_LIFECYCLE_EVENT",
            type: "REVALIDATE_SUCCESS",
            message: "Revalidated keys. Old keys remained visible during fetch.",
          });
        }, 800);
      };

      return (
        <div className="glass-panel p-6 rounded-2xl space-y-5">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-bold font-mono px-2 py-0.5 rounded bg-rose-950/80 border border-rose-800 text-rose-300">
                EXPERIMENT E: PURGE VS SWR
              </span>
              <h2 className="text-lg font-bold text-white mt-1">Cache Invalidation vs Revalidation</h2>
            </div>
            <span className="text-xs font-mono text-slate-400">Status: {state.resource.status}</span>
          </div>

          <p className="text-xs text-slate-400">
            Revalidation preserves data during background checks. Invalidation destroys untrusted/security data immediately.
          </p>

          <div className="p-6 bg-slate-950 rounded-2xl border border-slate-800 space-y-4 font-mono">
            {state.resource.data ? (
              <div className="space-y-2 text-xs">
                <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 flex justify-between">
                  <span className="text-slate-400">OAuth Access Token:</span>
                  <span className="text-emerald-400 font-bold">{state.resource.data.token}</span>
                </div>
                <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 flex justify-between">
                  <span className="text-slate-400">Secret Encryption Key:</span>
                  <span className="text-amber-400 font-bold">{state.resource.data.secret}</span>
                </div>
              </div>
            ) : (
              <div className="p-8 text-center text-xs text-rose-400 space-y-2">
                <div className="text-3xl">🔒❌</div>
                <div className="font-bold">Security Context Purged (data: null)</div>
                <p className="text-slate-400 font-sans">No cached credentials exist in browser memory.</p>
              </div>
            )}
          </div>

          <div className="flex gap-3">
            <button
              onClick={handleInvalidate}
              className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-xs transition"
            >
              Invalidate & Purge Cache (Logout)
            </button>
            <button
              onClick={handleRevalidate}
              className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs transition"
            >
              Revalidate SWR
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT F: DASHBOARD MULTI-RESOURCE PARTIAL ISOLATION
    // =========================================================================
    function ExperimentMultiDashboard({ onTelemetry }) {
      const [revenueStatus, setRevenueStatus] = useState("READY");
      const [usersStatus, setUsersStatus] = useState("READY");
      const [ordersStatus, setOrdersStatus] = useState("REFRESH_ERROR");

      const handleFailOrders = () => {
        setOrdersStatus("REFRESH_ERROR");
        onTelemetry({
          category: "PARTIAL_RESOURCE_EVENT",
          type: "ORDERS_WIDGET_TIMEOUT",
          message: "Orders widget failed with 504. Revenue and Users widgets remain 100% healthy.",
        });
      };

      const handleRecoverOrders = () => {
        setOrdersStatus("READY");
        onTelemetry({
          category: "PARTIAL_RESOURCE_EVENT",
          type: "ORDERS_WIDGET_RECOVERED",
          message: "Orders widget revalidation recovered.",
        });
      };

      return (
        <div className="glass-panel p-6 rounded-2xl space-y-5">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-bold font-mono px-2 py-0.5 rounded bg-teal-950/80 border border-teal-800 text-teal-300">
                EXPERIMENT F: MULTI-POD ISOLATION
              </span>
              <h2 className="text-lg font-bold text-white mt-1">Partial Resource Failure Isolation</h2>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 font-mono text-xs">
            {/* Widget 1: Revenue */}
            <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-2">
              <div className="flex justify-between text-slate-400">
                <span>Revenue Stream</span>
                <span className="text-emerald-400">● Live</span>
              </div>
              <div className="text-2xl font-extrabold text-white">$1,420,500.00</div>
              <p className="text-[11px] text-emerald-400">+14.2% vs last week</p>
            </div>

            {/* Widget 2: Users */}
            <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-2">
              <div className="flex justify-between text-slate-400">
                <span>Active Users</span>
                <span className="text-emerald-400">● Live</span>
              </div>
              <div className="text-2xl font-extrabold text-white">42,890</div>
              <p className="text-[11px] text-slate-400">Peak concurrency stable</p>
            </div>

            {/* Widget 3: Orders (Failed locally) */}
            <div className={`p-4 rounded-xl border space-y-2 ${
              ordersStatus === "REFRESH_ERROR" ? "bg-amber-950/30 border-amber-800" : "bg-slate-950 border-slate-800"
            }`}>
              <div className="flex justify-between text-slate-400">
                <span>Orders Pipeline</span>
                <span className={ordersStatus === "REFRESH_ERROR" ? "text-amber-400" : "text-emerald-400"}>
                  {ordersStatus === "REFRESH_ERROR" ? "⚠️ 504 Timeout" : "● Live"}
                </span>
              </div>
              <div className="text-2xl font-extrabold text-white">1,840 Orders</div>
              {ordersStatus === "REFRESH_ERROR" ? (
                <button
                  onClick={handleRecoverOrders}
                  className="w-full py-1 bg-amber-600 hover:bg-amber-500 text-white rounded font-bold text-[11px] transition"
                >
                  Retry Orders Pod
                </button>
              ) : (
                <p className="text-[11px] text-emerald-400">All queues operational</p>
              )}
            </div>
          </div>

          <div className="flex gap-3 pt-2">
            <button
              onClick={handleFailOrders}
              className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition"
            >
              Simulate Orders Pod Failure
            </button>
            <button
              onClick={handleRecoverOrders}
              className="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-xl text-xs font-bold transition"
            >
              Recover All Pods
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3. TELEMETRY & EVENT STREAM VIEWER
    // =========================================================================
    function TelemetryStreamViewer({ logs }) {
      return (
        <div className="glass-panel p-5 rounded-2xl space-y-4">
          <div className="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 className="font-bold text-white text-xs flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
              Live Async Observability Stream
            </h3>
            <span className="text-xs font-mono text-slate-400">{logs.length} Events</span>
          </div>

          <div className="h-72 overflow-y-auto space-y-2.5 scrollbar-thin pr-1">
            {logs.length === 0 ? (
              <div className="h-full flex items-center justify-center text-xs text-slate-500 font-mono">
                Interact with async tabs to observe SWR lifecycles and race condition drops...
              </div>
            ) : (
              logs.map((evt) => {
                const isFailure = evt.category === "ASYNC_OPERATIONAL_FAILURE";
                const isRace = evt.category === "CONCURRENCY_RACE_EVENT";

                return (
                  <div
                    key={evt.id}
                    className={`p-3 rounded-xl border text-xs font-mono space-y-1 ${
                      isFailure
                        ? "bg-amber-950/40 border-amber-800 text-amber-300"
                        : isRace
                        ? "bg-purple-950/40 border-purple-800 text-purple-300"
                        : "bg-blue-950/40 border-blue-800 text-blue-300"
                    }`}
                  >
                    <div className="flex items-center justify-between text-[10px] text-slate-400">
                      <span className="font-bold uppercase">{evt.category}</span>
                      <span>{new Date().toLocaleTimeString()}</span>
                    </div>
                    <div className="font-bold text-slate-200">{evt.type}</div>
                    <p className="text-[11px] text-slate-300 leading-relaxed">{evt.message}</p>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 4. ARCHITECTURAL RULE SUMMARY CARD
    // =========================================================================
    function ArchitecturalRuleCard({ activeTab }) {
      return (
        <div className="glass-panel p-5 rounded-2xl space-y-3 border-l-4 border-blue-500">
          <h4 className="text-xs font-bold text-white uppercase tracking-wider font-mono">Governing Architectural Law</h4>
          <p className="text-xs text-slate-300 leading-relaxed">
            {activeTab === "exp_a" && "Initial load failure has no prior data in memory (`data: null`) and must render a full-resource fallback card."}
            {activeTab === "exp_b" && "Background refresh failure preserves existing data in memory and renders a non-blocking warning notice."}
            {activeTab === "exp_c" && "Monotonic Operation IDs ensure obsolete, out-of-order network errors never destroy fresh state."}
            {activeTab === "exp_d" && "Full Jitter Exponential Backoff smoothly randomizes retry intervals, preventing self-DDoS thundering herds."}
            {activeTab === "exp_e" && "Revalidation keeps data visible during fetch; Invalidation purges untrusted security credentials immediately."}
            {activeTab === "exp_f" && "Modular dashboards isolate async failures by resource pod without degrading healthy sibling widgets."}
          </p>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<AsyncResilienceLab />);
  </script>
