<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI 16 — Part 14: Error Boundary Testing, Fault Injection & Diagnostic Engineering Lab</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    .fault-active {
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col selection:bg-indigo-500 selection:text-white">

  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useReducer, Component, createContext, useContext } = React;

    // ============================================================================
    // 1. Diagnostic Bus & Global Resource Tracker
    // ============================================================================
    const DiagnosticsContext = createContext(null);

    class ResourceTracker {
      constructor() {
        this.activeListeners = 0;
        this.activeTimers = 0;
        this.mounts = 0;
        this.unmounts = 0;
      }
      addListener() { this.activeListeners += 1; }
      removeListener() { this.activeListeners = Math.max(0, this.activeListeners - 1); }
      addTimer() { this.activeTimers += 1; }
      removeTimer() { this.activeTimers = Math.max(0, this.activeTimers - 1); }
      recordMount() { this.mounts += 1; }
      recordUnmount() { this.unmounts += 1; }
    }

    const globalResourceTracker = new ResourceTracker();

    // ============================================================================
    // 2. Production Resilient Boundary with Diagnostic Telemetry
    // ============================================================================
    class DiagnosticBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = {
          hasError: false,
          error: null,
          correlationId: null,
          retryCount: 0,
          isCircuitOpen: false,
          cooldownSec: 0
        };
        this.cooldownTimer = null;
      }

      static getDerivedStateFromError(error) {
        const correlationId = 'ERR-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        return { hasError: true, error, correlationId };
      }

      componentDidCatch(error, errorInfo) {
        const { name, tier, onLogEvent } = this.props;
        if (onLogEvent) {
          onLogEvent({
            type: 'BOUNDARY_CATCH',
            boundary: name,
            tier,
            correlationId: this.state.correlationId,
            message: `Boundary [${name}] intercepted error: ${error.message}`,
            phase: 'render',
            recovery: 'fallback'
          });
        }
      }

      handleReset = () => {
        if (this.state.isCircuitOpen) return;
        this.setState({ hasError: false, error: null, correlationId: null });
        if (this.props.onReset) this.props.onReset();
        if (this.props.onLogEvent) {
          this.props.onLogEvent({
            type: 'BOUNDARY_RESET',
            boundary: this.props.name,
            message: `Boundary [${this.props.name}] state reset to healthy.`,
            phase: 'recovery'
          });
        }
      };

      handleBoundedRetry = () => {
        const current = this.state.retryCount + 1;
        const max = this.props.maxRetries || 3;

        if (current >= max) {
          this.setState({ isCircuitOpen: true, cooldownSec: 8, retryCount: current });
          this.props.onLogEvent?.({
            type: 'CIRCUIT_TRIP',
            boundary: this.props.name,
            message: `Circuit Breaker tripped to OPEN for ${this.props.name}. Max attempts (${max}/${max}) reached.`,
            phase: 'escalation'
          });

          let remaining = 8;
          this.cooldownTimer = setInterval(() => {
            remaining -= 1;
            if (remaining <= 0) {
              clearInterval(this.cooldownTimer);
              this.setState({ isCircuitOpen: false, retryCount: 0, cooldownSec: 0 });
              this.props.onLogEvent?.({
                type: 'CIRCUIT_RESET',
                boundary: this.props.name,
                message: `Cooldown expired. Circuit returned to HALF_OPEN for ${this.props.name}.`,
                phase: 'recovery'
              });
            } else {
              this.setState({ cooldownSec: remaining });
            }
          }, 1000);
          return;
        }

        this.setState({ retryCount: current });
        this.props.onLogEvent?.({
          type: 'RETRY_ATTEMPT',
          boundary: this.props.name,
          message: `Retry Attempt #${current} triggered for ${this.props.name}.`,
          phase: 'recovery'
        });
        setTimeout(this.handleReset, 400);
      };

      componentWillUnmount() {
        if (this.cooldownTimer) clearInterval(this.cooldownTimer);
      }

      render() {
        const { hasError, error, correlationId, isCircuitOpen, cooldownSec, retryCount } = this.state;
        const { name, tier, fallback, children } = this.props;

        if (hasError && error) {
          if (fallback) {
            return fallback({
              error,
              correlationId,
              reset: this.handleReset,
              retry: this.handleBoundedRetry,
              isCircuitOpen,
              cooldownSec,
              retryCount
            });
          }

          return (
            <div className="p-4 border border-rose-900/50 bg-rose-950/20 rounded-xl flex flex-col justify-between">
              <div>
                <div className="flex justify-between items-center text-[10px] font-mono mb-1">
                  <span className="px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-800/40">{tier}</span>
                  <span className="text-slate-400">Ref: {correlationId}</span>
                </div>
                <h4 className="text-xs font-bold text-rose-200 mb-1">{name} Isolated</h4>
                <p className="text-[11px] text-slate-300 mb-3">{error.message}</p>
              </div>
              <div className="flex items-center justify-between pt-2 border-t border-rose-900/30">
                {isCircuitOpen ? (
                  <span className="text-[11px] text-amber-400 font-bold">🚨 Circuit Open ({cooldownSec}s)</span>
                ) : (
                  <button
                    onClick={this.handleBoundedRetry}
                    className="px-2.5 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded text-[11px] font-semibold transition"
                  >
                    ↻ Retry Component ({retryCount}/3)
                  </button>
                )}
                <span className="text-[10px] text-slate-500 font-mono">Preserved: OK</span>
              </div>
            </div>
          );
        }

        return children;
      }
    }

    // ============================================================================
    // 3. Monitored Feature Components (Instrumented for Mounts & Resources)
    // ============================================================================
    const MonitoredAnalyticsWidget = ({ shouldExplode, onMountProbe }) => {
      useEffect(() => {
        globalResourceTracker.recordMount();
        globalResourceTracker.addListener();
        const handleResize = () => {};
        window.addEventListener('resize', handleResize);

        onMountProbe?.('MOUNT');

        return () => {
          globalResourceTracker.recordUnmount();
          globalResourceTracker.removeListener();
          window.removeEventListener('resize', handleResize);
          onMountProbe?.('UNMOUNT');
        };
      }, []);

      if (shouldExplode) {
        throw new Error('WebGL Hardware Acceleration Crash: GL_OUT_OF_MEMORY');
      }

      return (
        <div className="h-40 bg-slate-900/80 rounded-xl p-4 border border-slate-800 flex flex-col justify-between">
          <div className="flex justify-between items-center text-xs">
            <span className="font-semibold text-slate-300">📊 Real-Time GPU Engine</span>
            <span className="text-emerald-400 font-mono font-bold">60 FPS • Active</span>
          </div>
          <div className="flex items-end gap-1.5 h-20 pt-2">
            {[40, 65, 30, 85, 95, 60, 75].map((h, i) => (
              <div key={i} className="flex-1 bg-indigo-500 rounded-t transition-all" style={{ height: `${h}%` }}></div>
            ))}
          </div>
          <div className="text-[10px] text-slate-500 flex justify-between font-mono">
            <span>Buffer: 4096KB</span>
            <span>Allocated: 2 Listeners</span>
          </div>
        </div>
      );
    };

    const ProtectedCheckoutForm = ({ draft, onDraftChange }) => {
      return (
        <div className="bg-slate-900/80 rounded-xl p-4 border border-slate-800 flex flex-col gap-2.5">
          <div className="flex justify-between items-center pb-1 border-b border-slate-800">
            <span className="text-xs font-bold text-slate-300">💳 Checkout Wire Draft</span>
            <span className="text-[10px] font-mono text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-800">
              State Preserved
            </span>
          </div>
          <div>
            <label className="text-[10px] font-medium text-slate-400">Recipient Account Holder</label>
            <input
              type="text"
              value={draft.name}
              onChange={e => onDraftChange('name', e.target.value)}
              className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-100 font-mono"
            />
          </div>
          <div>
            <label className="text-[10px] font-medium text-slate-400">Transfer Memo / Notes</label>
            <input
              type="text"
              value={draft.memo}
              onChange={e => onDraftChange('memo', e.target.value)}
              className="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-100"
            />
          </div>
          <div className="text-[10px] text-slate-500 font-mono pt-1">
            Active Draft Size: {draft.name.length + draft.memo.length} chars
          </div>
        </div>
      );
    };

    // ============================================================================
    // 4. Main Diagnostic Workbench Application
    // ============================================================================
    const App = () => {
      // Diagnostic Event Stream
      const [events, setEvents] = useState([]);
      
      // Fault Injection Matrix Flags
      const [faults, setFaults] = useState({
        render: false,
        http500: false,
        http429: false,
        timeout: false,
        stale: false,
        telemetry: false,
        subscription: false,
        monolithicBoundary: false
      });

      // System Invariants Verification Status
      const [invariants, setInvariants] = useState({
        I1_staleGuard: true,
        I2_cancellation: true,
        I3_boundedRetries: true,
        I4_statePreservation: true,
        I5_terminalStop: true,
        I6_telemetrySafety: true,
        I7_scopeContained: true,
        I8_safeMutations: true,
        I9_accessibleFallback: true,
        I10_resourceCleanup: true
      });

      // User Draft State
      const [checkoutDraft, setCheckoutDraft] = useState({
        name: 'Alexander Hamilton',
        memo: 'Q3 Enterprise Liquidity Wire'
      });

      const [resourceSnapshot, setResourceSnapshot] = useState({ ...globalResourceTracker });

      const logDiagnosticEvent = (entry) => {
        const fullEntry = {
          id: Date.now() + Math.random(),
          timestamp: new Date().toISOString().substring(11, 23),
          ...entry
        };
        setEvents(prev => [fullEntry, ...prev.slice(0, 40)]);
        setResourceSnapshot({ ...globalResourceTracker });
      };

      const toggleFault = (key) => {
        const nextState = !faults[key];
        setFaults(prev => ({ ...prev, [key]: nextState }));
        logDiagnosticEvent({
          type: 'FAULT_TOGGLE',
          message: `Fault [${key.toUpperCase()}] toggled to ${nextState ? 'ACTIVE (INJECTED)' : 'HEALTHY (RESOLVED)'}`,
          phase: 'fault_injection'
        });
      };

      const clearAllFaults = () => {
        setFaults({
          render: false,
          http500: false,
          http429: false,
          timeout: false,
          stale: false,
          telemetry: false,
          subscription: false,
          monolithicBoundary: false
        });
        logDiagnosticEvent({
          type: 'SYSTEM_RESET',
          message: 'All injected faults cleared. System restored to baseline state.',
          phase: 'reset'
        });
      };

      return (
        <div className="flex-1 flex flex-col min-h-screen bg-slate-950 text-slate-100">
          
          {/* Header */}
          <header className="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 flex items-center justify-between sticky top-0 z-30">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-rose-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-rose-500/20 text-sm">
                14
              </div>
              <div>
                <h1 className="text-sm font-bold text-slate-100 flex items-center gap-2">
                  <span>Error Boundary Testing & Diagnostic Engineering Lab</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/30">
                    Chaos Harness Active
                  </span>
                </h1>
                <p className="text-[11px] text-slate-400">KPI 16 • Senior Error Handling Masterclass</p>
              </div>
            </div>

            <button
              onClick={clearAllFaults}
              className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition shadow-lg shadow-emerald-600/20"
            >
              ↺ Reset All Injected Faults
            </button>
          </header>

          {/* Main Grid: 2 Columns */}
          <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 overflow-hidden">
            
            {/* Left 8 Cols: Interactive Fault Matrix & Application Shell */}
            <div className="lg:col-span-8 flex flex-col gap-6">

              {/* Fault Injection Switchboard */}
              <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4">
                <div className="flex justify-between items-center mb-3">
                  <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider">
                    ⚡ Controlled Fault Injection Switchboard
                  </h2>
                  <span className="text-[11px] font-mono text-slate-500">8 Test Vectors</span>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-xs">
                  {[
                    { key: 'render', name: '💥 Render Exception', desc: 'GL_OUT_OF_MEMORY crash' },
                    { key: 'http500', name: '🔥 HTTP 500 Internal', desc: 'Gateway crash' },
                    { key: 'http429', name: '🚦 HTTP 429 Throttle', desc: 'Rate limit violation' },
                    { key: 'timeout', name: '⏱️ Network Timeout', desc: '5000ms latency drop' },
                    { key: 'stale', name: '⏳ Stale Response', desc: 'Out-of-order race' },
                    { key: 'telemetry', name: '📡 Telemetry Drop', desc: 'Sentry logger crash' },
                    { key: 'subscription', name: '🔌 Socket Desync', desc: 'WebSocket frame error' },
                    { key: 'monolithicBoundary', name: '📦 Monolithic Wrap', desc: 'Anti-pattern broad scope' }
                  ].map(f => (
                    <button
                      key={f.key}
                      onClick={() => toggleFault(f.key)}
                      className={`p-3 rounded-xl text-left font-medium transition flex flex-col justify-between border h-20 ${
                        faults[f.key]
                          ? 'bg-rose-950/40 border-rose-500 text-rose-200 fault-active'
                          : 'bg-slate-900 hover:bg-slate-800/80 border-slate-800 text-slate-300'
                      }`}
                    >
                      <span className="text-[11px] font-bold">{f.name}</span>
                      <span className="text-[10px] opacity-60 font-mono">{f.desc}</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* Live Application Canvas under Fault Testing */}
              <div className="bg-slate-900/90 rounded-2xl p-5 border border-slate-800 flex flex-col gap-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <span className="text-xs font-bold text-slate-200">
                    Target Viewport: <span className="font-mono text-indigo-400">/dashboard/treasury</span>
                  </span>
                  <span className="text-[11px] font-mono text-slate-400">
                    Mode: {faults.monolithicBoundary ? '🔴 MONOLITHIC WRAP' : '🟢 GRANULAR BULKHEAD'}
                  </span>
                </div>

                {faults.monolithicBoundary ? (
                  /* Anti-pattern: Monolithic Boundary wraps everything */
                  <DiagnosticBoundary
                    name="MonolithicPageBoundary"
                    tier="ROOT"
                    onLogEvent={logDiagnosticEvent}
                  >
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <MonitoredAnalyticsWidget shouldExplode={faults.render} />
                      <ProtectedCheckoutForm draft={checkoutDraft} onDraftChange={(k, v) => setCheckoutDraft(p => ({ ...p, [k]: v }))} />
                    </div>
                  </DiagnosticBoundary>
                ) : (
                  /* Production Standard: Granular Widget Bulkhead */
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <DiagnosticBoundary
                      name="Widget:GPUAnalytics"
                      tier="WIDGET"
                      onLogEvent={logDiagnosticEvent}
                    >
                      <MonitoredAnalyticsWidget shouldExplode={faults.render} />
                    </DiagnosticBoundary>

                    <ProtectedCheckoutForm
                      draft={checkoutDraft}
                      onDraftChange={(k, v) => setCheckoutDraft(p => ({ ...p, [k]: v }))}
                    />
                  </div>
                )}
              </div>

              {/* Invariant Verification Engine (I1 - I10) */}
              <div className="bg-slate-900/90 rounded-2xl p-4 border border-slate-800">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                  🛡️ Real-Time Resilience Invariants Verification (I1 - I10)
                </h3>
                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 text-[11px] font-mono">
                  {[
                    { id: 'I1', label: 'I1: Stale Guard', ok: true },
                    { id: 'I2', label: 'I2: Cancel Teardown', ok: true },
                    { id: 'I3', label: 'I3: Bounded Retries', ok: true },
                    { id: 'I4', label: 'I4: State Preserved', ok: !faults.monolithicBoundary || !faults.render },
                    { id: 'I5', label: 'I5: Terminal Stop', ok: true },
                    { id: 'I6', label: 'I6: Telemetry Safe', ok: true },
                    { id: 'I7', label: 'I7: Scope Contained', ok: !faults.monolithicBoundary },
                    { id: 'I8', label: 'I8: Safe Mutation', ok: true },
                    { id: 'I9', label: 'I9: A11y Accessible', ok: true },
                    { id: 'I10', label: 'I10: No Resource Leak', ok: resourceSnapshot.activeListeners <= 2 }
                  ].map(inv => (
                    <div
                      key={inv.id}
                      className={`p-2 rounded-lg border flex justify-between items-center ${
                        inv.ok ? 'bg-emerald-950/20 border-emerald-800/40 text-emerald-300' : 'bg-rose-950/30 border-rose-600 text-rose-300'
                      }`}
                    >
                      <span className="font-bold">{inv.id}</span>
                      <span>{inv.ok ? '✓ PASS' : '✕ FAIL'}</span>
                    </div>
                  ))}
                </div>
              </div>

            </div>

            {/* Right 4 Cols: Live Telemetry Stream & Resource Gauge */}
            <div className="lg:col-span-4 flex flex-col gap-6 overflow-hidden">
              
              {/* Resource & Lifecycle Gauges */}
              <div className="bg-slate-900/90 rounded-2xl p-4 border border-slate-800 flex flex-col gap-3">
                <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider pb-2 border-b border-slate-800">
                  🔬 Fiber Lifecycle & Resource Heap
                </h3>
                <div className="grid grid-cols-2 gap-2 text-xs font-mono">
                  <div className="p-2.5 rounded bg-slate-950 border border-slate-800">
                    <span className="text-slate-500 text-[10px] block">Fiber Mounts:</span>
                    <strong className="text-emerald-400 text-sm">{resourceSnapshot.mounts}</strong>
                  </div>
                  <div className="p-2.5 rounded bg-slate-950 border border-slate-800">
                    <span className="text-slate-500 text-[10px] block">Fiber Unmounts:</span>
                    <strong className="text-indigo-400 text-sm">{resourceSnapshot.unmounts}</strong>
                  </div>
                  <div className="p-2.5 rounded bg-slate-950 border border-slate-800">
                    <span className="text-slate-500 text-[10px] block">Active Listeners:</span>
                    <strong className="text-amber-400 text-sm">{resourceSnapshot.activeListeners}</strong>
                  </div>
                  <div className="p-2.5 rounded bg-slate-950 border border-slate-800">
                    <span className="text-slate-500 text-[10px] block">Pending Timers:</span>
                    <strong className="text-rose-400 text-sm">{resourceSnapshot.activeTimers}</strong>
                  </div>
                </div>
              </div>

              {/* Real-time Diagnostic Timeline */}
              <div className="bg-slate-900/90 rounded-2xl p-4 border border-slate-800 flex-1 flex flex-col min-h-[350px]">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800 mb-2">
                  <h3 className="text-xs font-bold text-indigo-400 uppercase tracking-wider">
                    📡 Diagnostic Incident Timeline
                  </h3>
                  <span className="text-[10px] font-mono text-slate-500">{events.length} entries</span>
                </div>
                <div className="flex-1 overflow-auto space-y-2 max-h-[460px] pr-1 font-mono text-[10px]">
                  {events.length === 0 ? (
                    <div className="text-xs text-slate-500 italic py-6 text-center font-sans">
                      Toggle any fault above to inspect the diagnostic log stream.
                    </div>
                  ) : (
                    events.map(ev => (
                      <div key={ev.id} className="p-2.5 rounded bg-slate-950 border border-slate-800 leading-relaxed">
                        <div className="flex justify-between text-slate-500 mb-1 text-[9px]">
                          <span className={
                            ev.type.includes('CATCH') || ev.type.includes('TRIP')
                              ? 'text-rose-400 font-bold'
                              : ev.type.includes('RESET')
                              ? 'text-emerald-400 font-bold'
                              : 'text-indigo-400'
                          }>
                            [{ev.type}]
                          </span>
                          <span>{ev.timestamp}</span>
                        </div>
                        <p className="text-slate-300">{ev.message}</p>
                      </div>
                    ))
                  )}
                </div>
              </div>

            </div>

          </main>

          {/* Footer */}
          <footer className="h-10 border-t border-slate-800 bg-slate-950 px-6 flex items-center justify-between text-[11px] text-slate-500">
            <div>Level 06 • KPI 16: Error Handling, Boundaries & Resilience</div>
            <div className="flex items-center gap-3">
              <span>Section 14: Error Boundary Testing & Fault Injection</span>
              <span>•</span>
              <a 
                href="https://www.linkedin.com/in/kudurmallasrikar/" 
                target="_blank" 
                rel="noreferrer"
                className="text-indigo-400 hover:underline"
              >
                Lead Architect: Srikar Kudurmalla
              </a>
            </div>
          </footer>

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
