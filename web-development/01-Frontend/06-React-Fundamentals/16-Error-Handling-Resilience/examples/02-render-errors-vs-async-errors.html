<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI 16 — Part 02 Companion Lab: Failure-Surface Classification & Boundary Scope</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #090d16;
      color: #f8fafc;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, Component, useCallback } = React;

    // ==========================================
    // ERROR BOUNDARY PRIMITIVE
    // ==========================================
    class LabErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error: error instanceof Error ? error : new Error(String(error)) };
      }

      componentDidCatch(error, errorInfo) {
        if (this.props.onLog) {
          this.props.onLog(
            "ErrorBoundary (Fiber Reconciler)",
            `Caught synchronous render exception: "${error.message}"`,
            "error",
            true
          );
        }
      }

      reset = () => {
        this.setState({ hasError: false, error: null });
        if (this.props.onReset) this.props.onReset();
      };

      render() {
        if (this.state.hasError) {
          return (
            <div role="alert" className="p-5 bg-rose-950/60 border border-rose-800 rounded-xl text-rose-200 space-y-3">
              <div className="flex justify-between items-center">
                <span className="font-bold text-xs uppercase font-mono tracking-wider text-rose-400">
                  🛡️ ErrorBoundary Intercepted Render Crash
                </span>
                <button
                  onClick={this.reset}
                  className="px-3 py-1 bg-rose-800 hover:bg-rose-700 text-white rounded text-xs font-semibold font-mono transition"
                >
                  Reset & Retry
                </button>
              </div>
              <p className="text-xs font-mono text-rose-300/90">{this.state.error?.message}</p>
            </div>
          );
        }

        return this.props.children;
      }
    }

    // ==========================================
    // ASYNC ERROR BRIDGE HOOK
    // ==========================================
    function useAsyncErrorBridge() {
      const [, setError] = useState();
      return useCallback((e) => {
        setError(() => {
          throw e instanceof Error ? e : new Error(String(e));
        });
      }, []);
    }

    // ==========================================
    // INTERACTIVE LAB APPLICATION
    // ==========================================
    function App() {
      const [triggerRenderError, setTriggerRenderError] = useState(false);
      const [eventErrorBanner, setEventErrorBanner] = useState(null);
      const [asyncQueryStatus, setAsyncQueryStatus] = useState("idle");
      const [timerStatus, setTimerStatus] = useState("idle");
      const [logs, setLogs] = useState([]);
      const [selectedSurface, setSelectedSurface] = useState("render");

      const throwToBoundary = useAsyncErrorBridge();

      const addLog = (tag, message, type = "info", boundaryCaught = false) => {
        setLogs(prev => [
          {
            id: Math.random().toString(36).substring(2, 9),
            time: new Date().toLocaleTimeString() + "." + Math.floor(performance.now() % 1000).toString().padStart(3, "0"),
            tag,
            message,
            type,
            boundaryCaught
          },
          ...prev.slice(0, 30)
        ]);
      };

      // 1. RENDER SURFACE TEST
      const handleRenderThrow = () => {
        setSelectedSurface("render");
        addLog("Render Trigger", "Injecting synchronous render throw (TypeError: null.data)...", "warn");
        setTriggerRenderError(true);
      };

      // 2. EVENT HANDLER SURFACE TEST
      const handleEventThrow = () => {
        setSelectedSurface("event");
        addLog("Event Handler", "Executing button onClick callback. Thrown in browser macrotask queue.", "warn");
        try {
          throw new Error("ValidationException: Credit card CVV invalid.");
        } catch (err) {
          addLog("Event Handler", `Caught locally in try/catch: "${err.message}". Error Boundary NOT involved!`, "success", false);
          setEventErrorBanner(err.message);
        }
      };

      // 3. ASYNC PROMISE MICROTASK TEST
      const handlePromiseRejection = () => {
        setSelectedSurface("promise");
        setAsyncQueryStatus("loading");
        addLog("Async Fetch", "Dispatched GET /api/orders. Response delayed 800ms...", "info");

        setTimeout(() => {
          setAsyncQueryStatus("error");
          addLog("Async Fetch", "HTTP 500 Internal Server Error returned. Modeled in query state; UI remains intact!", "error", false);
        }, 800);
      };

      // 4. TIMER MACROTASK TEST
      const handleTimerThrow = () => {
        setSelectedSurface("timer");
        setTimerStatus("running");
        addLog("Timer Manager", "Scheduled setTimeout(callback, 1000ms)...", "info");

        setTimeout(() => {
          setTimerStatus("error");
          addLog("Timer Callback", "Exception inside setTimeout callback. Handled defensively via timer coordinator.", "warn", false);
        }, 1000);
      };

      // 5. ASYNC ERROR BRIDGE TEST
      const handleBridgeThrow = () => {
        setSelectedSurface("bridge");
        addLog("Async Bridge", "Bridging unrecoverable WebSocket fatal failure to ErrorBoundary...", "warn");
        setTimeout(() => {
          throwToBoundary(new Error("FatalWebSocketCorrupted: Stream parity failed."));
        }, 300);
      };

      const resetAll = () => {
        setTriggerRenderError(false);
        setEventErrorBanner(null);
        setAsyncQueryStatus("idle");
        setTimerStatus("idle");
        addLog("System", "All fault injection states reset.", "info");
      };

      return (
        <div className="max-w-7xl mx-auto space-y-6">
          {/* Header */}
          <header className="glass-panel p-6 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-2xl border-cyan-500/20">
            <div>
              <div className="flex items-center gap-3">
                <span className="px-3 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-full text-xs font-semibold uppercase tracking-wider">
                  Level 06 — KPI 16 / Part 02
                </span>
                <span className="px-3 py-1 bg-purple-500/10 text-purple-400 border border-purple-500/30 rounded-full text-xs font-semibold">
                  Failure-Surface Classification Lab
                </span>
              </div>
              <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight mt-2 text-white">
                Render Errors vs Async & Event Errors Simulator
              </h1>
              <p className="text-slate-400 text-sm mt-1">
                Explore execution zones, macrotask event handlers, microtask promises, timer callbacks, and the Async Error Bridge pattern.
              </p>
            </div>
            <button
              onClick={resetAll}
              className="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-xs font-mono font-bold transition shadow"
            >
              🔄 Reset All Faults
            </button>
          </header>

          {/* Fault Injection Buttons Bar */}
          <div className="glass-panel p-4 rounded-xl flex flex-wrap gap-2 items-center justify-between">
            <div className="flex flex-wrap gap-2">
              <button
                onClick={handleRenderThrow}
                className="px-3.5 py-2 bg-rose-950/60 hover:bg-rose-900 border border-rose-800 text-rose-200 rounded-lg text-xs font-mono font-semibold transition"
              >
                1. 💥 Throw in Render Body (Fiber Catch)
              </button>
              <button
                onClick={handleEventThrow}
                className="px-3.5 py-2 bg-amber-950/60 hover:bg-amber-900 border border-amber-800 text-amber-200 rounded-lg text-xs font-mono font-semibold transition"
              >
                2. ⚡ Throw in onClick Event (Macrotask)
              </button>
              <button
                onClick={handlePromiseRejection}
                className="px-3.5 py-2 bg-blue-950/60 hover:bg-blue-900 border border-blue-800 text-blue-200 rounded-lg text-xs font-mono font-semibold transition"
              >
                3. ⏳ Reject in fetch() (Microtask Queue)
              </button>
              <button
                onClick={handleTimerThrow}
                className="px-3.5 py-2 bg-emerald-950/60 hover:bg-emerald-900 border border-emerald-800 text-emerald-200 rounded-lg text-xs font-mono font-semibold transition"
              >
                4. ⏱️ Throw in setTimeout (Timer Callback)
              </button>
              <button
                onClick={handleBridgeThrow}
                className="px-3.5 py-2 bg-purple-950/60 hover:bg-purple-900 border border-purple-800 text-purple-200 rounded-lg text-xs font-mono font-semibold transition"
              >
                5. 🌉 useAsyncErrorBridge to Boundary
              </button>
            </div>
          </div>

          {/* Main Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Live Component Under Test (2 Cols) */}
            <div className="lg:col-span-2 space-y-5">
              <LabErrorBoundary onLog={addLog} onReset={() => setTriggerRenderError(false)}>
                <div className="glass-panel p-6 rounded-2xl space-y-5">
                  <div className="flex justify-between items-center">
                    <h2 className="text-sm font-bold text-slate-300 font-mono uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
                      Component Under Execution Test
                    </h2>
                    <span className="px-2.5 py-0.5 bg-slate-800 text-slate-400 text-xs font-mono rounded">
                      Wrapped in &lt;LabErrorBoundary /&gt;
                    </span>
                  </div>

                  {/* Render Crash Trigger */}
                  {triggerRenderError && (() => {
                    const obj = null;
                    return <div>{obj.invalid_property_access}</div>;
                  })()}

                  {/* Event Error UI */}
                  {eventErrorBanner && (
                    <div className="p-3 bg-amber-950/50 border border-amber-800 text-amber-300 rounded-lg text-xs font-mono flex justify-between items-center">
                      <span>⚠️ Event Error Handled Locally: {eventErrorBanner}</span>
                      <button onClick={() => setEventErrorBanner(null)} className="text-amber-400 hover:underline">Dismiss</button>
                    </div>
                  )}

                  {/* Async Query Status UI */}
                  <div className="p-4 bg-slate-900/90 rounded-xl border border-slate-800 space-y-2">
                    <div className="flex justify-between items-center text-xs font-mono">
                      <span className="text-slate-400">Async Query State:</span>
                      <span className={`font-bold ${
                        asyncQueryStatus === "error" ? "text-rose-400" :
                        asyncQueryStatus === "loading" ? "text-cyan-400" : "text-slate-400"
                      }`}>
                        {asyncQueryStatus.toUpperCase()}
                      </span>
                    </div>
                    {asyncQueryStatus === "error" && (
                      <div className="p-3 bg-rose-950/40 border border-rose-800/60 rounded text-xs text-rose-300 font-mono">
                        ⚠️ HTTP 500: Server rejected batch query. Component remains mounted!
                      </div>
                    )}
                  </div>

                  {/* Timer Status UI */}
                  <div className="p-4 bg-slate-900/90 rounded-xl border border-slate-800 space-y-2">
                    <div className="flex justify-between items-center text-xs font-mono">
                      <span className="text-slate-400">Timer Macrotask State:</span>
                      <span className={`font-bold ${
                        timerStatus === "error" ? "text-amber-400" :
                        timerStatus === "running" ? "text-cyan-400" : "text-slate-400"
                      }`}>
                        {timerStatus.toUpperCase()}
                      </span>
                    </div>
                  </div>
                </div>
              </LabErrorBoundary>

              {/* Surface Classification Deep Dive Panel */}
              <div className="glass-panel p-5 rounded-2xl space-y-3">
                <h3 className="font-bold text-xs uppercase font-mono tracking-wider text-cyan-400">
                  Execution Surface Analysis: {selectedSurface.toUpperCase()}
                </h3>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs font-mono">
                  <div className="p-3 bg-slate-900 rounded-lg border border-slate-800">
                    <div className="text-slate-500 text-[10px]">Execution Zone</div>
                    <div className="font-bold text-slate-200 mt-0.5">
                      {selectedSurface === "render" ? "Fiber Reconciler" :
                       selectedSurface === "event" ? "Browser Macrotask" :
                       selectedSurface === "promise" ? "Microtask Queue" :
                       selectedSurface === "timer" ? "Timer Macrotask" : "Async Bridge (Render)"}
                    </div>
                  </div>
                  <div className="p-3 bg-slate-900 rounded-lg border border-slate-800">
                    <div className="text-slate-500 text-[10px]">Caught by ErrorBoundary?</div>
                    <div className={`font-bold mt-0.5 ${
                      selectedSurface === "render" || selectedSurface === "bridge" ? "text-emerald-400" : "text-rose-400"
                    }`}>
                      {selectedSurface === "render" || selectedSurface === "bridge" ? "YES (✅)" : "NO (❌)"}
                    </div>
                  </div>
                  <div className="p-3 bg-slate-900 rounded-lg border border-slate-800">
                    <div className="text-slate-500 text-[10px]">Authoritative Owner</div>
                    <div className="font-bold text-slate-200 mt-0.5">
                      {selectedSurface === "render" ? "Component Boundary" :
                       selectedSurface === "event" ? "Local Handler State" :
                       selectedSurface === "promise" ? "Query State Machine" :
                       selectedSurface === "timer" ? "Timer Coordinator" : "Feature Boundary"}
                    </div>
                  </div>
                  <div className="p-3 bg-slate-900 rounded-lg border border-slate-800">
                    <div className="text-slate-500 text-[10px]">Recovery Strategy</div>
                    <div className="font-bold text-cyan-400 mt-0.5">
                      {selectedSurface === "render" ? "Reset Boundary" :
                       selectedSurface === "event" ? "Dismiss & Edit Form" :
                       selectedSurface === "promise" ? "Retry Request" :
                       selectedSurface === "timer" ? "Reschedule Task" : "Reconnect Stream"}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* Diagnostic Telemetry Log (1 Col) */}
            <div className="glass-panel p-5 rounded-2xl flex flex-col h-[650px] shadow-xl">
              <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
                  <h3 className="font-bold text-sm text-slate-200">Execution Telemetry Stream</h3>
                </div>
                <button
                  onClick={() => setLogs([])}
                  className="text-[10px] text-slate-400 hover:text-white font-mono"
                >
                  Clear
                </button>
              </div>

              <div className="flex-1 overflow-y-auto space-y-2.5 pt-4 pr-1">
                {logs.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-center text-slate-600">
                    <svg className="w-10 h-10 mb-2 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    <p className="text-xs font-mono">Trigger fault buttons above to stream execution zone events.</p>
                  </div>
                ) : (
                  logs.map(log => (
                    <div
                      key={log.id}
                      className={`p-3 rounded-xl border text-xs font-mono space-y-1 ${
                        log.boundaryCaught
                          ? "bg-rose-950/40 border-rose-800/60 text-rose-200"
                          : log.type === "error"
                          ? "bg-amber-950/40 border-amber-800/60 text-amber-200"
                          : log.type === "success"
                          ? "bg-emerald-950/40 border-emerald-800/60 text-emerald-200"
                          : "bg-slate-900 border-slate-800 text-slate-300"
                      }`}
                    >
                      <div className="flex justify-between items-center text-[10px] opacity-70">
                        <span className="font-bold uppercase tracking-wider text-cyan-400">{log.tag}</span>
                        <span>{log.time}</span>
                      </div>
                      <p className="leading-relaxed">{log.message}</p>
                      <div className="text-[10px] text-slate-500 flex items-center gap-1.5 pt-0.5">
                        <span>Boundary Intercepted:</span>
                        <strong className={log.boundaryCaught ? "text-emerald-400" : "text-rose-400"}>
                          {log.boundaryCaught ? "YES" : "NO"}
                        </strong>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
