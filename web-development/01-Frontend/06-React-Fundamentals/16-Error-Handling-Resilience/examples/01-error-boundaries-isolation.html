<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI 16 — Part 01 Companion Lab: React Error Boundaries & Failure Isolation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-panel {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, Component } = React;

    // ==========================================
    // REUSABLE ERROR BOUNDARY CLASS COMPONENT
    // ==========================================
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, retryCount: 0 };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        if (this.props.onError) {
          this.props.onError(error, errorInfo, this.props.name || "AnonymousBoundary");
        }
      }

      reset = () => {
        this.setState(prev => ({
          hasError: false,
          error: null,
          retryCount: prev.retryCount + 1
        }));
        if (this.props.onReset) this.props.onReset();
      };

      render() {
        if (this.state.hasError) {
          if (this.props.fallbackRender) {
            return this.props.fallbackRender({
              error: this.state.error,
              resetErrorBoundary: this.reset,
              retryCount: this.state.retryCount
            });
          }
          if (this.props.fallback) {
            return this.props.fallback;
          }
          return (
            <div className="p-4 bg-rose-950/40 border border-rose-800 rounded-xl text-rose-300 space-y-2">
              <h4 className="font-bold text-sm">⚠️ {this.props.name || "Boundary"} Caught Error</h4>
              <p className="text-xs font-mono">{this.state.error?.message}</p>
              <button 
                onClick={this.reset}
                className="px-3 py-1 bg-rose-700 hover:bg-rose-600 text-white text-xs rounded font-semibold transition"
              >
                Reset Boundary
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ==========================================
    // MAIN INTERACTIVE APPLICATION
    // ==========================================
    function App() {
      const [telemetry, setTelemetry] = useState([]);
      const [crashChart, setCrashChart] = useState(false);
      const [crashMetrics, setCrashMetrics] = useState(false);
      const [crashFallback, setCrashFallback] = useState(false);
      const [portfolioId, setPortfolioId] = useState("PORT_ALPHA");

      const logError = (error, errorInfo, boundaryName) => {
        const event = {
          id: "err_" + Math.random().toString(36).substring(2, 7),
          time: new Date().toLocaleTimeString() + "." + Math.floor(performance.now() % 1000).toString().padStart(3, "0"),
          boundary: boundaryName,
          message: error.message,
          stack: errorInfo.componentStack ? errorInfo.componentStack.trim().split("\n").slice(0, 3).join(" -> ") : "N/A"
        };
        setTelemetry(prev => [event, ...prev]);
      };

      const clearTelemetry = () => setTelemetry([]);

      return (
        <ErrorBoundary 
          name="RootErrorBoundary" 
          onError={logError}
          fallbackRender={({ error, resetErrorBoundary }) => (
            <div className="min-h-[80vh] flex flex-col items-center justify-center p-8 text-center space-y-4">
              <div className="w-16 h-16 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center text-3xl font-bold">💥</div>
              <h1 className="text-2xl font-black text-rose-400">Root Application Lifeboat Activated</h1>
              <p className="text-slate-400 text-sm max-w-md">
                A catastrophic error escaped all nested feature boundaries. Total blast radius containment engaged.
              </p>
              <pre className="p-4 bg-slate-950 border border-slate-800 rounded-xl text-xs font-mono text-rose-300 max-w-lg overflow-x-auto text-left">
                {error?.message}
              </pre>
              <button
                onClick={() => {
                  setCrashChart(false);
                  setCrashMetrics(false);
                  setCrashFallback(false);
                  resetErrorBoundary();
                }}
                className="px-6 py-2.5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold text-xs transition shadow-lg shadow-rose-600/30"
              >
                Reconstruct Full Application Tree
              </button>
            </div>
          )}
        >
          <div className="max-w-7xl mx-auto space-y-6">
            {/* Header */}
            <header className="glass-panel p-6 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-2xl border-cyan-500/20">
              <div>
                <div className="flex items-center gap-3">
                  <span className="px-3 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-full text-xs font-semibold uppercase tracking-wider">
                    Level 06 — KPI 16 / Part 01
                  </span>
                  <span className="px-3 py-1 bg-rose-500/10 text-rose-400 border border-rose-500/30 rounded-full text-xs font-semibold">
                    Failure Containment Lab
                  </span>
                </div>
                <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight mt-2 text-white">
                  Error Boundaries & Blast Radius Simulator
                </h1>
                <p className="text-slate-400 text-sm mt-1">
                  Simulate local widget errors, feature-level collapses, fallback crashes, and semantic identity resets.
                </p>
              </div>

              <div className="flex gap-2">
                <button
                  onClick={() => setPortfolioId(prev => prev === "PORT_ALPHA" ? "PORT_BETA" : "PORT_ALPHA")}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-300 rounded-lg text-xs font-mono font-semibold transition border border-cyan-800/40"
                >
                  Switch Identity: {portfolioId}
                </button>
                <button
                  onClick={clearTelemetry}
                  className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-lg text-xs font-mono transition"
                >
                  Clear Logs
                </button>
              </div>
            </header>

            {/* Failure Injection Control Matrix */}
            <div className="glass-panel p-5 rounded-2xl border-amber-500/20 space-y-3">
              <div className="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-amber-400">
                <span>⚡ Synthetic Failure Injection Controls</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <button
                  onClick={() => setCrashChart(true)}
                  className="p-3 bg-slate-900 hover:bg-rose-950/40 border border-slate-800 hover:border-rose-700 rounded-xl text-left transition group"
                >
                  <div className="text-xs font-bold text-rose-400 group-hover:text-rose-300 font-mono">1. Crash Trading Chart (Widget Level)</div>
                  <div className="text-[11px] text-slate-500 mt-0.5">Blast Radius ≤ 10%. Metrics & Order Book survive.</div>
                </button>

                <button
                  onClick={() => setCrashMetrics(true)}
                  className="p-3 bg-slate-900 hover:bg-amber-950/40 border border-slate-800 hover:border-amber-700 rounded-xl text-left transition group"
                >
                  <div className="text-xs font-bold text-amber-400 group-hover:text-amber-300 font-mono">2. Crash Metrics (Feature Level)</div>
                  <div className="text-[11px] text-slate-500 mt-0.5">Blast Radius ≈ 40%. Feature boundary catches.</div>
                </button>

                <button
                  onClick={() => { setCrashChart(true); setCrashFallback(true); }}
                  className="p-3 bg-slate-900 hover:bg-purple-950/40 border border-slate-800 hover:border-purple-700 rounded-xl text-left transition group"
                >
                  <div className="text-xs font-bold text-purple-400 group-hover:text-purple-300 font-mono">3. Crash Fallback UI (Cascade Upward)</div>
                  <div className="text-[11px] text-slate-500 mt-0.5">Widget fallback throws ──► Escalates to Feature.</div>
                </button>
              </div>
            </div>

            {/* Main Application Topology */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {/* Active Application Canvas (2 Cols) */}
              <div className="lg:col-span-2 space-y-6">
                <div className="glass-panel p-6 rounded-2xl space-y-5">
                  <div className="flex justify-between items-center pb-4 border-b border-slate-800">
                    <div className="flex items-center gap-3">
                      <div className="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                      <h2 className="font-bold text-base text-white">Live Trading Terminal Shell</h2>
                    </div>
                    <span className="text-xs font-mono bg-slate-900 px-3 py-1 rounded-full text-slate-400 border border-slate-800">
                      Scope: {portfolioId}
                    </span>
                  </div>

                  {/* FEATURE BOUNDARY: ANALYTICS SUITE */}
                  <ErrorBoundary
                    key={portfolioId}
                    name="DashboardFeatureBoundary"
                    onError={logError}
                    fallbackRender={({ error, resetErrorBoundary }) => (
                      <div className="p-6 bg-amber-950/20 border border-amber-800/60 rounded-xl text-center space-y-3">
                        <div className="text-2xl">⚠️</div>
                        <h3 className="font-bold text-sm text-amber-300">Dashboard Feature Temporarily Unavailable</h3>
                        <p className="text-xs text-slate-400 font-mono">{error.message}</p>
                        <button
                          onClick={() => {
                            setCrashMetrics(false);
                            setCrashChart(false);
                            setCrashFallback(false);
                            resetErrorBoundary();
                          }}
                          className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-xs font-semibold transition"
                        >
                          Recover Feature Subtree
                        </button>
                      </div>
                    )}
                  >
                    <div className="space-y-4">
                      {/* Metrics Component */}
                      <MetricsSummary crash={crashMetrics} onReset={() => setCrashMetrics(false)} />

                      {/* Widget Grid */}
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {/* WIDGET 1: TRADING CHART BOUNDARY */}
                        <ErrorBoundary
                          name="ChartWidgetBoundary"
                          onError={logError}
                          fallbackRender={({ error, resetErrorBoundary }) => {
                            if (crashFallback) {
                              throw new Error("CASCADING_FAILURE: Chart fallback component threw during render!");
                            }
                            return (
                              <div className="p-4 bg-slate-900/90 border border-dashed border-rose-800/80 rounded-xl flex flex-col items-center justify-center min-h-[220px] text-center space-y-2">
                                <span className="text-lg">📊</span>
                                <h4 className="text-xs font-bold text-rose-300">Chart Bulkhead Engaged</h4>
                                <p className="text-[11px] text-slate-400 max-w-xs">{error.message}</p>
                                <button
                                  onClick={() => {
                                    setCrashChart(false);
                                    resetErrorBoundary();
                                  }}
                                  className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded text-xs font-semibold transition"
                                >
                                  Retry Chart Canvas
                                </button>
                              </div>
                            );
                          }}
                        >
                          <TradingChartWidget crash={crashChart} />
                        </ErrorBoundary>

                        {/* WIDGET 2: ORDER BOOK BOUNDARY */}
                        <ErrorBoundary name="OrderBookWidgetBoundary" onError={logError}>
                          <OrderBookWidget />
                        </ErrorBoundary>
                      </div>
                    </div>
                  </ErrorBoundary>
                </div>
              </div>

              {/* SENTRY / TELEMETRY LOGS (1 Col) */}
              <div className="glass-panel p-5 rounded-2xl flex flex-col h-[650px] shadow-xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <div className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></div>
                    <h3 className="font-bold text-sm text-slate-200">Failure Telemetry Stream</h3>
                  </div>
                  <span className="text-[10px] font-mono text-slate-500">{telemetry.length} incidents</span>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3 pt-4 pr-1">
                  {telemetry.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-center text-slate-600">
                      <p className="text-xs font-mono">No exceptions captured yet.<br/>Trigger synthetic errors above.</p>
                    </div>
                  ) : (
                    telemetry.map(t => (
                      <div key={t.id} className="p-3 bg-slate-950 border border-rose-900/60 rounded-xl font-mono text-xs space-y-1 text-slate-300">
                        <div className="flex justify-between items-center text-[10px]">
                          <span className="px-2 py-0.5 bg-rose-500/20 text-rose-300 rounded font-semibold">{t.boundary}</span>
                          <span className="text-slate-500">{t.time}</span>
                        </div>
                        <div className="text-rose-400 font-bold text-[11px] pt-1">{t.message}</div>
                        <div className="text-[10px] text-slate-500 truncate pt-1">{t.stack}</div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          </div>
        </ErrorBoundary>
      );
    }

    // ==========================================
    // LEAF COMPONENTS WITH CRASH INJECTORS
    // ==========================================
    function MetricsSummary({ crash, onReset }) {
      if (crash) {
        throw new Error("TYPE_ERROR: Cannot read properties of undefined (reading 'map') in MetricsSummary");
      }
      return (
        <div className="grid grid-cols-3 gap-3 p-4 bg-slate-900/90 rounded-xl border border-slate-800">
          <div>
            <div className="text-[11px] text-slate-500 font-medium">Portfolio NAV</div>
            <div className="text-base font-bold text-emerald-400 font-mono mt-0.5">$1,849,200.40</div>
          </div>
          <div>
            <div className="text-[11px] text-slate-500 font-medium">Daily P&L</div>
            <div className="text-base font-bold text-cyan-400 font-mono mt-0.5">+$42,110.00 (2.3%)</div>
          </div>
          <div>
            <div className="text-[11px] text-slate-500 font-medium">Active Limit Orders</div>
            <div className="text-base font-bold text-purple-400 font-mono mt-0.5">18 Active</div>
          </div>
        </div>
      );
    }

    function TradingChartWidget({ crash }) {
      if (crash) {
        throw new Error("CANVAS_CRASH: ThirdPartyWebGLCanvas buffer overflow exception during frame tick");
      }
      return (
        <div className="p-4 bg-slate-900/90 rounded-xl border border-slate-800 min-h-[220px] flex flex-col justify-between">
          <div className="flex justify-between items-center text-xs font-mono">
            <span className="text-slate-300 font-semibold">BTC-USD Live Stream</span>
            <span className="text-emerald-400 font-bold">$68,490.50</span>
          </div>
          <div className="h-28 bg-slate-950 rounded-lg border border-slate-800 flex items-center justify-center text-xs text-slate-600 font-mono">
            [Interactive WebGL Candlestick Rendering Engine Active]
          </div>
          <div className="text-[10px] text-slate-500 font-mono flex justify-between">
            <span>Latency: 14ms</span>
            <span>Feed: WS_PRIMARY</span>
          </div>
        </div>
      );
    }

    function OrderBookWidget() {
      return (
        <div className="p-4 bg-slate-900/90 rounded-xl border border-slate-800 min-h-[220px] space-y-2">
          <div className="flex justify-between items-center text-xs font-mono">
            <span className="text-slate-300 font-semibold">Order Depth Book</span>
            <span className="text-slate-500">Spread: $0.50</span>
          </div>
          <div className="space-y-1 text-xs font-mono">
            <div className="flex justify-between text-emerald-400 bg-emerald-950/20 px-2 py-0.5 rounded">
              <span>68,491.00</span>
              <span>1.42 BTC</span>
            </div>
            <div className="flex justify-between text-emerald-400 bg-emerald-950/20 px-2 py-0.5 rounded">
              <span>68,490.50</span>
              <span>4.18 BTC</span>
            </div>
            <div className="flex justify-between text-rose-400 bg-rose-950/20 px-2 py-0.5 rounded">
              <span>68,489.50</span>
              <span>2.80 BTC</span>
            </div>
            <div className="flex justify-between text-rose-400 bg-rose-950/20 px-2 py-0.5 rounded">
              <span>68,489.00</span>
              <span>0.95 BTC</span>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
