<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI 16 — Part 01 Companion Lab: Error Boundaries & Failure Isolation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #080c16;
      color: #f1f5f9;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .blast-intact {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(6, 78, 59, 0.15);
    }
    .blast-crashed {
      border-color: rgba(239, 68, 68, 0.6);
      background: rgba(127, 29, 29, 0.25);
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, Component } = React;

    // ==========================================
    // PRODUCTION-GRADE ERROR BOUNDARY CLASS
    // ==========================================
    class ResilientErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error: error instanceof Error ? error : new Error(String(error)) };
      }

      componentDidCatch(error, errorInfo) {
        if (this.props.onLog) {
          this.props.onLog(
            this.props.boundaryName || "ErrorBoundary",
            `Caught render exception: "${error.message}"`,
            errorInfo.componentStack,
            "error"
          );
        }
      }

      resetErrorBoundary = () => {
        if (this.props.onReset) {
          this.props.onReset();
        }
        this.setState({ hasError: false, error: null });
      };

      render() {
        if (this.state.hasError) {
          if (this.props.fallback) {
            return typeof this.props.fallback === "function"
              ? this.props.fallback(this.state.error, this.resetErrorBoundary)
              : this.props.fallback;
          }

          return (
            <div role="alert" className="p-4 bg-rose-950/60 border border-rose-800/80 rounded-xl text-rose-200 space-y-3">
              <div className="flex items-center justify-between">
                <span className="font-bold text-xs uppercase font-mono tracking-wider text-rose-400">
                  ⚠️ {this.props.boundaryName || "Component"} Crash
                </span>
                <button
                  onClick={this.resetErrorBoundary}
                  className="px-3 py-1 bg-rose-800 hover:bg-rose-700 text-white rounded text-xs font-semibold font-mono transition"
                >
                  Reset & Retry
                </button>
              </div>
              <p className="text-xs font-mono text-rose-300/80">{this.state.error?.message}</p>
            </div>
          );
        }

        return this.props.children;
      }
    }

    // ==========================================
    // CRASHABLE TEST COMPONENTS
    // ==========================================
    function LiveRevenueChart({ shouldCrash, onReset }) {
      if (shouldCrash) {
        throw new Error("WebGLContextLost: Canvas 2D render context crashed on invalid vector coordinate.");
      }

      return (
        <div className="p-4 bg-slate-900/90 border border-slate-800 rounded-xl space-y-3">
          <div className="flex justify-between items-center text-xs">
            <span className="font-bold text-slate-300 font-mono">Live Revenue Curve</span>
            <span className="text-emerald-400 font-mono text-[11px]">● Streaming 60fps</span>
          </div>
          <div className="h-28 flex items-end gap-2 bg-slate-950 p-3 rounded-lg border border-slate-800/60">
            {[45, 60, 55, 78, 85, 92, 110, 105, 125, 140].map((val, i) => (
              <div
                key={i}
                className="flex-1 bg-cyan-500/80 hover:bg-cyan-400 rounded-t transition-all duration-300"
                style={{ height: `${(val / 150) * 100}%` }}
              ></div>
            ))}
          </div>
          <div className="text-[11px] text-slate-400 font-mono flex justify-between">
            <span>MRR: $142,500</span>
            <span>+18.4% WoW</span>
          </div>
        </div>
      );
    }

    function ActiveOrdersTable({ shouldCrash, onReset }) {
      if (shouldCrash) {
        throw new Error("TypeError: Cannot read properties of undefined (reading 'customer.billing_address')");
      }

      return (
        <div className="p-4 bg-slate-900/90 border border-slate-800 rounded-xl space-y-3">
          <div className="flex justify-between items-center text-xs">
            <span className="font-bold text-slate-300 font-mono">Active Fulfillment Queue</span>
            <span className="text-cyan-400 font-mono text-[11px]">3 Orders Pending</span>
          </div>
          <div className="space-y-2">
            {[
              { id: "ORD-9821", item: "Enterprise License", amount: "$12,400", status: "PROCESSING" },
              { id: "ORD-9822", item: "Custom Integration", amount: "$4,500", status: "VERIFIED" },
              { id: "ORD-9823", item: "Dedicated Node", amount: "$1,800", status: "IN_TRANSIT" },
            ].map(ord => (
              <div key={ord.id} className="p-2 bg-slate-950 rounded border border-slate-800 flex justify-between items-center text-xs font-mono">
                <span className="text-slate-300">{ord.id}</span>
                <span className="text-slate-400">{ord.item}</span>
                <span className="text-emerald-400 font-bold">{ord.amount}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function UserProfileHeader({ shouldCrash }) {
      if (shouldCrash) {
        throw new Error("ReferenceError: 'user.permissions' is not defined during header mount.");
      }

      return (
        <header className="p-4 bg-slate-900/90 border border-slate-800 rounded-xl flex justify-between items-center">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-full bg-cyan-600 flex items-center justify-center font-bold text-xs text-white">
              PK
            </div>
            <div>
              <div className="text-xs font-bold text-white">Prasenjeet (Lead Architect)</div>
              <div className="text-[10px] text-slate-400 font-mono">Tenant: ACME Global HQ</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <span className="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded text-[11px] font-mono">
              System: HEALTHY
            </span>
          </div>
        </header>
      );
    }

    // ==========================================
    // MAIN INTERACTIVE APP COMPONENT
    // ==========================================
    function App() {
      const [architectureMode, setArchitectureMode] = useState("granular"); // 'granular' vs 'monolithic'
      const [crashChart, setCrashChart] = useState(false);
      const [crashOrders, setCrashOrders] = useState(false);
      const [crashHeader, setCrashHeader] = useState(false);
      const [logs, setLogs] = useState([]);

      const addLog = (tag, message, stack, type = "info") => {
        setLogs(prev => [
          {
            id: Math.random().toString(36).substring(2, 9),
            time: new Date().toLocaleTimeString(),
            tag,
            message,
            stack,
            type
          },
          ...prev.slice(0, 30)
        ]);
      };

      const handleEventError = () => {
        addLog("Event Handler", "Triggered throw inside button onClick. Notice: Error Boundary will NOT catch this!", null, "warn");
        try {
          throw new Error("Uncaught event exception in button callback.");
        } catch (e) {
          console.warn("[Event Handled locally via try/catch]", e);
        }
      };

      const handleAsyncError = () => {
        addLog("Async Task", "Triggered unhandled Promise rejection in setTimeout. Error Boundary cannot catch macrotasks!", null, "warn");
        setTimeout(() => {
          console.warn("[Async Task Error - Bypassed React Error Boundary]");
        }, 100);
      };

      const resetAll = () => {
        setCrashChart(false);
        setCrashOrders(false);
        setCrashHeader(false);
        addLog("System", "All fault injection states reset.", null, "info");
      };

      return (
        <div className="max-w-7xl mx-auto space-y-6">
          {/* Header */}
          <header className="glass-panel p-6 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-2xl border-cyan-500/20">
            <div>
              <div className="flex items-center gap-3">
                <span className="px-3 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-full text-xs font-semibold uppercase tracking-wider">
                  Level 06 — KPI 16 / Part 01
                </span>
                <span className="px-3 py-1 bg-rose-500/10 text-rose-400 border border-rose-500/30 rounded-full text-xs font-semibold">
                  Failure Isolation Simulator
                </span>
              </div>
              <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight mt-2 text-white">
                React Error Boundaries & Blast Radius Laboratory
              </h1>
              <p className="text-slate-400 text-sm mt-1">
                Explore component-tree failure containment, fiber stack propagation, and monolithic vs granular boundary architectures.
              </p>
            </div>
            <div className="flex bg-slate-900 p-1.5 rounded-xl border border-slate-800 text-xs">
              <button
                onClick={() => setArchitectureMode("granular")}
                className={`px-3 py-1.5 rounded-lg font-semibold transition ${
                  architectureMode === "granular" ? "bg-emerald-600 text-white shadow" : "text-slate-400 hover:text-white"
                }`}
              >
                Granular Architecture (Defensive)
              </button>
              <button
                onClick={() => setArchitectureMode("monolithic")}
                className={`px-3 py-1.5 rounded-lg font-semibold transition ${
                  architectureMode === "monolithic" ? "bg-rose-600 text-white shadow" : "text-slate-400 hover:text-white"
                }`}
              >
                Monolithic Global Boundary (Fragile)
              </button>
            </div>
          </header>

          {/* Fault Injection Control Bar */}
          <div className="glass-panel p-4 rounded-xl flex flex-wrap gap-2 items-center justify-between">
            <div className="flex flex-wrap gap-2">
              <button
                onClick={() => setCrashChart(true)}
                className="px-3 py-1.5 bg-rose-950/60 hover:bg-rose-900 border border-rose-800 text-rose-200 rounded-lg text-xs font-mono font-semibold transition"
              >
                💥 Crash Revenue Chart
              </button>
              <button
                onClick={() => setCrashOrders(true)}
                className="px-3 py-1.5 bg-rose-950/60 hover:bg-rose-900 border border-rose-800 text-rose-200 rounded-lg text-xs font-mono font-semibold transition"
              >
                💥 Crash Orders Table
              </button>
              <button
                onClick={() => setCrashHeader(true)}
                className="px-3 py-1.5 bg-rose-950/60 hover:bg-rose-900 border border-rose-800 text-rose-200 rounded-lg text-xs font-mono font-semibold transition"
              >
                💥 Crash Header
              </button>
              <button
                onClick={handleEventError}
                className="px-3 py-1.5 bg-amber-950/60 hover:bg-amber-900 border border-amber-800 text-amber-200 rounded-lg text-xs font-mono font-semibold transition"
              >
                ⚡ Trigger Event Error (onClick)
              </button>
              <button
                onClick={handleAsyncError}
                className="px-3 py-1.5 bg-purple-950/60 hover:bg-purple-900 border border-purple-800 text-purple-200 rounded-lg text-xs font-mono font-semibold transition"
              >
                ⏳ Trigger Async Promise Error
              </button>
            </div>
            <button
              onClick={resetAll}
              className="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-mono font-bold transition shadow"
            >
              🔄 Reset All Faults
            </button>
          </div>

          {/* Main Workspace Layout */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Live Component Tree Workspace (2 Cols) */}
            <div className="lg:col-span-2 space-y-4">
              <div className="flex justify-between items-center">
                <h2 className="text-sm font-bold text-slate-300 font-mono uppercase tracking-wider">
                  Live Enterprise Workspace ({architectureMode.toUpperCase()} BOUNDARY MODE)
                </h2>
                <span className={`text-xs px-2.5 py-0.5 rounded font-mono font-semibold ${
                  architectureMode === "granular" ? "bg-emerald-950 text-emerald-400 border border-emerald-800" : "bg-rose-950 text-rose-400 border border-rose-800"
                }`}>
                  Blast Radius: {architectureMode === "granular" ? "MINIMAL (Leaf-Level)" : "CATASTROPHIC (Full Page)"}
                </span>
              </div>

              {/* BOUNDARY RENDERING LOGIC */}
              {architectureMode === "monolithic" ? (
                /* MONOLITHIC GLOBAL BOUNDARY (Fragile) */
                <ResilientErrorBoundary
                  boundaryName="GlobalAppRootBoundary"
                  onLog={addLog}
                  fallback={(error, reset) => (
                    <div className="p-8 bg-rose-950/80 border-2 border-rose-600 rounded-2xl text-center space-y-4">
                      <div className="text-4xl">💥</div>
                      <h3 className="text-lg font-bold text-white">Entire Application Crashed!</h3>
                      <p className="text-xs font-mono text-rose-300 max-w-md mx-auto">{error.message}</p>
                      <button
                        onClick={() => { resetAll(); reset(); }}
                        className="px-5 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-xs font-mono transition shadow-lg"
                      >
                        Reboot Entire Application Root
                      </button>
                    </div>
                  )}
                >
                  <div className="space-y-4">
                    <UserProfileHeader shouldCrash={crashHeader} />
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <LiveRevenueChart shouldCrash={crashChart} onReset={() => setCrashChart(false)} />
                      <ActiveOrdersTable shouldCrash={crashOrders} onReset={() => setCrashOrders(false)} />
                    </div>
                  </div>
                </ResilientErrorBoundary>
              ) : (
                /* GRANULAR DEFENSIVE ARCHITECTURE */
                <div className="space-y-4">
                  {/* Header Boundary */}
                  <ResilientErrorBoundary
                    boundaryName="HeaderBoundary"
                    onLog={addLog}
                    onReset={() => setCrashHeader(false)}
                  >
                    <UserProfileHeader shouldCrash={crashHeader} />
                  </ResilientErrorBoundary>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {/* Revenue Chart Isolated Boundary */}
                    <ResilientErrorBoundary
                      boundaryName="RevenueChartBoundary"
                      onLog={addLog}
                      onReset={() => setCrashChart(false)}
                      fallback={(error, reset) => (
                        <div className="p-4 bg-rose-950/40 border border-rose-800 rounded-xl space-y-3">
                          <div className="flex justify-between items-center">
                            <span className="text-xs font-bold text-rose-400 font-mono">⚠️ Revenue Chart Unavailable</span>
                            <button
                              onClick={() => { setCrashChart(false); reset(); }}
                              className="px-3 py-1 bg-rose-800 hover:bg-rose-700 text-white rounded text-xs font-mono transition"
                            >
                              Retry Widget
                            </button>
                          </div>
                          <p className="text-[11px] font-mono text-rose-300/80">{error.message}</p>
                        </div>
                      )}
                    >
                      <LiveRevenueChart shouldCrash={crashChart} onReset={() => setCrashChart(false)} />
                    </ResilientErrorBoundary>

                    {/* Orders Table Isolated Boundary */}
                    <ResilientErrorBoundary
                      boundaryName="OrdersTableBoundary"
                      onLog={addLog}
                      onReset={() => setCrashOrders(false)}
                      fallback={(error, reset) => (
                        <div className="p-4 bg-rose-950/40 border border-rose-800 rounded-xl space-y-3">
                          <div className="flex justify-between items-center">
                            <span className="text-xs font-bold text-rose-400 font-mono">⚠️ Orders Queue Unavailable</span>
                            <button
                              onClick={() => { setCrashOrders(false); reset(); }}
                              className="px-3 py-1 bg-rose-800 hover:bg-rose-700 text-white rounded text-xs font-mono transition"
                            >
                              Retry Widget
                            </button>
                          </div>
                          <p className="text-[11px] font-mono text-rose-300/80">{error.message}</p>
                        </div>
                      )}
                    >
                      <ActiveOrdersTable shouldCrash={crashOrders} onReset={() => setCrashOrders(false)} />
                    </ResilientErrorBoundary>
                  </div>
                </div>
              )}
            </div>

            {/* Telemetry Stream & Stack Inspector (1 Col) */}
            <div className="glass-panel p-5 rounded-2xl flex flex-col h-[650px] shadow-xl">
              <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <div className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></div>
                  <h3 className="font-bold text-sm text-slate-200">Fiber Error Telemetry Stream</h3>
                </div>
                <button
                  onClick={() => setLogs([])}
                  className="text-[10px] text-slate-400 hover:text-white font-mono"
                >
                  Clear
                </button>
              </div>

              <div className="flex-1 overflow-y-auto space-y-3 pt-4 pr-1">
                {logs.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-center text-slate-600">
                    <svg className="w-10 h-10 mb-2 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <p className="text-xs font-mono">No exceptions intercepted. Trigger fault injection buttons above.</p>
                  </div>
                ) : (
                  logs.map(log => (
                    <div
                      key={log.id}
                      className={`p-3 rounded-xl border text-xs font-mono space-y-1.5 ${
                        log.type === "error"
                          ? "bg-rose-950/40 border-rose-800/60 text-rose-200"
                          : "bg-amber-950/40 border-amber-800/60 text-amber-200"
                      }`}
                    >
                      <div className="flex justify-between items-center text-[10px] opacity-70">
                        <span className="font-bold uppercase tracking-wider text-cyan-400">{log.tag}</span>
                        <span>{log.time}</span>
                      </div>
                      <p className="font-semibold text-slate-200">{log.message}</p>
                      {log.stack && (
                        <div className="p-2 bg-slate-950 rounded border border-slate-800 text-[10px] text-slate-400 overflow-x-auto whitespace-pre leading-tight">
                          {log.stack.trim()}
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
