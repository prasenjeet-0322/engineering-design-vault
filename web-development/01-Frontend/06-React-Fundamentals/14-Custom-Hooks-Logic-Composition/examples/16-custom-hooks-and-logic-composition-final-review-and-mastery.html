<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI 12 — Part 16: Custom Hooks & Logic Composition Final Review & Mastery Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
    }
    pre, code {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #111827;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useReducer, useCallback, useMemo, useRef, memo, useSyncExternalStore } = React;

    // =========================================================================
    // EXPERIMENT 1: THE FIBER MEMOIZEDSTATE TOPOLOGY INSPECTOR
    // =========================================================================
    function Exp1FiberInspector() {
      const [count, setCount] = useState(0);
      const [text, setText] = useState("Alpha");
      const [toggle, setToggle] = useState(true);
      const renderCountRef = useRef(1);

      useEffect(() => {
        renderCountRef.current += 1;
      });

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/50">Module 01</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Fiber `memoizedState` Linked List Visualizer</h2>
              <p className="text-xs text-slate-400 mt-1">Inspect the internal linear pointer sequence React uses to associate hook memory with the caller Fiber.</p>
            </div>
            <span className="text-xs font-mono text-indigo-300 bg-indigo-950 px-3 py-1.5 rounded-lg border border-indigo-800">
              Render Pass: #{renderCountRef.current}
            </span>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 font-mono text-xs">
            {/* Interactive Controls */}
            <div className="lg:col-span-4 p-4 bg-slate-950 border border-slate-800 rounded-lg space-y-4">
              <span className="text-slate-400 font-bold block">TRIGGER STATE UPDATES:</span>
              
              <div className="space-y-2">
                <button
                  onClick={() => setCount(c => c + 1)}
                  className="w-full px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded flex justify-between items-center"
                >
                  <span>Mutate Hook 1 (useState)</span>
                  <span>count: {count}</span>
                </button>

                <button
                  onClick={() => setText(t => t === "Alpha" ? "Beta" : "Alpha")}
                  className="w-full px-3 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded flex justify-between items-center"
                >
                  <span>Mutate Hook 2 (useState)</span>
                  <span>text: "{text}"</span>
                </button>

                <button
                  onClick={() => setToggle(t => !t)}
                  className="w-full px-3 py-2 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded flex justify-between items-center"
                >
                  <span>Mutate Hook 3 (useState)</span>
                  <span>toggle: {String(toggle)}</span>
                </button>
              </div>

              <div className="text-[11px] text-slate-500 pt-2 border-t border-slate-800">
                Notice that all three hooks belong to this single Fiber's memoizedState chain.
              </div>
            </div>

            {/* Linked List Topology Diagram */}
            <div className="lg:col-span-8 bg-slate-950 border border-slate-800 rounded-lg p-4 space-y-3">
              <span className="text-emerald-400 font-bold block border-b border-slate-800 pb-2">
                ACTIVE FIBER MEMOIZEDSTATE LINKED LIST
              </span>

              <div className="space-y-2">
                <div className="p-3 bg-slate-900 border border-indigo-600 rounded-lg flex items-center justify-between">
                  <div className="space-y-1">
                    <span className="text-[10px] text-indigo-400 font-bold block">NODE #1 [useState]</span>
                    <span className="text-slate-200">memoizedState: {count}</span>
                  </div>
                  <span className="text-slate-500 text-xs">next ──►</span>
                </div>

                <div className="p-3 bg-slate-900 border border-cyan-600 rounded-lg flex items-center justify-between">
                  <div className="space-y-1">
                    <span className="text-[10px] text-cyan-400 font-bold block">NODE #2 [useState]</span>
                    <span className="text-slate-200">memoizedState: "{text}"</span>
                  </div>
                  <span className="text-slate-500 text-xs">next ──►</span>
                </div>

                <div className="p-3 bg-slate-900 border border-purple-600 rounded-lg flex items-center justify-between">
                  <div className="space-y-1">
                    <span className="text-[10px] text-purple-400 font-bold block">NODE #3 [useState]</span>
                    <span className="text-slate-200">memoizedState: {String(toggle)}</span>
                  </div>
                  <span className="text-slate-500 text-xs">next ──►</span>
                </div>

                <div className="p-3 bg-slate-900 border border-slate-700 rounded-lg flex items-center justify-between">
                  <div className="space-y-1">
                    <span className="text-[10px] text-slate-400 font-bold block">NODE #4 [useRef]</span>
                    <span className="text-slate-200">memoizedState.current: {renderCountRef.current}</span>
                  </div>
                  <span className="text-slate-600 text-xs">next ──► null</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 2: THE 15 PREDICTION CHALLENGES GAUNTLET
    // =========================================================================
    function Exp2Gauntlet() {
      const challenges = [
        {
          id: 1,
          q: "What happens if a custom hook executes `useState()` inside an `if (condition)` block?",
          a: "Fatal runtime error. Skipping or adding hooks conditionally changes the linked list topology, causing React's FIFO pointer to misalign state cells across re-renders.",
          tag: "Fiber Topology"
        },
        {
          id: 2,
          q: "Why does mutating `ref.current = 5` not update the component UI?",
          a: "Refs are raw mutable heap cells that bypass React's render loop. Mutating `.current` does not enqueue a Fiber work unit in React's work loop.",
          tag: "State vs Ref"
        },
        {
          id: 3,
          q: "If an interval timer repeatedly logs count = 0 even after state updates, what is the root cause?",
          a: "Stale closure. The effect closure captured the initial render snapshot of count and was never re-synchronized because dependencies were omitted.",
          tag: "Closures"
        },
        {
          id: 4,
          q: "Why is `AbortController.abort()` insufficient on its own to guarantee async correctness?",
          a: "Cancellation attempts to terminate the network socket, but in-flight microtasks or already-queued promises may still resolve. An `isCurrent` guard is mandatory.",
          tag: "Concurrency"
        },
        {
          id: 5,
          q: "Why does `React.memo` fail to stop child re-renders when a consumed Context updates?",
          a: "React.memo only shallowly compares parent props. Context subscriptions notify consumer Fibers directly, bypassing prop checks completely.",
          tag: "Context & Perf"
        }
      ];

      const [revealed, setRevealed] = useState({});

      const toggleReveal = (id) => {
        setRevealed(prev => ({ ...prev, [id]: !prev[id] }));
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="border-b border-slate-800 pb-4">
            <span className="text-xs font-mono uppercase tracking-widest text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50">Module 02</span>
            <h2 className="text-xl font-bold text-slate-100 mt-1">The Senior Diagnostic Prediction Gauntlet</h2>
            <p className="text-xs text-slate-400 mt-1">Interactive architectural challenge cards testing mental model precision under production edge cases.</p>
          </div>

          <div className="space-y-4">
            {challenges.map(c => (
              <div key={c.id} className="p-4 bg-slate-950 border border-slate-800 rounded-lg space-y-3 font-mono text-xs">
                <div className="flex items-center justify-between">
                  <span className="text-indigo-400 font-bold">CHALLENGE #{c.id}</span>
                  <span className="px-2 py-0.5 rounded text-[10px] bg-slate-900 text-slate-400 border border-slate-800">{c.tag}</span>
                </div>
                <h3 className="text-sm font-semibold text-slate-200">{c.q}</h3>

                {revealed[c.id] ? (
                  <div className="p-3 bg-slate-900 border border-emerald-900/60 rounded text-emerald-300 space-y-1">
                    <span className="font-bold text-emerald-400 block text-[10px] uppercase">Staff-Level Answer:</span>
                    <p className="leading-relaxed">{c.a}</p>
                  </div>
                ) : null}

                <button
                  onClick={() => toggleReveal(c.id)}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded transition-all"
                >
                  {revealed[c.id] ? "Hide Analysis" : "Reveal Senior Answer"}
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 3: STAFF CERTIFICATION EXAM & DIPLOMA
    // =========================================================================
    function Exp3GraduationExam() {
      const questions = [
        {
          id: 1,
          q: "What defines a true enterprise custom Hook boundary?",
          options: [
            "It has at least 500 lines of code and uses TypeScript generics",
            "It establishes a stable, narrow semantic contract that hides underlying infrastructure (Context, external stores, workers) so implementation can evolve without modifying consumers",
            "It replaces all components with custom hooks",
            "It executes only on the Node.js server"
          ],
          correct: 1,
          explanation: "A true architectural boundary acts as an impermeable migration firewall, exposing domain commands and ARIA attributes while hiding implementation mechanics."
        },
        {
          id: 2,
          q: "Why is `useSyncExternalStore` the gold standard for high-rate global state subscriptions?",
          options: [
            "It converts React to WebAssembly",
            "It reads store snapshots synchronously during render, eliminating visual tearing in Concurrent React and allowing fine-grained selector memoization",
            "It runs on the GPU",
            "It removes the need for useEffect cleanup"
          ],
          correct: 1,
          explanation: "useSyncExternalStore integrates directly with React 18's concurrent scheduler to guarantee consistent, tear-free reads from external pub/sub stores."
        },
        {
          id: 3,
          q: "When should logic be written as a plain TypeScript function rather than a custom Hook?",
          options: [
            "Never, all logic in React projects must be hooks",
            "When the computation is pure, deterministic, and requires no React state, lifecycle effects, refs, or Context",
            "Only when building mobile apps",
            "When the function contains async/await"
          ],
          correct: 1,
          explanation: "Plain functions avoid React hook overhead, preserve purity, and can be reused in non-React modules, web workers, and backend services."
        }
      ];

      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const score = Object.keys(answers).reduce((acc, qId) => {
        const q = questions.find(item => item.id === Number(qId));
        return q && answers[qId] === q.correct ? acc + 1 : acc;
      }, 0);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-fuchsia-400 bg-fuchsia-950/60 px-2 py-0.5 rounded border border-fuchsia-800/50">Module 03</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Staff-Level Master Certification Exam</h2>
              <p className="text-xs text-slate-400 mt-1">Complete the final certification exam to earn your KPI 12 Senior Mastery Seal.</p>
            </div>
            {submitted && (
              <div className="text-right">
                <span className="text-2xl font-black font-mono text-fuchsia-400">{score} / {questions.length}</span>
                <span className="text-xs text-slate-400 block">{score === questions.length ? "🎖️ 100% Master Certified!" : "Review below"}</span>
              </div>
            )}
          </div>

          <div className="space-y-6 font-mono text-xs">
            {questions.map(q => (
              <div key={q.id} className="p-4 bg-slate-950 border border-slate-800/80 rounded-lg space-y-3">
                <h3 className="text-sm font-semibold text-slate-200">
                  <span className="text-fuchsia-400 font-mono mr-2">Q{q.id}.</span>
                  {q.q}
                </h3>

                <div className="space-y-2">
                  {q.options.map((opt, optIdx) => {
                    const isSelected = answers[q.id] === optIdx;
                    const isCorrect = q.correct === optIdx;
                    let borderClass = 'border-slate-800 hover:border-slate-700 bg-slate-900/60';
                    if (submitted) {
                      if (isCorrect) borderClass = 'border-emerald-500 bg-emerald-950/40 text-emerald-200';
                      else if (isSelected && !isCorrect) borderClass = 'border-red-500 bg-red-950/40 text-red-200';
                    } else if (isSelected) {
                      borderClass = 'border-fuchsia-500 bg-fuchsia-950/40 text-fuchsia-200';
                    }

                    return (
                      <button
                        key={optIdx}
                        disabled={submitted}
                        onClick={() => setAnswers(prev => ({ ...prev, [q.id]: optIdx }))}
                        className={`w-full text-left p-2.5 rounded-lg border transition-all flex items-center justify-between ${borderClass}`}
                      >
                        <span>{opt}</span>
                        {submitted && isCorrect && <span className="text-emerald-400 font-bold">✓ CORRECT</span>}
                        {submitted && isSelected && !isCorrect && <span className="text-red-400 font-bold">✗ INCORRECT</span>}
                      </button>
                    );
                  })}
                </div>

                {submitted && (
                  <div className="p-3 bg-slate-900/90 border border-slate-800 rounded text-[11px] text-slate-300">
                    <span className="font-bold text-fuchsia-400 block mb-1">Architectural Analysis:</span>
                    {q.explanation}
                  </div>
                )}
              </div>
            ))}

            {/* Graduation Diploma Banner */}
            {submitted && score === questions.length && (
              <div className="p-6 bg-gradient-to-r from-indigo-950 via-purple-950 to-slate-950 border-2 border-fuchsia-500 rounded-xl shadow-2xl text-center space-y-3">
                <span className="text-3xl">🎖️</span>
                <h3 className="text-lg font-black text-slate-100 tracking-wider">
                  KPI 12 SENIOR HOOK ARCHITECT CERTIFICATION
                </h3>
                <p className="text-slate-300 text-xs max-w-xl mx-auto leading-relaxed">
                  Congratulations! You have demonstrated staff-level mastery over Custom Hooks, Fiber linked-list topologies, symmetric lifecycle teardowns, asynchronous concurrency invariants, and enterprise migration firewalls.
                </p>
                <div className="text-[10px] text-slate-500 font-mono">
                  Level 06: React Fundamentals · Senior Engineering Design Vault · Certified 2026
                </div>
              </div>
            )}

            <div className="flex justify-end gap-3 pt-2">
              {submitted ? (
                <button
                  onClick={() => { setAnswers({}); setSubmitted(false); }}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-mono rounded-lg"
                >
                  Reset Exam
                </button>
              ) : (
                <button
                  onClick={() => setSubmitted(true)}
                  disabled={Object.keys(answers).length < questions.length}
                  className="px-6 py-2 bg-fuchsia-600 hover:bg-fuchsia-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-xs font-bold font-mono rounded-lg shadow-lg shadow-fuchsia-600/30"
                >
                  Submit & Evaluate
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MAIN APP HARNESS
    // =========================================================================
    function App() {
      const [activeTab, setActiveTab] = useState("topology");

      return (
        <div className="max-w-6xl mx-auto px-4 py-8 space-y-8">
          <header className="border-b border-slate-800 pb-6 space-y-2">
            <div className="flex items-center gap-2">
              <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                Level 06 · React Fundamentals
              </span>
              <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-purple-500/10 text-purple-400 border border-purple-500/20">
                KPI 12 · Custom Hooks
              </span>
              <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                Part 16 Finale Lab
              </span>
            </div>
            <h1 className="text-3xl font-extrabold text-slate-100 tracking-tight">
              Custom Hooks & Logic Composition: Final Mastery
            </h1>
            <p className="text-slate-400 text-sm max-w-3xl leading-relaxed">
              Terminal mastery laboratory providing interactive Fiber linked-list inspection, the 15 Prediction Challenges Gauntlet, and final Staff-Level certification diploma evaluation.
            </p>
          </header>

          {/* Navigation Tabs */}
          <div className="flex flex-wrap gap-2 border-b border-slate-800 pb-2">
            <button
              onClick={() => setActiveTab("topology")}
              className={`px-4 py-2 text-xs font-mono font-bold rounded-lg border transition-all ${
                activeTab === "topology"
                  ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg shadow-indigo-600/20'
                  : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
              }`}
            >
              1. Fiber Topology Inspector
            </button>
            <button
              onClick={() => setActiveTab("gauntlet")}
              className={`px-4 py-2 text-xs font-mono font-bold rounded-lg border transition-all ${
                activeTab === "gauntlet"
                  ? 'bg-emerald-600 border-emerald-500 text-white shadow-lg shadow-emerald-600/20'
                  : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
              }`}
            >
              2. Prediction Gauntlet
            </button>
            <button
              onClick={() => setActiveTab("exam")}
              className={`px-4 py-2 text-xs font-mono font-bold rounded-lg border transition-all ${
                activeTab === "exam"
                  ? 'bg-fuchsia-600 border-fuchsia-500 text-white shadow-lg shadow-fuchsia-600/20'
                  : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
              }`}
            >
              3. Master Certification
            </button>
          </div>

          {/* Active Tab */}
          <main>
            {activeTab === "topology" && <Exp1FiberInspector />}
            {activeTab === "gauntlet" && <Exp2Gauntlet />}
            {activeTab === "exam" && <Exp3GraduationExam />}
          </main>

          <footer className="text-center text-xs font-mono text-slate-600 pt-8 border-t border-slate-900">
            Level 06: React Fundamentals · KPI 12 (Custom Hooks) Complete 16-Part Masterclass · Senior Engineering Vault
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
