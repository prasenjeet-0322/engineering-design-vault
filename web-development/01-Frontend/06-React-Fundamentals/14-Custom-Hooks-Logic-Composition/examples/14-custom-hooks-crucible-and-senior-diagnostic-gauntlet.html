<body class="min-h-screen bg-slate-950 text-slate-100 antialiased custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useReducer, useCallback, useMemo, useRef, memo } = React;

    // =========================================================================
    // EXPERIMENT 1: LIVE STALE CLOSURE INTERVAL CRUCIBLE
    // =========================================================================
    function Exp1StaleClosure() {
      const [count, setCount] = useState(0);
      const [isRunning, setIsRunning] = useState(false);
      const [mode, setMode] = useState("stale"); // "stale" vs "latestRef"
      const [logs, setLogs] = useState([]);

      const savedCallback = useRef();

      const addLog = (msg, type = "info") => {
        setLogs(prev => [`[${new Date().toLocaleTimeString()}] ${msg}`, ...prev.slice(0, 6)]);
      };

      // Mode A: Stale Closure Buggy Hook
      useEffect(() => {
        if (!isRunning || mode !== "stale") return;
        addLog("Effect Setup: Timer started with closure over current count.");

        const id = setInterval(() => {
          // ❌ Closes over 'count' at effect creation time!
          addLog(`Timer tick: Observed count = ${count}. Attempting count + 1...`, "warn");
          setCount(count + 1);
        }, 1000);

        return () => {
          clearInterval(id);
          addLog("Effect Cleanup: Timer cleared.");
        };
      }, [isRunning, mode]); // Omitted 'count' to simulate common anti-pattern

      // Mode B: Senior Latest Ref Pattern
      useEffect(() => {
        savedCallback.current = () => {
          addLog(`Timer tick (Latest Ref): Correctly updating from latest state.`, "success");
          setCount(prev => prev + 1);
        };
      });

      useEffect(() => {
        if (!isRunning || mode !== "latestRef") return;
        addLog("Effect Setup: Stable timer started with Latest Value Ref.");

        const id = setInterval(() => {
          savedCallback.current?.();
        }, 1000);

        return () => {
          clearInterval(id);
          addLog("Effect Cleanup: Timer cleared.");
        };
      }, [isRunning, mode]);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-red-400 bg-red-950/60 px-2 py-0.5 rounded border border-red-800/50">Crucible 01</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">The Stale Closure Interval Trap</h2>
              <p className="text-xs text-slate-400 mt-1">Observe why omission of dependencies in `useEffect` freezes execution scope over initial render snapshots.</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => { setIsRunning(false); setMode(mode === "stale" ? "latestRef" : "stale"); }}
                className={`px-3 py-1.5 text-xs font-mono rounded-lg border transition-all ${
                  mode === "latestRef"
                    ? 'bg-emerald-950/60 border-emerald-700 text-emerald-300'
                    : 'bg-red-950/60 border-red-700 text-red-300'
                }`}
              >
                Implementation: {mode === "latestRef" ? "✅ Latest Ref Pattern" : "❌ Stale Closure Bug"}
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 font-mono text-xs">
            <div className="lg:col-span-5 space-y-4">
              <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg space-y-3">
                <span className="text-slate-400 block font-bold">STATE DASHBOARD:</span>
                <div className="flex items-center justify-between p-3 bg-slate-900 rounded border border-slate-800">
                  <span className="text-slate-400">Current React State:</span>
                  <span className="text-2xl font-black text-indigo-400">{count}</span>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => setIsRunning(!isRunning)}
                    className={`px-4 py-2 font-bold rounded-lg text-white transition-all ${
                      isRunning ? 'bg-amber-600 hover:bg-amber-500' : 'bg-indigo-600 hover:bg-indigo-500'
                    }`}
                  >
                    {isRunning ? "⏹ Stop Timer" : "▶ Start 1-Second Interval"}
                  </button>
                  <button
                    onClick={() => { setCount(0); setLogs([]); }}
                    className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg"
                  >
                    Reset
                  </button>
                </div>
              </div>

              <div className="p-3 bg-slate-950/60 border border-slate-800 rounded text-[11px] text-slate-400 space-y-1">
                <span className="font-bold text-slate-200 block">Behavioral Analysis:</span>
                {mode === "stale" ? (
                  <p className="text-red-300">
                    In Stale mode, the timer is stuck closing over <code className="text-white">count = 0</code>. Even if it fires 10 times, it computes <code className="text-white">0 + 1 = 1</code> on every tick, locking the counter at 1!
                  </p>
                ) : (
                  <p className="text-emerald-300">
                    In Latest Ref mode, <code className="text-white">savedCallback.current</code> synchronizes on every render pass, allowing the timer to increment state accurately.
                  </p>
                )}
              </div>
            </div>

            {/* Logs tracer */}
            <div className="lg:col-span-7 bg-slate-950 border border-slate-800 rounded-lg p-4 flex flex-col justify-between">
              <div>
                <span className="text-indigo-400 font-bold block border-b border-slate-800 pb-2 mb-2">
                  CLOSURE & EXECUTION LOG
                </span>
                <div className="space-y-1.5">
                  {logs.length === 0 ? (
                    <div className="text-slate-600 italic py-6 text-center">Start timer to observe closure traces...</div>
                  ) : (
                    logs.map((l, i) => (
                      <div key={i} className={`p-1.5 rounded text-[11px] ${
                        l.includes('warn') || l.includes('Observed') ? 'bg-amber-950/40 text-amber-300 border border-amber-800/40' :
                        l.includes('Success') || l.includes('Latest') ? 'bg-emerald-950/40 text-emerald-300 border border-emerald-800/40' :
                        'bg-slate-900 text-slate-300 border border-slate-800'
                      }`}>
                        {l}
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 2: INFINITE EFFECT LOOP & DEPENDENCY ANALYZER
    // =========================================================================
    function Exp2InfiniteLoop() {
      const [renderCount, setRenderCount] = useState(0);
      const [filter, setFilter] = useState("active");
      const [mode, setMode] = useState("safe"); // "unsafe" vs "safe"
      const [isCircuitBreakerTripped, setIsCircuitBreakerTripped] = useState(false);
      const loopCountRef = useRef(0);

      // Simulation trigger
      const triggerEffect = () => {
        loopCountRef.current = 0;
        setIsCircuitBreakerTripped(false);
        setRenderCount(p => p + 1);
      };

      useEffect(() => {
        if (renderCount === 0) return;

        loopCountRef.current += 1;
        if (loopCountRef.current > 15) {
          setIsCircuitBreakerTripped(true);
          return;
        }

        if (mode === "unsafe") {
          // ❌ UNSAFE: Simulated state update inside effect triggered by unstable dependency
          const timer = setTimeout(() => {
            setRenderCount(p => p + 1);
          }, 80);
          return () => clearTimeout(timer);
        }
      }, [renderCount, mode]);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800/50">Crucible 02</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Infinite Effect Loop & Dependency Storm</h2>
              <p className="text-xs text-slate-400 mt-1">Observe how passing inline composite objects creates new memory references, triggering infinite render storms.</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => { setRenderCount(0); setMode(mode === "safe" ? "unsafe" : "safe"); setIsCircuitBreakerTripped(false); }}
                className={`px-3 py-1.5 text-xs font-mono rounded-lg border transition-all ${
                  mode === "safe"
                    ? 'bg-emerald-950/60 border-emerald-700 text-emerald-300'
                    : 'bg-red-950/60 border-red-700 text-red-300'
                }`}
              >
                Dependency Mode: {mode === "safe" ? "✅ Primitive [filter]" : "❌ Inline Object [{ filter }]"}
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg space-y-4">
              <span className="text-slate-400 block font-bold">RECONCILIATION MONITOR:</span>
              
              <div className="flex items-center justify-between p-3 bg-slate-900 rounded border border-slate-800">
                <span className="text-slate-400">Total Render Cycles:</span>
                <span className={`text-2xl font-black ${isCircuitBreakerTripped ? 'text-red-400' : 'text-emerald-400'}`}>
                  {renderCount}
                </span>
              </div>

              {isCircuitBreakerTripped && (
                <div className="p-3 bg-red-950/80 border border-red-600 rounded text-red-200">
                  <span className="font-bold block">🚨 CIRCUIT BREAKER TRIPPED!</span>
                  <p className="text-[11px] mt-1">React maximum update depth exceeded. Infinite loop aborted after 15 cascaded render cycles.</p>
                </div>
              )}

              <button
                onClick={triggerEffect}
                className="w-full px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg transition-all"
              >
                Test Render Cycle
              </button>
            </div>

            <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg flex flex-col justify-between">
              <div className="space-y-2">
                <span className="text-amber-400 font-bold block border-b border-slate-800 pb-2">
                  DEPENDENCY OBJECT.IS COMPARISON
                </span>
                <div className="p-2.5 bg-slate-900 rounded text-[11px] text-slate-300 space-y-1">
                  <div className="flex justify-between">
                    <span className="text-slate-500">Render #1:</span>
                    <code>{`{ filter: "${filter}" } (0x01)`}</code>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Render #2:</span>
                    <code>{`{ filter: "${filter}" } (0x02)`}</code>
                  </div>
                  <div className="pt-2 border-t border-slate-800 flex justify-between font-bold">
                    <span>Object.is(0x01, 0x02):</span>
                    <span className="text-red-400">FALSE (Triggers Effect!)</span>
                  </div>
                </div>
              </div>

              <div className="text-[11px] text-slate-400 pt-3 border-t border-slate-800">
                <span className="font-bold text-slate-200 block mb-1">Senior Standard:</span>
                Never pass composite object literals to dependency arrays. Extract primitive values (`[filter]`) or flatten the hook signature.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 3: BOOLEAN EXPLOSION VS FSM DISCRIMINATED UNION
    // =========================================================================
    function Exp3BooleanExplosion() {
      // Anti-Pattern: Multiple conflicting booleans
      const [isLoading, setIsLoading] = useState(false);
      const [isSuccess, setIsSuccess] = useState(false);
      const [isError, setIsError] = useState(false);

      // Senior Standard: Discriminated Union Finite State Machine
      const [fsmState, setFsmState] = useState({ status: "idle" });

      const setFsm = (status, payload = null) => {
        if (status === "idle") setFsmState({ status: "idle" });
        if (status === "loading") setFsmState({ status: "loading" });
        if (status === "success") setFsmState({ status: "success", data: payload });
        if (status === "error") setFsmState({ status: "error", error: payload });
      };

      const induceImpossibleState = () => {
        // Impossible state: Loading AND Error AND Success all TRUE simultaneously!
        setIsLoading(true);
        setIsSuccess(true);
        setIsError(true);
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-fuchsia-400 bg-fuchsia-950/60 px-2 py-0.5 rounded border border-fuchsia-800/50">Crucible 03</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Boolean State Explosion vs. Discriminated Union FSM</h2>
              <p className="text-xs text-slate-400 mt-1">Eliminate impossible UI states by replacing loose boolean flags with mathematical state machines.</p>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            {/* Anti-Pattern Side */}
            <div className="p-4 bg-slate-950 border border-red-900/50 rounded-lg space-y-4">
              <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                <span className="text-red-400 font-bold">ANTI-PATTERN: 3 INDEPENDENT BOOLEANS</span>
                <span className="text-[10px] bg-red-950 text-red-300 px-1.5 py-0.5 rounded">Fragile</span>
              </div>

              <div className="grid grid-cols-3 gap-2 text-center">
                <div className={`p-2 rounded border ${isLoading ? 'bg-indigo-950 border-indigo-600 text-indigo-200' : 'bg-slate-900 border-slate-800 text-slate-600'}`}>
                  isLoading: {String(isLoading)}
                </div>
                <div className={`p-2 rounded border ${isSuccess ? 'bg-emerald-950 border-emerald-600 text-emerald-200' : 'bg-slate-900 border-slate-800 text-slate-600'}`}>
                  isSuccess: {String(isSuccess)}
                </div>
                <div className={`p-2 rounded border ${isError ? 'bg-red-950 border-red-600 text-red-200' : 'bg-slate-900 border-slate-800 text-slate-600'}`}>
                  isError: {String(isError)}
                </div>
              </div>

              {isLoading && isSuccess && isError && (
                <div className="p-2.5 bg-red-950/80 border border-red-500 rounded text-red-200 text-[11px]">
                  ⚠️ IMPOSSIBLE STATE: UI is simultaneously loading, errored, and successful!
                </div>
              )}

              <button
                onClick={induceImpossibleState}
                className="w-full px-3 py-2 bg-red-900/60 hover:bg-red-800/80 text-red-200 font-bold rounded border border-red-700"
              >
                Trigger Impossible Boolean Conflict
              </button>
            </div>

            {/* Senior FSM Side */}
            <div className="p-4 bg-slate-950 border border-emerald-900/50 rounded-lg space-y-4">
              <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                <span className="text-emerald-400 font-bold">SENIOR STANDARD: DISCRIMINATED UNION</span>
                <span className="text-[10px] bg-emerald-950 text-emerald-300 px-1.5 py-0.5 rounded">FSM Solid</span>
              </div>

              <div className="p-3 bg-slate-900 rounded border border-slate-800 flex items-center justify-between">
                <span className="text-slate-400">Current Status:</span>
                <span className="text-emerald-400 font-bold uppercase">{fsmState.status}</span>
              </div>

              <div className="grid grid-cols-4 gap-1.5">
                <button onClick={() => setFsm("idle")} className="p-1.5 bg-slate-800 hover:bg-slate-700 rounded text-[10px]">idle</button>
                <button onClick={() => setFsm("loading")} className="p-1.5 bg-indigo-900 hover:bg-indigo-800 rounded text-[10px]">loading</button>
                <button onClick={() => setFsm("success", "Payload 200")} className="p-1.5 bg-emerald-900 hover:bg-emerald-800 rounded text-[10px]">success</button>
                <button onClick={() => setFsm("error", new Error("404"))} className="p-1.5 bg-red-900 hover:bg-red-800 rounded text-[10px]">error</button>
              </div>

              <div className="text-[11px] text-slate-400">
                A single status discriminator guarantees mathematically that impossible states cannot exist.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 4: SENIOR DIAGNOSTIC CERTIFICATION EXAM
    // =========================================================================
    function Exp4SeniorExam() {
      const questions = [
        {
          id: 1,
          q: "What causes a timer in useInterval to repeatedly log the initial count value (0) instead of incrementing?",
          options: [
            "The browser throttled the timer",
            "The effect closure captured the initial render snapshot of count and was never re-synchronized because dependencies were omitted",
            "JavaScript does not support numbers inside intervals",
            "React Fiber destroyed the hook linked list"
          ],
          correct: 1,
          explanation: "Omitting count from dependencies preserves the initial callback closure forever. The Latest Value Ref pattern or functional state updaters solve this."
        },
        {
          id: 2,
          q: "Why is declaring custom hooks inside an `if` block a fatal React runtime error?",
          options: [
            "Because TypeScript compiler blocks if statements",
            "Because React relies on an unconditional, stable Hook call order to map hooks to their corresponding Fiber memoizedState linked list nodes",
            "Because if statements consume too much memory",
            "Because React 18 deprecated conditionals"
          ],
          correct: 1,
          explanation: "React relies on FIFO index alignment on the Fiber memoizedState linked list. Conditional execution alters the list topology, causing fatal misalignment."
        },
        {
          id: 3,
          q: "Why does React.memo fail to stop child re-renders when a Context updates?",
          options: [
            "React.memo is broken in production",
            "React.memo only checks shallow prop equality; Context subscriptions bypass prop checks and trigger Fiber re-renders directly",
            "Because Context only works with class components",
            "Because memo requires Redux"
          ],
          correct: 1,
          explanation: "React.memo prevents parent-driven re-renders when props are identical. However, when a component subscribes to Context via useContext, Context updates re-render the component directly."
        }
      ];

      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const score = Object.keys(answers).reduce((acc, qId) => {
        const q = questions.find(item => item.id === Number(qId));
        return q && answers[qId] === q.correct ? acc + 1 : acc;
      }, 0);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-cyan-400 bg-cyan-950/60 px-2 py-0.5 rounded border border-cyan-800/50">Crucible 04</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Staff-Level Diagnostic Certification Exam</h2>
              <p className="text-xs text-slate-400 mt-1">Demonstrate your mastery of Hook Fiber internals, stale closures, and diagnostic triage.</p>
            </div>
            {submitted && (
              <div className="text-right">
                <span className="text-2xl font-black font-mono text-cyan-400">{score} / {questions.length}</span>
                <span className="text-xs text-slate-400 block">{score === questions.length ? "🎖️ Senior Master Certified!" : "Review explanations below"}</span>
              </div>
            )}
          </div>

          <div className="space-y-6">
            {questions.map(q => (
              <div key={q.id} className="p-4 bg-slate-950 border border-slate-800/80 rounded-lg space-y-3">
                <h3 className="text-sm font-semibold text-slate-200">
                  <span className="text-cyan-400 font-mono mr-2">Q{q.id}.</span>
                  {q.q}
                </h3>

                <div className="space-y-2">
                  {q.options.map((opt, optIdx) => {
                    const isSelected = answers[q.id] === optIdx;
                    const isCorrect = q.correct === optIdx;
                    let borderClass = 'border-slate-800 hover:border-slate-700 bg-slate-900/60';
                    if (submitted) {
                      if (isCorrect) borderClass = 'border-emerald-500 bg-emerald-950/40 text-emerald-200';
                      else if (isSelected && !isCorrect) borderClass = 'border-red-500 bg-red-950/40 text-red-200';
                    } else if (isSelected) {
                      borderClass = 'border-cyan-500 bg-cyan-950/40 text-cyan-200';
                    }

                    return (
                      <button
                        key={optIdx}
                        disabled={submitted}
                        onClick={() => setAnswers(prev => ({ ...prev, [q.id]: optIdx }))}
                        className={`w-full text-left p-2.5 rounded-lg text-xs font-mono border transition-all flex items-center justify-between ${borderClass}`}
                      >
                        <span>{opt}</span>
                        {submitted && isCorrect && <span className="text-emerald-400 font-bold">✓ CORRECT</span>}
                        {submitted && isSelected && !isCorrect && <span className="text-red-400 font-bold">✗ INCORRECT</span>}
                      </button>
                    );
                  })}
                </div>

                {submitted && (
                  <div className="p-3 bg-slate-900/90 border border-slate-800 rounded text-[11px] text-slate-300">
                    <span className="font-bold text-cyan-400 block mb-1">Architectural Analysis:</span>
                    {q.explanation}
                  </div>
                )}
              </div>
            ))}

            <div className="flex justify-end gap-3 pt-2">
              {submitted ? (
                <button
                  onClick={() => { setAnswers({}); setSubmitted(false); }}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-mono rounded-lg"
                >
                  Reset Exam
                </button>
              ) : (
                <button
                  onClick={() => setSubmitted(true)}
                  disabled={Object.keys(answers).length < questions.length}
                  className="px-6 py-2 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-xs font-bold font-mono rounded-lg shadow-lg shadow-cyan-600/30"
                >
                  Submit & Evaluate
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MAIN LAB HARNESS
    // =========================================================================
