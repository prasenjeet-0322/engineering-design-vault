  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useReducer, useCallback, useMemo, useRef, memo } = React;

    // ==========================================
    // EXPERIMENT 1: USEEVENTLISTENER LEAK INSPECTOR
    // ==========================================
    let globalZombieCount = 0;

    function Exp1EventListenerLab() {
      const [mounted, setMounted] = useState(true);
      const [leakMode, setLeakMode] = useState(false);
      const [eventLogs, setEventLogs] = useState([]);
      const [pressCount, setPressCount] = useState(0);

      const addLog = (msg) => setEventLogs(prev => [`[${new Date().toLocaleTimeString()}] ${msg}`, ...prev.slice(0, 5)]);

      // Inside Sub-Widget
      const SubWidget = () => {
        const handlerRef = useRef();
        handlerRef.current = (e) => {
          if (e.key === "Enter" || e.key === " ") {
            setPressCount(c => c + 1);
            addLog(`Triggered by Key: [${e.key}] (Current Press Count State: ${pressCount + 1})`);
          }
        };

        useEffect(() => {
          if (leakMode) {
            // ❌ BROKEN: Inline arrow in cleanup fails to remove!
            const brokenListener = (e) => handlerRef.current(e);
            window.addEventListener("keydown", brokenListener);
            globalZombieCount++;
            return () => {
              // Passing NEW arrow function does NOT remove brokenListener!
              window.removeEventListener("keydown", (e) => handlerRef.current(e));
            };
          } else {
            // ✅ STABLE BRIDGE PATTERN: Same pointer passed to removeEventListener
            const stableListener = (e) => handlerRef.current(e);
            window.addEventListener("keydown", stableListener);
            return () => {
              window.removeEventListener("keydown", stableListener);
            };
          }
        }, [leakMode]);

        return (
          <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-2">
            <div className="flex items-center justify-between">
              <span className="text-xs font-bold text-emerald-400">Sub-Widget Active</span>
              <span className="text-xs font-mono text-slate-400">Keypresses Captured: <strong className="text-white">{pressCount}</strong></span>
            </div>
            <p className="text-xs text-slate-400">Press <kbd className="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-200">Space</kbd> or <kbd className="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-200">Enter</kbd> anywhere on the page.</p>
          </div>
        );
      };

      return (
        <div className="space-y-6">
          <div className="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h3 className="text-sm font-bold text-white">Event Listener Cleanup & Zombie Leak Inspector</h3>
              <p className="text-xs text-slate-400">Mount and unmount the sub-widget to observe symmetric listener cleanup.</p>
            </div>
            <div className="flex items-center gap-3">
              <button
                onClick={() => setLeakMode(prev => !prev)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${leakMode ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'}`}
              >
                Leak Mode: {leakMode ? "ON (Broken Cleanup)" : "OFF (Symmetric Cleanup)"}
              </button>
              <button
                onClick={() => setMounted(prev => !prev)}
                className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition"
              >
                {mounted ? "Unmount Sub-Widget" : "Mount Sub-Widget"}
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="p-5 rounded-2xl bg-slate-900/40 border border-slate-800 space-y-4">
              <h4 className="text-sm font-bold text-slate-200">Widget Container</h4>
              {mounted ? <SubWidget /> : (
                <div className="p-8 text-center bg-slate-950/60 rounded-xl border border-dashed border-slate-800 text-xs text-slate-500">
                  Sub-widget unmounted. Try pressing Space/Enter. If Leak Mode was ON, zombie listeners will still fire!
                </div>
              )}
            </div>

            <div className="p-5 rounded-2xl bg-slate-900/40 border border-slate-800 space-y-4">
              <h4 className="text-sm font-bold text-slate-200">Telemetry Stream</h4>
              <div className="p-3 bg-slate-950 rounded-lg border border-slate-800 min-h-[120px] font-mono text-xs space-y-1">
                {eventLogs.length === 0 ? (
                  <p className="text-slate-500">No events captured yet. Press Space or Enter.</p>
                ) : (
                  eventLogs.map((l, i) => <div key={i} className="text-indigo-300">{l}</div>)
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // EXPERIMENT 2: USERESIZEOBSERVER CONTAINER QUERIES
    // ==========================================
    function Exp2ResizeObserverLab() {
      const containerRef = useRef(null);
      const [dimensions, setDimensions] = useState({ width: 0, height: 0 });

      useEffect(() => {
        if (!containerRef.current || typeof ResizeObserver === "undefined") return;

        const observer = new ResizeObserver(([entry]) => {
          if (entry && entry.contentRect) {
            setDimensions({
              width: Math.round(entry.contentRect.width),
              height: Math.round(entry.contentRect.height),
            });
          }
        });

        observer.observe(containerRef.current);
        return () => observer.disconnect();
      }, []);

      const isCompact = dimensions.width < 380;

      return (
        <div className="space-y-6">
          <div className="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h4 className="text-sm font-bold text-white">ResizeObserver Container Query Simulator</h4>
              <p className="text-xs text-slate-400">Drag the bottom-right corner of the container below to resize.</p>
            </div>
            <div className="font-mono text-xs text-indigo-400 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
              Width: <strong className="text-white">{dimensions.width}px</strong> | Height: <strong className="text-white">{dimensions.height}px</strong>
            </div>
          </div>

          <div
            ref={containerRef}
            className="p-6 rounded-2xl bg-slate-900 border border-indigo-500/30 overflow-hidden resize space-y-4 shadow-xl min-w-[260px] max-w-full"
            style={{ height: "220px", width: "480px" }}
          >
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <span className="text-xs font-bold text-slate-300">Responsive Container Component</span>
              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${isCompact ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'}`}>
                {isCompact ? "COMPACT LAYOUT (<380px)" : "EXPANDED LAYOUT (≥380px)"}
              </span>
            </div>

            <div className={isCompact ? "space-y-2" : "grid grid-cols-2 gap-3"}>
              <div className="p-3 rounded-lg bg-slate-950 border border-slate-800 text-xs">
                <span className="text-slate-400 font-mono">CPU Load</span>
                <p className="text-base font-bold text-white">12.4%</p>
              </div>
              <div className="p-3 rounded-lg bg-slate-950 border border-slate-800 text-xs">
                <span className="text-slate-400 font-mono">Memory</span>
                <p className="text-base font-bold text-white">4.2 GB</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // EXPERIMENT 3: USEINTERSECTIONOBSERVER LAB
    // ==========================================
    function Exp3IntersectionLab() {
      const targetRef = useRef(null);
      const [entry, setEntry] = useState(null);
      const [freeze, setFreeze] = useState(false);

      useEffect(() => {
        if (!targetRef.current || typeof IntersectionObserver === "undefined") return;

        const observer = new IntersectionObserver(([ent]) => {
          setEntry(ent);
          if (freeze && ent.isIntersecting) {
            observer.disconnect();
          }
        }, { threshold: [0, 0.5, 1.0] });

        observer.observe(targetRef.current);
        return () => observer.disconnect();
      }, [freeze]);

      const isVisible = entry?.isIntersecting || false;
      const ratio = entry ? Math.round(entry.intersectionRatio * 100) : 0;

      return (
        <div className="space-y-6">
          <div className="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h4 className="text-sm font-bold text-white">IntersectionObserver Viewport Target</h4>
              <p className="text-xs text-slate-400">Scroll the container below to trigger intersection threshold entries.</p>
            </div>
            <div className="flex items-center gap-3">
              <span className={`px-3 py-1 rounded-full text-xs font-bold border ${isVisible ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                {isVisible ? `VISIBLE (${ratio}%)` : 'OFF-SCREEN (0%)'}
              </span>
              <button
                onClick={() => setFreeze(prev => !prev)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${freeze ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}
              >
                freezeOnceVisible: {freeze ? "ON" : "OFF"}
              </button>
            </div>
          </div>

          <div className="h-64 overflow-y-auto rounded-2xl bg-slate-950 border border-slate-800 p-4 space-y-48 custom-scrollbar">
            <div className="p-4 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-400 text-center">
              ↓ Scroll down to bring target element into view ↓
            </div>

            <div
              ref={targetRef}
              className={`p-6 rounded-2xl border transition-all duration-300 text-center space-y-2 ${isVisible ? 'bg-indigo-950/40 border-indigo-500 shadow-lg shadow-indigo-500/20' : 'bg-slate-900 border-slate-800 opacity-40'}`}
            >
              <h5 className="text-sm font-bold text-white">Target Tracking Node</h5>
              <p className="text-xs font-mono text-indigo-300">Intersection Ratio: {ratio}% | isIntersecting: {String(isVisible)}</p>
            </div>

            <div className="p-4 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-400 text-center">
              End of scroll container
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // EXPERIMENT 4: USELOCALSTORAGE SYNCHRONIZATION LAB
    // ==========================================
    function Exp4LocalStorageLab() {
      const [themeA, setThemeA] = useState("dark");
      const [themeB, setThemeB] = useState("dark");

      const updateStorage = (val) => {
        setThemeA(val);
        setThemeB(val);
        try {
          localStorage.setItem("demo_theme", val);
        } catch (e) {
          console.warn(e);
        }
      };

      return (
        <div className="space-y-6">
          <div className="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 flex justify-between items-center">
            <div>
              <h4 className="text-sm font-bold text-white">Reactive LocalStorage Synchronization</h4>
              <p className="text-xs text-slate-400">Simulating two isolated components subscribing to the same storage key.</p>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => updateStorage("dark")}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${themeA === 'dark' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}`}
              >
                Dark Theme
              </button>
              <button
                onClick={() => updateStorage("cyberpunk-neon")}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${themeA === 'cyberpunk-neon' ? 'bg-pink-600 text-white' : 'bg-slate-800 text-slate-300'}`}
              >
                Neon Theme
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className={`p-6 rounded-2xl border transition-colors duration-300 space-y-3 ${themeA === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-pink-950/30 border-pink-500/50'}`}>
              <span className="text-xs font-bold uppercase tracking-wider text-slate-300">Widget Alpha (Sidebar)</span>
              <p className="text-sm font-mono text-white">Active Theme: <strong className="text-pink-400">{themeA}</strong></p>
            </div>

            <div className={`p-6 rounded-2xl border transition-colors duration-300 space-y-3 ${themeB === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-pink-950/30 border-pink-500/50'}`}>
              <span className="text-xs font-bold uppercase tracking-wider text-slate-300">Widget Beta (Navbar)</span>
              <p className="text-sm font-mono text-white">Active Theme: <strong className="text-pink-400">{themeB}</strong></p>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // EXPERIMENT 5: SENIOR BROWSER ARCHITECT EXAM
    // ==========================================
    const CERT_QUESTIONS = [
      {
        id: 1,
        question: "Why does window.removeEventListener('click', () => handler()) fail to remove the event listener?",
        options: [
          "Because click events cannot be removed in modern browsers.",
          "Because the arrow function creates a new memory address, failing JavaScript's pointer identity equality check.",
          "Because removeEventListener only accepts named function declarations.",
          "Because React reconciler blocks removeEventListener calls."
        ],
        correct: 1,
        rationale: "removeEventListener requires the exact same function reference that was passed to addEventListener."
      },
      {
        id: 2,
        question: "What is the purpose of the 'Latest Value Ref Bridge' pattern in useEventListener?",
        options: [
          "To force React to re-render 60 times per second.",
          "To keep the listener registration stable in useEffect while always executing with fresh closure state.",
          "To bypass all browser security policies.",
          "To enable Server-Side Rendering on Node.js."
        ],
        correct: 1,
        rationale: "The ref bridge decouples the registration lifecycle from handler closure changes, preventing constant re-attachment churn."
      },
      {
        id: 3,
        question: "Why is accessing localStorage directly during synchronous component rendering unsafe in Next.js / Remix?",
        options: [
          "Because localStorage is deprecated.",
          "Because SSR runs on Node.js servers where localStorage is undefined, triggering fatal ReferenceErrors.",
          "Because localStorage requires a payment gateway.",
          "Because React 18 disables all browser storage."
        ],
        correct: 1,
        rationale: "Server runtimes lack browser globals. Direct access during render crashes the server; it must be isolated in useEffect."
      },
      {
        id: 4,
        question: "Does navigator.onLine === true guarantee that your backend API server is healthy and reachable?",
        options: [
          "Yes, the browser pings the server automatically.",
          "No, it only indicates a local network interface connection, not WAN reachability or backend health.",
          "Yes, if using HTTP/2.",
          "No, unless using WebSocket connections."
        ],
        correct: 1,
        rationale: "navigator.onLine is a platform signal indicating LAN/Wi-Fi connection, not end-to-end API reachability."
      },
      {
        id: 5,
        question: "Why are Callback Refs preferred over standard useRef for dynamic DOM nodes in IntersectionObserver hooks?",
        options: [
          "Because useRef does not notify React when a DOM element mounts or unmounts conditionally.",
          "Because Callback Refs use less RAM than useRef.",
          "Because Callback Refs work on the server.",
          "Because useRef is deprecated in React 18."
        ],
        correct: 0,
        rationale: "useRef mutations (.current = node) do not re-run useEffect. Callback refs invoke the hook immediately when DOM nodes attach/detach."
      }
    ];

    function Exp5CertExam() {
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const handleSelect = (qId, idx) => {
        if (submitted) return;
        setAnswers(prev => ({ ...prev, [qId]: idx }));
      };

      const score = Object.keys(answers).filter(qId => answers[qId] === CERT_QUESTIONS.find(q => q.id === parseInt(qId)).correct).length;

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between p-4 rounded-xl bg-slate-900/60 border border-slate-800">
            <div>
              <h3 className="text-sm font-bold text-white">Senior Browser Architect Exam</h3>
              <p className="text-xs text-slate-400">Validate your mastery of Observers, SSR Boundaries, and Event Lifecycles.</p>
            </div>
            {submitted && (
              <span className={`px-4 py-1.5 rounded-full text-xs font-bold ${score >= 4 ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'}`}>
                Score: {score} / {CERT_QUESTIONS.length} ({Math.round((score / CERT_QUESTIONS.length) * 100)}%)
              </span>
            )}
          </div>

          <div className="space-y-4">
            {CERT_QUESTIONS.map((q, idx) => {
              const selected = answers[q.id];
              const isCorrect = selected === q.correct;
              return (
                <div key={q.id} className="p-5 rounded-2xl bg-slate-900/50 border border-slate-800 space-y-3">
                  <div className="flex items-start gap-3">
                    <span className="w-6 h-6 rounded-full bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 text-xs font-bold flex items-center justify-center shrink-0">
                      {idx + 1}
                    </span>
                    <p className="text-sm font-semibold text-slate-200">{q.question}</p>
                  </div>

                  <div className="grid grid-cols-1 gap-2 pl-9">
                    {q.options.map((opt, optIdx) => {
                      let btnStyle = "bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700";
                      if (selected === optIdx) btnStyle = "bg-indigo-950/60 border-indigo-500 text-indigo-200";
                      if (submitted) {
                        if (optIdx === q.correct) btnStyle = "bg-emerald-950/60 border-emerald-500 text-emerald-200 font-semibold";
                        else if (selected === optIdx && !isCorrect) btnStyle = "bg-rose-950/60 border-rose-500 text-rose-200";
                      }
                      return (
                        <button
                          key={optIdx}
                          disabled={submitted}
                          onClick={() => handleSelect(q.id, optIdx)}
                          className={`w-full text-left p-3 rounded-lg border text-xs transition ${btnStyle}`}
                        >
                          {opt}
                        </button>
                      );
                    })}
                  </div>

                  {submitted && (
                    <div className="pl-9 pt-2">
                      <p className="text-xs text-slate-400 font-mono bg-slate-950 p-2.5 rounded border border-slate-800">
                        <span className="font-bold text-indigo-400">Architect Rationale:</span> {q.rationale}
                      </p>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <div className="flex justify-end gap-3 pt-2">
            {!submitted ? (
              <button
                disabled={Object.keys(answers).length < CERT_QUESTIONS.length}
                onClick={() => setSubmitted(true)}
                className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/20 transition"
              >
                Submit Certification Answers
              </button>
            ) : (
              <button
                onClick={() => { setSubmitted(false); setAnswers({}); }}
                className="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold transition"
              >
                Retake Exam
              </button>
            )}
          </div>
        </div>
      );
    }

      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
