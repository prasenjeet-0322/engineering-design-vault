  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useReducer, useCallback, useMemo, useRef, memo } = React;

    // =========================================================================
    // CORE HEADLESS ENGINE: useMenu HOOK
    // =========================================================================
    function useHeadlessMenu({ items = [], onSelect, wrap = true, defaultOpen = false }) {
      const [isOpen, setIsOpen] = useState(defaultOpen);
      const [activeId, setActiveId] = useState(null);
      const [selectedId, setSelectedId] = useState(null);
      
      const triggerRef = useRef(null);
      const menuRef = useRef(null);
      const itemRefs = useRef(new Map());

      const enabledItems = useMemo(() => items.filter(i => !i.disabled), [items]);

      const open = useCallback(() => {
        setIsOpen(true);
        if (enabledItems.length > 0) {
          setActiveId(enabledItems[0].id);
        }
      }, [enabledItems]);

      const close = useCallback(() => {
        setIsOpen(false);
        setActiveId(null);
        triggerRef.current?.focus();
      }, []);

      const toggle = useCallback(() => {
        setIsOpen(prev => {
          if (!prev && enabledItems.length > 0) {
            setActiveId(enabledItems[0].id);
          }
          return !prev;
        });
      }, [enabledItems]);

      const select = useCallback((id) => {
        const item = items.find(i => i.id === id);
        if (!item || item.disabled) return;
        setSelectedId(id);
        onSelect?.(item);
        close();
      }, [items, onSelect, close]);

      const moveNext = useCallback(() => {
        if (!enabledItems.length) return;
        const currentIndex = enabledItems.findIndex(i => i.id === activeId);
        let nextIndex;
        if (currentIndex === -1 || currentIndex === enabledItems.length - 1) {
          nextIndex = wrap ? 0 : enabledItems.length - 1;
        } else {
          nextIndex = currentIndex + 1;
        }
        const nextId = enabledItems[nextIndex]?.id;
        setActiveId(nextId);
        itemRefs.current.get(nextId)?.focus();
      }, [enabledItems, activeId, wrap]);

      const movePrevious = useCallback(() => {
        if (!enabledItems.length) return;
        const currentIndex = enabledItems.findIndex(i => i.id === activeId);
        let prevIndex;
        if (currentIndex <= 0) {
          prevIndex = wrap ? enabledItems.length - 1 : 0;
        } else {
          prevIndex = currentIndex - 1;
        }
        const prevId = enabledItems[prevIndex]?.id;
        setActiveId(prevId);
        itemRefs.current.get(prevId)?.focus();
      }, [enabledItems, activeId, wrap]);

      const moveFirst = useCallback(() => {
        if (!enabledItems.length) return;
        const firstId = enabledItems[0].id;
        setActiveId(firstId);
        itemRefs.current.get(firstId)?.focus();
      }, [enabledItems]);

      const moveLast = useCallback(() => {
        if (!enabledItems.length) return;
        const lastId = enabledItems[enabledItems.length - 1].id;
        setActiveId(lastId);
        itemRefs.current.get(lastId)?.focus();
      }, [enabledItems]);

      // Prop Getters
      const getTriggerProps = useCallback((userProps = {}) => ({
        ref: triggerRef,
        "aria-haspopup": "menu",
        "aria-expanded": isOpen,
        onClick: (e) => {
          userProps.onClick?.(e);
          toggle();
        },
        onKeyDown: (e) => {
          userProps.onKeyDown?.(e);
          if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            open();
          }
        },
        ...userProps,
      }), [isOpen, toggle, open]);

      const getMenuProps = useCallback((userProps = {}) => ({
        ref: menuRef,
        role: "menu",
        tabIndex: -1,
        onKeyDown: (e) => {
          userProps.onKeyDown?.(e);
          if (e.key === "ArrowDown") {
            e.preventDefault();
            moveNext();
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            movePrevious();
          } else if (e.key === "Home") {
            e.preventDefault();
            moveFirst();
          } else if (e.key === "End") {
            e.preventDefault();
            moveLast();
          } else if (e.key === "Escape") {
            e.preventDefault();
            close();
          } else if (e.key === "Tab") {
            close();
          }
        },
        ...userProps,
      }), [moveNext, movePrevious, moveFirst, moveLast, close]);

      const getItemProps = useCallback((item, userProps = {}) => {
        const isActive = activeId === item.id;
        const isSelected = selectedId === item.id;
        return {
          ref: (node) => {
            if (node) itemRefs.current.set(item.id, node);
            else itemRefs.current.delete(item.id);
          },
          role: "menuitem",
          tabIndex: isActive ? 0 : -1,
          "aria-disabled": item.disabled ? true : undefined,
          "aria-selected": isSelected,
          onClick: (e) => {
            userProps.onClick?.(e);
            if (!item.disabled) select(item.id);
          },
          onMouseEnter: () => {
            if (!item.disabled) setActiveId(item.id);
          },
          onKeyDown: (e) => {
            userProps.onKeyDown?.(e);
            if ((e.key === "Enter" || e.key === " ") && !item.disabled) {
              e.preventDefault();
              select(item.id);
            }
          },
          ...userProps,
        };
      }, [activeId, selectedId, select]);

      // Multi-boundary Click Outside
      useEffect(() => {
        if (!isOpen) return;
        const handlePointerDown = (e) => {
          const target = e.target;
          if (!target || !(target instanceof Node)) return;
          const isInsideTrigger = triggerRef.current?.contains(target);
          const isInsideMenu = menuRef.current?.contains(target);
          if (!isInsideTrigger && !isInsideMenu) {
            close();
          }
        };
        document.addEventListener("pointerdown", handlePointerDown);
        return () => document.removeEventListener("pointerdown", handlePointerDown);
      }, [isOpen, close]);

      return {
        isOpen,
        activeId,
        selectedId,
        open,
        close,
        toggle,
        select,
        moveNext,
        movePrevious,
        getTriggerProps,
        getMenuProps,
        getItemProps,
        triggerRef,
        menuRef,
      };
    }

    // =========================================================================
    // EXPERIMENT 1: ROVING TABINDEX & THE 5 INTERACTION IDENTITIES
    // =========================================================================
    function Experiment1RovingTabindex() {
      const [items, setItems] = useState([
        { id: "opt-1", label: "Create Pull Request", icon: "🔀", disabled: false },
        { id: "opt-2", label: "Merge commit (Blocked)", icon: "🔒", disabled: true },
        { id: "opt-3", label: "Squash and merge", icon: "📦", disabled: false },
        { id: "opt-4", label: "Rebase and merge", icon: "⚡", disabled: false },
        { id: "opt-5", label: "Close with comment", icon: "💬", disabled: false },
      ]);
      const [wrap, setWrap] = useState(true);
      const [lastSelected, setLastSelected] = useState(null);

      const menu = useHeadlessMenu({
        items,
        wrap,
        onSelect: (item) => setLastSelected(item),
      });

      const toggleDisabled = (id) => {
        setItems(prev => prev.map(i => i.id === id ? { ...i, disabled: !i.disabled } : i));

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>

              <h2 className="text-xl font-bold text-slate-100 mt-1">Roving tabIndex & 5 Interaction Dimensions</h2>
              <p className="text-xs text-slate-400 mt-1">Observe real-time roving tabIndex, active highlight vs physical focus vs committed selection.</p>
            </div>
            <div className="flex items-center gap-3">
              <label className="flex items-center gap-2 text-xs font-mono text-slate-300 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 cursor-pointer">
                <input type="checkbox" checked={wrap} onChange={e => setWrap(e.target.checked)} className="rounded text-indigo-600 focus:ring-0" />
                <span>Wrap-Around Navigation</span>
              </label>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Left Column: Interactive Headless Menu */}
            <div className="lg:col-span-5 space-y-4">
              <div className="p-4 bg-slate-950/60 border border-slate-800/80 rounded-lg">
                <label className="text-xs font-mono text-slate-400 block mb-3">CONSUMER VIEW (Interactive Dropdown):</label>
                
                <div className="relative inline-block w-full">
                  <button
                    {...menu.getTriggerProps()}
                    className="w-full flex items-center justify-between px-4 py-2.5 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-medium text-sm rounded-lg shadow-lg shadow-indigo-500/20 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all"
                  >
                    <span className="flex items-center gap-2">
                      <span>⚡</span>
                      <span>{lastSelected ? lastSelected.label : "Select Git Action"}</span>
                    </span>
                    <span className={`transform transition-transform text-xs ${menu.isOpen ? 'rotate-180' : ''}`}>▼</span>
                  </button>

                  {menu.isOpen && (
                    <ul
                      {...menu.getMenuProps()}
                      className="absolute left-0 mt-2 w-full bg-slate-900/95 backdrop-blur-md border border-slate-700 rounded-lg shadow-2xl py-1.5 z-50 focus:outline-none custom-scrollbar"
                    >
                      {items.map((item) => {
                        const itemProps = menu.getItemProps(item);
                        const isActive = menu.activeId === item.id;
                        const isSelected = menu.selectedId === item.id;
                        
                        return (
                          <li
                            key={item.id}
                            {...itemProps}
                            className={`flex items-center justify-between px-3.5 py-2 text-xs cursor-pointer transition-colors ${
                              item.disabled
                                ? 'text-slate-600 bg-slate-950/30 cursor-not-allowed opacity-50'
                                : isActive
                                ? 'bg-indigo-600 text-white font-semibold'
                                : 'text-slate-300 hover:bg-slate-800'
                            }`}
                          >
                            <span className="flex items-center gap-2">
                              <span>{item.icon}</span>
                              <span>{item.label}</span>
                            </span>
                            <div className="flex items-center gap-1.5 font-mono text-[10px]">
                              {item.disabled && <span className="bg-red-950/80 text-red-400 px-1 py-0.5 rounded border border-red-800/40">DISABLED</span>}
                              {isSelected && <span className="text-emerald-400">✓ SELECTED</span>}
                              <span className="bg-slate-800/80 px-1 py-0.5 rounded text-slate-400">tabIndex={itemProps.tabIndex}</span>
                            </div>
                          </li>
                        );
                      })}
                    </ul>
                  )}
                </div>

                <div className="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between text-[11px] font-mono text-slate-400">
                  <span>Keyboard Navigation:</span>
                  <span className="text-indigo-400">↑ ↓ Home End Enter Esc</span>
                </div>
              </div>

              {/* Item Toggles */}
              <div className="p-3 bg-slate-950/40 border border-slate-800/60 rounded-lg space-y-2">
                <span className="text-[11px] font-mono text-slate-400 uppercase tracking-wider block">Toggle Item Disabled Status:</span>
                <div className="grid grid-cols-2 gap-2">
                  {items.map(item => (
                    <button
                      key={item.id}
                      onClick={() => toggleDisabled(item.id)}
                      className={`px-2 py-1 text-[11px] rounded font-mono border transition-all text-left truncate ${
                        item.disabled
                          ? 'bg-red-950/40 border-red-800/50 text-red-300'
                          : 'bg-slate-800/40 border-slate-700/50 text-slate-300'
                      }`}
                    >
                      {item.disabled ? '🔴' : '🟢'} {item.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* Right Column: Live Hook State Telemetry */}
            <div className="lg:col-span-7 bg-slate-950 border border-slate-800 rounded-lg p-4 font-mono text-xs space-y-4">
              <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                <span className="text-indigo-400 font-bold">HOOK INTERNAL STATE & ARIA CONTRACTS</span>
                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${menu.isOpen ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-slate-800 text-slate-400'}`}>
                  {menu.isOpen ? 'OPEN' : 'CLOSED'}
                </span>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div className="p-2.5 bg-slate-900 border border-slate-800 rounded">
                  <span className="text-[10px] text-slate-500 block">activeId (Arrow Key):</span>
                  <span className="text-amber-400 font-bold">{menu.activeId || "null"}</span>
                </div>
                <div className="p-2.5 bg-slate-900 border border-slate-800 rounded">
                  <span className="text-[10px] text-slate-500 block">selectedId (Commit):</span>
                  <span className="text-emerald-400 font-bold">{menu.selectedId || "null"}</span>
                </div>
                <div className="p-2.5 bg-slate-900 border border-slate-800 rounded">
                  <span className="text-[10px] text-slate-500 block">aria-expanded:</span>
                  <span className="text-indigo-400 font-bold">{String(menu.isOpen)}</span>
                </div>
                <div className="p-2.5 bg-slate-900 border border-slate-800 rounded">
                  <span className="text-[10px] text-slate-500 block">Enabled Count:</span>
                  <span className="text-cyan-400 font-bold">{items.filter(i => !i.disabled).length} / {items.length}</span>
                </div>
              </div>

              <div>
                <span className="text-[11px] text-slate-400 block mb-1">Roving tabIndex Roster:</span>
                <table className="w-full text-[11px] border border-slate-800 rounded overflow-hidden">
                  <thead className="bg-slate-900 text-slate-400">
                    <tr>
                      <th className="p-1.5 text-left">Item ID</th>
                      <th className="p-1.5 text-left">Label</th>
                      <th className="p-1.5 text-left">tabIndex</th>
                      <th className="p-1.5 text-left">ARIA State</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {items.map(i => {
                      const isActive = menu.activeId === i.id;
                      const isSelected = menu.selectedId === i.id;
                      return (
                        <tr key={i.id} className={isActive ? 'bg-indigo-950/40 text-indigo-200' : ''}>
                          <td className="p-1.5 text-slate-400">{i.id}</td>
                          <td className="p-1.5">{i.label}</td>
                          <td className="p-1.5">
                            <span className={`px-1.5 py-0.5 rounded font-bold ${isActive ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-500'}`}>
                              {isActive ? '0 (Focusable)' : '-1'}
                            </span>
                          </td>
                          <td className="p-1.5 text-[10px] space-x-1">
                            {i.disabled && <span className="text-red-400">aria-disabled="true"</span>}
                            {isSelected && <span className="text-emerald-400">aria-selected="true"</span>}
                            {!i.disabled && !isSelected && <span className="text-slate-600">none</span>}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 2: MULTI-BOUNDARY PORTAL CLICK-OUTSIDE
    // =========================================================================
    function Experiment2PortalClickOutside() {
      const [isOpen, setIsOpen] = useState(false);
      const [usePortal, setUsePortal] = useState(true);
      const [mode, setMode] = useState("multi"); // "naive" vs "multi"
      const [logs, setLogs] = useState([]);

      const triggerRef = useRef(null);
      const menuRef = useRef(null);

      const addLog = (msg, type = "info") => {
        setLogs(prev => [`[${new Date().toLocaleTimeString()}] [${type.toUpperCase()}] ${msg}`, ...prev.slice(0, 7)]);
      };

      useEffect(() => {
        if (!isOpen) return;

        const handlePointerDown = (e) => {
          const target = e.target;
          if (!target || !(target instanceof Node)) return;

          if (mode === "naive") {
            // ❌ NAIVE SINGLE REF CHECK: Only checks menuRef!
            // Clicking the trigger will be classified as "outside" the menu, immediately firing close,
            // while the trigger's own onClick fires toggle -> leading to glitchy bounce!
            if (menuRef.current && !menuRef.current.contains(target)) {
              addLog(`Naive check: target is outside menuRef ──► Closing menu`, "error");
              setIsOpen(false);
            } else {
              addLog(`Pointer click inside menuRef`, "success");
            }
          } else {
            // ✅ SENIOR MULTI-BOUNDARY CHECK: Checks both trigger AND menu
            const isInsideTrigger = triggerRef.current?.contains(target);
            const isInsideMenu = menuRef.current?.contains(target);

            if (!isInsideTrigger && !isInsideMenu) {
              addLog(`Multi-boundary check: Click is outside [trigger, menu] ──► Graceful close`, "warn");
              setIsOpen(false);
            } else {
              addLog(`Click is within owned boundary set (${isInsideTrigger ? 'Trigger' : 'Menu'})`, "success");
            }
          }
        };

        document.addEventListener("pointerdown", handlePointerDown);
        return () => document.removeEventListener("pointerdown", handlePointerDown);
      }, [isOpen, mode]);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50">Lab 02</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Multi-Boundary React Portal Click-Outside</h2>
              <p className="text-xs text-slate-400 mt-1">Discover why naive DOM ancestry checks fail when overlays mount in separate React Portals.</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setMode(mode === "naive" ? "multi" : "naive")}
                className={`px-3 py-1.5 text-xs font-mono rounded-lg border transition-all ${
                  mode === "multi"
                    ? 'bg-emerald-950/60 border-emerald-700 text-emerald-300'
                    : 'bg-red-950/60 border-red-700 text-red-300'
                }`}
              >
                Algorithm: {mode === "multi" ? "✅ Multi-Boundary [Trigger + Menu]" : "❌ Naive Single Ref (Buggy)"}
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-5 space-y-4">
              <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg relative">
                <span className="text-xs font-mono text-slate-400 block mb-3">REACT TREE ROOT (#root):</span>
                
                <button
                  ref={triggerRef}
                  onClick={() => setIsOpen(p => !p)}
                  className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-lg shadow-lg shadow-emerald-600/20 focus:ring-2 focus:ring-emerald-400 transition-all"
                >
                  {isOpen ? "Close Portal Dropdown" : "Open Portal Dropdown"}
                </button>

                <div className="mt-4 text-[11px] font-mono text-slate-500">
                  Trigger DOM node: <code className="text-slate-300">&lt;button ref=triggerRef&gt;</code>
                </div>
              </div>

              {/* Simulated Portal Container in separate DOM Branch */}
              <div className="p-4 bg-slate-950/80 border-2 border-dashed border-indigo-800/60 rounded-lg relative">
                <span className="text-xs font-mono text-indigo-400 block mb-2">SEPARATE DOM BRANCH (#portal-root):</span>
                
                {isOpen ? (
                  <div
                    ref={menuRef}
                    className="p-3 bg-slate-900 border border-indigo-600 rounded-lg shadow-2xl space-y-2 text-xs"
                  >
                    <div className="flex items-center justify-between text-indigo-300 font-bold border-b border-slate-800 pb-1">
                      <span>Portal Overlay Panel</span>
                      <span className="text-[10px] bg-indigo-950 px-1.5 py-0.5 rounded text-indigo-400">PORTAL ACTIVE</span>
                    </div>
                    <p className="text-[11px] text-slate-400">Click inside this box or click outside on the background to test boundaries.</p>
                    <div className="grid grid-cols-2 gap-1 pt-1">
                      <button className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-[11px]">Action 1</button>
                      <button className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-[11px]">Action 2</button>
                    </div>
                  </div>
                ) : (
                  <div className="p-4 text-center text-xs font-mono text-slate-600">
                    (Portal overlay unmounted)
                  </div>
                )}
              </div>
            </div>

            {/* Right: Live Event Dispatch Console */}
            <div className="lg:col-span-7 bg-slate-950 border border-slate-800 rounded-lg p-4 font-mono text-xs flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between border-b border-slate-800 pb-2 mb-3">
                  <span className="text-emerald-400 font-bold">INTERACTION BOUNDARY EVENT TRACER</span>
                  <button onClick={() => setLogs([])} className="text-[10px] text-slate-500 hover:text-slate-300">Clear Logs</button>
                </div>

                <div className="space-y-1.5">
                  {logs.length === 0 ? (
                    <div className="text-slate-600 italic py-6 text-center">Click trigger or background to generate boundary events...</div>
                  ) : (
                    logs.map((log, idx) => (
                      <div key={idx} className={`p-1.5 rounded text-[11px] ${

    const OverlayStackContext = createContext(null);

    function OverlayStackProvider({ children }) {
      const stackRef = useRef([]);

      const register = useCallback((id, dismissFn) => {
        stackRef.current.push({ id, dismissFn });
      }, []);

      const unregister = useCallback((id) => {
        stackRef.current = stackRef.current.filter(item => item.id !== id);
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "Escape" && stackRef.current.length > 0) {
            e.preventDefault();
            // Pop the TOPMOST overlay only!
            const topmost = stackRef.current[stackRef.current.length - 1];
            topmost.dismissFn();
          }
        };
        document.addEventListener("keydown", handleKeyDown);
        return () => document.removeEventListener("keydown", handleKeyDown);
      }, []);

      return (
        <OverlayStackContext.Provider value={{ register, unregister, stack: stackRef.current }}>
          {children}
        </OverlayStackContext.Provider>
      );
    }

    function useOverlayDismiss(id, onDismiss, isOpen) {
      const stackCtx = useContext(OverlayStackContext);
      useEffect(() => {
        if (!isOpen) return;
        stackCtx?.register(id, onDismiss);
        return () => stackCtx?.unregister(id);
      }, [isOpen, id, onDismiss, stackCtx]);
    }

    // =========================================================================
    // EXPERIMENT 5: SENIOR ARCHITECTURE CERTIFICATION EXAM
    // =========================================================================
    function Experiment5SeniorExam() {
      const questions = [
        {
          id: 1,
          q: "Why should active navigation item and committed selected item be separate state dimensions in a listbox hook?",
          options: [
            "To save memory in React fiber nodes",
            "Because keyboard Arrow navigation highlights candidate options without committing domain selection until Enter is pressed",
            "Because React StrictMode requires at least two state hooks",
            "To make CSS transition animations faster"
          ],
          correct: 1,
          explanation: "In standard accessibility patterns (WAI-ARIA), active item represents current keyboard target/highlight, while selected represents the committed application value. Collapsing them forces premature domain updates on every arrow key press."
        },
        {
          id: 2,
          q: "Why does naive click-outside detection fails when an overlay is rendered inside a React Portal?",
          options: [
            "Because Portals disable browser event bubbling",
            "Because the trigger and portal overlay exist in separate DOM subtrees, so menuRef.contains(target) falsely classifies trigger clicks as outside clicks",
            "Because portals convert pointerdown events to touchstart",
            "Because useEffect cleanup runs before portal mounts"
          ],
          correct: 1,
          explanation: "In portals, the menu is mounted under a separate DOM node (e.g. document.body). Clicking the trigger is outside menuRef.current, causing the menu to close and immediately toggle back open."
        },
        {
          id: 3,
          q: "When should roving tabIndex be chosen over aria-activedescendant?",
          options: [
            "Always, roving tabIndex is superior in every widget",
            "When building standalone toolbars, menus, or radio groups where individual DOM focus is desirable and typing input is not required",
            "When building searchable comboboxes or typeaheads",
            "Only when JavaScript is disabled in the browser"
          ],
          correct: 1,
          explanation: "Roving tabIndex moves physical DOM focus to each item. For comboboxes, moving focus away from the input breaks typing, making aria-activedescendant mandatory."
        }
      ];

      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const score = Object.keys(answers).reduce((acc, qId) => {
        const q = questions.find(item => item.id === Number(qId));
        return q && answers[qId] === q.correct ? acc + 1 : acc;
      }, 0);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-fuchsia-400 bg-fuchsia-950/60 px-2 py-0.5 rounded border border-fuchsia-800/50">Lab 05</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Senior Headless UI Architecture Exam</h2>
              <p className="text-xs text-slate-400 mt-1">Validate your architectural mastery of interaction coordination, WAI-ARIA, and overlay stacks.</p>
            </div>
            {submitted && (
              <div className="text-right">
                <span className="text-2xl font-black font-mono text-fuchsia-400">{score} / {questions.length}</span>
                <span className="text-xs text-slate-400 block">{score === questions.length ? "🎖️ Senior Architect Certified!" : "Review explanations below"}</span>
              </div>
            )}
          </div>

          <div className="space-y-6">
            {questions.map(q => (
              <div key={q.id} className="p-4 bg-slate-950 border border-slate-800/80 rounded-lg space-y-3">
                <h3 className="text-sm font-semibold text-slate-200">
                  <span className="text-fuchsia-400 font-mono mr-2">Q{q.id}.</span>
                  {q.q}
                </h3>

                <div className="space-y-2">
                  {q.options.map((opt, optIdx) => {
                    const isSelected = answers[q.id] === optIdx;
                    const isCorrect = q.correct === optIdx;
                    let borderClass = 'border-slate-800 hover:border-slate-700 bg-slate-900/60';
                    if (submitted) {
                      if (isCorrect) borderClass = 'border-emerald-500 bg-emerald-950/40 text-emerald-200';
                      else if (isSelected && !isCorrect) borderClass = 'border-red-500 bg-red-950/40 text-red-200';
                    } else if (isSelected) {
                      borderClass = 'border-fuchsia-500 bg-fuchsia-950/40 text-fuchsia-200';
                    }

                    return (
                      <button
                        key={optIdx}
                        disabled={submitted}
                        onClick={() => setAnswers(prev => ({ ...prev, [q.id]: optIdx }))}
                        className={`w-full text-left p-2.5 rounded-lg text-xs font-mono border transition-all flex items-center justify-between ${borderClass}`}
                      >
                        <span>{opt}</span>
                        {submitted && isCorrect && <span className="text-emerald-400 font-bold">✓ CORRECT</span>}
                        {submitted && isSelected && !isCorrect && <span className="text-red-400 font-bold">✗ INCORRECT</span>}
                      </button>
                    );
                  })}
                </div>

                {submitted && (
                  <div className="p-3 bg-slate-900/90 border border-slate-800 rounded text-[11px] text-slate-300">
                    <span className="font-bold text-fuchsia-400 block mb-1">Architectural Analysis:</span>
                    {q.explanation}
                  </div>
                )}
              </div>
            ))}

            <div className="flex justify-end gap-3 pt-2">
              {submitted ? (
                <button
                  onClick={() => { setAnswers({}); setSubmitted(false); }}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-mono rounded-lg"
                >
                  Reset Exam
                </button>
              ) : (
                <button
                  onClick={() => setSubmitted(true)}
                  disabled={Object.keys(answers).length < questions.length}
                  className="px-6 py-2 bg-fuchsia-600 hover:bg-fuchsia-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-xs font-bold font-mono rounded-lg shadow-lg shadow-fuchsia-600/30"
                >
                  Submit & Evaluate
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }
