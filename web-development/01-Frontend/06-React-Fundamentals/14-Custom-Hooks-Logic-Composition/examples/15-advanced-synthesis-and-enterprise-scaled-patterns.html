<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI 12 — Part 15: Advanced Synthesis & Enterprise Scaled Patterns Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
    }
    pre, code {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #111827;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }

</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useReducer, useCallback, useMemo, useRef, memo, useSyncExternalStore } = React;

    // =========================================================================
    // EXPERIMENT 1: THE MIGRATION FIREWALL SIMULATOR
    // =========================================================================
    // External Store Engine for Phase 3
    class UserStore {
      constructor() {
        this.state = { name: "Alice Enterprise", role: "Principal Architect", level: "L7" };
        this.listeners = new Set();
      }
      getState = () => this.state;
      updateRole = (newRole) => {
        this.state = { ...this.state, role: newRole };
        this.listeners.forEach(l => l());
      };
      subscribe = (listener) => {
        this.listeners.add(listener);
        return () => this.listeners.delete(listener);
      };
    }
    const globalUserStore = new UserStore();

    function Exp1MigrationFirewall() {
      const [phase, setPhase] = useState(1);
      const [roleInput, setRoleInput] = useState("");

      // --- PHASE 1: Local State Hook ---
      const [p1State, setP1State] = useState({ name: "Alice Enterprise", role: "Frontend Lead", level: "L5" });

      // --- PHASE 2: Reducer State Hook ---
      const [p2State, p2Dispatch] = useReducer((state, action) => {
        if (action.type === "UPDATE_ROLE") return { ...state, role: action.payload };
        return state;
      }, { name: "Alice Enterprise", role: "Staff Engineer", level: "L6" });

      // --- PHASE 3: useSyncExternalStore Hook ---
      const p3State = useSyncExternalStore(globalUserStore.subscribe, globalUserStore.getState);

      // --- THE HOOK MIGRATION FIREWALL ---
      // Regardless of phase, the return contract remains: { user, updateRole, engineName }
      const useUserProfile = () => {
        if (phase === 1) {
          return {
            user: p1State,
            updateRole: (r) => setP1State(p => ({ ...p, role: r })),
            engineName: "Phase 1: Local useState + Mock Async",
          };
        }
        if (phase === 2) {
          return {
            user: p2State,
            updateRole: (r) => p2Dispatch({ type: "UPDATE_ROLE", payload: r }),
            engineName: "Phase 2: Context + useReducer",
          };
        }
        if (phase === 3) {
          return {
            user: p3State,
            updateRole: (r) => globalUserStore.updateRole(r),
            engineName: "Phase 3: useSyncExternalStore (Subscribed Pub/Sub)",
          };
        }
        // Phase 4: Simulated Background Worker
        return {
          user: { name: "Alice Enterprise", role: "Fellow / VP Architecture", level: "L8 (Worker Thread)" },
          updateRole: (r) => alert(`Worker postMessage: Dispatched role update '${r}' to background thread`),
          engineName: "Phase 4: Multi-Threaded Web Worker Adapter",
        };
      };

      // Consumer Component (Notice JSX has ZERO knowledge of which phase runs underneath!)
      const { user, updateRole, engineName } = useUserProfile();

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/50">Pattern 01</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">The Hook Migration Firewall</h2>
              <p className="text-xs text-slate-400 mt-1">Evolve the internal data engine across 4 enterprise phases while preserving 100% of the public consumer contract.</p>
            </div>
          </div>

          {/* Phase Selector Bar */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
            {[1, 2, 3, 4].map(p => (
              <button
                key={p}
                onClick={() => setPhase(p)}
                className={`p-2.5 text-xs font-mono font-bold rounded-lg border text-left transition-all ${
                  phase === p
                    ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg shadow-indigo-600/30'
                    : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-slate-200'
                }`}
              >
                <div>Phase 0{p}</div>
                <div className="text-[10px] font-normal truncate opacity-80">
                  {p === 1 && "Local useState"}
                  {p === 2 && "useReducer FSM"}
                  {p === 3 && "useSyncExternalStore"}
                  {p === 4 && "Web Worker Adapter"}
                </div>
              </button>
            ))}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            {/* Consumer Component Card */}
            <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg space-y-4">
              <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                <span className="text-indigo-400 font-bold">DOWNSTREAM CONSUMER JSX:</span>
                <span className="text-[10px] bg-indigo-950 text-indigo-300 px-2 py-0.5 rounded border border-indigo-800/60">
                  Zero Code Changes
                </span>
              </div>

              <div className="space-y-2 text-slate-300">
                <div className="p-2.5 bg-slate-900 rounded border border-slate-800 flex justify-between">
                  <span className="text-slate-500">Employee:</span>
                  <span className="font-bold text-slate-100">{user.name}</span>
                </div>
                <div className="p-2.5 bg-slate-900 rounded border border-slate-800 flex justify-between">
                  <span className="text-slate-500">Current Role:</span>
                  <span className="font-bold text-emerald-400">{user.role}</span>
                </div>
                <div className="p-2.5 bg-slate-900 rounded border border-slate-800 flex justify-between">
                  <span className="text-slate-500">Org Level:</span>
                  <span className="font-bold text-cyan-400">{user.level}</span>
                </div>
              </div>

              <div className="pt-2 flex gap-2">
                <input
                  type="text"
                  placeholder="Enter new role title..."
                  value={roleInput}
                  onChange={e => setRoleInput(e.target.value)}
                  className="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-700 rounded text-slate-200 focus:outline-none focus:border-indigo-500"
                />
                <button
                  onClick={() => { if (roleInput) { updateRole(roleInput); setRoleInput(""); } }}
                  className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded"
                >
                  Update
                </button>
              </div>
            </div>

            {/* Internal Engine Telemetry */}
            <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg flex flex-col justify-between space-y-4">
              <div className="space-y-3">
                <span className="text-emerald-400 font-bold block border-b border-slate-800 pb-2">
                  INTERNAL ADAPTER UNDER THE HOOD
                </span>
                <div className="p-3 bg-slate-900 rounded border border-slate-800 text-[11px] text-slate-300 space-y-2">
                  <div className="font-bold text-indigo-300">Active Engine: {engineName}</div>
                  <p className="text-slate-400 leading-relaxed">
                    The consumer component simply imports <code className="text-slate-200">useUserProfile()</code>. The entire infrastructure changed from a simple component-local state to a multi-threaded web worker without altering a single prop in the UI tree.
                  </p>
                </div>
              </div>

              <div className="p-2.5 bg-slate-900/60 border border-slate-800 rounded text-[11px] text-slate-500">
                💡 Enterprise Principle: Public API stability is the highest architectural priority.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 2: COMPOSED MULTI-HOOK PIPELINE (RICH EDITOR)
    // =========================================================================
    function Exp2ComposedPipeline() {
      // Sub-hook 1: Buffer State
      const [buffer, setBuffer] = useState("Enterprise custom hooks compose focused sub-hooks into coherent domain pipelines.");
      
      // Sub-hook 2: Selection / Cursor
      const [selection, setSelection] = useState({ start: 0, end: 0 });

      // Sub-hook 3: History Stack (Undo/Redo)
      const [history, setHistory] = useState([buffer]);
      const [historyIndex, setHistoryIndex] = useState(0);

      const updateBuffer = (newText) => {
        setBuffer(newText);
        setHistory(prev => [...prev.slice(0, historyIndex + 1), newText]);
        setHistoryIndex(prev => prev + 1);
      };

      const undo = () => {
        if (historyIndex > 0) {
          setHistoryIndex(p => p - 1);
          setBuffer(history[historyIndex - 1]);
        }
      };

      const redo = () => {
        if (historyIndex < history.length - 1) {
          setHistoryIndex(p => p + 1);
          setBuffer(history[historyIndex + 1]);
        }
      };

      // Sub-hook 4: Word Count Analytics
      const stats = useMemo(() => {
        const words = buffer.trim().split(/\s+/).filter(Boolean).length;
        const chars = buffer.length;
        return { words, chars };
      }, [buffer]);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="border-b border-slate-800 pb-4">
            <span className="text-xs font-mono uppercase tracking-widest text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50">Pattern 02</span>
            <h2 className="text-xl font-bold text-slate-100 mt-1">Composed Multi-Hook Pipeline: The Rich Editor</h2>
            <p className="text-xs text-slate-400 mt-1">Four independent sub-hooks composed into a cohesive `useEditor()` orchestration pipeline.</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 font-mono text-xs">
            {/* Editor Surface */}
            <div className="lg:col-span-7 space-y-3">
              <div className="flex items-center justify-between">
                <span className="text-slate-400 font-bold">EDITOR BUFFER:</span>
                <div className="flex gap-2">
                  <button
                    onClick={undo}
                    disabled={historyIndex === 0}
                    className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-200 rounded"
                  >
                    ↶ Undo
                  </button>
                  <button
                    onClick={redo}
                    disabled={historyIndex >= history.length - 1}
                    className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-200 rounded"
                  >
                    ↷ Redo
                  </button>
                </div>
              </div>

              <textarea
                value={buffer}
                onChange={e => updateBuffer(e.target.value)}
                onSelect={e => setSelection({ start: e.target.selectionStart, end: e.target.selectionEnd })}
                rows={5}
                className="w-full p-3 bg-slate-950 border border-slate-800 rounded-lg text-slate-200 focus:outline-none focus:border-emerald-500 font-sans text-sm"
              />

              <div className="flex justify-between text-[11px] text-slate-500 pt-1">
                <span>Cursor Position: [{selection.start} - {selection.end}]</span>
                <span>History Stack: {historyIndex + 1} / {history.length} snapshots</span>
              </div>
            </div>

            {/* Sub-hook Pipeline Topology */}
            <div className="lg:col-span-5 bg-slate-950 border border-slate-800 rounded-lg p-4 space-y-3">
              <span className="text-emerald-400 font-bold block border-b border-slate-800 pb-2">
                FIBER PIPELINE COMPOSITION ROSTER
              </span>

              <div className="space-y-2">
                <div className="p-2 bg-slate-900 rounded border border-slate-800 flex justify-between">
                  <span className="text-indigo-300">1. useBufferState()</span>
                  <span className="text-slate-400">{stats.chars} chars</span>
                </div>
                <div className="p-2 bg-slate-900 rounded border border-slate-800 flex justify-between">
                  <span className="text-cyan-300">2. useSelection()</span>
                  <span className="text-slate-400">len: {selection.end - selection.start}</span>
                </div>
                <div className="p-2 bg-slate-900 rounded border border-slate-800 flex justify-between">
                  <span className="text-amber-300">3. useHistoryStack()</span>
                  <span className="text-slate-400">{history.length} frames</span>
                </div>
                <div className="p-2 bg-slate-900 rounded border border-slate-800 flex justify-between">
                  <span className="text-emerald-300">4. useAnalyticsWorker()</span>
                  <span className="text-emerald-400 font-bold">{stats.words} words</span>
                </div>
              </div>

              <div className="text-[11px] text-slate-500 pt-2 border-t border-slate-800">
                All 4 hooks contribute to a single caller Fiber linked list.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 3: SENIOR CERTIFICATION EXAM
    // =========================================================================
    function Exp3SeniorExam() {
      const questions = [
        {
          id: 1,
          q: "What is the primary architectural purpose of a custom Hook Migration Firewall?",
          options: [
            "To encrypt network traffic inside WebSockets",
            "To provide a stable semantic API contract so that underlying data sources (Context, external stores, workers) can be migrated without modifying consuming components",
            "To prevent CSS style collisions in Tailwind",
            "To replace TypeScript with WebAssembly"
          ],
          correct: 1,
          explanation: "A migration firewall decouples components from data fetching mechanisms. The component depends only on the domain contract ({ data, status, mutate }), allowing backend or caching rewrites with zero JSX churn."
        },
        {
          id: 2,
          q: "Why is useSyncExternalStore preferred over useEffect + useState for subscribing to high-frequency stores?",
          options: [
            "Because useSyncExternalStore executes in parallel on all CPU cores",
            "Because useSyncExternalStore reads synchronously during render, eliminating tearing in Concurrent React and supporting fine-grained selectors",
            "Because useEffect was deprecated in React 18",
            "Because useState cannot store JavaScript objects"
          ],
          correct: 1,
          explanation: "useSyncExternalStore guarantees synchronous snapshot reads during render, preventing the visual tearing that occurs when asynchronous useEffect subscriptions lag behind rapid updates."
        },
        {
          id: 3,
          q: "What is the danger of storing mutable state inside a Hook Factory's outer closure?",
          options: [
            "It will throw a WebGL compilation error",
            "The mutable state will be shared across all component instances that use the generated Hook, destroying instance isolation and causing data leaks in SSR",
            "It disables React Developer Tools",
            "It forces all network requests to run synchronously"
          ],
          correct: 1,
          explanation: "Factory closures execute at module evaluation time. Variables in that closure act as module singletons, unintentionally sharing state across all components and SSR requests."
        }
      ];

      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const score = Object.keys(answers).reduce((acc, qId) => {
        const q = questions.find(item => item.id === Number(qId));
        return q && answers[qId] === q.correct ? acc + 1 : acc;
      }, 0);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-fuchsia-400 bg-fuchsia-950/60 px-2 py-0.5 rounded border border-fuchsia-800/50">Pattern 03</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Staff-Level Enterprise Architecture Exam</h2>
              <p className="text-xs text-slate-400 mt-1">Validate your architectural mastery of hook firewalls, store subscriptions, and factory lifetimes.</p>
            </div>
            {submitted && (
              <div className="text-right">
                <span className="text-2xl font-black font-mono text-fuchsia-400">{score} / {questions.length}</span>
                <span className="text-xs text-slate-400 block">{score === questions.length ? "🎖️ Enterprise Staff Certified!" : "Review explanations below"}</span>
              </div>
            )}
          </div>

          <div className="space-y-6">
            {questions.map(q => (
              <div key={q.id} className="p-4 bg-slate-950 border border-slate-800/80 rounded-lg space-y-3 font-mono text-xs">
                <h3 className="text-sm font-semibold text-slate-200">
                  <span className="text-fuchsia-400 font-mono mr-2">Q{q.id}.</span>
                  {q.q}
                </h3>

                <div className="space-y-2">
                  {q.options.map((opt, optIdx) => {
                    const isSelected = answers[q.id] === optIdx;
                    const isCorrect = q.correct === optIdx;
                    let borderClass = 'border-slate-800 hover:border-slate-700 bg-slate-900/60';
                    if (submitted) {
                      if (isCorrect) borderClass = 'border-emerald-500 bg-emerald-950/40 text-emerald-200';
                      else if (isSelected && !isCorrect) borderClass = 'border-red-500 bg-red-950/40 text-red-200';
                    } else if (isSelected) {
                      borderClass = 'border-fuchsia-500 bg-fuchsia-950/40 text-fuchsia-200';
                    }

                    return (
                      <button
                        key={optIdx}
                        disabled={submitted}
                        onClick={() => setAnswers(prev => ({ ...prev, [q.id]: optIdx }))}
                        className={`w-full text-left p-2.5 rounded-lg border transition-all flex items-center justify-between ${borderClass}`}
                      >
                        <span>{opt}</span>
                        {submitted && isCorrect && <span className="text-emerald-400 font-bold">✓ CORRECT</span>}
                        {submitted && isSelected && !isCorrect && <span className="text-red-400 font-bold">✗ INCORRECT</span>}
                      </button>
                    );
                  })}
                </div>

                {submitted && (
                  <div className="p-3 bg-slate-900/90 border border-slate-800 rounded text-[11px] text-slate-300">
                    <span className="font-bold text-fuchsia-400 block mb-1">Architectural Analysis:</span>
                    {q.explanation}
                  </div>
                )}
              </div>
            ))}

            <div className="flex justify-end gap-3 pt-2">
              {submitted ? (
                <button
                  onClick={() => { setAnswers({}); setSubmitted(false); }}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-mono rounded-lg"
                >
                  Reset Exam
                </button>
              ) : (
                <button
                  onClick={() => setSubmitted(true)}
                  disabled={Object.keys(answers).length < questions.length}
                  className="px-6 py-2 bg-fuchsia-600 hover:bg-fuchsia-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-xs font-bold font-mono rounded-lg shadow-lg shadow-fuchsia-600/30"
                >
                  Submit & Evaluate
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MAIN HARNESS
    // =========================================================================
    function App() {
      const [activeTab, setActiveTab] = useState("firewall");

      return (
        <div className="max-w-6xl mx-auto px-4 py-8 space-y-8">
          <header className="border-b border-slate-800 pb-6 space-y-2">
            <div className="flex items-center gap-2">
              <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                Level 06 · React Fundamentals
              </span>
              <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-purple-500/10 text-purple-400 border border-purple-500/20">
                KPI 12 · Custom Hooks
              </span>
              <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                Part 15 Companion Lab
              </span>
            </div>
            <h1 className="text-3xl font-extrabold text-slate-100 tracking-tight">
              Advanced Synthesis & Enterprise Scaled Patterns
            </h1>
            <p className="text-slate-400 text-sm max-w-3xl leading-relaxed">
              Interactive enterprise architecture laboratory demonstrating semantic migration firewalls, composed multi-hook pipelines, external pub/sub store subscriptions, and staff-level design patterns.
            </p>
          </header>

          {/* Navigation Tabs */}
          <div className="flex flex-wrap gap-2 border-b border-slate-800 pb-2">
            <button
              onClick={() => setActiveTab("firewall")}
              className={`px-4 py-2 text-xs font-mono font-bold rounded-lg border transition-all ${
                activeTab === "firewall"
                  ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg shadow-indigo-600/20'
                  : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
              }`}
            >
              1. Migration Firewall
            </button>
            <button
              onClick={() => setActiveTab("pipeline")}
              className={`px-4 py-2 text-xs font-mono font-bold rounded-lg border transition-all ${
                activeTab === "pipeline"
                  ? 'bg-emerald-600 border-emerald-500 text-white shadow-lg shadow-emerald-600/20'
                  : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
              }`}
            >
              2. Composed Pipeline
            </button>
            <button
              onClick={() => setActiveTab("exam")}
              className={`px-4 py-2 text-xs font-mono font-bold rounded-lg border transition-all ${
                activeTab === "exam"
                  ? 'bg-fuchsia-600 border-fuchsia-500 text-white shadow-lg shadow-fuchsia-600/20'
                  : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
              }`}
            >
              3. Enterprise Exam
            </button>
          </div>

          {/* Active Tab */}
          <main>
            {activeTab === "firewall" && <Exp1MigrationFirewall />}
            {activeTab === "pipeline" && <Exp2ComposedPipeline />}
            {activeTab === "exam" && <Exp3SeniorExam />}
          </main>

          <footer className="text-center text-xs font-mono text-slate-600 pt-8 border-t border-slate-900">
            Level 06: React Fundamentals · KPI 12 (Custom Hooks) Part 15 Lab · Senior Engineering Vault
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
