<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI 14 - Part 02: Hook Composition & Rules of Hooks Interactive Lab</title>
  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    
    :root {
      --bg-main: #0B0F19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(75, 85, 99, 0.4);
      --accent-cyan: #06B6D4;
      --accent-indigo: #6366F1;
      --accent-emerald: #10B981;
      --accent-rose: #F43F5E;
      --accent-amber: #F59E0B;
    }

    body {
      background-color: var(--bg-main);
      color: #F3F4F6;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #111827;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #4B5563;
    }

    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
    }
  </style>
</head>
<body class="custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useMemo, useRef, useCallback } = React;

    // =========================================================================
    // ROOT APP COMPONENT WITH TABBED LAB SECTIONS
    // =========================================================================
    function App() {
      const [activeTab, setActiveTab] = useState('exp1');

      const tabs = [
        { id: 'exp1', label: '1. Fiber Linked List Engine', icon: '🔗' },
        { id: 'exp2', label: '2. Early Return Pitfall', icon: '⚡' },
        { id: 'exp3', label: '3. Dynamic List vs Child Fibers', icon: '📦' },
        { id: 'exp4', label: '4. Conditional Work vs Call Order', icon: '🛡️' },
        { id: 'exp5', label: '5. Invariant Certification Quiz', icon: '🏆' },
      ];

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="border-b border-gray-800 bg-gray-950/80 sticky top-0 z-50 backdrop-blur px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="px-2.5 py-0.5 rounded text-xs font-bold uppercase tracking-wider bg-cyan-950 text-cyan-400 border border-cyan-800">
                  KPI 14 • PART 02
                </span>
                <span className="text-gray-400 text-sm">React Fundamentals & Fiber Internals</span>
              </div>
              <h1 className="text-xl font-extrabold text-white mt-1">
                Hook Composition & The Rules of Hooks Interactive Lab
              </h1>
            </div>
            <div className="text-xs text-gray-400 text-right hidden sm:block">
              <div>Author: <span className="text-cyan-400 font-semibold">Srikar Kudurmalla</span></div>
              <div>Co-Author: <span className="text-gray-300 font-semibold">Prasenjeet</span></div>
            </div>
          </header>

          {/* Tab Navigation */}
          <nav className="bg-gray-900/60 border-b border-gray-800 px-6 py-2.5 flex items-center gap-2 overflow-x-auto custom-scrollbar">
            {tabs.map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all duration-150 flex items-center gap-1.5 ${
                  activeTab === tab.id
                    ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/50 shadow-sm shadow-cyan-900/30'
                    : 'text-gray-400 hover:text-gray-200 hover:bg-gray-800/60 border border-transparent'
                }`}
              >
                <span>{tab.icon}</span>
                <span>{tab.label}</span>
              </button>
            ))}
          </nav>

          {/* Active Lab Body */}
          <main className="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
            {activeTab === 'exp1' && <Experiment1LinkedListEngine />}
            {activeTab === 'exp2' && <Experiment2EarlyReturn />}
            {activeTab === 'exp3' && <Experiment3DynamicLists />}
            {activeTab === 'exp4' && <Experiment4ConditionalWork />}
            {activeTab === 'exp5' && <Experiment5CertificationQuiz />}
          </main>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 1: FIBER LINKED LIST ENGINE
    // =========================================================================
    function Experiment1LinkedListEngine() {
      const [simulateCondition, setSimulateCondition] = useState(false);
      const [step, setStep] = useState(0);

      const standardNodes = [
        { id: 0, hook: "useState('name')", val: "'Alice'", type: "string" },
        { id: 1, hook: "useState('age')", val: "28", type: "number" },
        { id: 2, hook: "useRef('input')", val: "{ current: HTMLInput }", type: "ref" },
        { id: 3, hook: "useEffect('sync')", val: "EffectRecord", type: "effect" }
      ];

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">🔗 Experiment 1:</span> Fiber `memoizedState` Linked List Pointer Simulation
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Visualize how React traverses the <code className="text-cyan-300">memoizedState</code> pointer sequence during re-renders. Toggle a conditional hook skip to observe state misalignment and type corruption.
            </p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 font-mono text-xs">
            {/* Control Panel */}
            <div className="glass-panel p-5 rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Dispatcher Controls</h3>
              
              <div>
                <label className="text-xs text-gray-400 block mb-2 font-semibold">Simulate Hook Conditionality:</label>
                <div className="flex gap-2">
                  <button
                    onClick={() => setSimulateCondition(false)}
                    className={`flex-1 py-2 rounded-lg font-bold ${
                      !simulateCondition ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-400'
                    }`}
                  >
                    ✅ Stable Topology
                  </button>
                  <button
                    onClick={() => setSimulateCondition(true)}
                    className={`flex-1 py-2 rounded-lg font-bold ${
                      simulateCondition ? 'bg-rose-600 text-white' : 'bg-gray-800 text-gray-400'
                    }`}
                  >
                    💥 Skip Hook #0
                  </button>
                </div>
              </div>

              <div className="p-3 bg-gray-950 rounded-lg space-y-2 border border-gray-800">
                <span className="text-cyan-400 font-bold block">Reconciler Diagnosis:</span>
                {simulateCondition ? (
                  <p className="text-rose-300 text-[11px]">
                    ⚠️ <strong>State Shift Corruption!</strong> When Hook #0 is skipped, Hook #1 (expecting <code className="text-cyan-300">age: 28</code>) reads the 0th node's value (<code className="text-rose-400">'Alice'</code>). Type errors and data corruption occur immediately.
                  </p>
                ) : (
                  <p className="text-emerald-300 text-[11px]">
                    ✓ <strong>Perfect 1-to-1 Alignment:</strong> Each hook invocation in the render loop aligns with its identical <code className="text-cyan-300">memoizedState</code> node.
                  </p>
                )}
              </div>
            </div>

            {/* Linked List Visualizer */}
            <div className="lg:col-span-2 glass-panel p-5 rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Fiber Linked List Memory Map</h3>
              
              <div className="space-y-3">
                {standardNodes.map((node, idx) => {
                  const isSkippedInCall = simulateCondition && idx === 0;
                  const isShifted = simulateCondition && idx > 0;
                  return (
                    <div
                      key={node.id}
                      className={`p-3 rounded-lg border flex flex-wrap items-center justify-between gap-2 transition-all ${
                        isSkippedInCall
                          ? 'bg-rose-950/30 border-rose-800/80 opacity-60'
                          : isShifted
                          ? 'bg-amber-950/40 border-amber-800 text-amber-200'
                          : 'bg-gray-950 border-gray-800 text-gray-300'
                      }`}
                    >
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 rounded bg-gray-900 text-[10px] text-gray-400 font-bold border border-gray-800">
                          Index #{idx}
                        </span>
                        <span className="text-cyan-300 font-bold">{node.hook}</span>
                      </div>

                      <div className="flex items-center gap-3">
                        <span className="text-gray-500">memoizedState:</span>
                        <span className="font-bold text-emerald-400">{node.val}</span>
                        {isShifted && (
                          <span className="text-[10px] px-2 py-0.5 bg-rose-900 text-rose-200 rounded font-bold">
                            Corrupted Assignment!
                          </span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 2: EARLY RETURN PITFALL
    // =========================================================================
    function Experiment2EarlyReturn() {
      const [isLoading, setIsLoading] = useState(false);
      const [earlyReturnPattern, setEarlyReturnPattern] = useState(true);

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">⚡ Experiment 2:</span> The Early Return Trap: Lifecycle State Shifts
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Placing an early <code className="text-cyan-300">if (isLoading) return &lt;Spinner /&gt;</code> before custom hook calls causes the Hook call count to jump when loading finishes, crashing React.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            <div className="glass-panel p-5 rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Simulation Controls</h3>
              
              <div className="flex gap-2">
                <button
                  onClick={() => setIsLoading(v => !v)}
                  className={`flex-1 py-2 rounded-lg font-bold ${
                    isLoading ? 'bg-amber-600 text-white' : 'bg-gray-800 text-gray-300'
                  }`}
                >
                  Status: {isLoading ? '⏳ Loading (data is null)' : '✅ Data Ready'}
                </button>
              </div>

              <div className="flex gap-2">
                <button
                  onClick={() => setEarlyReturnPattern(true)}
                  className={`flex-1 py-2 rounded-lg font-bold ${
                    earlyReturnPattern ? 'bg-rose-600 text-white' : 'bg-gray-800 text-gray-400'
                  }`}
                >
                  ❌ Early Return before Hook
                </button>
                <button
                  onClick={() => setEarlyReturnPattern(false)}
                  className={`flex-1 py-2 rounded-lg font-bold ${
                    !earlyReturnPattern ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-400'
                  }`}
                >
                  ✅ Hoisted Hooks First
                </button>
              </div>
            </div>

            <div className="glass-panel p-5 rounded-xl space-y-3">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Reconciler Execution Trace</h3>
              <pre className="p-3 bg-gray-950 rounded-lg text-cyan-300 border border-gray-800 text-[11px] overflow-x-auto">
                {earlyReturnPattern ? `// ❌ FLAWED EARLY RETURN
function DocumentViewer({ isLoading, docId }) {
  if (isLoading) {
    return <Spinner />; // 💥 Skipped hooks!
  }

  // Hook count jumps when loading finishes:
  const doc = useDocumentSync(docId);
  return <Editor doc={doc} />;
}` : `// ✅ HOISTED HOOKS GOLD STANDARD
function DocumentViewer({ isLoading, docId }) {
  // Always runs unconditionally at the top:
  const doc = useDocumentSync(isLoading ? null : docId);

  if (isLoading) {
    return <Spinner />;
  }

  return <Editor doc={doc} />;
}`}
              </pre>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 3: DYNAMIC LIST VS CHILD FIBERS
    // =========================================================================
    function Experiment3DynamicLists() {
      const [items, setItems] = useState(['Task 1: Architecture Review', 'Task 2: Fiber Profiling']);

      const addItem = () => {
        setItems(prev => [...prev, `Task ${prev.length + 1}: Sprint Goal`]);
      };

      const removeItem = () => {
        setItems(prev => prev.slice(0, -1));
      };

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">📦 Experiment 3:</span> Dynamic Collections: Dynamic Hooks ❌ vs Dynamic Child Fibers ✅
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              You cannot call <code className="text-cyan-300">useState</code> inside <code className="text-cyan-300">items.map()</code>. Each dynamic stateful item must be modeled as an independent child component Fiber.
            </p>
          </div>

          <div className="glass-panel p-5 rounded-xl space-y-4 font-mono text-xs">
            <div className="flex gap-2">
              <button
                onClick={addItem}
                className="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition-all"
              >
                + Add Dynamic Row
              </button>
              <button
                disabled={items.length <= 1}
                onClick={removeItem}
                className="px-4 py-2 bg-gray-800 hover:bg-gray-700 disabled:opacity-40 text-gray-300 font-bold rounded-lg transition-all"
              >
                - Remove Row
              </button>
            </div>

            <div className="space-y-2">
              {items.map((item, idx) => (
                <TaskRow key={idx} text={item} index={idx} />
              ))}
            </div>
          </div>
        </div>
      );
    }

    function TaskRow({ text, index }) {
      const [isDone, setIsDone] = useState(false);

      return (
        <div className="p-3 bg-gray-950 rounded-lg border border-gray-800 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <span className="text-gray-500 text-[10px]">Row Fiber #{index + 1}</span>
            <span className={`font-bold ${isDone ? 'line-through text-gray-500' : 'text-emerald-400'}`}>
              {text}
            </span>
          </div>
          <button
            onClick={() => setIsDone(v => !v)}
            className={`px-3 py-1 rounded text-[10px] font-bold ${
              isDone ? 'bg-gray-800 text-gray-400' : 'bg-emerald-950 text-emerald-300 border border-emerald-800'
            }`}
          >
            {isDone ? 'Mark Incomplete' : 'Complete Task'}
          </button>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 4: CONDITIONAL WORK VS CALL ORDER
    // =========================================================================
    function Experiment4ConditionalWork() {
      const [syncEnabled, setSyncEnabled] = useState(true);
      const [tickCount, setTickCount] = useState(0);

      // Unconditional Hook call with conditional internal work
      useEffect(() => {
        if (!syncEnabled) return;
        const interval = setInterval(() => setTickCount(c => c + 1), 1000);
        return () => clearInterval(interval);
      }, [syncEnabled]);

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">🛡️ Experiment 4:</span> Conditional Behavior vs Conditional Call Order
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              The Hook call remains 100% unconditional at the top level, while its internal effect work pauses when <code className="text-cyan-300">syncEnabled === false</code>.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            <div className="glass-panel p-5 rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Feature Flag Toggle</h3>
              
              <button
                onClick={() => setSyncEnabled(v => !v)}
                className={`w-full py-2.5 rounded-lg font-bold transition-all ${
                  syncEnabled ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-400'
                }`}
              >
                Sync Active: {syncEnabled ? '🟢 ENABLED' : '🔴 PAUSED'}
              </button>

              <div className="p-3 bg-gray-950 rounded-lg border border-gray-800">
                <span className="text-gray-400 block mb-1">Hardware Interval Ticks:</span>
                <span className="text-3xl font-extrabold text-cyan-300">{tickCount}</span>
              </div>
            </div>

            <div className="glass-panel p-5 rounded-xl space-y-3">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Design Rule Summary</h3>
              <p className="text-gray-300 text-[11px] leading-relaxed">
                <strong>Cardinal Rule:</strong> Control flow should determine <em>behavior</em>, NEVER Hook topology.
                Always call <code className="text-cyan-300">useEffect</code> at the top level and place the early return guard <code className="text-cyan-300">if (!syncEnabled) return;</code> inside the effect body.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 5: CERTIFICATION QUIZ
    // =========================================================================
    function Experiment5CertificationQuiz() {
      const questions = [
        {
          id: 1,
          q: "Why is calling useState inside an 'if (flag)' statement fatal in React?",
          options: ["It slows down rendering", "It breaks the sequential 1-to-1 mapping of Fiber.memoizedState nodes"],
          correct: "It breaks the sequential 1-to-1 mapping of Fiber.memoizedState nodes"
        },
        {
          id: 2,
          q: "How must dynamic collections with independent local state be architected?",
          options: ["Calling useState inside items.map()", "Extracting an independent child component for each row"],
          correct: "Extracting an independent child component for each row"
        },
        {
          id: 3,
          q: "Can custom hooks call other custom hooks?",
          options: ["Yes, hooks flatten into the caller's Fiber topology", "No, custom hooks cannot be nested"],
          correct: "Yes, hooks flatten into the caller's Fiber topology"
        }
      ];

      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const score = questions.filter(q => answers[q.id] === q.correct).length;

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">🏆 Experiment 5:</span> Rules of Hooks Invariants Certification
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Verify your mastery of React Hook composition invariants and Fiber reconciler traversal mechanics.
            </p>
          </div>

          <div className="space-y-4">
            {questions.map((q) => {
              const selected = answers[q.id];
              return (
                <div key={q.id} className="glass-panel p-4 rounded-xl space-y-2.5 font-mono text-xs">
                  <div className="text-white font-bold text-sm">{q.q}</div>
                  <div className="flex flex-wrap gap-2">
                    {q.options.map((opt) => (
                      <button
                        key={opt}
                        onClick={() => setAnswers(prev => ({ ...prev, [q.id]: opt }))}
                        className={`px-3 py-1.5 rounded-lg transition-all ${
                          selected === opt ? 'bg-cyan-600 text-white font-bold' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'
                        }`}
                      >
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          <div className="flex justify-between items-center glass-panel p-4 rounded-xl font-mono">
            <button
              onClick={() => setSubmitted(true)}
              className="px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs uppercase tracking-wider rounded-lg transition-all"
            >
              Submit Diagnostic Evaluation
            </button>
            {submitted && (
              <div className="text-sm font-bold text-white">
                Score: <span className={score === questions.length ? 'text-emerald-400' : 'text-amber-400'}>{score} / {questions.length}</span> — {score === questions.length ? '✅ Part 02 Mastered!' : 'Review Recommended'}
              </div>
            )}
          </div>
        </div>
      );
    }

    // Mount Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
