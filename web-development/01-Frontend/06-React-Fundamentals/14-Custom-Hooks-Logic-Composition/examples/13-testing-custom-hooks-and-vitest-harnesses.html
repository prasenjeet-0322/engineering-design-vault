<body class="min-h-screen bg-slate-950 text-slate-100 antialiased custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useReducer, useCallback, useMemo, useRef, memo } = React;

    // =========================================================================
    // EXPERIMENT 1: INTERACTIVE VITEST RUNNER IN BROWSER
    // =========================================================================
    function Exp1TestRunner() {
      const [testResults, setTestResults] = useState([]);
      const [isRunning, setIsRunning] = useState(false);

      const runTestSuite = async () => {
        setIsRunning(true);
        setTestResults([]);

        const results = [];
        const record = (suite, name, passed, details = "") => {
          results.push({ id: Math.random(), suite, name, passed, details });
          setTestResults([...results]);
        };

        // Simulated Test 1: Initial state
        await new Promise(r => setTimeout(r, 200));
        record("useCounter", "initializes with default value 0", true, "expect(result.current.count).toBe(0)");

        // Simulated Test 2: act() increment
        await new Promise(r => setTimeout(r, 250));
        record("useCounter", "increments state via act() transition", true, "act(() => increment()) ──► count: 1");

        // Simulated Test 3: Clamping invariant
        await new Promise(r => setTimeout(r, 200));
        record("useCounter", "respects upper max constraint clamp", true, "max: 10, increment past max clamped to 10");

        // Simulated Test 4: Dynamic rerender
        await new Promise(r => setTimeout(r, 300));
        record("useCounter", "adapts dynamically when step prop changes", true, "rerender({ step: 5 }) ──► count advanced by 5");

        // Simulated Test 5: Symmetric cleanup
        await new Promise(r => setTimeout(r, 250));
        record("useOnlineStatus", "strictly unregisters event listeners on unmount", true, "unmount() ──► window.removeEventListener called");

        setIsRunning(false);
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800/50">Lab 01</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Virtual In-Browser Vitest Execution Harness</h2>
              <p className="text-xs text-slate-400 mt-1">Execute automated behavioral contract assertions with real-time pass/fail feedback.</p>
            </div>
            <button
              onClick={runTestSuite}
              disabled={isRunning}
              className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-mono text-xs font-bold rounded-lg shadow-lg shadow-indigo-600/30 flex items-center gap-2 transition-all"
            >
              <span>{isRunning ? "⚡ Running Vitest..." : "▶ Run Test Suite"}</span>
            </button>
          </div>

          <div className="space-y-3 font-mono text-xs">
            {testResults.length === 0 && !isRunning ? (
              <div className="p-8 text-center text-slate-500 bg-slate-950/40 border border-slate-800 rounded-lg">
                Click "Run Test Suite" to execute simulated Vitest hook tests...
              </div>
            ) : (
              testResults.map(t => (
                <div key={t.id} className="p-3 bg-slate-950 border border-slate-800/80 rounded-lg flex items-center justify-between">
                  <div className="space-y-1">
                    <div className="flex items-center gap-2">
                      <span className="text-emerald-400 font-bold">✓ PASS</span>
                      <span className="text-indigo-300 font-semibold">{t.suite}</span>
                      <span className="text-slate-400">›</span>
                      <span className="text-slate-200">{t.name}</span>
                    </div>
                    <div className="text-[11px] text-slate-500 pl-6">{t.details}</div>
                  </div>
                  <span className="text-[10px] text-slate-600 bg-slate-900 px-2 py-0.5 rounded">vitest</span>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 2: ASYNC RACE CONDITION & DEFERRED PROMISE SIMULATOR
    // =========================================================================
    function Exp2RaceCondition() {
      const [reqAStatus, setReqAStatus] = useState("idle"); // idle, pending, resolved
      const [reqBStatus, setReqBStatus] = useState("idle");
      const [activeResult, setActiveResult] = useState(null);
      const [mode, setMode] = useState("guarded"); // guarded vs naive
      const [logs, setLogs] = useState([]);

      const activeReqIdRef = useRef(0);

      const addLog = (msg, type = "info") => {
        setLogs(prev => [`[${new Date().toLocaleTimeString()}] ${msg}`, ...prev.slice(0, 6)]);
      };

      const startReqA = () => {
        const id = ++activeReqIdRef.current;
        setReqAStatus("pending");
        addLog(`Started Query A (Search: 'React') [Req ID: ${id}]`);
      };

      const startReqB = () => {
        const id = ++activeReqIdRef.current;
        setReqBStatus("pending");
        addLog(`Started Query B (Search: 'Rust') [Req ID: ${id}]`);
      };

      const resolveReqA = () => {
        if (reqAStatus !== "pending") return;
        setReqAStatus("resolved");
        const payload = "React 18 Fiber Results";

        if (mode === "naive") {
          // ❌ Naive: Always accepts response, causing race condition overwrite!
          setActiveResult(payload);
          addLog(`❌ NAIVE BUG: Request A resolved and OVERWROTE UI with stale data!`, "error");
        } else {
          // ✅ Senior Guard: Only accepts if Req ID is latest!
          if (activeReqIdRef.current === 1) { // 1 was A's ID
            setActiveResult(payload);
            addLog(`Request A accepted (Req ID is current).`);
          } else {
            addLog(`🛡️ LATEST-WINS GUARD: Discarded stale Request A response!`, "warn");
          }
        }
      };

      const resolveReqB = () => {
        if (reqBStatus !== "pending") return;
        setReqBStatus("resolved");
        const payload = "Rust Tokio Concurrency Results";
        setActiveResult(payload);
        addLog(`✅ Request B resolved: Updated UI with 'Rust' payload.`);
      };

      const resetAll = () => {
        activeReqIdRef.current = 0;
        setReqAStatus("idle");
        setReqBStatus("idle");
        setActiveResult(null);
        setLogs([]);
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50">Lab 02</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Deferred Promise & Async Race Condition Simulator</h2>
              <p className="text-xs text-slate-400 mt-1">Simulate out-of-order async resolution to verify the Latest-Wins Invariant.</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setMode(mode === "guarded" ? "naive" : "guarded")}
                className={`px-3 py-1.5 text-xs font-mono rounded-lg border transition-all ${
                  mode === "guarded"
                    ? 'bg-emerald-950/60 border-emerald-700 text-emerald-300'
                    : 'bg-red-950/60 border-red-700 text-red-300'
                }`}
              >
                Strategy: {mode === "guarded" ? "🛡️ Latest-Wins Guarded" : "❌ Naive (Unprotected)"}
              </button>
              <button onClick={resetAll} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-mono rounded-lg">
                Reset
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-6 space-y-4 font-mono text-xs">
              {/* Request A Box */}
              <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-amber-400 font-bold">Query A: 'React' (Slow 500ms Network)</span>
                  <span className={`px-2 py-0.5 rounded text-[10px] ${
                    reqAStatus === "pending" ? 'bg-amber-950 text-amber-300' :
                    reqAStatus === "resolved" ? 'bg-emerald-950 text-emerald-300' : 'bg-slate-800 text-slate-500'
                  }`}>
                    {reqAStatus.toUpperCase()}
                  </span>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={startReqA}
                    disabled={reqAStatus !== "idle"}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 rounded"
                  >
                    1. Start Query A
                  </button>
                  <button
                    onClick={resolveReqA}
                    disabled={reqAStatus !== "pending"}
                    className="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 disabled:opacity-40 text-white font-bold rounded"
                  >
                    4. Resolve A (Late!)
                  </button>
                </div>
              </div>

              {/* Request B Box */}
              <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-cyan-400 font-bold">Query B: 'Rust' (Fast 50ms Network)</span>
                  <span className={`px-2 py-0.5 rounded text-[10px] ${
                    reqBStatus === "pending" ? 'bg-cyan-950 text-cyan-300' :
                    reqBStatus === "resolved" ? 'bg-emerald-950 text-emerald-300' : 'bg-slate-800 text-slate-500'
                  }`}>
                    {reqBStatus.toUpperCase()}
                  </span>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={startReqB}
                    disabled={reqBStatus !== "idle"}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 rounded"
                  >
                    2. Start Query B
                  </button>
                  <button
                    onClick={resolveReqB}
                    disabled={reqBStatus !== "pending"}
                    className="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-40 text-white font-bold rounded"
                  >
                    3. Resolve B (Fast!)
                  </button>
                </div>
              </div>

              {/* Observed Result Output */}
              <div className="p-4 bg-slate-950 border border-indigo-900/60 rounded-lg space-y-2">
                <span className="text-slate-400 text-[11px] block">COMMITTED UI STATE (`result.current.data`):</span>
                <div className="text-base font-bold text-indigo-300">
                  {activeResult || <span className="text-slate-600 font-normal italic">No data committed yet</span>}
                </div>
              </div>
            </div>

            {/* Right: Race Log Tracer */}
            <div className="lg:col-span-6 bg-slate-950 border border-slate-800 rounded-lg p-4 font-mono text-xs flex flex-col justify-between">
              <div>
                <span className="text-emerald-400 font-bold block border-b border-slate-800 pb-2 mb-3">
                  TEMPORAL RESOLUTION TRACER
                </span>
                <div className="space-y-1.5">
                  {logs.length === 0 ? (
                    <div className="text-slate-600 italic py-6 text-center">Follow steps 1 ➔ 2 ➔ 3 ➔ 4 to test race resolution...</div>
                  ) : (
                    logs.map((log, idx) => (
                      <div key={idx} className={`p-2 rounded text-[11px] ${
                        log.includes('BUG') ? 'bg-red-950/50 text-red-300 border border-red-800' :
                        log.includes('GUARD') ? 'bg-amber-950/50 text-amber-300 border border-amber-800' :
                        'bg-slate-900 text-slate-300 border border-slate-800'
                      }`}>
                        {log}
                      </div>
                    ))
                  )}
                </div>
              </div>

              <div className="mt-4 p-3 bg-slate-900/60 border border-slate-800 rounded text-[11px] text-slate-400">
                <span className="text-slate-200 font-bold block mb-1">💡 Vitest Testing Axiom:</span>
                Never use real timers in CI to test race conditions. Use manual Deferred Promises to deterministically resolve Request B before Request A.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 3: SYMMETRIC CLEANUP & LISTENER LEAK DETECTOR
    // =========================================================================
    function Exp3CleanupDetector() {
      const [mountedInstances, setMountedInstances] = useState(0);
      const [activeListenersCount, setActiveListenersCount] = useState(0);
      const [cleanupBugEnabled, setCleanupBugEnabled] = useState(false);

      const mountInstance = () => {
        setMountedInstances(p => p + 1);
        setActiveListenersCount(p => p + 1);
      };

      const unmountInstance = () => {
        if (mountedInstances <= 0) return;
        setMountedInstances(p => p - 1);
        if (!cleanupBugEnabled) {
          // Symmetric cleanup removes listener
          setActiveListenersCount(p => Math.max(0, p - 1));
        }
        // If bug enabled, listener is leaked and activeListenersCount stays high!
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800/50">Lab 03</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Lifecycle & Symmetric Cleanup Leak Detector</h2>
              <p className="text-xs text-slate-400 mt-1">Visualize what happens when `unmount()` fails to symmetrically remove DOM subscriptions.</p>
            </div>
            <label className="flex items-center gap-2 text-xs font-mono text-slate-300 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 cursor-pointer">
              <input
                type="checkbox"
                checked={cleanupBugEnabled}
                onChange={e => setCleanupBugEnabled(e.target.checked)}
                className="rounded text-red-600 focus:ring-0"
              />
              <span className="text-red-300 font-bold">Simulate Leaky Hook Bug</span>
            </label>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg space-y-4">
              <span className="text-slate-400 block font-bold">LIFECYCLE CONTROLS:</span>
              <div className="flex gap-3">
                <button
                  onClick={mountInstance}
                  className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg"
                >
                  + Mount Hook Instance
                </button>
                <button
                  onClick={unmountInstance}
                  disabled={mountedInstances === 0}
                  className="px-4 py-2 bg-red-600 hover:bg-red-500 disabled:opacity-40 text-white font-bold rounded-lg"
                >
                  - Unmount Instance
                </button>
              </div>

              <div className="space-y-2 pt-2">
                <div className="flex justify-between p-2 bg-slate-900 rounded border border-slate-800">
                  <span className="text-slate-400">Mounted Hook Instances:</span>
                  <span className="text-indigo-400 font-bold text-sm">{mountedInstances}</span>
                </div>
                <div className={`flex justify-between p-2 rounded border ${
                  activeListenersCount > mountedInstances
                    ? 'bg-red-950/60 border-red-600 text-red-300 font-bold'
                    : 'bg-slate-900 border-slate-800 text-slate-300'
                }`}>
                  <span>Active DOM Event Listeners:</span>
                  <span className="text-sm font-bold">{activeListenersCount}</span>
                </div>
              </div>
            </div>

            <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg flex flex-col justify-between">
              <div>
                <span className="text-amber-400 font-bold block border-b border-slate-800 pb-2 mb-2">
                  TEARDOWN DIAGNOSTIC STATUS
                </span>
                {activeListenersCount > mountedInstances ? (
                  <div className="p-3 bg-red-950/80 border border-red-500 rounded text-red-200 space-y-1">
                    <span className="font-bold block">⚠️ MEMORY LEAK DETECTED!</span>
                    <p className="text-[11px]">
                      You have {mountedInstances} mounted components, but {activeListenersCount} active window listeners. Memory and event callbacks are leaking into the heap!
                    </p>
                  </div>
                ) : (
                  <div className="p-3 bg-emerald-950/80 border border-emerald-500 rounded text-emerald-200">
                    <span className="font-bold block">✅ SYMMETRIC CLEANUP INTACT</span>
                    <p className="text-[11px] mt-1">1:1 correlation between mounted hook instances and active listeners.</p>
                  </div>
                )}
              </div>

              <div className="text-[11px] text-slate-500 pt-3 border-t border-slate-800/60">
                Vitest assert: <code className="text-slate-300">expect(removeSpy).toHaveBeenCalled()</code> on <code className="text-slate-300">unmount()</code>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 4: SENIOR CERTIFICATION EXAM
    // =========================================================================
    function Exp4SeniorExam() {
      const questions = [
        {
          id: 1,
          q: "Why must state updates inside a custom hook test be wrapped in act()?",
          options: [
            "To prevent JavaScript memory leaks in V8 engine",
            "To establish a synchronous boundary that flushes pending Fiber work, passive effects, and state transition queues",
            "Because Vitest requires act() for TypeScript typechecking",
            "To convert React state to global window variables"
          ],
          correct: 1,
          explanation: "act() ensures that all queued React state transitions, layout effects, and passive effects are fully processed and flushed before assertions execute."
        },
        {
          id: 2,
          q: "Why should we use createDeferred<T>() over setTimeout() when testing async hook race conditions?",
          options: [
            "Deferred promises execute on the GPU",
            "Deferred promises allow tests to deterministically resolve requests out-of-order without relying on fragile wall-clock timing",
            "setTimeout does not work inside Node.js test runners",
            "Because React 18 deprecated promises"
          ],
          correct: 1,
          explanation: "Real wall-clock timeouts are flaky and slow in CI. Deferred promises allow immediate, deterministic control over resolution order."
        },
        {
          id: 3,
          q: "What is the primary danger of testing implementation details (e.g. asserting useState was called)?",
          options: [
            "It makes the test suite fragile, breaking on harmless internal refactorings even when behavioral contracts remain identical",
            "It slows down Vitest execution by 10x",
            "It violates React license agreements",
            "It throws runtime WebGL errors"
          ],
          correct: 0,
          explanation: "Implementation tests lock code in place. Tests should verify observable behavioral contracts and state transitions, not internal primitives."
        }
      ];

      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const score = Object.keys(answers).reduce((acc, qId) => {
        const q = questions.find(item => item.id === Number(qId));
        return q && answers[qId] === q.correct ? acc + 1 : acc;
      }, 0);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <span className="text-xs font-mono uppercase tracking-widest text-fuchsia-400 bg-fuchsia-950/60 px-2 py-0.5 rounded border border-fuchsia-800/50">Lab 04</span>
              <h2 className="text-xl font-bold text-slate-100 mt-1">Senior Hook Testing Certification Exam</h2>
              <p className="text-xs text-slate-400 mt-1">Verify your architectural mastery of hook harnesses, `act()` semantics, and race invariants.</p>
            </div>
            {submitted && (
              <div className="text-right">
                <span className="text-2xl font-black font-mono text-fuchsia-400">{score} / {questions.length}</span>
                <span className="text-xs text-slate-400 block">{score === questions.length ? "🎖️ Senior Certified!" : "Review below"}</span>
              </div>
            )}
          </div>

          <div className="space-y-6">
            {questions.map(q => (
              <div key={q.id} className="p-4 bg-slate-950 border border-slate-800/80 rounded-lg space-y-3">
                <h3 className="text-sm font-semibold text-slate-200">
                  <span className="text-fuchsia-400 font-mono mr-2">Q{q.id}.</span>
                  {q.q}
                </h3>

                <div className="space-y-2">
                  {q.options.map((opt, optIdx) => {
                    const isSelected = answers[q.id] === optIdx;
                    const isCorrect = q.correct === optIdx;
                    let borderClass = 'border-slate-800 hover:border-slate-700 bg-slate-900/60';
                    if (submitted) {
                      if (isCorrect) borderClass = 'border-emerald-500 bg-emerald-950/40 text-emerald-200';
                      else if (isSelected && !isCorrect) borderClass = 'border-red-500 bg-red-950/40 text-red-200';
                    } else if (isSelected) {
                      borderClass = 'border-fuchsia-500 bg-fuchsia-950/40 text-fuchsia-200';
                    }

                    return (
                      <button
                        key={optIdx}
                        disabled={submitted}
                        onClick={() => setAnswers(prev => ({ ...prev, [q.id]: optIdx }))}
                        className={`w-full text-left p-2.5 rounded-lg text-xs font-mono border transition-all flex items-center justify-between ${borderClass}`}
                      >
                        <span>{opt}</span>
                        {submitted && isCorrect && <span className="text-emerald-400 font-bold">✓ CORRECT</span>}
                        {submitted && isSelected && !isCorrect && <span className="text-red-400 font-bold">✗ INCORRECT</span>}
                      </button>
                    );
                  })}
                </div>

                {submitted && (
                  <div className="p-3 bg-slate-900/90 border border-slate-800 rounded text-[11px] text-slate-300">
                    <span className="font-bold text-fuchsia-400 block mb-1">Architectural Analysis:</span>
                    {q.explanation}
                  </div>
                )}
              </div>
            ))}

            <div className="flex justify-end gap-3 pt-2">
              {submitted ? (
                <button
                  onClick={() => { setAnswers({}); setSubmitted(false); }}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-mono rounded-lg"
                >
                  Reset Exam
                </button>
              ) : (
                <button
                  onClick={() => setSubmitted(true)}
                  disabled={Object.keys(answers).length < questions.length}

                >

                </button>
              )}
            </div>
          </div>
        </div>
      );
    }
