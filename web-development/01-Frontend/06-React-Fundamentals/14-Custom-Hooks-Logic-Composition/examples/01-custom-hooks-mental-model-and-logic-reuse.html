<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI 14 - Part 01: Custom Hooks Mental Model & Logic Reuse Interactive Lab</title>
  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    
    :root {
      --bg-main: #0B0F19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(75, 85, 99, 0.4);
      --accent-cyan: #06B6D4;
      --accent-indigo: #6366F1;
      --accent-emerald: #10B981;
      --accent-rose: #F43F5E;
      --accent-amber: #F59E0B;
    }

    body {
      background-color: var(--bg-main);
      color: #F3F4F6;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #111827;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #4B5563;
    }

    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
    }
  </style>
</head>
<body class="custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useMemo, useRef, useCallback } = React;

    // =========================================================================
    // CUSTOM HOOKS DEFINED FOR THE LAB
    // =========================================================================

    // 1. Local State Abstraction Hook
    function useCounter(initial = 0) {
      const [count, setCount] = useState(initial);
      const executionCount = useRef(0);
      executionCount.current += 1;

      const increment = useCallback(() => setCount(c => c + 1), []);
      const decrement = useCallback(() => setCount(c => c - 1), []);
      const reset = useCallback(() => setCount(initial), [initial]);

      return { count, increment, decrement, reset, executions: executionCount.current };
    }

    // 2. Shared Context Example
    const SharedCounterContext = createContext(null);

    function SharedCounterProvider({ children }) {
      const [count, setCount] = useState(0);
      const increment = () => setCount(c => c + 1);
      const reset = () => setCount(0);
      const value = useMemo(() => ({ count, increment, reset }), [count]);
      return <SharedCounterContext.Provider value={value}>{children}</SharedCounterContext.Provider>;
    }

    function useSharedCounter() {
      const ctx = useContext(SharedCounterContext);
      if (!ctx) throw new Error('Must be inside SharedCounterProvider');
      return ctx;
    }

    // =========================================================================
    // ROOT APP SHELL
    // =========================================================================
    function App() {
      const [activeTab, setActiveTab] = useState('expA');

      const tabs = [
        { id: 'expA', label: '1. State Isolation (A vs B)', icon: '📦' },
        { id: 'expB', label: '2. Execution vs Persistence', icon: '⚡' },
        { id: 'expC', label: '3. Shared State Illusion', icon: '🪄' },
        { id: 'expD', label: '4. Logic Placement Matrix', icon: '📊' },
        { id: 'expE', label: '5. Diagnostic Gauntlet', icon: '🏆' },
      ];

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="border-b border-gray-800 bg-gray-950/80 sticky top-0 z-50 backdrop-blur px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="px-2.5 py-0.5 rounded text-xs font-bold uppercase tracking-wider bg-cyan-950 text-cyan-400 border border-cyan-800">
                  KPI 14 • PART 01
                </span>
                <span className="text-gray-400 text-sm">Custom Hooks & Logic Composition</span>
              </div>
              <h1 className="text-xl font-extrabold text-white mt-1">
                Custom Hooks Mental Model & Logic Reuse Interactive Lab
              </h1>
            </div>
            <div className="text-xs text-gray-400 text-right hidden sm:block">
              <div>Author: <span className="text-cyan-400 font-semibold">Srikar Kudurmalla</span></div>
              <div>Co-Author: <span className="text-gray-300 font-semibold">Prasenjeet</span></div>
            </div>
          </header>

          {/* Tab Navigation */}
          <nav className="bg-gray-900/60 border-b border-gray-800 px-6 py-2.5 flex items-center gap-2 overflow-x-auto custom-scrollbar">
            {tabs.map((tab) => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all duration-150 flex items-center gap-1.5 ${
                  activeTab === tab.id
                    ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/50 shadow-sm shadow-cyan-900/30'
                    : 'text-gray-400 hover:text-gray-200 hover:bg-gray-800/60 border border-transparent'
                }`}
              >
                <span>{tab.icon}</span>
                <span>{tab.label}</span>
              </button>
            ))}
          </nav>

          {/* Active Lab Content */}
          <main className="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
            {activeTab === 'expA' && <ExperimentStateIsolation />}
            {activeTab === 'expB' && <ExperimentExecutionTimeline />}
            {activeTab === 'expC' && <ExperimentSharedStateIllusion />}
            {activeTab === 'expD' && <ExperimentLogicPlacementMatrix />}
            {activeTab === 'expE' && <ExperimentDiagnosticGauntlet />}
          </main>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 1: STATE ISOLATION (A vs B)
    // =========================================================================
    function ExperimentStateIsolation() {
      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">📦 Experiment 1:</span> Hook State Isolation: Same Code, Independent Memory
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Both components invoke the same <code className="text-cyan-300">useCounter()</code> Hook. Notice how incrementing Instance A does NOT affect Instance B.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            <CounterWidget title="Component Instance Alpha (Fiber A)" accent="emerald" />
            <CounterWidget title="Component Instance Beta (Fiber B)" accent="indigo" />
          </div>

          <div className="p-4 bg-gray-950 rounded-xl border border-gray-800 font-mono text-xs space-y-2">
            <div className="text-cyan-400 font-bold">Mechanical Invariant:</div>
            <p className="text-gray-300">
              $$\text{State Instance} = \text{Caller Fiber Identity} \times \text{Hook Position}$$
              Each component Fiber maintains its own distinct <code className="text-cyan-300">memoizedState</code> linked list. The custom Hook function is shared logic, not shared memory.
            </p>
          </div>
        </div>
      );
    }

    function CounterWidget({ title, accent }) {
      const { count, increment, decrement, reset, executions } = useCounter(0);
      const isEmerald = accent === 'emerald';

      return (
        <div className={`glass-panel p-5 rounded-xl space-y-4 border-${isEmerald ? 'emerald' : 'indigo'}-900/50`}>
          <div className="flex justify-between items-center border-b border-gray-800 pb-2">
            <span className={`font-bold ${isEmerald ? 'text-emerald-400' : 'text-indigo-400'}`}>{title}</span>
            <span className="text-[10px] text-gray-500">Hook Executions: {executions}</span>
          </div>

          <div className="p-4 bg-gray-950 rounded-xl text-center space-y-1 border border-gray-800">
            <span className="text-gray-500 text-[10px] uppercase tracking-wider block">Isolated State Snapshot</span>
            <span className={`text-4xl font-extrabold ${isEmerald ? 'text-emerald-300' : 'text-indigo-300'}`}>
              {count}
            </span>
          </div>

          <div className="flex gap-2">
            <button
              onClick={increment}
              className={`flex-1 py-2 ${isEmerald ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-indigo-600 hover:bg-indigo-500'} text-white font-bold rounded-lg transition-all`}
            >
              + Increment
            </button>
            <button
              onClick={decrement}
              className="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold rounded-lg transition-all"
            >
              - Decrement
            </button>
            <button
              onClick={reset}
              className="px-3 py-2 bg-gray-900 hover:bg-gray-800 text-gray-400 font-bold rounded-lg transition-all"
            >
              Reset
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 2: EXECUTION VS PERSISTENCE
    // =========================================================================
    function ExperimentExecutionTimeline() {
      const [renderTrigger, setRenderTrigger] = useState(0);
      const { count, increment, executions } = useCounter(0);

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">⚡ Experiment 2:</span> Function Execution vs Persistent State
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              A custom Hook function executes on <strong>every render pass</strong>. The function body runs repeatedly, but React preserves its state between renders.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            <div className="glass-panel p-5 rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Render Controls</h3>
              
              <div className="space-y-3">
                <button
                  onClick={increment}
                  className="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition-all"
                >
                  Increment State (Triggers State Update + Render)
                </button>
                <button
                  onClick={() => setRenderTrigger(t => t + 1)}
                  className="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-200 font-bold rounded-lg transition-all"
                >
                  Force Parent Re-render (Unrelated State Update)
                </button>
              </div>

              <div className="p-3 bg-gray-950 rounded-lg border border-gray-800 space-y-1">
                <div className="text-gray-400">Persistent State Value: <span className="text-emerald-400 font-bold">{count}</span></div>
                <div className="text-gray-400">Hook Function Calls: <span className="text-cyan-400 font-bold">{executions}</span></div>
                <div className="text-gray-400">Parent Re-renders: <span className="text-amber-400 font-bold">{renderTrigger}</span></div>
              </div>
            </div>

            <div className="glass-panel p-5 rounded-xl space-y-3">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Temporal Concept Inspector</h3>
              <div className="space-y-2 text-[11px] text-gray-300">
                <div className="p-2.5 bg-gray-950 rounded border border-gray-800">
                  <strong className="text-cyan-400 block mb-1">1. Hook Execution Lifetime:</strong>
                  Runs synchronously inside the render function of the caller. Dies as soon as the render finishes.
                </div>
                <div className="p-2.5 bg-gray-950 rounded border border-gray-800">
                  <strong className="text-emerald-400 block mb-1">2. Hook State Lifetime:</strong>
                  Persists on the Fiber node across thousands of renders as long as the component remains mounted in the tree.
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 3: SHARED STATE ILLUSION
    // =========================================================================
    function ExperimentSharedStateIllusion() {
      const [useSharedMode, setUseSharedMode] = useState(false);

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">🪄 Experiment 3:</span> The "Shared State Illusion" & Context Gateways
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Compare isolated Hook state against a shared Context Provider gateway. Notice how only Context establishes true single-source-of-truth sharing.
            </p>
          </div>

          <div className="flex gap-3">
            <button
              onClick={() => setUseSharedMode(false)}
              className={`px-4 py-2 rounded-lg text-xs font-mono font-bold transition-all ${
                !useSharedMode ? 'bg-rose-600 text-white shadow-md' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
              }`}
            >
              ❌ Standard Hook (Isolated State Illusion)
            </button>
            <button
              onClick={() => setUseSharedMode(true)}
              className={`px-4 py-2 rounded-lg text-xs font-mono font-bold transition-all ${
                useSharedMode ? 'bg-emerald-600 text-white shadow-md' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
              }`}
            >
              ✅ Context Provider + Gateway Hook (True Shared State)
            </button>
          </div>

          {!useSharedMode ? (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
              <CounterWidget title="Header Component (useCounter)" accent="emerald" />
              <CounterWidget title="Profile Component (useCounter)" accent="indigo" />
            </div>
          ) : (
            <SharedCounterProvider>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
                <SharedConsumer title="Header Component (useSharedCounter)" />
                <SharedConsumer title="Profile Component (useSharedCounter)" />
              </div>
            </SharedCounterProvider>
          )}
        </div>
      );
    }

    function SharedConsumer({ title }) {
      const { count, increment, reset } = useSharedCounter();

      return (
        <div className="glass-panel p-5 rounded-xl space-y-4 border-cyan-800/60">
          <div className="flex justify-between items-center border-b border-gray-800 pb-2">
            <span className="font-bold text-cyan-400">{title}</span>
            <span className="text-[10px] text-emerald-400 font-bold bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">
              Shared Gateway Connected
            </span>
          </div>

          <div className="p-4 bg-gray-950 rounded-xl text-center space-y-1 border border-gray-800">
            <span className="text-gray-500 text-[10px] uppercase tracking-wider block">Shared Context Value</span>
            <span className="text-4xl font-extrabold text-cyan-300">{count}</span>
          </div>

          <div className="flex gap-2">
            <button
              onClick={increment}
              className="flex-1 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition-all"
            >
              + Increment Shared State
            </button>
            <button
              onClick={reset}
              className="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold rounded-lg transition-all"
            >
              Reset
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 4: LOGIC PLACEMENT MATRIX
    // =========================================================================
    function ExperimentLogicPlacementMatrix() {
      const rows = [
        { code: "formatCurrency(price, 'USD')", needsReact: false, best: "Pure Utility", reason: "Pure deterministic calculation; zero lifecycle or state." },
        { code: "useToggle(initial)", needsReact: true, best: "Custom Hook", reason: "Encapsulates useState with memoized open/close/toggle handlers." },
        { code: "useOnlineStatus()", needsReact: true, best: "Custom Hook", reason: "Subscribes to window 'online'/'offline' events via useEffect." },
        { code: "useCurrentUser()", needsReact: true, best: "Context Gateway", reason: "Global shared session identity required across disparate components." },
        { code: "calculateCartTax(items, rate)", needsReact: false, best: "Pure Utility", reason: "Framework-independent math; effortlessly unit-testable." }
      ];

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">📊 Experiment 4:</span> 5-Way Logic Placement Matrix
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Apply the "Would this exist without React?" test to choose the cleanest abstraction mechanism.
            </p>
          </div>

          <div className="glass-panel p-5 rounded-xl overflow-x-auto">
            <table className="w-full text-left text-xs font-mono">
              <thead>
                <tr className="border-b border-gray-800 text-gray-400">
                  <th className="pb-3">Candidate Logic Signature</th>
                  <th className="pb-3">Requires React?</th>
                  <th className="pb-3">Optimal Abstraction</th>
                  <th className="pb-3">Architectural Rationale</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-800/60">
                {rows.map((r, idx) => (
                  <tr key={idx} className="hover:bg-gray-800/30 transition-colors">
                    <td className="py-3 text-cyan-300 font-bold">{r.code}</td>
                    <td className="py-3">{r.needsReact ? <span className="text-emerald-400 font-bold">YES</span> : <span className="text-gray-500">NO</span>}</td>
                    <td className="py-3">
                      <span className="px-2 py-0.5 rounded bg-gray-900 border border-gray-800 text-white font-bold">
                        {r.best}
                      </span>
                    </td>
                    <td className="py-3 text-gray-300">{r.reason}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // =========================================================================
    // EXPERIMENT 5: DIAGNOSTIC GAUNTLET
    // =========================================================================
    function ExperimentDiagnosticGauntlet() {
      const questions = [
        {
          id: 1,
          q: "Do two components invoking the same custom Hook share the same state instance?",
          options: ["Yes, hooks are singletons", "No, each caller gets isolated Hook state"],
          correct: "No, each caller gets isolated Hook state"
        },
        {
          id: 2,
          q: "Does a custom Hook create a new Fiber node in the reconciliation tree?",
          options: ["No, it executes inline during the caller's render", "Yes, every hook is a sub-fiber"],
          correct: "No, it executes inline during the caller's render"
        },
        {
          id: 3,
          q: "When should logic be written as a pure utility function rather than a custom Hook?",
          options: ["When it doesn't need React state, effects, or refs", "When it is called more than 5 times"],
          correct: "When it doesn't need React state, effects, or refs"
        }
      ];

      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const score = questions.filter(q => answers[q.id] === q.correct).length;

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">🏆 Experiment 5:</span> KPI 14 Part 01 Diagnostic Gauntlet
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Verify your mental model of custom hook composition, state isolation, and execution lifecycles.
            </p>
          </div>

          <div className="space-y-4">
            {questions.map((q) => {
              const selected = answers[q.id];
              return (
                <div key={q.id} className="glass-panel p-4 rounded-xl space-y-2.5 font-mono text-xs">
                  <div className="text-white font-bold text-sm">{q.q}</div>
                  <div className="flex flex-wrap gap-2">
                    {q.options.map((opt) => (
                      <button
                        key={opt}
                        onClick={() => setAnswers(prev => ({ ...prev, [q.id]: opt }))}
                        className={`px-3 py-1.5 rounded-lg transition-all ${
                          selected === opt ? 'bg-cyan-600 text-white font-bold' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'
                        }`}
                      >
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          <div className="flex justify-between items-center glass-panel p-4 rounded-xl font-mono">
            <button
              onClick={() => setSubmitted(true)}
              className="px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs uppercase tracking-wider rounded-lg transition-all"
            >
              Submit Diagnostic Evaluation
            </button>
            {submitted && (
              <div className="text-sm font-bold text-white">
                Score: <span className={score === questions.length ? 'text-emerald-400' : 'text-amber-400'}>{score} / {questions.length}</span> — {score === questions.length ? '✅ Part 01 Mastered!' : 'Review Recommended'}
              </div>
            )}
          </div>
        </div>
      );
    }

    // Mount Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
