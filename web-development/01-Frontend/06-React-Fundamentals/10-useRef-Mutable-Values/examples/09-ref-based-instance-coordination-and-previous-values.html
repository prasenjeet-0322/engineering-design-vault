  <script type="text/babel">
    const { useState, useEffect, useLayoutEffect, useRef, useCallback } = React;

    // Custom useLatest Hook implementation
    function useLatest(value) {
      const ref = useRef(value);
      useLayoutEffect(() => {
        ref.current = value;
      });
      return ref;
    }

    // Custom usePrevious Hook implementation
    function usePrevious(value) {
      const ref = useRef(undefined);
      useEffect(() => {
        ref.current = value;
      }, [value]);
      return ref.current;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('stale'); // 'stale' | 'previous' | 'churn' | 'sequence' | 'hidden'

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">

          <header className="mb-8 border-b border-slate-800 pb-6">

                </div>

                  Instance Coordination & Previous Values
                </h1>
                <p className="text-slate-400 text-sm mt-1 max-w-3xl">
                  Explore how mutable ref containers bridge long-lived asynchronous closures, prevent subscription churn, track monotonic sequence tokens, and capture previous committed values without scheduling re-renders.
                </p>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 font-mono">
                  React 18 Concurrent
                </span>
                <a 
                  href="../09-ref-based-instance-coordination-and-previous-values.md" 
                  className="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-2 rounded-lg transition shadow-lg shadow-indigo-600/20 flex items-center gap-1.5"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                  </svg>
                  Read Architecture Guide
                </a>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="flex flex-wrap gap-2 mt-6">
              {[
                { id: 'stale', label: '1. Stale Closure vs useLatest Bridge', icon: '🌉' },
                { id: 'previous', label: '2. usePrevious Committed Inspector', icon: '⏪' },
                { id: 'churn', label: '3. Subscription Churn Benchmark', icon: '⚡' },
                { id: 'sequence', label: '4. Monotonic Request Sequence Token', icon: '🛡️' },
                { id: 'hidden', label: '5. Hidden State Anti-Pattern Trap', icon: '⚠️' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2.5 rounded-xl font-medium text-sm transition-all duration-200 flex items-center gap-2 ${
                    activeTab === tab.id
                      ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/25 border border-indigo-400/30'
                      : 'bg-slate-900/60 text-slate-400 hover:text-slate-200 hover:bg-slate-800/80 border border-slate-800'
                  }`}
                >

                  {tab.label}
                </button>
              ))}
            </nav>
          </header>

          {/* Tab Views */}
          <main>
            {activeTab === 'stale' && <StaleClosureLab />}
            {activeTab === 'previous' && <PreviousValueLab />}
            {activeTab === 'churn' && <SubscriptionChurnLab />}
            {activeTab === 'sequence' && <SequenceTokenLab />}
            {activeTab === 'hidden' && <HiddenStateLab />}
          </main>
        </div>
      );
    }

    // ==========================================
    // TAB 1: Stale Closure vs useLatest Bridge
    // ==========================================
    function StaleClosureLab() {
      const [count, setCount] = useState(0);
      const [timerRunning, setTimerRunning] = useState(false);
      const [logs, setLogs] = useState([]);

      const latestCount = useLatest(count);

      const addLog = (msg) => {
        setLogs(prev => [...prev.slice(-8), { time: performance.now().toFixed(1), text: msg }]);
      };

      const triggerAsyncOperation = () => {
        const capturedCount = count; // Closed over at invocation turn
        setTimerRunning(true);
        addLog(`⏳ Async 3s timer started with count = ${count}`);

        setTimeout(() => {
          setTimerRunning(false);
          addLog(`[3s Elapsed] Closed Snapshot saw: ${capturedCount} | useLatest ref saw: ${latestCount.current}`);
        }, 3000);
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Control Panel */}
            <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-5">
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>⚙️</span> Stale Closure Controller
              </h2>

              <div className="p-4 bg-slate-900/80 rounded-xl border border-slate-800 space-y-2">
                <span className="text-xs text-slate-400 uppercase font-semibold">Active State Counter</span>
                <div className="flex items-center justify-between">
                  <span className="text-3xl font-black text-white font-mono">{count}</span>
                  <button
                    onClick={() => setCount(c => c + 1)}
                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition shadow-lg shadow-indigo-600/20"
                  >
                    + Increment Count
                  </button>
                </div>
              </div>

              <div className="pt-2 border-t border-slate-800">
                <button
                  onClick={triggerAsyncOperation}
                  disabled={timerRunning}
                  className="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:opacity-50 text-white font-bold rounded-xl text-xs transition shadow-xl"
                >
                  {timerRunning ? 'Timer Active (Increment counter now!)...' : '🚀 Trigger 3-Second Async Timeout'}
                </button>
              </div>

              {/* Execution Log */}
              <div className="space-y-2">
                <div className="flex justify-between items-center text-xs font-semibold text-slate-400">
                  <span>Closure Execution Telemetry</span>
                  <button onClick={() => setLogs([])} className="text-slate-500 hover:text-slate-300">Clear</button>
                </div>
                <div className="bg-slate-950/90 rounded-xl p-3 border border-slate-800/80 font-mono text-xs space-y-1 h-36 overflow-y-auto custom-scrollbar">
                  {logs.length === 0 ? (
                    <span className="text-slate-600">No timeout dispatched yet...</span>
                  ) : (
                    logs.map((log, i) => (
                      <div key={i} className="text-slate-300 leading-tight">
                        <span className="text-indigo-400">+{log.time}ms</span>: {log.text}
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>

            {/* Visual Architecture Stage */}
            <div className="glass-card rounded-2xl p-6 border border-slate-800 lg:col-span-2 flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-white mb-1">Lexical Closure vs Mutable Ref Comparison</h3>
                <p className="text-xs text-slate-400 mb-6">Observe how traditional closures freeze the initial snapshot while useLatest bridges currentness</p>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {/* Left Box: Stale Lexical Closure */}
                  <div className="p-5 rounded-2xl bg-rose-950/20 border border-rose-500/30 space-y-3">
                    <div className="flex justify-between items-center">
                      <h4 className="text-xs font-bold text-rose-400 uppercase tracking-wider">Lexical Scope Closure</h4>
                      <span className="text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded font-mono">FROZEN</span>
                    </div>
                    <div className="text-2xl font-mono font-black text-slate-300">
                      Value: <span className="text-rose-400">{timerRunning ? logs[logs.length-1]?.text.match(/count = (\d+)/)?.[1] ?? count : count}</span>
                    </div>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      Captured during render turn when timeout was initiated. If state updates while the timeout is pending, this closure cannot observe the change.
                    </p>
                  </div>

                  {/* Right Box: useLatest Ref Container */}
                  <div className="p-5 rounded-2xl bg-emerald-950/20 border border-emerald-500/30 space-y-3">
                    <div className="flex justify-between items-center">
                      <h4 className="text-xs font-bold text-emerald-400 uppercase tracking-wider">useLatest Ref Bridge</h4>
                      <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-mono">LIVE</span>
                    </div>
                    <div className="text-2xl font-mono font-black text-slate-300">
                      Value: <span className="text-emerald-400">{latestCount.current}</span>
                    </div>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      Maintains a stable pointer to heap memory. When state updates, useLayoutEffect mutates <code className="text-emerald-300">ref.current</code> synchronously.
                    </p>
                  </div>
                </div>
              </div>

              <div className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 text-xs text-slate-400 mt-6">
                💡 <strong>Senior Principle:</strong> Use closures when you need the historical render snapshot; use <code className="text-indigo-400">useLatest</code> when long-lived async code requires the freshest instance state.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TAB 2: usePrevious Committed Inspector
    // ==========================================
    function PreviousValueLab() {
      const [stage, setStage] = useState('Draft');
      const prevStage = usePrevious(stage);
      const [history, setHistory] = useState([]);

      const handleStageChange = (nextStage) => {
        setHistory(prev => [...prev.slice(-6), { from: stage, to: nextStage, time: new Date().toLocaleTimeString() }]);
        setStage(nextStage);
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Control Panel */}
            <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-5">
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>⏪</span> Stage Transition Controller
              </h2>

              <div className="space-y-2">
                <label className="text-xs font-semibold text-slate-400 uppercase">Select Target Stage</label>
                <div className="grid grid-cols-2 gap-2">
                  {['Draft', 'Review', 'Approved', 'Published', 'Archived'].map(s => (
                    <button
                      key={s}
                      onClick={() => handleStageChange(s)}
                      className={`px-3 py-2 text-xs font-bold rounded-xl border transition ${
                        stage === s 
                          ? 'bg-indigo-600 text-white border-indigo-400/50 shadow-lg shadow-indigo-600/25' 
                          : 'bg-slate-900 text-slate-400 hover:text-white border-slate-800'
                      }`}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </div>

              <div className="space-y-2 pt-2 border-t border-slate-800">
                <span className="text-xs font-semibold text-slate-400">Transition Event Audit Log</span>
                <div className="bg-slate-950/90 rounded-xl p-3 border border-slate-800 font-mono text-xs space-y-1 max-h-40 overflow-y-auto custom-scrollbar">
                  {history.length === 0 ? (
                    <span className="text-slate-600">No transitions recorded yet...</span>
                  ) : (
                    history.map((h, i) => (
                      <div key={i} className="text-slate-300">
                        <span className="text-indigo-400">{h.time}</span>: "{h.from}" ➔ "{h.to}"
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>

            {/* Visualizer Stage */}
            <div className="glass-card rounded-2xl p-6 border border-slate-800 lg:col-span-2 flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-white mb-1">Committed Frame Delta Inspector</h3>
                <p className="text-xs text-slate-400 mb-6">Verify that usePrevious holds the value from the immediately preceding committed render turn</p>

                <div className="flex flex-col sm:flex-row items-center justify-center gap-6 py-6">
                  {/* Previous State Box */}
                  <div className="w-full sm:w-1/2 p-6 rounded-2xl bg-slate-900/90 border border-slate-800 text-center space-y-2">
                    <span className="text-xs font-mono text-slate-400 uppercase tracking-wider block">Previous Frame (usePrevious)</span>
                    <div className="text-2xl font-black text-indigo-400 font-mono">
                      {prevStage ?? '<Initial Mount>'}
                    </div>
                    <span className="text-[11px] text-slate-500">Stored via useEffect post-commit</span>
                  </div>

                  <div className="text-2xl text-slate-600">➔</div>

                  {/* Current State Box */}
                  <div className="w-full sm:w-1/2 p-6 rounded-2xl bg-gradient-to-br from-indigo-950/40 to-slate-900 border border-indigo-500/40 text-center space-y-2 shadow-xl shadow-indigo-950/30">
                    <span className="text-xs font-mono text-emerald-400 uppercase tracking-wider block">Current Frame (useState)</span>
                    <div className="text-2xl font-black text-white font-mono">
                      {stage}
                    </div>
                    <span className="text-[11px] text-indigo-300">Render-visible active state</span>
                  </div>
                </div>
              </div>

              <div className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 text-xs text-slate-400">
                🔬 <strong>Mechanics:</strong> During render execution, <code className="text-indigo-300">ref.current</code> still contains the previous value. After the DOM commit completes, <code className="text-indigo-300">useEffect</code> updates the ref for the next turn.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TAB 3: Subscription Churn Benchmark
    // ==========================================
    function SubscriptionChurnLab() {
      const [filter, setFilter] = useState('');
      const [telemetry, setTelemetry] = useState({ naiveCount: 0, optimizedCount: 0 });

      // Naive subscription effect: Re-runs and re-attaches listener on every single keystroke!
      useEffect(() => {
        setTelemetry(t => ({ ...t, naiveCount: t.naiveCount + 1 }));
        const handler = () => {};
        window.addEventListener('naive-stream', handler);
        return () => window.removeEventListener('naive-stream', handler);
      }, [filter]);

      // Optimized subscription effect: Stable ref identity, zero reconnect churn!
      const latestFilter = useLatest(filter);
      useEffect(() => {
        setTelemetry(t => ({ ...t, optimizedCount: t.optimizedCount + 1 }));
        const handler = () => {
          console.log("Filtered with latest:", latestFilter.current);
        };
        window.addEventListener('optimized-stream', handler);
        return () => window.removeEventListener('optimized-stream', handler);
      }, [latestFilter]);

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Input Panel */}
            <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-5">
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>⚡</span> Churn Simulator
              </h2>

              <div className="space-y-2">
                <label className="text-xs font-semibold text-slate-400 uppercase">Type to simulate rapid prop/state changes</label>
                <input
                  type="text"
                  value={filter}
                  onChange={e => setFilter(e.target.value)}
                  placeholder="Type rapidly here..."
                  className="w-full px-4 py-3 bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-xl text-sm text-white font-mono outline-none"
                />
              </div>

              <div className="pt-2 border-t border-slate-800 flex gap-2">
                <button
                  onClick={() => setFilter('')}
                  className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl transition"
                >
                  Clear Input
                </button>
              </div>

              <div className="p-3 bg-slate-950/60 rounded-xl border border-slate-800 text-xs text-slate-400 leading-relaxed">
                Keystrokes trigger React render passes. Observe how naive effect dependencies destroy and recreate subscriptions on every single character.
              </div>
            </div>

            {/* Benchmark Metrics */}
            <div className="glass-card rounded-2xl p-6 border border-slate-800 lg:col-span-2 flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-white mb-4">Subscription Lifecycle Registration Benchmark</h3>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {/* Naive Churn Card */}
                  <div className="p-6 rounded-2xl bg-rose-950/20 border border-rose-500/30 space-y-3">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold text-rose-400 uppercase tracking-wider">Naive Dependency Array</span>
                      <span className="text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded font-mono">CHURNING</span>
                    </div>
                    <div className="text-4xl font-black text-rose-400 font-mono">
                      {telemetry.naiveCount}
                    </div>
                    <p className="text-xs text-slate-400">
                      Total WebSocket / Listener reconnects. Causes high CPU load, TLS re-handshakes, and dropped frames.
                    </p>
                  </div>

                  {/* Optimized useLatest Card */}
                  <div className="p-6 rounded-2xl bg-emerald-950/20 border border-emerald-500/30 space-y-3">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">useLatest Ref Bridge</span>
                      <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-mono">OPTIMAL</span>
                    </div>
                    <div className="text-4xl font-black text-emerald-400 font-mono">
                      {telemetry.optimizedCount}
                    </div>
                    <p className="text-xs text-slate-400">
                      Total subscriptions registered. Initialized once on mount and remains stable for component lifetime.
                    </p>
                  </div>
                </div>
              </div>

              <div className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 text-xs text-slate-400 mt-6">
                ⚡ <strong>Production Benchmark:</strong> In high-frequency tickers, eliminating effect churn reduces garbage collection cycles by up to 85%.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TAB 4: Monotonic Request Sequence Token
    // ==========================================
    function SequenceTokenLab() {
      const [query, setQuery] = useState('');
      const [displayedResult, setDisplayedResult] = useState('Initial Data');
      const [logs, setLogs] = useState([]);

      const requestSeqRef = useRef(0);

      const triggerSearch = (searchTerm, latencyMs) => {
        const token = ++requestSeqRef.current;
        setQuery(searchTerm);
        
        setLogs(prev => [...prev, {
          id: token,
          text: `[Request #${token}] Dispatched query "${searchTerm}" (Simulated Latency: ${latencyMs}ms)`,
          type: 'info'
        }]);

        setTimeout(() => {
          if (token === requestSeqRef.current) {
            setDisplayedResult(`Results for "${searchTerm}" (Token #${token})`);
            setLogs(prev => [...prev, {
              id: token + '-done',
              text: `✅ [Request #${token}] APPLIED: Token is authoritative (current === ${token})`,
              type: 'success'
            }]);
          } else {
            setLogs(prev => [...prev, {
              id: token + '-stale',
              text: `🛑 [Request #${token}] DISCARDED: Stale response (current sequence is #${requestSeqRef.current})`,
              type: 'warning'
            }]);
          }
        }, latencyMs);
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Control Panel */}
            <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-5">
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>🛡️</span> Race Condition Simulator
              </h2>

              <div className="space-y-3">
                <button
                  onClick={() => triggerSearch('Slow Alice', 2500)}
                  className="w-full py-2.5 bg-amber-600/80 hover:bg-amber-500 text-white font-semibold rounded-xl text-xs transition flex justify-between px-4 items-center"
                >
                  <span>1. Dispatch Slow Query "Alice"</span>
                  <span className="font-mono bg-amber-900/60 px-2 py-0.5 rounded text-[10px]">2500ms</span>
                </button>

                <button
                  onClick={() => triggerSearch('Fast Bob', 600)}
                  className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs transition flex justify-between px-4 items-center"
                >
                  <span>2. Dispatch Fast Query "Bob"</span>
                  <span className="font-mono bg-indigo-900/60 px-2 py-0.5 rounded text-[10px]">600ms</span>
                </button>
              </div>

              <div className="pt-2 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400 font-mono">
                <span>Authoritative Token:</span>
                <span className="text-indigo-400 font-bold bg-indigo-500/10 px-2.5 py-1 rounded border border-indigo-500/30">
                  #{requestSeqRef.current}
                </span>
              </div>
            </div>

            {/* Results & Audit Stream */}
            <div className="glass-card rounded-2xl p-6 border border-slate-800 lg:col-span-2 flex flex-col justify-between">
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-sm font-bold text-white">Active Displayed Result</h3>
                  <span className="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-mono">
                    {displayedResult}
                  </span>
                </div>

                <div className="space-y-2">
                  <span className="text-xs font-semibold text-slate-400">Asynchronous Resolution Log</span>
                  <div className="bg-slate-950/90 rounded-xl p-3 border border-slate-800 font-mono text-xs space-y-1.5 h-48 overflow-y-auto custom-scrollbar">
                    {logs.length === 0 ? (
                      <span className="text-slate-600">Click buttons to trigger out-of-order responses...</span>
                    ) : (
                      logs.map(log => (
                        <div 
                          key={log.id} 
                          className={`p-1.5 rounded ${
                            log.type === 'success' ? 'text-emerald-300 bg-emerald-950/30 border border-emerald-500/20' :
                            log.type === 'warning' ? 'text-amber-300 bg-amber-950/30 border border-amber-500/20' :
                            'text-slate-300'
                          }`}
                        >
                          {log.text}
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>

              <div className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 text-xs text-slate-400 mt-4">
                🛡️ <strong>Senior Pattern:</strong> Incrementing an instance sequence token ref on every fetch eliminates network race conditions without third-party libraries.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TAB 5: Hidden State Anti-Pattern Trap
    // ==========================================
    function HiddenStateLab() {
      const queryRef = useRef('');
      const [stateQuery, setStateQuery] = useState('');
      const [, forceRerender] = useState({});

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Left: Ref Anti-Pattern */}
            <div className="glass-card rounded-2xl p-6 border border-rose-500/30 bg-rose-950/10 space-y-4">
              <div className="flex justify-between items-center">
                <h3 className="text-sm font-bold text-rose-400">❌ Anti-Pattern: UI State in a Ref</h3>
                <span className="text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded font-mono">BROKEN</span>
              </div>

              <div className="space-y-2">
                <label className="text-xs text-slate-400">Type into this input (mutates ref.current only):</label>
                <input
                  type="text"
                  onChange={e => { queryRef.current = e.target.value; }}
                  placeholder="Type here..."
                  className="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white font-mono outline-none"
                />
              </div>

              <div className="p-4 bg-slate-950/80 rounded-xl border border-slate-800 space-y-1">
                <span className="text-[10px] text-slate-500 uppercase font-mono">Rendered Paragraph Output</span>
                <div className="text-base font-bold text-slate-300">
                  Preview: <span className="text-rose-400">"{queryRef.current}"</span>
                </div>
                <span className="text-[10px] text-rose-400/80 block">⚠️ Notice: This preview NEVER updates while you type!</span>
              </div>

              <button
                onClick={() => forceRerender({})}
                className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl transition"
              >
                Force Unrelated Re-render (Reveals delayed ref value)
              </button>
            </div>

            {/* Right: Proper useState */}
            <div className="glass-card rounded-2xl p-6 border border-emerald-500/30 bg-emerald-950/10 space-y-4">
              <div className="flex justify-between items-center">
                <h3 className="text-sm font-bold text-emerald-400">✅ Senior Pattern: Reactive State</h3>
                <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-mono">CORRECT</span>
              </div>

              <div className="space-y-2">
                <label className="text-xs text-slate-400">Type into this input (calls setState):</label>
                <input
                  type="text"
                  value={stateQuery}
                  onChange={e => setStateQuery(e.target.value)}
                  placeholder="Type here..."
                  className="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white font-mono outline-none"
                />
              </div>

              <div className="p-4 bg-slate-950/80 rounded-xl border border-slate-800 space-y-1">
                <span className="text-[10px] text-slate-500 uppercase font-mono">Rendered Paragraph Output</span>
                <div className="text-base font-bold text-white">
                  Preview: <span className="text-emerald-400">"{stateQuery}"</span>
                </div>
                <span className="text-[10px] text-emerald-400/80 block">✅ Perfectly reactive in real-time.</span>
              </div>

              <div className="p-2 text-xs text-slate-400 text-center">
                State dispatch notifies React Fiber WorkLoop to reconcile DOM.
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
