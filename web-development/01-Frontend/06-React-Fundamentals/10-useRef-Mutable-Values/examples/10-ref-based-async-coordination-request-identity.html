    // ==========================================
    // TAB 1: Out-of-Order Race Telemetry
    // ==========================================
    function RaceLab() {
      const [displayedResult, setDisplayedResult] = useState('Default Query Results');
      const [guardEnabled, setGuardEnabled] = useState(true);
      const [logs, setLogs] = useState([]);
      const generationRef = useRef(0);

      const dispatchSearch = (query, latencyMs) => {
        const token = ++generationRef.current;

        setLogs(prev => [...prev.slice(-8), {
          id: token + '-start',
          text: `[t=0ms] Dispatched "${query}" (Token #${token}, Latency: ${latencyMs}ms)`,
          type: 'info'
        }]);

        setTimeout(() => {
          if (guardEnabled) {
            // Guarded implementation: only apply if token matches current generation
            if (token === generationRef.current) {
              setDisplayedResult(`"${query}" (Token #${token})`);
              setLogs(prev => [...prev.slice(-8), {
                id: token + '-done',
                text: `✅ [t=${latencyMs}ms] APPLIED: Token #${token} === current (${generationRef.current})`,
                type: 'success'
              }]);
            } else {
              setLogs(prev => [...prev.slice(-8), {
                id: token + '-discard',
                text: `🛑 [t=${latencyMs}ms] DISCARDED: Token #${token} was superseded by Token #${generationRef.current}`,
                type: 'warning'
              }]);
            }
          } else {
            // Unguarded implementation: blindly overwrite state!
            setDisplayedResult(`"${query}" (Token #${token})`);
            setLogs(prev => [...prev.slice(-8), {
              id: token + '-blind',
              text: `💥 [t=${latencyMs}ms] BLIND OVERWRITE: "${query}" applied unconditionally!`,
              type: 'danger'
            }]);
          }
        }, latencyMs);
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Control Panel */}
            <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-5">
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>⚙️</span> Dispatch Controller
              </h2>

              <div className="space-y-2">
                <label className="text-xs font-semibold text-slate-400 uppercase">Concurrency Defense Guard</label>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => setGuardEnabled(true)}
                    className={`px-3 py-2 text-xs font-bold rounded-xl border transition ${
                      guardEnabled 
                        ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' 
                        : 'bg-slate-900 text-slate-400 border-slate-800'
                    }`}
                  >
                    Guard ON (Safe)
                  </button>
                  <button
                    onClick={() => setGuardEnabled(false)}
                    className={`px-3 py-2 text-xs font-bold rounded-xl border transition ${
                      !guardEnabled 
                        ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' 
                        : 'bg-slate-900 text-slate-400 border-slate-800'
                    }`}
                  >
                    Guard OFF (Buggy)
                  </button>
                </div>
              </div>

              <div className="space-y-2 pt-2 border-t border-slate-800">
                <button
                  onClick={() => dispatchSearch('Slow Search "A"', 2200)}
                  className="w-full py-2.5 bg-amber-600/80 hover:bg-amber-500 text-white font-semibold rounded-xl text-xs transition flex justify-between px-4 items-center"
                >
                  <span>1. Dispatch Slow Query "A"</span>
                  <span className="font-mono bg-amber-900/60 px-2 py-0.5 rounded text-[10px]">2200ms</span>
                </button>

                <button
                  onClick={() => dispatchSearch('Fast Search "B"', 500)}
                  className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs transition flex justify-between px-4 items-center"
                >
                  <span>2. Dispatch Fast Query "B"</span>
                  <span className="font-mono bg-indigo-900/60 px-2 py-0.5 rounded text-[10px]">500ms</span>
                </button>
              </div>

              <div className="pt-2 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400 font-mono">
                <span>Active Generation Token:</span>
                <span className="text-indigo-400 font-bold bg-indigo-500/10 px-2.5 py-1 rounded border border-indigo-500/30">
                  #{generationRef.current}
                </span>
              </div>
            </div>

            {/* Visual Telemetry Stage */}
            <div className="glass-card rounded-2xl p-6 border border-slate-800 lg:col-span-2 flex flex-col justify-between">
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-sm font-bold text-white">Active UI State Result</h3>
                  <span className="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-lg border border-indigo-500/30 font-mono font-bold">
                    {displayedResult}
                  </span>
                </div>

                <div className="space-y-2">
                  <span className="text-xs font-semibold text-slate-400">Execution Telemetry Stream</span>

                    ) : (

                            log.type === 'warning' ? 'text-amber-300 bg-amber-950/30 border border-amber-500/20' :

                        >

                      ))
                    )}

                </div>
              </div>

              <div className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 text-xs text-slate-400 mt-4">
                🔬 <strong>Instructions:</strong> Click "Slow Query A", then immediately click "Fast Query B". With Guard ON, Query A's late resolution is discarded. With Guard OFF, Query A overwrites Query B 1.7 seconds later!
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TAB 2: The Unguarded finally Bug
    // ==========================================
    function FinallyLab() {
      const [loading, setLoading] = useState(false);
      const [activeResult, setActiveResult] = useState('Idle');
      const [mode, setMode] = useState('buggy'); // 'buggy' | 'fixed'
      const genRef = useRef(0);

      const runRequest = (name, delayMs) => {
        const token = ++genRef.current;
        setLoading(true);

        setTimeout(() => {
          if (mode === 'buggy') {
            // Buggy finally pattern: setLoading(false) executes regardless of token currentness
            if (token === genRef.current) {
              setActiveResult(`Loaded ${name} (Token #${token})`);
            }
            setLoading(false); // 💥 BUG: premature loading termination!
          } else {
            // Fixed pattern: only update state and clear loading if token is authoritative
            if (token === genRef.current) {
              setActiveResult(`Loaded ${name} (Token #${token})`);
              setLoading(false);
            }
          }
        }, delayMs);
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-5">
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>⏳</span> Finally Race Controller
              </h2>

              <div className="space-y-2">
                <label className="text-xs font-semibold text-slate-400 uppercase">Architecture Mode</label>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => setMode('buggy')}
                    className={`px-3 py-2 text-xs font-bold rounded-xl border transition ${
                      mode === 'buggy' ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' : 'bg-slate-900 text-slate-400 border-slate-800'
                    }`}
                  >
                    Buggy finally
                  </button>
                  <button
                    onClick={() => setMode('fixed')}
                    className={`px-3 py-2 text-xs font-bold rounded-xl border transition ${
                      mode === 'fixed' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : 'bg-slate-900 text-slate-400 border-slate-800'
                    }`}
                  >
                    Guarded finally
                  </button>
                </div>
              </div>

              <div className="space-y-2 pt-2 border-t border-slate-800">
                <button
                  onClick={() => runRequest('Heavy Dataset A', 2000)}
                  className="w-full py-2.5 bg-amber-600/80 hover:bg-amber-500 text-white font-semibold rounded-xl text-xs transition flex justify-between px-4 items-center"
                >
                  <span>1. Start Slow A (2000ms)</span>
                  <span className="font-mono bg-amber-900/60 px-2 py-0.5 rounded text-[10px]">2000ms</span>
                </button>

                <button
                  onClick={() => runRequest('Quick Dataset B', 500)}
                  className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs transition flex justify-between px-4 items-center"
                >
                  <span>2. Start Fast B (500ms)</span>
                  <span className="font-mono bg-indigo-900/60 px-2 py-0.5 rounded text-[10px]">500ms</span>
                </button>
              </div>
            </div>

            <div className="glass-card rounded-2xl p-6 border border-slate-800 lg:col-span-2 flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-white mb-4">Loading State & Content Presentation</h3>

                <div className="grid grid-cols-2 gap-4 mb-6">
                  <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800 space-y-1">
                    <span className="text-xs text-slate-400">Loading Spinner State:</span>
                    <div className="flex items-center gap-2">
                      <span className={`w-3 h-3 rounded-full ${loading ? 'bg-amber-400 animate-ping' : 'bg-emerald-400'}`}></span>
                      <span className="font-mono font-bold text-white">{loading ? 'LOADING...' : 'IDLE'}</span>
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800 space-y-1">
                    <span className="text-xs text-slate-400">Active Result:</span>
                    <div className="font-mono font-bold text-indigo-400">{activeResult}</div>
                  </div>
                </div>

                <div className="p-4 bg-slate-950/80 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-2">
                  <p><strong>The Buggy Sequence:</strong></p>
                  <p className="text-slate-400">
                    If Request A completes and runs <code className="text-rose-400">setLoading(false)</code> in its unguarded finally block while Request B is still running, the UI prematurely hides the spinner, confusing the user into thinking data has loaded.
                  </p>
                </div>
              </div>

              <div className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 text-xs text-slate-400 mt-4">
                🛡️ <strong>Senior Rule:</strong> Never place <code className="text-indigo-400">setLoading(false)</code> in an unconditional finally block without validating token currentness.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TAB 3: AbortController Stream Inspector
    // ==========================================
    function AbortLab() {
      const [status, setStatus] = useState('idle');
      const [logList, setLogList] = useState([]);
      const abortRef = useRef(null);
      const tokenRef = useRef(0);

      const triggerFetch = async () => {
        if (abortRef.current) {
          abortRef.current.abort();
          setLogList(prev => [...prev.slice(-6), `🛑 Aborted prior request in flight!`]);
        }

        const controller = new AbortController();
        abortRef.current = controller;
        const token = ++tokenRef.current;
        setStatus('loading');
        setLogList(prev => [...prev.slice(-6), `🚀 Dispatched Request #${token}`]);

        try {
          // Fetch heavy JSON payload
          const res = await fetch('https://jsonplaceholder.typicode.com/photos', { signal: controller.signal });
          const json = await res.json();
          if (token === tokenRef.current) {
            setStatus(`Fetched ${json.length} records (Token #${token})`);
            setLogList(prev => [...prev.slice(-6), `✅ Request #${token} resolved successfully!`]);
          }
        } catch (err) {
          if (err.name === 'AbortError') {
            setLogList(prev => [...prev.slice(-6), `⚡ Request #${token} canceled via AbortSignal.`]);
          } else {
            setStatus(`Error: ${err.message}`);
          }
        }
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-5">
              <h2 className="text-lg font-bold text-white flex items-center gap-2">
                <span>🛑</span> Abort Controller
              </h2>

              <button
                onClick={triggerFetch}
                className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs transition shadow-lg shadow-indigo-600/25"
              >
                Trigger Heavy Fetch (Click rapidly!)
              </button>

              <div className="p-3 bg-slate-950/60 rounded-xl border border-slate-800 text-xs text-slate-400">
                Inspect Chrome DevTools Network tab to observe real canceled HTTP streams (shown in red).
              </div>
            </div>

            <div className="glass-card rounded-2xl p-6 border border-slate-800 lg:col-span-2 flex flex-col justify-between">
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-sm font-bold text-white">Active Stream Status</h3>
                  <span className="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded font-mono font-bold">
                    {status}
                  </span>
                </div>

                <div className="space-y-2">
                  <span className="text-xs font-semibold text-slate-400">Network Event Log</span>
                  <div className="bg-slate-950/90 rounded-xl p-3 border border-slate-800 font-mono text-xs space-y-1.5 h-44 overflow-y-auto custom-scrollbar">
                    {logList.map((l, i) => (
                      <div key={i} className="text-slate-300">{l}</div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 text-xs text-slate-400 mt-4">
                ⚡ <strong>Performance Benefit:</strong> <code className="text-indigo-400">AbortController</code> closes browser TCP socket streams immediately, freeing client bandwidth for subsequent requests.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TAB 4: Entity-Scoped Concurrency Grid
    // ==========================================
    function ScopedGridLab() {
      const [items, setItems] = useState([
        { id: 'sku-1', name: 'MacBook Pro M3 Max', stock: 12, status: 'idle' },
        { id: 'sku-2', name: 'Dell XPS 15 OLED', stock: 24, status: 'idle' },
        { id: 'sku-3', name: 'ThinkPad X1 Carbon', stock: 7, status: 'idle' },
      ]);

      const generationsRef = useRef(new Map());

      const refreshCard = (id, latencyMs) => {
        const nextToken = (generationsRef.current.get(id) ?? 0) + 1;
        generationsRef.current.set(id, nextToken);

        setItems(prev => prev.map(item => item.id === id ? { ...item, status: 'loading' } : item));

        setTimeout(() => {
          if (generationsRef.current.get(id) === nextToken) {
            setItems(prev => prev.map(item => item.id === id ? { 
              ...item, 
              stock: Math.floor(Math.random() * 40) + 1, 
              status: 'idle' 
            } : item));
          } else {
            console.debug(`[Scoped Registry] Discarded stale token #${nextToken} for ${id}`);
          }
        }, latencyMs);
      };

      return (
        <div className="space-y-6">
          <div className="glass-card rounded-2xl p-6 border border-slate-800">
            <h3 className="text-sm font-bold text-white mb-2">Entity-Scoped Independent Concurrency Grid</h3>
            <p className="text-xs text-slate-400 mb-6">Each card manages an independent generation token in a <code className="text-indigo-300">Map&lt;EntityID, number&gt;</code> ref registry.</p>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {items.map(item => (
                <div key={item.id} className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-3 shadow-lg">
                  <div className="flex justify-between items-start">
                    <h4 className="font-bold text-white text-sm">{item.name}</h4>
                    <span className="text-[10px] font-mono text-slate-400 bg-slate-800 px-2 py-0.5 rounded">{item.id}</span>
                  </div>

                  <div className="flex items-center justify-between">
                    <span className="text-xs text-slate-400">Stock Count:</span>
                    <span className="text-xl font-black text-emerald-400 font-mono">{item.stock} units</span>
                  </div>

                  <div className="flex items-center justify-between text-xs text-slate-400">
                    <span>Card Status:</span>
                    <span className={`font-mono font-bold ${item.status === 'loading' ? 'text-amber-400 animate-pulse' : 'text-slate-300'}`}>
                      {item.status.toUpperCase()}
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-2">
                    <button
                      onClick={() => refreshCard(item.id, 2000)}
                      className="px-3 py-1.5 bg-amber-600/80 hover:bg-amber-500 text-white font-semibold text-xs rounded-lg transition"
                    >
                      Slow (2s)
                    </button>
                    <button
                      onClick={() => refreshCard(item.id, 400)}
                      className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-lg transition"
                    >
                      Fast (0.4s)
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TAB 5: Mutation Mutex & Idempotency
    // ==========================================
    function MutexLab() {
      const [orderStatus, setOrderStatus] = useState('idle');
      const [charges, setCharges] = useState(0);
      const isLockedRef = useRef(false);
      const idempotencyKeyRef = useRef(crypto.randomUUID());

      const submitPayment = async () => {
        // Mutex gate: prevent parallel triggers
        if (isLockedRef.current) {
          alert('⚠️ Mutex Block: Payment already in flight!');
          return;
        }

        isLockedRef.current = true;
        setOrderStatus('processing');

        // Simulate server payment call with idempotency token
        setTimeout(() => {
          setCharges(c => c + 1);
          setOrderStatus('confirmed');
          isLockedRef.current = false;
          // Refresh key for next payment
          idempotencyKeyRef.current = crypto.randomUUID();
        }, 1200);
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-5">
              <h3 className="text-sm font-bold text-white">Payment Checkout Gate</h3>
              <p className="text-xs text-slate-400">Double-click rapidly to test mutex locking protection against duplicate charges.</p>

              <button
                onClick={submitPayment}
                disabled={orderStatus === 'processing'}
                className="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 disabled:opacity-50 text-white font-extrabold text-sm rounded-xl shadow-xl shadow-emerald-900/30 transition"
              >
                {orderStatus === 'processing' ? 'Processing Charge...' : '💳 Pay $250 (Double-Click Attack Test)'}
              </button>

              <div className="p-3 bg-slate-950/80 rounded-xl border border-slate-800 font-mono text-xs space-y-1">
                <span className="text-slate-500 text-[10px] uppercase">Active Idempotency Key:</span>
                <div className="text-indigo-400 truncate">{idempotencyKeyRef.current}</div>
              </div>
            </div>

            <div className="glass-card rounded-2xl p-6 border border-slate-800 space-y-4">
              <h3 className="text-sm font-bold text-white">Confirmed Transactions Ledger</h3>

              <div className="p-6 bg-slate-900/80 rounded-2xl border border-slate-800 text-center space-y-2">
                <span className="text-xs text-slate-400 uppercase tracking-wider">Total Confirmed Charges</span>
                <div className="text-4xl font-black text-emerald-400 font-mono">
                  ${charges * 250}
                </div>
                <span className="text-xs text-slate-500 font-mono">({charges} charges processed)</span>
              </div>

              <div className="bg-slate-900/60 rounded-xl p-3 border border-slate-800 text-xs text-slate-400">
                🔒 <strong>Destructive Mutation Invariant:</strong> Never use latest-wins on financial mutations. Enforce client mutex gates and transmit server-side idempotency keys.
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
