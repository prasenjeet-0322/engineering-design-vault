<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI 10 — Part 01: useRef Mental Model & Identity Mechanics Lab</title>
  
  <!-- React 18 & Babel via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #080d1a;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 24px;
    }
    
    .container {
      max-width: 1540px;
      margin: 0 auto;
    }
    
    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .badge-gold {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    
    .badge-stable {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    
    .layout-grid {
      display: grid;
      grid-template-columns: 360px 1fr 380px;
      gap: 20px;
    }
    
    @media (max-width: 1240px) {
      .layout-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(12px);
    }
    
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 8px;
    }
    
    .control-group {
      margin-bottom: 16px;
    }
    
    .control-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    
    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      user-select: none;
    }
    
    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border-color: #38bdf8;
      color: white;
    }
    
    .btn-emerald {
      background: linear-gradient(135deg, #059669, #10b981);
      border-color: #34d399;
      color: white;
    }

    .btn-amber {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fda4af;
    }
    
    .btn-sm {
      padding: 4px 8px;
      font-size: 0.75rem;
    }
    
    .stats-bar {
      display: flex;
      gap: 16px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      border: 1px solid var(--card-border);
      flex-wrap: wrap;
    }
    
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    
    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    
    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent-cyan);
    }
    
    .memory-diagram {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    .memory-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .memory-tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .tag-fiber { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .tag-hook { background: rgba(139, 92, 246, 0.2); color: #c084fc; }
    .tag-ref { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .tag-state { background: rgba(245, 158, 11, 0.2); color: #fde047; }
    .tag-dom { background: rgba(244, 63, 94, 0.2); color: #fda4af; }

    .cell-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    .log-container {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      background: #040711;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      height: 480px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-entry {
      line-height: 1.4;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      padding-bottom: 4px;
    }

    .log-time { color: #64748b; }
    .log-tag { font-weight: 700; }
    .tag-mount { color: #10b981; }
    .tag-unmount { color: #ef4444; }
    .tag-mutate { color: #38bdf8; }
    .tag-render { color: #f59e0b; }
    .tag-dom { color: #c084fc; }
    .tag-async { color: #ec4899; }

    .alert-banner {
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #67e8f9;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect, useLayoutEffect, useCallback } = React;

    function UseRefMentalModelHub() {
      const [instanceKey, setInstanceKey] = useState("session-A");
      const [parentTick, setParentTick] = useState(0);

      const [logs, setLogs] = useState([]);
      const addLog = useCallback((tag, message, tagClass = "tag-mutate") => {
        const time = new Date().toLocaleTimeString().split(" ")[0] + "." + Math.floor(Date.now() % 1000).toString().padStart(3, "0");
        setLogs(prev => [{ id: crypto.randomUUID(), time, tag, message, tagClass }, ...prev.slice(0, 99)]);
      }, []);

      const handleChangeKey = () => {
        const next = instanceKey === "session-A" ? "session-B" : "session-A";
        setInstanceKey(next);
        addLog("KEY_CHANGE", `Switched Component Key to ${next} ➔ Triggers Remount & New Ref Container!`, "tag-unmount");
      };

      return (
        <div className="container">
          <header>
            <div>
              <h1>
                <span>🔬</span> useRef Mental Model & Identity Mechanics
              </h1>
              <p style={{ color: "var(--text-muted)", fontSize: "0.85rem", marginTop: "4px" }}>
                Level 06 · KPI 10 · Part 01: Fiber Memory Linked Lists, Non-Reactive Mutation & Commit Attachment
              </p>
            </div>
            <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
              <span className="badge badge-gold">KPI 10 · Part 01</span>
              <span className="badge badge-stable">Key: {instanceKey}</span>
            </div>
          </header>

          <div className="layout-grid">
            <div className="card">
              <div className="card-title">
                <span>⚙️</span> Interactive Controls
              </div>

              <div className="control-group">
                <label>Parent Render Trigger</label>
                <button 
                  className="btn btn-primary" 
                  style={{ width: "100%" }}
                  onClick={() => { setParentTick(t => t + 1); addLog("PARENT_RENDER", "Forced parent rerender via useState", "tag-render"); }}
                >
                  🔄 Force Parent Rerender (Tick: {parentTick})
                </button>
              </div>

              <div className="control-group">
                <label>Component Identity (Key Reset)</label>
                <button 
                  className="btn btn-warning" 
                  style={{ width: "100%" }}
                  onClick={handleChangeKey}
                >
                  🔑 Switch Key ({instanceKey === "session-A" ? "A ➔ B" : "B ➔ A"})
                </button>
                <small style={{ color: "var(--text-muted)", fontSize: "0.72rem", marginTop: "4px", display: "block" }}>
                  Changing key unmounts Fiber node and allocates brand new ref container!
                </small>
              </div>

              <div className="control-group">
                <label>Reset Telemetry</label>
                <button className="btn" style={{ width: "100%" }} onClick={() => setLogs([])}>
                  🧹 Clear Event Stream
                </button>
              </div>
            </div>

            <div className="card">
              <div className="card-title" style={{ justifyContent: "space-between" }}>
                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                  <span>📦</span> Mounted Component Instance (Key: <code>{instanceKey}</code>)
                </div>
              </div>

              <div className="alert-banner">
                <span>💡</span> <strong>Mechanical Fact:</strong> Clicking <strong>"Mutate Ref (.current += 1)"</strong> updates the JavaScript heap silently without triggering a React render. Click <strong>"Force Rerender"</strong> to see the DOM catch up!
              </div>

              <InstrumentedRefComponent 
                key={instanceKey} 
                instanceKey={instanceKey} 
                addLog={addLog} 
              />
            </div>

            <div className="card">
              <div className="card-title" style={{ justifyContent: "space-between" }}>
                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                  <span>🔬</span> Live Telemetry Log
                </div>
                <button className="btn btn-sm" onClick={() => setLogs([])}>Clear</button>
              </div>

              <div className="log-container">
                {logs.length === 0 && (
                  <div style={{ color: "#475569", textAlign: "center", marginTop: "40px" }}>
                    Telemetry idle. Click "Mutate Ref", "Set State", or "Run Async Callback" to inspect live mechanics.
                  </div>
                )}
                {logs.map(log => (
                  <div key={log.id} className="log-entry">
                    <span className="log-time">{log.time}</span>
                    <span className={`log-tag ${log.tagClass}`}>[{log.tag}]</span>
                    <span>{log.message}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function InstrumentedRefComponent({ instanceKey, addLog }) {
      const counterRef = useRef(0);
      const refHeapAddress = useRef("0x" + Math.floor(Math.random() * 0xFFFFFF).toString(16).toUpperCase()).current;
      const [reactiveState, setReactiveState] = useState(0);
      const domInputRef = useRef(null);
      const [showDomInput, setShowDomInput] = useState(true);

      const renderCount = useRef(0);
      renderCount.current += 1;

      useEffect(() => {
        addLog("MOUNT", `Mounted Fiber Instance for key="${instanceKey}" (Ref Heap: ${refHeapAddress})`, "tag-mount");
        return () => {
          addLog("UNMOUNT", `Unmounted Fiber Instance for key="${instanceKey}" (Ref Heap: ${refHeapAddress} destroyed)`, "tag-unmount");
        };
      }, [instanceKey, refHeapAddress, addLog]);

      useLayoutEffect(() => {
        if (showDomInput && domInputRef.current) {
          addLog("DOM_ATTACH", `Commit Phase Attached DOM: <${domInputRef.current.tagName.toLowerCase()}> into domInputRef.current`, "tag-dom");
        } else if (!showDomInput) {
          addLog("DOM_DETACH", `Commit Phase Detached DOM: domInputRef.current is now null`, "tag-dom");
        }
      }, [showDomInput, addLog]);

      const handleMutateRefDirectly = () => {
        counterRef.current += 1;
        addLog("REF_MUTATE", `Direct Mutation: counterRef.current = ${counterRef.current} (Render Count STILL: ${renderCount.current})`, "tag-mutate");
      };

      const handleSetState = () => {
        setReactiveState(s => s + 1);
        addLog("STATE_DISPATCH", `State Dispatch: setReactiveState(${reactiveState + 1}) ➔ React Schedules Render`, "tag-render");
      };

      const handleFocusInput = () => {
        if (domInputRef.current) {
          domInputRef.current.focus();
          domInputRef.current.select();
          addLog("IMPERATIVE_CALL", `Executed domInputRef.current.focus() + select()`, "tag-dom");
        }
      };

      const handleRunAsyncCallback = () => {
        const snapshotState = reactiveState;
        addLog("ASYNC_START", `Dispatched Async Timer (1500ms). Snapshot State: ${snapshotState} | Ref at start: ${counterRef.current}`, "tag-async");

        setTimeout(() => {
          addLog("ASYNC_RESOLVE", `Async Callback Executed! Lexical Snapshot State: ${snapshotState} | Latest Ref .current: ${counterRef.current}`, "tag-async");
        }, 1500);
      };

      return (
        <div>
          <div className="stats-bar">
            <div className="stat-item">
              <span className="stat-label">Ref Heap Address</span>
              <span className="stat-val" style={{ color: "#34d399" }}>{refHeapAddress}</span>
            </div>
            <div className="stat-item">
              <span className="stat-label">ref.current</span>
              <span className="stat-val" style={{ color: "#38bdf8" }}>{counterRef.current}</span>
            </div>
            <div className="stat-item">
              <span className="stat-label">useState</span>
              <span className="stat-val" style={{ color: "#fde047" }}>{reactiveState}</span>
            </div>
            <div className="stat-item">
              <span className="stat-label">Render Count</span>
              <span className="stat-val" style={{ color: "#c084fc" }}>R:{renderCount.current}</span>
            </div>
          </div>

          <div className="memory-diagram">
            <div style={{ color: "var(--text-muted)", fontSize: "0.72rem", textTransform: "uppercase", marginBottom: "8px" }}>
              Fiber Hook Linked List Memory (fiber.memoizedState)
            </div>
            
            <div className="memory-row">
              <span className="memory-tag tag-fiber">FiberNode</span>
              <span>Key: "{instanceKey}"</span>
            </div>
            
            <div className="memory-row">
              <span className="memory-tag tag-ref">Hook 1 (useRef)</span>
              <span>Ref Address: {refHeapAddress} ➔ <code>&#123; current: {counterRef.current} &#125;</code></span>
            </div>

            <div className="memory-row">
              <span className="memory-tag tag-state">Hook 2 (useState)</span>
              <span>Value: {reactiveState}</span>
            </div>

            <div className="memory-row" style={{ borderBottom: "none", marginBottom: 0 }}>
              <span className="memory-tag tag-dom">Hook 3 (DOM Ref)</span>
              <span>domInputRef.current: <code>{domInputRef.current ? "<HTMLInputElement>" : "null"}</code></span>
            </div>
          </div>

          <div className="btn-grid" style={{ marginBottom: "16px" }}>
            <button className="btn btn-emerald" onClick={handleMutateRefDirectly}>
              ⚡ Mutate Ref (counterRef.current += 1)
            </button>
            <button className="btn btn-primary" onClick={handleSetState}>
              🔄 Set State (setReactiveState)
            </button>
            <button className="btn btn-amber" onClick={handleRunAsyncCallback}>
              ⏳ Run Async Callback (1500ms Race)
            </button>
            <button className="btn" onClick={() => setShowDomInput(s => !s)}>
              {showDomInput ? "🚫 Detach DOM Node" : "✅ Attach DOM Node"}
            </button>
          </div>

          {showDomInput && (
            <div style={{ display: "flex", gap: "8px", alignItems: "center", background: "rgba(0,0,0,0.3)", padding: "12px", borderRadius: "8px", border: "1px solid var(--card-border)" }}>
              <input 
                ref={domInputRef} 
                type="text" 
                defaultValue="Imperative Target Element" 
                style={{ flex: 1 }}
              />
              <button className="btn btn-sm btn-primary" onClick={handleFocusInput}>
                🎯 Focus & Select via Ref
              </button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<UseRefMentalModelHub />);
  </script>
</body>
</html>
