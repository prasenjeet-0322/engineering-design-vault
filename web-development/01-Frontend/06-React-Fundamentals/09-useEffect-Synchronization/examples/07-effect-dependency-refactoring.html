<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 07 — Effect Dependency Refactoring & Synchronization Boundaries</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-card: #111827;
      --bg-card-hover: #1f293d;
      --border-color: #2e384d;
      --accent-cyan: #38bdf8;
      --accent-purple: #a855f7;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-banner {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(168, 85, 247, 0.12));
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-banner h1 {
      font-size: 1.4rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-tier { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-green { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge-cyan { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.15rem;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.82rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: #334155; border-color: var(--accent-cyan); color: #fff; }
    button.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      font-weight: 600;
    }
    button.danger { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: #f87171; }
    button.purple { background: rgba(168, 85, 247, 0.15); border-color: rgba(168, 85, 247, 0.4); color: #c084fc; }

    .telemetry-box {
      background: #06090e;
      border: 1px solid #1f293d;
      border-radius: 8px;
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-line { display: flex; gap: 8px; align-items: center; }
    .log-time { color: var(--text-muted); font-size: 0.75rem; }
    .log-socket { color: var(--accent-green); font-weight: 600; }
    .log-title { color: var(--accent-cyan); font-weight: 600; }
    .log-churn { color: var(--accent-red); font-weight: 600; }
    .log-info { color: var(--text-muted); }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px;
    }

    .stat-card {
      background: #0c121e;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .stat-val {
      font-size: 1.3rem;
      font-weight: 700;
      font-family: var(--font-mono);
      margin-top: 4px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Component 1: Monolithic Overloaded Effect (Coupled Invalidation)
    function MonolithicComponent({ roomId, title, counter, onLog }) {
      const socketReconCount = useRef(0);

      useEffect(() => {
        socketReconCount.current += 1;
        onLog("MONOLITHIC", `[MEGA-EFFECT] Reconnecting WebSocket to "${roomId}" AND updating title to "${title}" (Run #${socketReconCount.current})`, "churn");

        document.title = `[Monolithic] ${title}`;

        return () => {
          onLog("MONOLITHIC", `[MEGA-EFFECT TEARDOWN] Tearing down connection for "${roomId}"`, "info");
        };
      }, [roomId, title]); // title change triggers WebSocket teardown!

      return (
        <div style={{ padding: "14px", background: "#0c1524", borderRadius: "8px", border: "1px solid #1e293b" }}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={{ fontSize: "0.85rem", color: "var(--text-muted)" }}>Monolithic Socket Reconnects:</span>
            <span style={{ color: "var(--accent-red)", fontFamily: "var(--font-mono)", fontWeight: "700" }}>
              {socketReconCount.current} Reconnects
            </span>
          </div>
          <div style={{ fontSize: "0.8rem", color: "var(--text-muted)", marginTop: "6px" }}>
            ⚠️ Changing <code>title</code> destroys and recreates the active WebSocket connection!
          </div>
        </div>
      );
    }

    // Component 2: Decomposed Independent Synchronization Boundaries
    function DecomposedComponent({ roomId, title, counter, onLog }) {
      const socketReconCount = useRef(0);
      const titleUpdateCount = useRef(0);

      // Effect A: WebSocket boundary (Only invalidates when roomId changes)
      useEffect(() => {
        socketReconCount.current += 1;
        onLog("DECOMPOSED", `[SOCKET EFFECT] Connected to room "${roomId}" (Connection #${socketReconCount.current})`, "socket");

        return () => {
          onLog("DECOMPOSED", `[SOCKET CLEANUP] Disconnected from room "${roomId}"`, "info");
        };
      }, [roomId]);

      // Effect B: Document title boundary (Only invalidates when title changes)
      useEffect(() => {
        titleUpdateCount.current += 1;
        document.title = `[Decomposed] ${title}`;
        onLog("DECOMPOSED", `[TITLE EFFECT] Synchronized title to "${title}" (Update #${titleUpdateCount.current})`, "title");
      }, [title]);

      return (
        <div style={{ padding: "14px", background: "#0c1524", borderRadius: "8px", border: "1px solid #1e293b" }}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <span style={{ fontSize: "0.85rem", color: "var(--text-muted)" }}>Socket Reconnects:</span>
            <span style={{ color: "var(--accent-green)", fontFamily: "var(--font-mono)", fontWeight: "700" }}>
              {socketReconCount.current} Reconnects
            </span>
          </div>
          <div style={{ fontSize: "0.8rem", color: "var(--text-muted)", marginTop: "6px" }}>
            ✅ Changing <code>title</code> updates document.title with 0 impact on the active WebSocket!
          </div>
        </div>
      );
    }

    function App() {
      const [roomId, setRoomId] = useState("general");
      const [title, setTitle] = useState("Dashboard");
      const [counter, setCounter] = useState(0);

      const [logsA, setLogsA] = useState([]);
      const [logsB, setLogsB] = useState([]);

      const logMessage = (target, text, type) => {
        const time = new Date().toLocaleTimeString();
        const entry = { id: Math.random(), time, text, type };
        if (target === "MONOLITHIC") {
          setLogsA(prev => [entry, ...prev.slice(0, 29)]);
        } else {
          setLogsB(prev => [entry, ...prev.slice(0, 29)]);
        }
      };

      const resetAll = () => {
        setRoomId("general");
        setTitle("Dashboard");
        setCounter(0);
        setLogsA([]);
        setLogsB([]);
      };

      return (
        <div className="container">
          <div className="header-banner">
            <div>
              <h1>
                <span>⚡</span> KPI 06 — PART 07: Synchronization Boundary Refactoring Lab
              </h1>
              <p style={{ color: "var(--text-muted)", fontSize: "0.85rem", marginTop: "4px" }}>
                Interactive Verification of Monolithic Coupling vs Decomposed Synchronization Boundaries
              </p>
            </div>
            <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
              <span className="badge badge-tier">Must Know</span>
              <span className="badge badge-cyan">React 18</span>
            </div>
          </div>

          <div className="card">
            <h2>
              <span>Interactive Invalidation Controls</span>
              <span className="badge badge-cyan">Reactive State</span>
            </h2>
            <div className="control-panel">
              <span style={{ fontSize: "0.85rem", color: "var(--text-muted)" }}>Switch Room (Socket Input):</span>
              {["general", "engineering", "ops"].map(r => (
                <button key={r} className={roomId === r ? "active" : ""} onClick={() => setRoomId(r)}>
                  #{r}
                </button>
              ))}
            </div>

            <div className="control-panel">
              <span style={{ fontSize: "0.85rem", color: "var(--text-muted)" }}>Switch Title (Title Input):</span>
              {["Dashboard", "Analytics", "Settings"].map(t => (
                <button key={t} className={title === t ? "active" : ""} onClick={() => setTitle(t)}>
                  "{t}"
                </button>
              ))}
            </div>

            <div className="control-panel">
              <span style={{ fontSize: "0.85rem", color: "var(--text-muted)" }}>Unrelated State:</span>
              <button className="purple" onClick={() => setCounter(c => c + 1)}>
                ⚡ Trigger Unrelated Render ({counter})
              </button>
              <button onClick={resetAll}>Reset All</button>
            </div>
          </div>

          <div className="grid-2">
            {/* Column 1: Monolithic Mega-Effect */}
            <div className="card">
              <h2>
                <span>1. Monolithic Coupled Effect</span>
                <span className="badge badge-tier">Accidental Churn</span>
              </h2>

              <MonolithicComponent roomId={roomId} title={title} counter={counter} onLog={logMessage} />

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: "0.85rem", fontWeight: "600", color: "var(--text-muted)" }}>Telemetry (Monolithic)</span>
                <button onClick={() => setLogsA([])} style={{ padding: "4px 8px", fontSize: "0.75rem" }}>Clear</button>
              </div>

              <div className="telemetry-box">
                {logsA.length === 0 ? (
                  <div style={{ color: "var(--text-muted)", fontStyle: "italic" }}>Switch title to see accidental socket invalidation.</div>
                ) : (
                  logsA.map(l => (
                    <div key={l.id} className="log-line">
                      <span className="log-time">[{l.time}]</span>
                      <span className={`log-${l.type}`}>{l.text}</span>
                    </div>
                  ))
                )}
              </div>
            </div>

            {/* Column 2: Decomposed Boundaries */}
            <div className="card">
              <h2>
                <span>2. Decomposed Resource Boundaries</span>
                <span className="badge badge-green">Isolated Lifecycles</span>
              </h2>

              <DecomposedComponent roomId={roomId} title={title} counter={counter} onLog={logMessage} />

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: "0.85rem", fontWeight: "600", color: "var(--text-muted)" }}>Telemetry (Decomposed)</span>
                <button onClick={() => setLogsB([])} style={{ padding: "4px 8px", fontSize: "0.75rem" }}>Clear</button>
              </div>

              <div className="telemetry-box">
                {logsB.length === 0 ? (
                  <div style={{ color: "var(--text-muted)", fontStyle: "italic" }}>Switch title to see isolated title update without socket reconnect.</div>
                ) : (
                  logsB.map(l => (
                    <div key={l.id} className="log-line">
                      <span className="log-time">[{l.time}]</span>
                      <span className={`log-${l.type}`}>{l.text}</span>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
