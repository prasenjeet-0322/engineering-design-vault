<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 11 — Effects, External Systems & Imperative APIs</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-card: #111827;
      --bg-card-hover: #1f293d;
      --border-color: #2e384d;
      --accent-cyan: #38bdf8;
      --accent-purple: #a855f7;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-banner {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(168, 85, 247, 0.12));
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-banner h1 {
      font-size: 1.4rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-primary { background: rgba(56, 189, 248, 0.2); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
    .badge-purple { background: rgba(168, 85, 247, 0.2); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
    .badge-green { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-red { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .badge-amber { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); }

    .ledger-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .stat-card {
      background: #0d131f;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 1.4rem; font-weight: 700; font-family: var(--font-mono); }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(620px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    button:hover:not(:disabled) {
      background: var(--bg-card-hover);
      border-color: var(--accent-cyan);
      color: #fff;
    }
    button.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input, select {
      background: #0d131f;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent-cyan);
    }

    .terminal {
      background: #050811;
      border: 1px solid #1a2333;
      border-radius: 8px;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-line {
      display: flex;
      gap: 8px;
    }
    .log-time { color: #64748b; }
    .log-event { font-weight: 600; }
    .log-info { color: var(--accent-cyan); }
    .log-warn { color: var(--accent-amber); }
    .log-error { color: var(--accent-red); }
    .log-success { color: var(--accent-green); }
    .log-purple { color: var(--accent-purple); }

    .widget-box {
      background: #0d131f;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .widget-canvas {
      height: 90px;
      border-radius: 6px;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 1px dashed #374151;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useReducer } = React;

    // --- GLOBAL TELEMETRY LEDGER ---
    const globalTelemetry = {
      created: 0,
      active: 0,
      destroyed: 0,
      subscriptions: 0
    };

    // --- LOG TERMINAL COMPONENT ---
    function LogTerminal({ logs, onClear }) {
      const bottomRef = useRef(null);
      useEffect(() => {
        if (bottomRef.current) {
          bottomRef.current.scrollIntoView({ behavior: "smooth" });
        }
      }, [logs]);

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: "0.75rem", color: "var(--text-muted)", textTransform: "uppercase", letterSpacing: "0.05em" }}>Synchronization Timeline</span>
            <button style={{ padding: "2px 8px", fontSize: "0.72rem" }} onClick={onClear}>Clear</button>
          </div>
          <div className="terminal">
            {logs.length === 0 ? (
              <div style={{ color: "#475569", fontStyle: "italic" }}>No synchronization events recorded yet.</div>
            ) : (
              logs.map((log, idx) => (
                <div key={idx} className="log-line">
                  <span className="log-time">[{log.time}]</span>
                  <span className={`log-${log.type} log-event`}>{log.event}</span>
                  <span>{log.message}</span>
                </div>
              ))
            )}
            <div ref={bottomRef} />
          </div>
        </div>
      );
    }

    // =========================================================================
    // SIMULATED EXTERNAL WIDGET ENGINE (Imperative 3rd-Party Library)
    // =========================================================================
    let widgetInstanceCounter = 0;
    class MockImperativeWidget {
      constructor(containerElement, initialValue, onLedgerUpdate) {
        this.id = ++widgetInstanceCounter;
        this.container = containerElement;
        this.value = initialValue;
        this.listeners = new Set();
        this.isDestroyed = false;
        this.onLedgerUpdate = onLedgerUpdate;

        globalTelemetry.created++;
        globalTelemetry.active++;
        this.onLedgerUpdate?.();

        this.renderDOM();
      }

      renderDOM() {
        if (this.isDestroyed || !this.container) return;
        this.container.innerHTML = `
          <div style="width: 100%; text-align: center; color: #38bdf8; font-weight: 600; font-family: monospace;">
            [Instance #${this.id}] ${this.value}
          </div>
        `;
      }

      setValue(nextValue) {
        if (this.isDestroyed) return;
        this.value = nextValue;
        this.renderDOM();
      }

      getValue() {
        return this.value;
      }

      // External user typing or external event source
      triggerExternalEdit(newValue, emitEvent = true) {
        if (this.isDestroyed) return;
        this.value = newValue;
        this.renderDOM();
        if (emitEvent) {
          this.listeners.forEach(cb => cb(newValue));
        }
      }

      onChange(callback) {
        this.listeners.add(callback);
        globalTelemetry.subscriptions++;
        this.onLedgerUpdate?.();

        return () => {
          this.listeners.delete(callback);
          globalTelemetry.subscriptions--;
          this.onLedgerUpdate?.();
        };
      }

      destroy() {
        if (this.isDestroyed) return;
        this.isDestroyed = true;
        this.listeners.clear();
        if (this.container) {
          this.container.innerHTML = `<span style="color: #64748b; font-style: italic;">[Instance #${this.id} Destroyed]</span>`;
        }
        globalTelemetry.active--;
        globalTelemetry.destroyed++;
        this.onLedgerUpdate?.();
      }
    }

    // =========================================================================
    // DEMO 1: RESOURCE LIFECYCLE & IDENTITY VS RECREATION
    // =========================================================================
    function ResourceIdentityDemo({ onLedgerChange }) {
      const [strategy, setStrategy] = useState("separate"); // "separate" (Good) vs "coupled" (Bad)
      const [text, setText] = useState("Hello World");
      const [themeColor, setThemeColor] = useState("#38bdf8");
      const [logs, setLogs] = useState([]);
      const [isMounted, setIsMounted] = useState(true);

      const containerRef = useRef(null);
      const widgetRef = useRef(null);

      const addLog = (event, message, type = "info") => {
        const time = new Date().toISOString().substring(17, 23);
        setLogs(prev => [...prev.slice(-30), { time, event, message, type }]);
      };

      // --- GOOD ARCHITECTURE: Separate Creation vs Synchronization ---
      useEffect(() => {
        if (strategy !== "separate" || !isMounted) return;

        addLog("CREATE", `Allocating MockImperativeWidget in container`, "purple");
        const widget = new MockImperativeWidget(containerRef.current, text, onLedgerChange);
        widgetRef.current = widget;

        return () => {
          addLog("DESTROY", `Tearing down Instance #${widget.id}`, "warn");
          widget.destroy();
          widgetRef.current = null;
        };
      }, [strategy, isMounted]); // Runs ONLY on mount or unmount

      useEffect(() => {
        if (strategy !== "separate" || !widgetRef.current || !isMounted) return;
        addLog("SYNC", `Synchronizing text state ("${text}") into existing Instance #${widgetRef.current.id}`, "success");
        widgetRef.current.setValue(text);
      }, [text, strategy, isMounted]);

      // --- BAD ARCHITECTURE: Recreating instance on every state change ---
      useEffect(() => {
        if (strategy !== "coupled" || !isMounted) return;

        addLog("CREATE [COUPLING]", `Re-allocating instance for new text: "${text}"`, "error");
        const widget = new MockImperativeWidget(containerRef.current, text, onLedgerChange);

        return () => {
          addLog("DESTROY [COUPLING]", `Wiping and destroying Instance #${widget.id}`, "warn");
          widget.destroy();
        };
      }, [text, strategy, isMounted]); // Re-runs on EVERY keystroke!

      return (
        <div className="card">
          <div className="card-title">
            <span>1. Resource Identity vs Accidental Recreation</span>
            <span className={`badge ${strategy === "separate" ? "badge-green" : "badge-red"}`}>
              {strategy === "separate" ? "Stable Identity (CREATE once)" : "Destructive (CREATE every render)"}
            </span>
          </div>
          <p className="card-desc">
            Watch the Resource Ledger. In <strong>Stable Identity</strong> mode, updating React state preserves the widget instance and synchronizes value. In <strong>Destructive Coupling</strong> mode, every keystroke destroys and reallocates the widget.
          </p>

          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center" }}>
            <div className="btn-group">
              <button 
                className={strategy === "separate" ? "active" : ""}
                onClick={() => setStrategy("separate")}
              >
                ✅ Stable Identity (Create Once)
              </button>
              <button 
                className={strategy === "coupled" ? "active" : ""}
                onClick={() => setStrategy("coupled")}
              >
                ❌ Destructive (Recreate on State Change)
              </button>
            </div>
            <button 
              style={{ borderColor: isMounted ? "var(--accent-red)" : "var(--accent-green)" }}
              onClick={() => setIsMounted(m => !m)}
            >
              {isMounted ? "Unmount Widget" : "Mount Widget"}
            </button>
          </div>

          <div style={{ display: "flex", gap: 8 }}>
            <input 
              type="text" 
              value={text} 
              disabled={!isMounted}
              onChange={e => setText(e.target.value)} 
              placeholder="Type to trigger state update..."
              style={{ flex: 1 }}
            />
          </div>

          <div className="widget-box">
            <div className="widget-header">
              <span>Third-Party DOM Host Container</span>
              <span>Status: {isMounted ? "Active" : "Unmounted"}</span>
            </div>
            <div ref={containerRef} className="widget-canvas"></div>
          </div>

          <LogTerminal logs={logs} onClear={() => setLogs([])} />
        </div>
      );
    }

    // =========================================================================
    // DEMO 2: TWO-WAY SYNCHRONIZATION & FEEDBACK LOOP GUARD
    // =========================================================================
    function TwoWaySyncDemo({ onLedgerChange }) {
      const [value, setValue] = useState("Alpha");
      const [guardEnabled, setGuardEnabled] = useState(true);
      const [loopCount, setLoopCount] = useState(0);
      const [logs, setLogs] = useState([]);

      const containerRef = useRef(null);
      const widgetRef = useRef(null);
      const loopBreakerRef = useRef(0);

      const addLog = (event, message, type = "info") => {
        const time = new Date().toISOString().substring(17, 23);
        setLogs(prev => [...prev.slice(-30), { time, event, message, type }]);
      };

      // Widget initialization
      useEffect(() => {
        const widget = new MockImperativeWidget(containerRef.current, value, onLedgerChange);
        widgetRef.current = widget;

        // Subscribe to external widget events
        const unsubscribe = widget.onChange(externalNewVal => {
          addLog("EVENT ◄ WIDGET", `Widget emitted onChange("${externalNewVal}")`, "purple");
          
          if (!guardEnabled) {
            loopBreakerRef.current++;
            if (loopBreakerRef.current > 6) {
              addLog("SAFETY TRIP", `Emergency stop: Feedback ping-pong loop detected!`, "error");
              return;
            }
          }

          setValue(externalNewVal);
        });

        return () => {
          unsubscribe();
          widget.destroy();
          widgetRef.current = null;
        };
      }, [guardEnabled]);

      // React -> Widget Synchronization
      useEffect(() => {
        if (!widgetRef.current) return;

        if (guardEnabled) {
          // GUARD: Only mutate external widget if its value is genuinely different
          if (widgetRef.current.getValue() !== value) {
            addLog("SYNC ► WIDGET", `Pushing React state ("${value}") to Widget`, "success");
            widgetRef.current.setValue(value);
          } else {
            addLog("GUARD BAILOUT", `Bailed out: Widget already holds "${value}"`, "info");
          }
        } else {
          // NO GUARD: Blindly mutates and triggers event feedback loop
          addLog("SYNC ► WIDGET [UNGUARDED]", `Blindly setting "${value}" on widget`, "warn");
          widgetRef.current.triggerExternalEdit(value, true); // re-emits onChange!
        }
      }, [value, guardEnabled]);

      const handleExternalSimulate = () => {
        loopBreakerRef.current = 0;
        const randomStr = "Val-" + Math.floor(Math.random() * 900 + 100);
        addLog("EXTERNAL SIMULATION", `External system changed value to "${randomStr}"`, "amber");
        widgetRef.current?.triggerExternalEdit(randomStr, true);
      };

      return (
        <div className="card">
          <div className="card-title">
            <span>2. Two-Way Sync & Feedback Loop Guard</span>
            <span className={`badge ${guardEnabled ? "badge-green" : "badge-red"}`}>
              {guardEnabled ? "Value Guard Active" : "Unchecked Feedback Loop"}
            </span>
          </div>
          <p className="card-desc">
            When an external widget emits <code>onChange</code> and React pushes <code>setValue</code> back down, value equality guards prevent endless ping-pong feedback loops.
          </p>

          <div style={{ display: "flex", gap: 12, flexWrap: "wrap", alignItems: "center" }}>
            <div className="btn-group">
              <button 
                className={guardEnabled ? "active" : ""}
                onClick={() => { setGuardEnabled(true); loopBreakerRef.current = 0; }}
              >
                🛡️ Enable Value Guard
              </button>
              <button 
                className={!guardEnabled ? "active" : ""}
                onClick={() => { setGuardEnabled(false); loopBreakerRef.current = 0; }}
              >
                ⚠️ Disable Guard (Loop Risk)
              </button>
            </div>
            <button onClick={handleExternalSimulate} style={{ borderColor: "var(--accent-amber)" }}>
              ⚡ Simulate External Widget Edit
            </button>
          </div>

          <div style={{ display: "flex", gap: 8 }}>
            <input 
              type="text" 
              value={value} 
              onChange={e => { loopBreakerRef.current = 0; setValue(e.target.value); }}
              placeholder="Edit React state directly..."
              style={{ flex: 1 }}
            />
          </div>

          <div className="widget-box">
            <div className="widget-header">
              <span>External Widget Instance</span>
              <span>Controlled Bridge</span>
            </div>
            <div ref={containerRef} className="widget-canvas"></div>
          </div>

          <LogTerminal logs={logs} onClear={() => setLogs([])} />
        </div>
      );
    }

    // =========================================================================
    // DEMO 3: SHARED RESOURCE OWNERSHIP & REFERENCE COUNTING
    // =========================================================================
    class SharedSocketManager {
      constructor(url, onLedger) {
        this.url = url;
        this.refCount = 0;
        this.listeners = new Set();
        this.onLedger = onLedger;
      }

      connect(clientId) {
        this.refCount++;
        if (this.refCount === 1) {
          globalTelemetry.created++;
          globalTelemetry.active++;
          this.onLedger?.();
        }
      }

      disconnect(clientId) {
        this.refCount = Math.max(0, this.refCount - 1);
        if (this.refCount === 0) {
          globalTelemetry.active--;
          globalTelemetry.destroyed++;
          this.onLedger?.();
        }
      }
    }

    const sharedSocket = new SharedSocketManager("wss://telemetry.cluster.internal");

    function SharedResourceDemo({ onLedgerChange }) {
      const [compAOpen, setCompAOpen] = useState(true);
      const [compBOpen, setCompBOpen] = useState(true);
      const [buggyCleanup, setBuggyCleanup] = useState(false);
      const [logs, setLogs] = useState([]);

      const addLog = (event, message, type = "info") => {
        const time = new Date().toISOString().substring(17, 23);
        setLogs(prev => [...prev.slice(-30), { time, event, message, type }]);
      };

      // Component A Effect
      useEffect(() => {
        if (!compAOpen) return;
        addLog("CompA Subscribed", "Component A connected to shared socket", "purple");
        sharedSocket.connect("CompA");
        onLedgerChange();

        return () => {
          addLog("CompA Cleanup", "Component A disconnecting", "warn");
          if (buggyCleanup) {
            // BUG: Closes the entire shared socket regardless of sibling components
            addLog("BUGGY CLOSE", "Component A force-closed the entire socket prematurely!", "error");
            sharedSocket.refCount = 1;
            sharedSocket.disconnect("CompA");
          } else {
            sharedSocket.disconnect("CompA");
          }
          onLedgerChange();
        };
      }, [compAOpen, buggyCleanup]);

      // Component B Effect
      useEffect(() => {
        if (!compBOpen) return;
        addLog("CompB Subscribed", "Component B connected to shared socket", "cyan");
        sharedSocket.connect("CompB");
        onLedgerChange();

        return () => {
          addLog("CompB Cleanup", "Component B disconnecting", "warn");
          sharedSocket.disconnect("CompB");
          onLedgerChange();
        };
      }, [compBOpen]);

      return (
        <div className="card">
          <div className="card-title">
            <span>3. Shared Resource Ownership & Reference Counting</span>
            <span className={`badge ${buggyCleanup ? "badge-red" : "badge-green"}`}>
              {buggyCleanup ? "Premature Shared Close Bug" : "Ref-Counted Ownership"}
            </span>
          </div>
          <p className="card-desc">
            When multiple sibling components consume a shared singleton resource (e.g. WebSocket connection), an individual component's cleanup must only decrement references—never terminate the connection if siblings are still active.
          </p>

          <div className="btn-group">
            <button 
              className={compAOpen ? "active" : ""} 
              onClick={() => setCompAOpen(a => !a)}
            >
              {compAOpen ? "Unmount Component A" : "Mount Component A"}
            </button>
            <button 
              className={compBOpen ? "active" : ""} 
              onClick={() => setCompBOpen(b => !b)}
            >
              {compBOpen ? "Unmount Component B" : "Mount Component B"}
            </button>
            <button 
              style={{ borderColor: buggyCleanup ? "var(--accent-red)" : "var(--accent-cyan)" }}
              onClick={() => setBuggyCleanup(b => !b)}
            >
              {buggyCleanup ? "Switch to Ref-Counted Cleanup" : "Simulate Premature Close Bug"}
            </button>
          </div>

          <div style={{ background: "#0d131f", padding: "14px", borderRadius: "8px", border: "1px solid var(--border-color)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>Shared Socket Reference Count: <strong style={{ color: "var(--accent-cyan)" }}>{sharedSocket.refCount} consumers</strong></div>
            <div>Socket Active State: <strong style={{ color: sharedSocket.refCount > 0 ? "var(--accent-green)" : "#64748b" }}>{sharedSocket.refCount > 0 ? "OPEN" : "CLOSED"}</strong></div>
          </div>

          <LogTerminal logs={logs} onClear={() => setLogs([])} />
        </div>
      );
    }

    // =========================================================================
    // DEMO 4: ADAPTER BOUNDARY PATTERN (VENDOR ISOLATION)
    // =========================================================================
    function AdapterBoundaryDemo() {
      const [chartData, setChartData] = useState([12, 45, 78, 32]);
      const [theme, setTheme] = useState("dark");
      const [logs, setLogs] = useState([]);
      const containerRef = useRef(null);

      const addLog = (event, message, type = "info") => {
        const time = new Date().toISOString().substring(17, 23);
        setLogs(prev => [...prev.slice(-30), { time, event, message, type }]);
      };

      // Simulated Adapter encapsulation
      useEffect(() => {
        addLog("Adapter.create", "Instantiating clean adapter boundary", "purple");
        const node = containerRef.current;

        const adapter = {
          render(data, th) {
            if (!node) return;
            node.innerHTML = `
              <div style="display: flex; gap: 8px; align-items: flex-end; height: 100%; padding: 10px; justify-content: center;">
                ${data.map(val => `
                  <div style="
                    width: 32px; 
                    height: ${val}%; 
                    background: ${th === 'dark' ? '#38bdf8' : '#a855f7'}; 
                    border-radius: 4px; 
                    display: flex; 
                    align-items: center; 
                    justify-content: center;
                    font-size: 0.65rem;
                    font-weight: 700;
                    color: #000;
                  ">${val}</div>
                `).join('')}
              </div>
            `;
          },
          destroy() {
            if (node) node.innerHTML = "";
          }
        };

        adapter.render(chartData, theme);

        return () => {
          addLog("Adapter.destroy", "Disposing vendor chart adapter", "info");
          adapter.destroy();
        };
      }, [chartData, theme]);

      const handleRandomize = () => {
        const next = [
          Math.floor(Math.random() * 80 + 15),
          Math.floor(Math.random() * 80 + 15),
          Math.floor(Math.random() * 80 + 15),
          Math.floor(Math.random() * 80 + 15),
        ];
        addLog("React State", `Randomized dataset: [${next.join(', ')}]`, "success");
        setChartData(next);
      };

      return (
        <div className="card">
          <div className="card-title">
            <span>4. The Adapter Boundary Pattern</span>
            <span className="badge badge-purple">Vendor Isolation</span>
          </div>
          <p className="card-desc">
            Encapsulating third-party drawing engines behind a clean React adapter separates component props from vendor-specific method calls and garbage collection lifecycles.
          </p>

          <div className="btn-group">
            <button onClick={handleRandomize}>🎲 Randomize Dataset</button>
            <button onClick={() => setTheme(t => t === 'dark' ? 'neon' : 'dark')}>
              🎨 Toggle Theme ({theme})
            </button>
          </div>

          <div className="widget-box">
            <div className="widget-header">
              <span>Adapter Chart Canvas</span>
              <span>Props: [{chartData.join(', ')}]</span>
            </div>
            <div ref={containerRef} className="widget-canvas" style={{ height: "110px" }}></div>
          </div>

          <LogTerminal logs={logs} onClear={() => setLogs([])} />
        </div>
      );
    }

    // =========================================================================
    // ROOT APPLICATION
    // =========================================================================
    function App() {
      const [, forceUpdate] = useReducer(x => x + 1, 0);

      return (
        <div className="container">
          <header className="header-banner">
            <div>
              <h1>
                <span>🔌</span>
                Lab 11 — Effects, External Systems & Imperative APIs
              </h1>
              <p style={{ color: "var(--text-muted)", fontSize: "0.88rem", marginTop: 4 }}>
                Diagnostic laboratory exploring resource identity, two-way synchronization guards, reference-counted shared ownership, and adapter boundaries.
              </p>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <span className="badge badge-primary">React 18</span>
              <span className="badge badge-purple">External APIs</span>
            </div>
          </header>

          <div className="ledger-strip">
            <div className="stat-card">
              <span className="stat-label">Total Allocated</span>
              <span className="stat-value" style={{ color: "var(--accent-purple)" }}>{globalTelemetry.created}</span>
            </div>
            <div className="stat-card">
              <span className="stat-label">Currently Active</span>
              <span className="stat-value" style={{ color: "var(--accent-green)" }}>{globalTelemetry.active}</span>
            </div>
            <div className="stat-card">
              <span className="stat-label">Cleaned Up / Destroyed</span>
              <span className="stat-value" style={{ color: "var(--accent-red)" }}>{globalTelemetry.destroyed}</span>
            </div>
            <div className="stat-card">
              <span className="stat-label">Active Subscriptions</span>
              <span className="stat-value" style={{ color: "var(--accent-cyan)" }}>{globalTelemetry.subscriptions}</span>
            </div>
          </div>

          <div className="grid-2">
            <ResourceIdentityDemo onLedgerChange={forceUpdate} />
            <TwoWaySyncDemo onLedgerChange={forceUpdate} />
            <SharedResourceDemo onLedgerChange={forceUpdate} />
            <AdapterBoundaryDemo />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
