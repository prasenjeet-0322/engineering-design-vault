<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 13 — Effect Performance & Synchronization Optimization</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-card: #111827;
      --bg-card-hover: #1f293d;
      --border-color: #2e384d;
      --accent-cyan: #38bdf8;
      --accent-purple: #a855f7;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-banner {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(168, 85, 247, 0.12));
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-banner h1 {
      font-size: 1.4rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge-primary { background: rgba(56, 189, 248, 0.2); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
    .badge-purple { background: rgba(168, 85, 247, 0.2); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
    .badge-green { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-red { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .badge-amber { background: rgba(245, 158, 11, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(620px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    button:hover:not(:disabled) {
      background: var(--bg-card-hover);
      border-color: var(--accent-cyan);
      color: #fff;
    }
    button.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input {
      background: #0d131f;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
    }
    input:focus {
      border-color: var(--accent-cyan);
    }

    .terminal {
      background: #050811;
      border: 1px solid #1a2333;
      border-radius: 8px;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-line {
      display: flex;
      gap: 8px;
    }
    .log-time { color: #64748b; }
    .log-event { font-weight: 600; }
    .log-info { color: var(--accent-cyan); }
    .log-warn { color: var(--accent-amber); }
    .log-error { color: var(--accent-red); }
    .log-success { color: var(--accent-green); }
    .log-purple { color: var(--accent-purple); }

    .benchmark-box {
      background: #0d131f;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- LOG TERMINAL COMPONENT ---
    function LogTerminal({ logs, onClear }) {
      const bottomRef = useRef(null);
      useEffect(() => {
        if (bottomRef.current) {
          bottomRef.current.scrollIntoView({ behavior: "smooth" });
        }
      }, [logs]);

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: "0.75rem", color: "var(--text-muted)", textTransform: "uppercase", letterSpacing: "0.05em" }}>Diagnostic Trace</span>
            <button style={{ padding: "2px 8px", fontSize: "0.72rem" }} onClick={onClear}>Clear</button>
          </div>
          <div className="terminal">
            {logs.length === 0 ? (
              <div style={{ color: "#475569", fontStyle: "italic" }}>No optimization events recorded yet.</div>
            ) : (
              logs.map((log, idx) => (
                <div key={idx} className="log-line">
                  <span className="log-time">[{log.time}]</span>
                  <span className={`log-${log.type} log-event`}>{log.event}</span>
                  <span>{log.message}</span>
                </div>
              ))
            )}
            <div ref={bottomRef} />
          </div>
        </div>
      );
    }

    // =========================================================================
    // DEMO 1: DERIVED STATE (PURE RENDER VS FAKE EFFECT PIPELINE)
    // =========================================================================
    function DerivedStateDemo() {
      const [strategy, setStrategy] = useState("pure"); // "pure" vs "effect"
      const [price, setPrice] = useState(25);
      const [qty, setQty] = useState(2);
      const [logs, setLogs] = useState([]);

      const addLog = (event, message, type = "info") => {
        const time = new Date().toISOString().substring(17, 23);
        setLogs(prev => [...prev.slice(-30), { time, event, message, type }]);
      };

      return (
        <div className="card">
          <div className="card-title">
            <span>1. Derived State Architecture</span>
            <span className={`badge ${strategy === "pure" ? "badge-green" : "badge-red"}`}>
              {strategy === "pure" ? "Pure Render (1 Pass)" : "Effect + State (2 Passes)"}
            </span>
          </div>
          <p className="card-desc">
            Deriving values during render executes in <strong>1 pass</strong> without intermediate state lag. Storing derived calculations in state triggers a second render pass for every input change.
          </p>

          <div className="btn-group">
            <button className={strategy === "pure" ? "active" : ""} onClick={() => setStrategy("pure")}>
              ✅ Pure Render Derivation
            </button>
            <button className={strategy === "effect" ? "active" : ""} onClick={() => setStrategy("effect")}>
              ❌ Effect + Shadow State
            </button>
          </div>

          <div style={{ display: "flex", gap: 12 }}>
            <label style={{ display: "flex", flexDirection: "column", gap: 4, flex: 1, fontSize: "0.82rem", color: "var(--text-muted)" }}>
              Price ($):
              <input type="number" value={price} onChange={e => setPrice(Number(e.target.value))} />
            </label>
            <label style={{ display: "flex", flexDirection: "column", gap: 4, flex: 1, fontSize: "0.82rem", color: "var(--text-muted)" }}>
              Quantity:
              <input type="number" value={qty} onChange={e => setQty(Number(e.target.value))} />
            </label>
          </div>

          <div className="benchmark-box">
            {strategy === "pure" ? (
              <PureDerivedCalculator price={price} qty={qty} onLog={addLog} />
            ) : (
              <EffectDerivedCalculator price={price} qty={qty} onLog={addLog} />
            )}
          </div>

          <LogTerminal logs={logs} onClear={() => setLogs([])} />
        </div>
      );
    }

    function PureDerivedCalculator({ price, qty, onLog }) {
      const renders = useRef(0);
      renders.current++;

      // Pure calculation in render
      const total = price * qty;

      useEffect(() => {
        onLog("PURE RENDER", `Calculated total = $${total} in 1 render pass`, "success");
      }, [total]);

      return (
        <div>
          <div>Total Price: <strong style={{ color: "var(--accent-green)", fontSize: "1.2rem" }}>${total}</strong></div>
          <div style={{ fontSize: "0.78rem", color: "var(--text-muted)" }}>Renders: <strong style={{ color: "#fff" }}>{renders.current}</strong> (Zero unnecessary commit cycles)</div>
        </div>
      );
    }

    function EffectDerivedCalculator({ price, qty, onLog }) {
      const renders = useRef(0);
      renders.current++;

      const [total, setTotal] = useState(0);

      useEffect(() => {
        onLog("EFFECT CASCADE", `Setting state total to $${price * qty} (forces Render #2)`, "warn");
        setTotal(price * qty);
      }, [price, qty]);

      return (
        <div>
          <div>Total Price: <strong style={{ color: "var(--accent-amber)", fontSize: "1.2rem" }}>${total}</strong></div>
          <div style={{ fontSize: "0.78rem", color: "var(--text-muted)" }}>Renders: <strong style={{ color: "var(--accent-red)" }}>{renders.current}</strong> (Double render on every keystroke!)</div>
        </div>
      );
    }

    // =========================================================================
    // DEMO 2: MONOLITHIC VS DECOMPOSED EFFECT BOUNDARIES
    // =========================================================================
    function EffectSplittingDemo() {
      const [architecture, setArchitecture] = useState("split"); // "split" vs "monolithic"
      const [roomId, setRoomId] = useState("general");
      const [theme, setTheme] = useState("dark");
      const [logs, setLogs] = useState([]);

      const addLog = (event, message, type = "info") => {
        const time = new Date().toISOString().substring(17, 23);
        setLogs(prev => [...prev.slice(-30), { time, event, message, type }]);
      };

      // Monolithic Effect Simulation
      useEffect(() => {
        if (architecture !== "monolithic") return;

        addLog("MONOLITHIC SETUP", `Connecting to socket "${roomId}" & syncing theme "${theme}"`, "purple");

        return () => {
          addLog("MONOLITHIC TEARDOWN", `Disconnecting socket "${roomId}" due to unrelated change!`, "error");
        };
      }, [roomId, theme, architecture]); // theme in deps triggers socket reconnect!

      // Decomposed / Split Effect Simulation
      useEffect(() => {
        if (architecture !== "split") return;
        addLog("SOCKET SETUP", `Connected to chat room "${roomId}"`, "green");
        return () => addLog("SOCKET TEARDOWN", `Disconnected from room "${roomId}"`, "warn");
      }, [roomId, architecture]); // ONLY roomId!

      useEffect(() => {
        if (architecture !== "split") return;
        addLog("THEME SYNC", `Synchronized document theme: ${theme}`, "cyan");
      }, [theme, architecture]);

      return (
        <div className="card">
          <div className="card-title">
            <span>2. Effect Splitting & Reconnect Storms</span>
            <span className={`badge ${architecture === "split" ? "badge-green" : "badge-red"}`}>
              {architecture === "split" ? "Decomposed Boundaries" : "Monolithic Mega-Effect"}
            </span>
          </div>
          <p className="card-desc">
            In <strong>Monolithic</strong> mode, toggling theme disconnects and reconnects the WebSocket. In <strong>Decomposed</strong> mode, theme changes never disturb the chat socket.
          </p>

          <div className="btn-group">
            <button className={architecture === "split" ? "active" : ""} onClick={() => setArchitecture("split")}>
              ✅ Decomposed Boundaries (Isolated)
            </button>
            <button className={architecture === "monolithic" ? "active" : ""} onClick={() => setArchitecture("monolithic")}>
              ❌ Monolithic Mega-Effect (Coupled)
            </button>
          </div>

          <div style={{ display: "flex", gap: 12 }}>
            <button onClick={() => setRoomId(r => r === "general" ? "engineering" : "general")}>
              🔄 Switch Room ({roomId})
            </button>
            <button onClick={() => setTheme(t => t === "dark" ? "light" : "dark")}>
              🎨 Toggle Theme ({theme})
            </button>
          </div>

          <LogTerminal logs={logs} onClear={() => setLogs([])} />
        </div>
      );
    }

    // =========================================================================
    // DEMO 3: ACCIDENTAL OBJECT IDENTITY CHURN
    // =========================================================================
    function IdentityChurnDemo() {
      const [parentTick, setParentTick] = useState(0);
      const [strategy, setStrategy] = useState("scoped"); // "scoped" vs "unstable"
      const [setups, setSetups] = useState(0);
      const [cleanups, setCleanups] = useState(0);
      const [logs, setLogs] = useState([]);

      const addLog = (event, message, type = "info") => {
        const time = new Date().toISOString().substring(17, 23);
        setLogs(prev => [...prev.slice(-30), { time, event, message, type }]);
      };

      // Unstable inline object declared outside Effect
      const inlineOptions = { autoRetry: true, timeout: 5000 };

      useEffect(() => {
        if (strategy === "unstable") {
          setSetups(s => s + 1);
          addLog("UNSTABLE SETUP", "Re-running Effect because inline object reference changed!", "error");

          return () => {
            setCleanups(c => c + 1);
            addLog("UNSTABLE CLEANUP", "Cleaning up previous effect...", "warn");
          };
        }
      }, [inlineOptions, strategy]); // inlineOptions is a new object on every parent render!

      useEffect(() => {
        if (strategy === "scoped") {
          setSetups(s => s + 1);
          addLog("SCOPED SETUP", "Effect setup with internal options (Zero invalidations)", "success");

          return () => {
            setCleanups(c => c + 1);
          };
        }
      }, [strategy]); // No inline object dependency!

      return (
        <div className="card">
          <div className="card-title">
            <span>3. Scoped Options vs Object Identity Churn</span>
            <span className={`badge ${strategy === "scoped" ? "badge-green" : "badge-red"}`}>
              {strategy === "scoped" ? "Scoped Inside (Stable)" : "Inline Object Churn"}
            </span>
          </div>
          <p className="card-desc">
            Inline dependency objects trigger teardown and setup on every parent render. Scoping options inside the Effect body eliminates the dependency completely.
          </p>

          <div className="btn-group">
            <button className={strategy === "scoped" ? "active" : ""} onClick={() => { setStrategy("scoped"); setSetups(0); setCleanups(0); }}>
              ✅ Scoped Inside Effect
            </button>
            <button className={strategy === "unstable" ? "active" : ""} onClick={() => { setStrategy("unstable"); setSetups(0); setCleanups(0); }}>
              ❌ Inline Object Dependency
            </button>
            <button onClick={() => setParentTick(t => t + 1)} style={{ borderColor: "var(--accent-cyan)" }}>
              ⚡ Trigger Unrelated Parent Render ({parentTick})
            </button>
          </div>

          <div style={{ background: "#0d131f", padding: 14, borderRadius: 8, border: "1px solid var(--border-color)", display: "flex", justifyContent: "space-between" }}>
            <div>Total Setups: <strong style={{ color: setups > 3 ? "var(--accent-red)" : "var(--accent-green)" }}>{setups}</strong></div>
            <div>Total Cleanups: <strong style={{ color: cleanups > 3 ? "var(--accent-red)" : "var(--accent-green)" }}>{cleanups}</strong></div>
          </div>

          <LogTerminal logs={logs} onClear={() => setLogs([])} />
        </div>
      );
    }

    // =========================================================================
    // DEMO 4: INCREMENTAL VS DESTRUCTIVE EXTERNAL WORK
    // =========================================================================
    function IncrementalSyncDemo() {
      const [strategy, setStrategy] = useState("incremental"); // "incremental" vs "destructive"
      const [dataPoint, setDataPoint] = useState(50);
      const [duration, setDuration] = useState(null);
      const canvasRef = useRef(null);

      const handleUpdate = () => {
        const nextVal = Math.floor(Math.random() * 80 + 10);
        setDataPoint(nextVal);

        const start = performance.now();

        if (strategy === "destructive") {
          // Destructive: Wipes DOM, rebuilds 200 elements
          if (canvasRef.current) {
            canvasRef.current.innerHTML = "";
            for (let i = 0; i < 300; i++) {
              const el = document.createElement("div");
              el.style.cssText = `display: inline-block; width: 4px; height: ${Math.random() * 60 + 10}px; background: #38bdf8; margin: 1px;`;
              canvasRef.current.appendChild(el);
            }
          }
        } else {
          // Incremental: Mutates only targeted element
          if (canvasRef.current) {
            const firstBar = canvasRef.current.firstElementChild;
            if (firstBar) {
              firstBar.style.height = `${nextVal}%`;
              firstBar.style.background = "#22c55e";
            }
          }
        }

        const elapsed = performance.now() - start;
        setDuration(elapsed.toFixed(3));
      };

      useEffect(() => {
        // Initial build
        if (canvasRef.current) {
          canvasRef.current.innerHTML = "";
          for (let i = 0; i < 40; i++) {
            const el = document.createElement("div");
            el.style.cssText = `display: inline-block; width: 8px; height: ${i === 0 ? dataPoint : Math.random() * 60 + 10}px; background: #38bdf8; margin: 2px; border-radius: 2px; vertical-align: bottom;`;
            canvasRef.current.appendChild(el);
          }
        }
      }, []);

      return (
        <div className="card">
          <div className="card-title">
            <span>4. Incremental vs Destructive External Sync</span>
            {duration && (
              <span className={`badge ${strategy === "incremental" ? "badge-green" : "badge-red"}`}>
                {duration} ms
              </span>
            )}
          </div>
          <p className="card-desc">
            When synchronizing with third-party canvas or chart libraries, mutating targeted points incrementally is up to <strong>100× faster</strong> than destroying and rebuilding the entire instance.
          </p>

          <div className="btn-group">
            <button className={strategy === "incremental" ? "active" : ""} onClick={() => setStrategy("incremental")}>
              ✅ Incremental Delta Update
            </button>
            <button className={strategy === "destructive" ? "active" : ""} onClick={() => setStrategy("destructive")}>
              ❌ Destructive Full Rebuild
            </button>
            <button onClick={handleUpdate} style={{ borderColor: "var(--accent-cyan)" }}>
              📊 Update Chart Value ({dataPoint})
            </button>
          </div>

          <div style={{ background: "#0d131f", padding: 14, borderRadius: 8, border: "1px solid var(--border-color)", minHeight: 90, display: "flex", alignItems: "flex-end" }}>
            <div ref={canvasRef} style={{ width: "100%", display: "flex", alignItems: "flex-end" }}></div>
          </div>

          {duration && (
            <div style={{ fontSize: "0.85rem", color: "var(--text-muted)" }}>
              Execution time: <strong style={{ color: "var(--accent-cyan)", fontFamily: "var(--font-mono)" }}>{duration}ms</strong>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // ROOT APP
    // =========================================================================
    function App() {
      return (
        <div className="container">
          <header className="header-banner">
            <div>
              <h1>
                <span>⚡</span>
                Lab 13 — Effect Performance & Synchronization Optimization
              </h1>
              <p style={{ color: "var(--text-muted)", fontSize: "0.88rem", marginTop: 4 }}>
                Diagnostic laboratory exploring derived state elimination, decomposed synchronization boundaries, inline identity stability, and incremental external updates.
              </p>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <span className="badge badge-primary">React 18</span>
              <span className="badge badge-green">Optimization</span>
            </div>
          </header>

          <div className="grid-2">
            <DerivedStateDemo />
            <EffectSplittingDemo />
            <IdentityChurnDemo />
            <IncrementalSyncDemo />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
