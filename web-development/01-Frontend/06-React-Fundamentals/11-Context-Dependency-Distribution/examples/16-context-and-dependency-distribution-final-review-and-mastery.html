    // =========================================================================
    // LAB 1: ARCHITECTURE BUILDER & SCOPE CONFIGURATOR
    // =========================================================================

      const [scope, setScope] = useState('Feature'); // Global | Feature | Local
      const [frequency, setFrequency] = useState('low'); // low | high

      return (
        <div className="space-y-6">

              <span className="text-cyan-400">🏛️ Lab 1:</span> Architectural Scope & Distribution Builder
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Configure dependency parameters to evaluate whether Context, Composition, Local State, or an External Store is the mathematically optimal distribution strategy.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6 font-mono text-xs">
            {/* Parameters Panel */}

                    <button
                      key={s}
                      onClick={() => setScope(s)}

                      }`}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="text-xs text-gray-400 block mb-1.5 font-semibold">Update Frequency:</label>
                <div className="grid grid-cols-2 gap-2">
                  {[
                    { id: 'low', label: 'Low (User Clicks)' },
                    { id: 'high', label: 'High (60fps/Keys)' }
                  ].map((f) => (
                    <button
                      key={f.id}
                      onClick={() => setFrequency(f.id)}
                      className={`py-1.5 rounded-lg text-xs font-bold transition-all ${
                        frequency === f.id ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'

            {/* Architecture Evaluation Output */}
            <div className="md:col-span-2 glass-panel p-5 rounded-xl space-y-4">

                    </p>

    // =========================================================================
    // LAB 2: THE SEVEN-IDENTITY PROBE [C, D_default, P, V, F, D_domain, D_DOM]
    // =========================================================================
    function Lab2SevenIdentityProbe() {
      const [providerInstance, setProviderInstance] = useState(1);
      const [count, setCount] = useState(10);

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">🔬 Lab 2:</span> The Seven Distinct Identities: [C, D_default, P, V, F, D_domain, D_DOM]
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Live inspection of the 7 separate identities in React Context architecture. Never collapse them into one concept.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            {/* Identity Probe Table */}
            <div className="glass-panel p-5 rounded-xl space-y-3">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Live Identity Matrix</h3>
              
              <div className="space-y-2">
                <div className="p-2 bg-gray-950 rounded border border-gray-800 flex justify-between">
                  <span className="text-gray-400">C (Context Token):</span>
                  <span className="text-cyan-400 font-bold">0x7F9A_TOKEN_CONST</span>
                </div>
                <div className="p-2 bg-gray-950 rounded border border-gray-800 flex justify-between">
                  <span className="text-gray-400">D_default (Default Fallback):</span>

                  <span className="text-emerald-400 font-bold">Object.is Tuple({count})</span>
                </div>
                <div className="p-2 bg-gray-950 rounded border border-gray-800 flex justify-between">
                  <span className="text-gray-400">F (Consumer Fiber):</span>
                  <span className="text-cyan-300 font-bold">Fiber_Consumer_Node</span>
                </div>
                <div className="p-2 bg-gray-950 rounded border border-gray-800 flex justify-between">

                  <span className="text-rose-400 font-bold">{docId}</span>
                </div>
                <div className="p-2 bg-gray-950 rounded border border-gray-800 flex justify-between">
                  <span className="text-gray-400">D_DOM (Host DOM Node):</span>
                  <span className="text-gray-300 font-bold">&lt;div#root-node&gt;</span>
                </div>
              </div>
            </div>

            {/* Mutation Controls */}
            <div className="glass-panel p-5 rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Trigger Isolated Identity Changes</h3>
              
              <div className="space-y-2">
                <button
                  onClick={() => setCount(prev => prev + 1)}
                  className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold transition-all"
                >
                  Mutate Value Identity (V) [Count + 1]
                </button>
                <button
                  onClick={() => setProviderInstance(prev => prev + 1)}
                  className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-bold transition-all"
                >
                  Change Provider Key (P) [Remount Fiber]
                </button>
                <button
                  onClick={() => setDocId(`DOC_${Math.floor(Math.random()*900 + 100)}_NEW`)}

                >
                  Switch Domain Identity (D_domain)
                </button>
              </div>

              <div className="p-3 bg-gray-950 rounded-lg text-[11px] text-gray-400 border border-gray-800">
                Notice how changing <strong>P (Provider Fiber)</strong> unmounts internal state, while changing <strong>V (Value)</strong> triggers propagation to consumers without destroying component state.

    // =========================================================================
    // LAB 3: 6-STAGE RENDER & RECONCILIATION PIPELINE
    // =========================================================================
    function Lab3RenderPipelineVisualizer() {
      const [step, setStep] = useState(0);

      const stages = [
        { name: '1. State Update Trigger', desc: 'Event handler dispatches setState() or reducer action on Provider owner.' },
        { name: '2. Provider Owner Render', desc: 'Parent component re-evaluates its render function and constructs value prop.' },
        { name: '3. Value Identity Check', desc: 'React evaluates !Object.is(oldValue, newValue). If false, triggers propagation.' },
        { name: '4. Traversal of Fiber.dependencies', desc: 'React walks child Fibers and marks matching consumers with update lanes.' },
        { name: '5. Consumer Render Execution', desc: 'Consumer components re-run their render functions and generate new virtual nodes.' },
        { name: '6. Commit Phase DOM Mutation', desc: 'React compares new vs old virtual nodes and mutates real host DOM if different.' }
      ];

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">⚡ Lab 3:</span> 6-Stage Render & Reconciliation Pipeline
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Step through the exact sequence of events during a Context update cycle in the React Fiber reconciler.
            </p>
          </div>

          <div className="glass-panel p-5 rounded-xl space-y-4">
            <div className="grid grid-cols-2 sm:grid-cols-6 gap-2">
              {stages.map((stg, idx) => (
                <button
                  key={idx}
                  onClick={() => setStep(idx)}
                  className={`p-2.5 rounded-lg text-xs font-mono font-bold text-center transition-all ${
                    step === idx
                      ? 'bg-cyan-600 text-white shadow-md'
                      : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
                  }`}
                >
                  Step {idx + 1}
                </button>
              ))}
            </div>

            <div className="p-5 bg-gray-950 rounded-xl border border-gray-800 font-mono space-y-2">
              <div className="text-cyan-400 font-bold text-sm">{stages[step].name}</div>
              <p className="text-gray-300 text-xs">{stages[step].desc}</p>
            </div>

            <div className="flex justify-between items-center pt-2">
              <button
                disabled={step === 0}
                onClick={() => setStep(prev => prev - 1)}
                className="px-4 py-2 bg-gray-800 hover:bg-gray-700 disabled:opacity-40 text-white rounded-lg text-xs font-bold"
              >
                ← Previous Stage
              </button>
              <button
                disabled={step === stages.length - 1}
                onClick={() => setStep(prev => prev + 1)}
                className="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-40 text-white rounded-lg text-xs font-bold"
              >
                Next Stage →
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // LAB 4: DYNAMIC DEPENDENCY MATRIX
    // =========================================================================
    function Lab4DependencyMatrix() {
      const consumers = [

        { name: 'EditorToolbar', readsTheme: true, readsAuth: false, readsEditor: true },
        { name: 'CanvasRenderer', readsTheme: false, readsAuth: false, readsEditor: true },
        { name: 'UserProfile', readsTheme: false, readsAuth: true, readsEditor: false },
        { name: 'SettingsDialog', readsTheme: true, readsAuth: true, readsEditor: false }
      ];

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">📊 Lab 4:</span> Interactive Component Dependency Matrix
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Audit which components establish dependencies on specific Context channels. Avoid multi-channel broad contamination.
            </p>
          </div>

          <div className="glass-panel p-5 rounded-xl overflow-x-auto">
            <table className="w-full text-left text-xs font-mono">
              <thead>
                <tr className="border-b border-gray-800 text-gray-400">
                  <th className="pb-3">Consumer Component</th>
                  <th className="pb-3">ThemeContext</th>

                    <td className="py-3 text-white font-bold">{c.name}</td>

                    <td className="py-3">{c.readsAuth ? <span className="text-indigo-400 font-bold">✓ Read</span> : <span className="text-gray-600">-</span>}</td>
                    <td className="py-3">{c.readsEditor ? <span className="text-cyan-400 font-bold">✓ Read</span> : <span className="text-gray-600">-</span>}</td>
                    <td className="py-3">
                      <span className="px-2 py-0.5 rounded bg-gray-900 border border-gray-800 text-[10px] text-gray-300">

            </table>
          </div>
        </div>
      );
    }

    // =========================================================================
    // LAB 5: OPTIMIZATION SIMULATOR
    // =========================================================================
    function Lab5OptimizationSimulator() {
      const [optStrategy, setOptStrategy] = useState('none');

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">🚀 Lab 5:</span> Performance Optimization Strategy Simulator
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Compare the effectiveness of different optimization strategies when mitigating Context re-render storms.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            <div className="glass-panel p-5 rounded-xl space-y-3">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Select Optimization Strategy</h3>
              
              <div className="space-y-2">
                {[
                  { id: 'none', label: '1. No Optimization (God Context)' },
                  { id: 'useMemo', label: '2. useMemo on Value Tuple' },
                  { id: 'split', label: '3. Split Context (State vs Dispatch)' },
                  { id: 'store', label: '4. Context + useSyncExternalStore' }
                ].map((s) => (
                  <button
                    key={s.id}
                    onClick={() => setOptStrategy(s.id)}
                    className={`w-full text-left p-2.5 rounded-lg font-bold transition-all ${
                      optStrategy === s.id
                        ? 'bg-cyan-600 text-white shadow-md'
                        : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
                    }`}
                  >
                    {s.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="glass-panel p-5 rounded-xl space-y-3">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Reconciliation Blast Radius</h3>
              
              <div className="p-4 bg-gray-950 rounded-xl border border-gray-800 space-y-2">
                {optStrategy === 'none' && (
                  <div className="text-rose-400">
                    <strong>100% Tree Re-render:</strong> Every consumer in the subtree re-renders on every keystroke or update.
                  </div>
                )}
                {optStrategy === 'useMemo' && (
                  <div className="text-amber-400">
                    <strong>Partial Stabilization:</strong> Protects against parent re-renders, but any state update still invalidates the tuple.
                  </div>
                )}
                {optStrategy === 'split' && (
                  <div className="text-emerald-400">
                    <strong>50% Waste Eliminated:</strong> Components needing only dispatch do not re-render when state changes.
                  </div>
                )}
                {optStrategy === 'store' && (
                  <div className="text-cyan-300">
                    <strong>Zero-Waste Reconciler:</strong> Only the exact leaf components whose selected state slices changed re-render!
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // LAB 6: MASTER CERTIFICATION QUIZ
    // =========================================================================
    function Lab6MasterCertification() {
      const questions = [
        {
          id: 1,
          q: "Does React.memo prevent a component from re-rendering when a consumed Context value updates?",
          options: ["Yes, memo blocks all renders", "No, Context bypasses memo via Fiber update lanes"],
          correct: "No, Context bypasses memo via Fiber update lanes"
        },
        {
          id: 2,
          q: "Why is createContext<T | null>(null) preferred over fake mock defaults for mandatory services?",
          options: ["It saves memory", "It causes missing Provider bugs to fail fast with descriptive errors"],
          correct: "It causes missing Provider bugs to fail fast with descriptive errors"
        },
        {
          id: 3,
          q: "What is the primary role of Context in a Context + External Store hybrid architecture?",
          options: ["To store reactive state", "To distribute the stable Store instance reference down the tree"],
          correct: "To distribute the stable Store instance reference down the tree"
        }
      ];

      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const score = questions.filter(q => answers[q.id] === q.correct).length;

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">🏆 Lab 6:</span> KPI 11 Senior Master Certification
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Complete the final gauntlet to verify comprehensive mastery of Context & Dependency Distribution.
            </p>
          </div>

          <div className="space-y-4">
            {questions.map((q) => {
              const selected = answers[q.id];
              return (
                <div key={q.id} className="glass-panel p-4 rounded-xl space-y-2.5 font-mono text-xs">
                  <div className="text-white font-bold text-sm">{q.q}</div>
                  <div className="flex flex-wrap gap-2">
                    {q.options.map((opt) => (
                      <button
                        key={opt}
                        onClick={() => setAnswers(prev => ({ ...prev, [q.id]: opt }))}
                        className={`px-3 py-1.5 rounded-lg transition-all ${
                          selected === opt ? 'bg-cyan-600 text-white font-bold' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'
                        }`}
                      >
                        {opt}
                      </button>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          <div className="flex justify-between items-center glass-panel p-4 rounded-xl">
            <button
              onClick={() => setSubmitted(true)}
              className="px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs uppercase tracking-wider rounded-lg transition-all"
            >
              Submit Certification Gauntlet
            </button>
            {submitted && (
              <div className="text-sm font-bold font-mono text-white">
                Score: <span className={score === questions.length ? 'text-emerald-400' : 'text-amber-400'}>{score} / {questions.length}</span> — {score === questions.length ? '🏆 Level 5 Principal Master Certified!' : 'Review Recommended'}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
