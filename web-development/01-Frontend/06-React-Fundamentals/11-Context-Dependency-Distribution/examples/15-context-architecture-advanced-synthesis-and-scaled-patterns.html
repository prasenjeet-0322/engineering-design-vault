          {/* Tab Navigation */}
          <nav className="bg-gray-900/60 border-b border-gray-800 px-6 py-2.5 flex items-center gap-2 overflow-x-auto custom-scrollbar">

              >

                <span>{tab.label}</span>

          </nav>

          {/* Active Lab Body */}
          <main className="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
            {activeTab === 'lab1' && <Lab1MultiTierTopology />}

    // =========================================================================
    // LAB 1: SCALED MULTI-TIER TOPOLOGY
    // =========================================================================
    function Lab1MultiTierTopology() {
      const [activeWorkspace, setActiveWorkspace] = useState('ws_engineering');
      const [theme, setTheme] = useState('dark');
      const [session, setSession] = useState({ user: 'Prasenjeet', role: 'Staff Engineer' });

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">🏛️ Lab 1:</span> Enterprise Multi-Tier Scope Hierarchy
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Visualize how global environmental tokens, session contexts, workspace scopes, and isolated feature boundaries nest together cleanly without tier confusion.
            </p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Control Column */}
            <div className="glass-panel p-5 rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Global & Workspace Controls</h3>
              
              <div>
                <label className="text-xs text-gray-400 block mb-1 font-semibold">Global Theme:</label>
                <div className="flex gap-2">
                  {['dark', 'light'].map((t) => (
                    <button
                      key={t}
                      onClick={() => setTheme(t)}
                      className={`flex-1 py-1.5 rounded-lg text-xs font-bold capitalize transition-all ${
                        theme === t ? 'bg-cyan-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
                      }`}
                    >
                      {t} Mode
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="text-xs text-gray-400 block mb-1 font-semibold">Workspace Context Route:</label>
                <div className="space-y-1.5">
                  {[
                    { id: 'ws_engineering', name: 'Engineering Design Vault' },
                    { id: 'ws_billing', name: 'Enterprise Billing & Invoices' }
                  ].map((ws) => (
                    <button
                      key={ws.id}
                      onClick={() => setActiveWorkspace(ws.id)}
                      className={`w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition-all ${
                        activeWorkspace === ws.id
                          ? 'bg-indigo-600 text-white shadow-md'
                          : 'bg-gray-800 text-gray-300 hover:bg-gray-700'
                      }`}
                    >
                      {ws.name}
                    </button>
                  ))}
                </div>
              </div>

              <div className="p-3 bg-gray-950 rounded-lg text-xs space-y-1.5 border border-gray-800 font-mono">
                <div className="text-cyan-400 font-bold">Tier Invariants:</div>
                <p className="text-gray-400">
                  • <strong>Global Tier</strong>: Stable lifetime, shared across entire SPA.<br/>
                  • <strong>Workspace Tier</strong>: Keyed reset when switching workspaces.<br/>
                  • <strong>Feature Tier</strong>: Scoped directly around Editor & Cart instances.
                </p>
              </div>
            </div>

            {/* Tree Map View */}
            <div className="lg:col-span-2 glass-panel p-5 rounded-xl font-mono text-xs space-y-3">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Scope Resolution Map</h3>

              <div className="p-4 bg-gray-950 rounded-xl space-y-3 border border-gray-800">
                {/* Global Layer */}
                <div className="p-3 bg-gray-900/90 rounded-lg border border-cyan-800/60 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-cyan-400 font-bold text-xs">TIER 1: &lt;EnvironmentProvider&gt; & &lt;SessionProvider&gt;</span>
                    <span className="text-[10px] text-gray-400">Scope: Application Root</span>
                  </div>
                  <div className="text-gray-300 text-[11px]">
                    User: <span className="text-emerald-400 font-bold">{session.user}</span> | Role: <span className="text-amber-400">{session.role}</span> | Theme: <span className="text-cyan-300 uppercase font-bold">{theme}</span>
                  </div>

                  {/* Workspace Layer */}
                  <div className="p-3 bg-gray-950 rounded-lg border border-indigo-800/60 space-y-2 mt-2">
                    <div className="flex items-center justify-between">
                      <span className="text-indigo-400 font-bold text-xs">TIER 2: &lt;WorkspaceScope key="{activeWorkspace}"&gt;</span>
                      <span className="text-[10px] text-gray-400">Scope: Route Level</span>
                    </div>
                    <div className="text-gray-300 text-[11px]">
                      Active Workspace ID: <span className="text-indigo-300 font-bold">{activeWorkspace}</span>
                    </div>

                    {/* Feature Instances */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2">
                      <div className="p-2.5 bg-gray-900 rounded border border-emerald-800/60 space-y-1">
                        <div className="text-emerald-400 font-bold text-[10px]">TIER 3: &lt;EditorFeatureScope id="A"&gt;</div>
                        <div className="text-gray-400 text-[10px]">Canvas, Selection, Commands</div>
                      </div>
                      <div className="p-2.5 bg-gray-900 rounded border border-amber-800/60 space-y-1">
                        <div className="text-amber-400 font-bold text-[10px]">TIER 3: &lt;CommentsFeatureScope&gt;</div>
                        <div className="text-gray-400 text-[10px]">Thread Stream, Mentions</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // LAB 2: GATEWAY PATTERN & ABSTRACTION SWAPPER
    // =========================================================================
    function Lab2GatewayPattern() {
      const [backendType, setBackendType] = useState('reducer'); // 'reducer' | 'externalStore' | 'mock'
      const [activeTool, setActiveTool] = useState('select');
      const [logs, setLogs] = useState([]);

      const handleToolSelect = (tool) => {
        setActiveTool(tool);
        setLogs(prev => [`[Gateway Execution] selectTool("${tool}") dispatched via ${backendType.toUpperCase()} backend`, ...prev.slice(0, 5)]);
      };

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">🔌 Lab 2:</span> Domain Gateway Pattern: Encapsulation in Practice
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Consumers should depend solely on semantic hooks (<code className="text-cyan-300">useEditorState()</code>, <code className="text-cyan-300">useEditorCommands()</code>), completely decoupled from whether the Provider uses <code className="text-cyan-300">useReducer</code>, an <code className="text-cyan-300">External Store</code>, or a mock adapter.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            {/* Backend Swapper */}
            <div className="glass-panel p-5 rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Provider Implementation Engine</h3>
              
              <div>
                <label className="text-xs text-gray-400 block mb-2 font-semibold">Underlying State Engine:</label>
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { id: 'reducer', label: 'useReducer' },
                    { id: 'externalStore', label: 'useSyncExtStore' },
                    { id: 'mock', label: 'Mock Adapter' }
                  ].map((b) => (
                    <button
                      key={b.id}
                      onClick={() => setBackendType(b.id)}
                      className={`py-2 rounded-lg text-xs font-bold transition-all ${
                        backendType === b.id
                          ? 'bg-cyan-600 text-white shadow-md'
                          : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
                      }`}
                    >
                      {b.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="p-3 bg-gray-950 rounded-lg space-y-2 border border-gray-800">
                <span className="text-cyan-400 font-bold block">Consumer Component View:</span>
                <div className="p-3 bg-gray-900 rounded border border-gray-800 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-gray-400">Active Tool:</span>
                    <span className="px-2 py-0.5 bg-indigo-950 text-indigo-300 rounded font-bold border border-indigo-800">
                      {activeTool.toUpperCase()}
                    </span>
                  </div>
                  <div className="flex gap-2">
                    {['select', 'pen', 'rectangle', 'eraser'].map((t) => (
                      <button
                        key={t}
                        onClick={() => handleToolSelect(t)}
                        className={`flex-1 py-1 rounded text-[11px] font-bold capitalize transition-all ${
                          activeTool === t ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'
                        }`}
                      >
                        {t}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* Event & Code Inspector */}
            <div className="glass-panel p-5 rounded-xl space-y-3">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Seam Decoupling Audit</h3>
              
              <div className="p-3 bg-gray-950 rounded-lg border border-gray-800 space-y-2">
                <div className="text-gray-400 text-[11px]">
                  Consumer code remains <strong>100% untouched</strong>:
                </div>
                <pre className="text-cyan-300 text-[10px] overflow-x-auto">
{`function Toolbar() {
  const { activeTool } = useEditorState();
  const { selectTool } = useEditorCommands();
  return <Button onClick={() => selectTool('pen')} />;
}`}
                </pre>
              </div>

              <div className="space-y-1.5 h-36 overflow-y-auto custom-scrollbar p-2 bg-gray-950 rounded-lg border border-gray-800">
                {logs.length === 0 ? (
                  <div className="text-gray-600 text-[11px] text-center py-8">Click tools to verify decoupled execution.</div>
                ) : (
                  logs.map((log, idx) => (
                    <div key={idx} className="text-gray-300 text-[10px] p-1.5 bg-gray-900 rounded border border-gray-800">
                      {log}
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // LAB 3: MULTI-INSTANCE ISOLATION GAUNTLET
    // =========================================================================
    function Lab3MultiInstanceIsolation() {
      const [editorA, setEditorA] = useState({ tool: 'pen', selection: ['Node_1'] });
      const [editorB, setEditorB] = useState({ tool: 'select', selection: [] });
      const [renderCounts, setRenderCounts] = useState({ A: 0, B: 0 });

      const mutateA = (tool) => {
        setEditorA(prev => ({ ...prev, tool }));
        setRenderCounts(prev => ({ ...prev, A: prev.A + 1 }));
      };

      const mutateB = (tool) => {
        setEditorB(prev => ({ ...prev, tool }));
        setRenderCounts(prev => ({ ...prev, B: prev.B + 1 }));
      };

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">📦 Lab 3:</span> Multi-Instance Isolation & Zero State Leakage
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Verify that rendering multiple concurrent instances of <code className="text-cyan-300">&lt;EditorProvider&gt;</code> maintains strict state isolation and zero cross-instance re-render pollution.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            {/* Instance A */}
            <div className="glass-panel p-5 rounded-xl space-y-3 border-emerald-900/50">
              <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                <span className="text-emerald-400 font-bold text-sm">Editor Instance A (docId="doc_alpha")</span>
                <span className="px-2 py-0.5 bg-emerald-950 text-emerald-300 rounded text-[10px] border border-emerald-800">
                  Renders: {renderCounts.A}
                </span>
              </div>

              <div className="p-3 bg-gray-950 rounded-lg space-y-2 border border-gray-800">
                <div className="text-gray-300">Tool: <strong className="text-emerald-400 uppercase">{editorA.tool}</strong></div>
                <div className="text-gray-400">Selected: {editorA.selection.join(', ') || 'None'}</div>
              </div>

              <div className="flex gap-2">
                {['pen', 'rectangle', 'select'].map((tool) => (
                  <button
                    key={tool}
                    onClick={() => mutateA(tool)}
                    className="flex-1 py-1.5 bg-gray-800 hover:bg-emerald-600 hover:text-white text-gray-300 rounded text-[11px] font-bold capitalize transition-all"
                  >
                    Set {tool}
                  </button>
                ))}
              </div>
            </div>

            {/* Instance B */}
            <div className="glass-panel p-5 rounded-xl space-y-3 border-indigo-900/50">
              <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                <span className="text-indigo-400 font-bold text-sm">Editor Instance B (docId="doc_beta")</span>
                <span className="px-2 py-0.5 bg-indigo-950 text-indigo-300 rounded text-[10px] border border-indigo-800">
                  Renders: {renderCounts.B}
                </span>
              </div>

              <div className="p-3 bg-gray-950 rounded-lg space-y-2 border border-gray-800">
                <div className="text-gray-300">Tool: <strong className="text-indigo-400 uppercase">{editorB.tool}</strong></div>
                <div className="text-gray-400">Selected: {editorB.selection.join(', ') || 'None'}</div>
              </div>

              <div className="flex gap-2">
                {['pen', 'rectangle', 'select'].map((tool) => (
                  <button
                    key={tool}
                    onClick={() => mutateB(tool)}
                    className="flex-1 py-1.5 bg-gray-800 hover:bg-indigo-600 hover:text-white text-gray-300 rounded text-[11px] font-bold capitalize transition-all"
                  >
                    Set {tool}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // LAB 4: CONTEXT + EXTERNAL STORE HYBRID WITH SELECTORS
    // =========================================================================
    function Lab4ContextExternalStore() {
      const [title, setTitle] = useState("System Architecture Spec");
      const [cursorPos, setCursorPos] = useState({ x: 120, y: 340 });
      const [titleRenderCount, setTitleRenderCount] = useState(0);
      const [cursorRenderCount, setCursorRenderCount] = useState(0);

      const moveCursor = () => {
        setCursorPos(prev => ({ x: prev.x + Math.floor(Math.random() * 10 - 5), y: prev.y + Math.floor(Math.random() * 10 - 5) }));
        setCursorRenderCount(prev => prev + 1);
      };

      const changeTitle = (newT) => {
        setTitle(newT);
        setTitleRenderCount(prev => prev + 1);
      };

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">⚡ Lab 4:</span> Hybrid Context + Fine-Grained Subscription Engine
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Context carries the stable Store reference while <code className="text-cyan-300">useSyncExternalStore</code> isolates slice updates. High-frequency cursor movements do not cause title consumers to re-render.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            {/* Title Consumer */}
            <div className="glass-panel p-5 rounded-xl space-y-3">
              <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                <span className="text-cyan-400 font-bold">Document Header (Selector: state.title)</span>
                <span className="px-2 py-0.5 bg-cyan-950 text-cyan-300 rounded text-[10px] border border-cyan-800">
                  Renders: {titleRenderCount}
                </span>
              </div>
              <input
                type="text"
                value={title}
                onChange={(e) => changeTitle(e.target.value)}
                className="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-white font-mono text-xs focus:border-cyan-500 outline-none"
              />
              <p className="text-gray-500 text-[10px]">
                Subscribed exclusively to <code className="text-cyan-400">title</code> changes.
              </p>
            </div>

            {/* Cursor Consumer */}
            <div className="glass-panel p-5 rounded-xl space-y-3">
              <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                <span className="text-amber-400 font-bold">Status Bar (Selector: state.cursor)</span>
                <span className="px-2 py-0.5 bg-amber-950 text-amber-300 rounded text-[10px] border border-amber-800">
                  Renders: {cursorRenderCount}
                </span>
              </div>
              <div className="p-3 bg-gray-950 rounded-lg text-gray-300 flex justify-between items-center">
                <span>Coordinates:</span>
                <span className="text-amber-400 font-bold">X: {cursorPos.x}px | Y: {cursorPos.y}px</span>
              </div>
              <button
                onClick={moveCursor}
                className="w-full py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg font-bold text-xs transition-all"
              >
                Simulate 60FPS Cursor Tick
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // LAB 5: HEADLESS COMPOUND UI
    // =========================================================================
    function Lab5HeadlessCompound() {
      const [activeTab, setActiveTab] = useState('overview');

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">🧩 Lab 5:</span> Headless Compound Components with Local Context
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Compound components like <code className="text-cyan-300">&lt;Tabs&gt;</code> use private local instance Context to communicate between triggers and panels without manual prop forwarding.
            </p>
          </div>

          <div className="glass-panel p-5 rounded-xl space-y-4">
            <div className="flex gap-2 border-b border-gray-800 pb-3">
              {[
                { id: 'overview', label: 'Architecture Overview' },
                { id: 'fiber', label: 'Fiber Reconciler' },
                { id: 'benchmarks', label: 'Performance Latency' }
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${
                    activeTab === tab.id
                      ? 'bg-cyan-600 text-white shadow-md'
                      : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            <div className="p-4 bg-gray-950 rounded-xl font-mono text-xs text-gray-300 border border-gray-800 min-h-24">
              {activeTab === 'overview' && (
                <div>
                  <h4 className="text-white font-bold mb-1">Architecture Overview Panel</h4>
                  <p className="text-gray-400">Context provides scoped communication between &lt;Tabs&gt; root and child triggers.</p>
                </div>
              )}
              {activeTab === 'fiber' && (
                <div>
                  <h4 className="text-white font-bold mb-1">Fiber Reconciler Panel</h4>
                  <p className="text-gray-400">Fiber dependencies are recorded during render passes and checked via Object.is equality.</p>
                </div>
              )}
              {activeTab === 'benchmarks' && (
                <div>
                  <h4 className="text-white font-bold mb-1">Performance Benchmarks Panel</h4>
                  <p className="text-gray-400">Zero unnecessary re-renders achieved through compound subtree memoization.</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // LAB 6: IN-TREE DI & TESTING
    // =========================================================================
    function Lab6InTreeDI() {
      const [storageMode, setStorageMode] = useState('memory'); // 'memory' | 'local'
      const [items, setItems] = useState({ 'session_token': 'SEC_TOKEN_89X' });

      const saveItem = () => {
        const key = `key_${Math.floor(Math.random() * 900 + 100)}`;
        setItems(prev => ({ ...prev, [key]: `val_${Date.now().toString().slice(-4)}` }));
      };

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">🧪 Lab 6:</span> In-Tree Dependency Injection for Test Harnesses
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Swap production adapters for in-memory fake test harnesses seamlessly via Context Provider injection.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 font-mono text-xs">
            <div className="glass-panel p-5 rounded-xl space-y-4">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Active Injected Adapter</h3>
              
              <div className="flex gap-2">
                <button
                  onClick={() => setStorageMode('memory')}
                  className={`flex-1 py-2 rounded-lg font-bold ${
                    storageMode === 'memory' ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-400'
                  }`}
                >
                  In-Memory Test Adapter
                </button>
                <button
                  onClick={() => setStorageMode('local')}
                  className={`flex-1 py-2 rounded-lg font-bold ${
                    storageMode === 'local' ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-400'
                  }`}
                >
                  Production LocalStorage
                </button>
              </div>

              <button
                onClick={saveItem}
                className="w-full py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg font-bold transition-all"
              >
                Write Storage Entry
              </button>
            </div>

            <div className="glass-panel p-5 rounded-xl space-y-3">
              <h3 className="text-sm font-bold text-white border-b border-gray-800 pb-2">Storage Snapshot</h3>
              <pre className="p-3 bg-gray-950 rounded-lg text-emerald-400 border border-gray-800 overflow-x-auto">
                {JSON.stringify(items, null, 2)}
              </pre>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // LAB 7: ARCHITECTURE SCORECARD
    // =========================================================================
    function Lab7ArchitectureScorecard() {
      const criteria = [
        { id: 'c1', name: 'Ownership Boundary', desc: 'Single authoritative controller owns the data.' },
        { id: 'c2', name: 'Scope Precision', desc: 'Mounted precisely at feature subtree boundary.' },
        { id: 'c3', name: 'Lifetime Alignment', desc: 'Strictly unmounted when feature closes.' },
        { id: 'c4', name: 'Update Frequency', desc: 'Low-frequency ambient data or external store.' },
        { id: 'c5', name: 'Domain Gateway Hook', desc: 'Private context behind useFeatureState / useFeatureCommands.' },
        { id: 'c6', name: 'Test DI Replaceability', desc: 'Easily injected with mock adapters.' }
      ];

      const [scores, setScores] = useState({ c1: 2, c2: 2, c3: 2, c4: 2, c5: 2, c6: 2 });

      const totalScore = Object.values(scores).reduce((a, b) => a + b, 0);

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl border-cyan-900/50">
            <h2 className="text-lg font-bold text-white flex items-center gap-2">
              <span className="text-cyan-400">📊 Lab 7:</span> Senior Architecture Review Scorecard
            </h2>
            <p className="text-gray-400 text-sm mt-1">
              Rate your Context architecture across enterprise dimensions to calculate its Senior Gold Standard index.
            </p>
          </div>

          <div className="space-y-3">
            {criteria.map((crit) => (
              <div key={crit.id} className="glass-panel p-4 rounded-xl flex flex-wrap items-center justify-between gap-4">
                <div>
                  <h4 className="text-white font-bold text-xs">{crit.name}</h4>
                  <p className="text-gray-400 text-[11px]">{crit.desc}</p>
                </div>
                <div className="flex gap-1.5 font-mono text-xs">
                  {[0, 1, 2].map((val) => (
                    <button
                      key={val}
                      onClick={() => setScores(prev => ({ ...prev, [crit.id]: val }))}
                      className={`px-3 py-1 rounded-lg font-bold transition-all ${
                        scores[crit.id] === val
                          ? 'bg-cyan-600 text-white'
                          : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
                      }`}
                    >
                      {val === 0 ? '0: Flawed' : val === 1 ? '1: Acceptable' : '2: Gold'}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>

          <div className="glass-panel p-5 rounded-xl flex items-center justify-between">
            <span className="text-white font-bold text-sm">Overall Score:</span>
            <div className="text-right font-mono">
              <span className={`text-xl font-extrabold ${totalScore >= 10 ? 'text-emerald-400' : 'text-amber-400'}`}>
                {totalScore} / 12
              </span>
              <span className="text-xs text-gray-400 block">
                {totalScore >= 10 ? '✅ Enterprise Senior Gold Standard' : '⚠️ Refactoring Recommended'}
              </span>
            </div>
          </div>
        </div>
      );
    }

    // Mount Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
