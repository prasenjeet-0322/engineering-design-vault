  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef, useReducer } = React;

    // --- HEADER COMPONENT ---
    function Header({ activeTab, setActiveTab }) {
      const tabs = [
        { id: 'race-simulator', label: '1. Out-of-Order Race Lab' },
        { id: 'generation-guard', label: '2. Generation Guards & Abort' },
        { id: 'adversarial-jitter', label: '3. Adversarial Jitter Test' },
        { id: 'domain-policies', label: '4. Domain Policy Matrix' },

      return (

          <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
              <div>
                <div className="flex items-center gap-2">

                    KPI 15 · Part 02
                  </span>

                  Request Cancellation & Race Condition Guards Lab

                  Monotonic Generation IDs, AbortController Signals, Latest-Wins Protocols & Invariant Guards

              </div>
              <div className="flex items-center gap-2">
                <a

    // =========================================================================
    // TAB 1: OUT-OF-ORDER RACE SIMULATOR
    // =========================================================================
    function TabRaceSimulator() {
      const [enableGuard, setEnableGuard] = useState(true);
      const [enableAbort, setEnableAbort] = useState(true);
      const [displayedData, setDisplayedData] = useState('None');
      const [requests, setRequests] = useState([]);

      const generationRef = useRef(0);
      const abortControllerRef = useRef(null);

      const triggerSearch = (query, delay) => {
        if (enableAbort) {
          abortControllerRef.current?.abort();
        }

        const controller = new AbortController();
        abortControllerRef.current = controller;
        const currentGen = ++generationRef.current;

        const reqId = `Req-${currentGen}`;
        const newReq = {
          id: reqId,
          query,
          gen: currentGen,
          delay,
          status: 'In-Flight',
          startedAt: performance.now()
        };

        setRequests(prev => [newReq, ...prev]);

        setTimeout(() => {
          let outcome = 'Committed';
          const isCurrent = currentGen === generationRef.current;
          const wasAborted = controller.signal.aborted;

          if (enableGuard && !isCurrent) {
            outcome = 'Discarded (Stale Generation)';
          } else if (enableAbort && wasAborted) {
            outcome = 'Discarded (Aborted)';
          } else {
            setDisplayedData(`Result for "${query}" (Gen #${currentGen})`);
          }

          setRequests(prev => prev.map(r => r.id === reqId ? { ...r, status: outcome } : r));
        }, delay);
      };

      const runClassicRace = () => {
        setRequests([]);
        setDisplayedData('Awaiting completion...');
        // Fire 3 requests in rapid succession with inverted latency!
        triggerSearch('react', 3000); // Req 1 (slow)
        setTimeout(() => triggerSearch('react hooks', 1500), 50); // Req 2 (medium)
        setTimeout(() => triggerSearch('react hooks forms', 400), 100); // Req 3 (fast)
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
              <div>
                <h2 className="text-lg font-bold text-white">The Classic Search-as-You-Type Race</h2>
                <p className="text-xs text-slate-400">
                  Simulate 3 requests with inverted delays (Req 1: 3000ms, Req 2: 1500ms, Req 3: 400ms).
                </p>
              </div>
              <button
                onClick={runClassicRace}
                className="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs rounded-lg transition shadow-lg shadow-cyan-600/20 font-mono"
              >
                ▶ Run Classic Race Sequence (A ──► B ──► C)
              </button>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-3 border-t border-slate-800">
              <label className="flex items-center justify-between p-3 bg-slate-950 rounded-xl border border-slate-800 cursor-pointer">
                <div>
                  <span className="text-xs font-mono text-cyan-400 font-bold block">1. Generation Currentness Guard</span>
                  <span className="text-[11px] text-slate-400">if (gen !== generationRef.current) return</span>
                </div>
                <input 
                  type="checkbox" 
                  checked={enableGuard} 
                  onChange={e => setEnableGuard(e.target.checked)} 
                  className="w-5 h-5 accent-cyan-500 rounded"
                />
              </label>

              <label className="flex items-center justify-between p-3 bg-slate-950 rounded-xl border border-slate-800 cursor-pointer">
                <div>
                  <span className="text-xs font-mono text-emerald-400 font-bold block">2. AbortController Signal</span>
                  <span className="text-[11px] text-slate-400">abortControllerRef.current?.abort()</span>
                </div>
                <input 
                  type="checkbox" 
                  checked={enableAbort} 
                  onChange={e => setEnableAbort(e.target.checked)} 
                  className="w-5 h-5 accent-emerald-500 rounded"
                />
              </label>
            </div>
          </div>

          {/* Current Displayed UI Banner */}
          <div className="p-5 bg-slate-900 border border-slate-800 rounded-xl space-y-2">
            <span className="text-xs font-mono text-slate-400 uppercase font-bold">Currently Rendered UI State:</span>
            <div className="text-xl font-bold font-mono text-white p-3 bg-slate-950 rounded-lg border border-slate-800">
              {displayedData}
            </div>
            <div className="text-xs font-mono text-slate-400">
              Latest Authoritative Generation ID: <strong className="text-cyan-400">{generationRef.current}</strong>
            </div>
          </div>

          {/* In-Flight & Completed Request Timeline */}
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 overflow-x-auto">
            <h3 className="text-xs font-bold text-white uppercase tracking-wider font-mono mb-3">
              Request Execution Timeline
            </h3>
            <table className="w-full text-xs font-mono text-left border border-slate-800">
              <thead className="bg-slate-950 text-slate-400 uppercase text-[10px]">
                <tr>
                  <th className="p-2.5">ID / Gen</th>
                  <th className="p-2.5">Query Intent</th>
                  <th className="p-2.5">Synthetic Delay</th>
                  <th className="p-2.5">Final Resolution Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {requests.map(req => (
                  <tr key={req.id} className="hover:bg-slate-800/30">
                    <td className="p-2.5 text-cyan-400 font-bold">{req.id}</td>
                    <td className="p-2.5 text-white font-semibold">"{req.query}"</td>
                    <td className="p-2.5 text-amber-400">{req.delay}ms</td>
                    <td className="p-2.5">
                      <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${
                        req.status === 'In-Flight' ? 'bg-cyan-500/20 text-cyan-300 animate-pulse' :
                        req.status === 'Committed' ? 'bg-emerald-500/20 text-emerald-300' :
                        'bg-rose-500/20 text-rose-300'
                      }`}>
                        {req.status}
                      </span>
                    </td>
                  </tr>
                ))}
                {requests.length === 0 && (
                  <tr>
                    <td colSpan={4} className="text-center py-8 text-slate-500">
                      Click "Run Classic Race Sequence" to start.
                    </td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // =========================================================================
    // TAB 2: GENERATION GUARDS & ABORT MECHANICS
    // =========================================================================
    function TabGenerationGuard() {
      const [inputVal, setInputVal] = useState('');
      const [result, setResult] = useState('Idle');
      const [isPending, setIsPending] = useState(false);
      const [genTrace, setGenTrace] = useState([]);

      const genRef = useRef(0);
      const abortRef = useRef(null);

      const handleChange = (e) => {
        const query = e.target.value;
        setInputVal(query);

        if (!query) {
          setResult('Empty search');
          return;
        }

        abortRef.current?.abort();
        const controller = new AbortController();
        abortRef.current = controller;

        const thisGen = ++genRef.current;
        setIsPending(true);

        const simulatedDelay = Math.max(200, Math.floor(Math.random() * 1500));

        setGenTrace(prev => [
          { gen: thisGen, query, delay: simulatedDelay, status: 'Active' },
          ...prev.slice(0, 5)
        ]);

        setTimeout(() => {
          if (thisGen !== genRef.current) {
            setGenTrace(prev => prev.map(t => t.gen === thisGen ? { ...t, status: 'Stale (Ignored)' } : t));
            return;
          }
          if (controller.signal.aborted) {
            setGenTrace(prev => prev.map(t => t.gen === thisGen ? { ...t, status: 'Aborted' } : t));
            return;
          }

          setResult(`Results for "${query}" (Committed Gen #${thisGen})`);
          setIsPending(false);
          setGenTrace(prev => prev.map(t => t.gen === thisGen ? { ...t, status: 'Committed ✅' } : t));
        }, simulatedDelay);
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
            <h2 className="text-lg font-bold text-white">Interactive Live Generation Guard</h2>
            <p className="text-xs text-slate-400">
              Type rapidly into the input. Notice how older keystroke promises are aborted and discarded in real time.
            </p>

            <div className="relative">
              <input
                type="text"
                value={inputVal}
                onChange={handleChange}
                placeholder="Type rapidly: 'React', 'Concurrency', 'Architecture'..."
                className="w-full bg-slate-950 border-2 border-slate-700 focus:border-cyan-500 rounded-xl px-4 py-3 text-white font-mono placeholder-slate-500 focus:outline-none transition shadow-inner"
              />
              {isPending && (
                <div className="absolute right-3 top-3.5 flex items-center gap-2 text-cyan-400 text-xs font-mono">
                  <span className="w-3 h-3 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></span>
                  Resolving...
                </div>
              )}
            </div>

            <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-between font-mono text-xs">
              <span className="text-slate-400">Rendered Result:</span>
              <span className="text-emerald-400 font-bold">{result}</span>
            </div>
          </div>

          {/* Trace History */}
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
            <h3 className="text-xs font-bold text-slate-400 uppercase font-mono">Recent Monotonic Generation Traces</h3>
            <div className="space-y-2 font-mono text-xs">
              {genTrace.map(t => (
                <div key={t.gen} className="p-2.5 bg-slate-950 rounded border border-slate-800 flex items-center justify-between">
                  <span className="text-cyan-400 font-bold">Gen #{t.gen} ("{t.query}")</span>
                  <span className="text-amber-400">{t.delay}ms</span>
                  <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${
                    t.status.includes('Committed') ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'
                  }`}>
                    {t.status}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // TAB 3: ADVERSARIAL JITTER TEST
    // =========================================================================
    function TabAdversarialJitter() {
      const [log, setLog] = useState([]);
      const genRef = useRef(0);

      const runJitterTest = () => {
        setLog([]);
        const words = ['alpha', 'beta', 'gamma', 'delta', 'epsilon'];

        words.forEach((word, idx) => {
          const gen = ++genRef.current;
          const randomDelay = Math.floor(Math.random() * 2500) + 100;

          setTimeout(() => {
            setLog(prev => [
              { gen, word, delay: randomDelay, isCurrent: gen === genRef.current },
              ...prev
            ]);
          }, randomDelay);
        });
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-lg font-bold text-white mb-1">Adversarial Network Jitter Crucible</h2>
              <p className="text-sm text-slate-400">
                Spawns 5 concurrent requests with randomized completion latencies (100ms - 2600ms).
              </p>
            </div>
            <button
              onClick={runJitterTest}
              className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs rounded-lg transition font-mono"
            >
              ⚡ Fire 5 Jitter Requests
            </button>
          </div>

          <div className="space-y-2 font-mono text-xs">
            {log.map((item, i) => (
              <div key={i} className={`p-3 rounded-lg border flex items-center justify-between ${
                item.isCurrent ? 'bg-emerald-950/30 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-400'
              }`}>
                <span>Gen #{item.gen} ("{item.word}") [Delay: {item.delay}ms]</span>
                <span className="font-bold">
                  {item.isCurrent ? '✅ COMMIT (Authoritative Latest Intent)' : '🗑️ DISCARDED (Stale)'}
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // TAB 4: DOMAIN POLICY MATRIX
    // =========================================================================
    function TabDomainPolicies() {
      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-6">
          <div>
            <h2 className="text-lg font-bold text-white mb-1">Domain Concurrency Policy Matrix</h2>
            <p className="text-sm text-slate-400">
              Why latest-wins is mandatory for search, but catastrophic for financial transactions.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="p-5 bg-slate-950 border border-emerald-500/40 rounded-xl space-y-3">
              <span className="text-xs font-bold text-emerald-400 font-mono uppercase">1. Search / Live Filtering (Latest-Wins)</span>
              <p className="text-xs text-slate-300 leading-relaxed">
                User intent evolves with each keystroke. Older in-flight requests represent abandoned user intents and must be cancelled and ignored.
              </p>
              <div className="text-[11px] text-emerald-300 font-mono bg-slate-900 p-2.5 rounded border border-slate-800">
                Policy: SwitchMap / Latest-Wins + AbortController
              </div>
            </div>

            <div className="p-5 bg-slate-950 border border-rose-500/40 rounded-xl space-y-3">
              <span className="text-xs font-bold text-rose-400 font-mono uppercase">2. Payments / Checkout (First-Wins + Idempotency)</span>
              <p className="text-xs text-slate-300 leading-relaxed">
                State-changing mutations permanently alter database balances. Aborting client sockets does NOT undo backend transactions.
              </p>
              <div className="text-[11px] text-rose-300 font-mono bg-slate-900 p-2.5 rounded border border-slate-800">
                Policy: ExhaustMap / Lock + Server Idempotency Keys (UUID)
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // TAB 5: REDUCER INVARIANTS
    // =========================================================================
    function TabReducerInvariants() {
      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-6">
          <div>
            <h2 className="text-lg font-bold text-white mb-1">State Reducer Race Guard Architecture</h2>
            <p className="text-sm text-slate-400">
              Enforcing operation identity invariants directly inside pure reducers.
            </p>
          </div>

          <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 font-mono text-xs text-cyan-300 space-y-2 overflow-x-auto">
            <pre>{`function raceSafeReducer(state, action) {
  switch (action.type) {
    case 'START':
      return { status: 'loading', operationId: action.operationId };

    case 'RESOLVE':
      // Invariant: Reject stale events at the reducer boundary
      if (state.status === 'loading' && state.operationId === action.operationId) {
        return { status: 'success', operationId: action.operationId, data: action.data };
      }
      return state; // Stale action safely discarded!

    case 'REJECT':
      if (state.status === 'loading' && state.operationId === action.operationId) {
        return { status: 'error', operationId: action.operationId, error: action.error };
      }
      return state;
  }
}`}</pre>
          </div>
        </div>
      );
    }

    // =========================================================================
    // TAB 6: SENIOR CERTIFICATION EXAM
    // =========================================================================
    function TabExam() {
      const questions = [
        {
          id: 1,
          question: "Why does calling `AbortController.abort()` NOT eliminate the need for an operation currentness check?",
          options: [
            "Because AbortController is not supported in Chromium browsers.",
            "Because in-flight requests can complete before the abort signal propagates, or non-cancellable async steps can race. Currentness provides an absolute semantic guarantee.",
            "Because AbortController only works with WebSockets.",
            "Because abort() throws an uncaught syntax error."
          ],
          correct: 1,
          explanation: "Cancellation is an operational optimization to close sockets, but currentness guards (generationRef) enforce the application invariant that stale results cannot commit."
        },
        {
          id: 2,
          question: "What happens if a user submits a $500 transfer twice in rapid succession under a naive 'latest-wins' policy?",
          options: [
            "The browser deduplicates the transaction automatically.",
            "Both requests may execute on the server, resulting in duplicate financial charges ($1,000 total) because client aborts do not roll back backend transactions.",
            "React throws an invariant exception.",
            "The first payment is automatically refunded."
          ],
          correct: 1,
          explanation: "Mutations must use first-wins submission locks and Server Idempotency Keys; client-side aborts cannot undo server-side database commits."
        },
        {
          id: 3,
          question: "How should `AbortError` exceptions be handled in try/catch blocks?",
          options: [
            "Show a red error toast with `err.message` to alert the user.",
            "Silently catch and ignore them (`if (err.name === 'AbortError' || signal.aborted) return`), as cancellation is an expected lifecycle event.",
            "Trigger a window reload.",
            "Log a fatal alert."
          ],
          correct: 1,
          explanation: "Cancellations from user typing or component unmounting are expected control flow and should not surface as user-visible errors."
        },
        {
          id: 4,
          question: "Why is `useRef` ideal for storing the monotonic generation counter (`generationRef`)?",
          options: [
            "Because refs are automatically synchronized with Redux.",
            "Because generation counters are coordination metadata that must persist across renders without triggering unnecessary re-renders when incremented.",
            "Because refs run in Web Workers.",
            "Because useState cannot store numbers."
          ],
          correct: 1,
          explanation: "Refs allow synchronous mutation without scheduling React re-renders, providing a stable coordination layer for operation IDs."
        },
        {
          id: 5,
          question: "In a race-safe search component, what is the correct sequence of operations when a new query is typed?",
          options: [
            "fetch() ──► update state ──► abort() ──► increment counter.",
            "abort previous controller ──► create new controller ──► increment generation ID ──► execute fetch with signal ──► verify generation before commit.",
            "render JSX ──► dispatch RESET ──► clear local cache.",
            "setTimeout(300ms) ──► JSON.parse() ──► setState."
          ],
          correct: 1,
          explanation: "Aborting previous work, assigning a new monotonic ID, and validating currentness upon promise resolution guarantees race-free state."
        }
      ];

      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      const handleSelect = (qId, optionIdx) => {
        if (submitted) return;
        setSelectedAnswers(prev => ({ ...prev, [qId]: optionIdx }));
      };

      const score = Object.keys(selectedAnswers).reduce((acc, qId) => {
        const q = questions.find(item => item.id === Number(qId));
        return selectedAnswers[qId] === q.correct ? acc + 1 : acc;
      }, 0);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <h2 className="text-xl font-bold text-white">Async Race Guards & Cancellation Certification</h2>
              <p className="text-xs text-slate-400 mt-1">Validate your expertise in monotonic generation counters, AbortController, and race-free architecture.</p>
            </div>
            {submitted && (
              <div className={`px-4 py-2 rounded-xl text-sm font-bold font-mono ${
                score === 5 ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
              }`}>
                Score: {score} / 5 ({((score / 5) * 100).toFixed(0)}%)
              </div>
            )}
          </div>

          <div className="space-y-6">
            {questions.map((q, idx) => (
              <div key={q.id} className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
                <div className="font-semibold text-sm text-slate-200">
                  <span className="text-cyan-400 font-mono mr-2">Q{idx + 1}.</span>
                  {q.question}
                </div>
                <div className="space-y-2">
                  {q.options.map((opt, optIdx) => {
                    const isSelected = selectedAnswers[q.id] === optIdx;
                    const isCorrect = q.correct === optIdx;
                    let optionStyle = 'bg-slate-900/80 border-slate-800 text-slate-300 hover:border-slate-700';

                    if (submitted) {
                      if (isCorrect) {
                        optionStyle = 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300';
                      } else if (isSelected && !isCorrect) {
                        optionStyle = 'bg-rose-500/20 border-rose-500/40 text-rose-300';
                      }
                    } else if (isSelected) {
                      optionStyle = 'bg-cyan-600/20 border-cyan-500 text-cyan-200';
                    }

                    return (
                      <button
                        key={optIdx}
                        onClick={() => handleSelect(q.id, optIdx)}
                        className={`w-full text-left p-3 rounded-lg border text-xs transition ${optionStyle}`}
                      >
                        <span className="font-mono font-semibold mr-2">{String.fromCharCode(65 + optIdx)}.</span>
                        {opt}
                      </button>
                    );
                  })}
                </div>

                {submitted && (
                  <div className="p-3 bg-slate-900 rounded-lg text-xs text-slate-400 border border-slate-800 font-mono">
                    💡 <strong className="text-slate-200">Explanation:</strong> {q.explanation}
                  </div>
                )}
              </div>
            ))}
          </div>

          <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
            {submitted ? (
              <button
                onClick={() => { setSelectedAnswers({}); setSubmitted(false); }}
                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 rounded-lg transition"
              >
                Retake Exam
              </button>
            ) : (
              <button
                onClick={() => setSubmitted(true)}
                disabled={Object.keys(selectedAnswers).length < questions.length}
                className="px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 text-xs font-bold text-white rounded-lg transition shadow-lg shadow-cyan-600/20"
              >
                Submit Answers
              </button>
            )}
          </div>
        </div>
      );
    }

    // --- ROOT APP CONTAINER ---
    function App() {
      const [activeTab, setActiveTab] = useState('race-simulator');

      return (
        <div className="min-h-screen bg-slate-950 flex flex-col">
          <Header activeTab={activeTab} setActiveTab={setActiveTab} />
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 sm:px-6 lg:px-8">
            {activeTab === 'race-simulator' && <TabRaceSimulator />}
            {activeTab === 'generation-guard' && <TabGenerationGuard />}
            {activeTab === 'adversarial-jitter' && <TabAdversarialJitter />}
            {activeTab === 'domain-policies' && <TabDomainPolicies />}
            {activeTab === 'reducer-invariants' && <TabReducerInvariants />}
            {activeTab === 'exam' && <TabExam />}
          </main>
          <footer className="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
            KPI 15 · Part 02 — Request Cancellation & Race Guards Lab · React 18 Architecture
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
