<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI 09 Part 04 — Rendering Collections & List Data Lab</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(26, 34, 52, 0.85);
      --card-border: rgba(99, 102, 241, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --accent: #38bdf8;
      --cyan: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 80%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1380px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      padding: 24px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    header h1 {
      font-size: 1.45rem;
      background: linear-gradient(135deg, #a5b4fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid var(--primary);
      color: #c7d2fe;
    }

    .nav-tabs {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.4);
    }

    .lab-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 980px) {
      .lab-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: rgba(15, 23, 42, 0.6);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    button.btn {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid var(--primary);
      color: #e0e7ff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      transition: all 0.15s ease;
    }

    button.btn:hover {
      background: var(--primary);
      color: #ffffff;
    }

    button.btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--danger);
      color: #fca5a5;
    }

    button.btn-danger:hover {
      background: var(--danger);
      color: #ffffff;
    }

    button.btn-warning {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--warning);
      color: #fcd34d;
    }

    button.btn-warning:hover {
      background: var(--warning);
      color: #ffffff;
    }

    .key-selector {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .key-option {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-muted);
    }

    .key-option.selected {
      background: var(--cyan);
      color: #000;
      border-color: var(--cyan);
      font-weight: 700;
    }

    .list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .list-row {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .list-row.highlight-corrupted {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
    }

    .entity-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 140px;
    }

    .entity-id {
      font-family: monospace;
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 700;
    }

    .entity-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #f1f5f9;
    }

    .key-tag {
      font-family: monospace;
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(6, 182, 212, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
      width: fit-content;
    }

    input.row-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.85rem;
    }

    input.row-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
    }

    .status-panel {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 16px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.6;
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-height: 480px;
      overflow-y: auto;
    }

    .status-panel table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    .status-panel th, .status-panel td {
      padding: 6px 8px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .status-panel th {
      color: var(--accent);
      font-weight: 700;
    }

    .alert-box {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1.5;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }

    .alert-warning {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--warning);
      color: #fde68a;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, Fragment } = React;

    const INITIAL_USERS = [
      { id: "usr_101", name: "Asha Sharma", role: "Principal Architect", active: true },
      { id: "usr_102", name: "Ravi Patel", role: "Senior Frontend Lead", active: true },
      { id: "usr_103", name: "Maya Lin", role: "DevOps Engineer", active: false },
      { id: "usr_104", name: "Zack Vance", role: "Security Engineer", active: true }
    ];

    // Stateful Row Component that tracks its own local draft input
    function StatefulRowItem({ user, index, keyMode, originalOwnerId }) {
      const [draftNote, setDraftNote] = useState("");
      const mountTime = useRef(performance.now()).current;
      const renders = useRef(0);
      renders.current += 1;

      // Detect state migration corruption
      const isCorrupted = draftNote.length > 0 && originalOwnerId && originalOwnerId !== user.id;

      return (
        <div className={`list-row ${isCorrupted ? "highlight-corrupted" : ""}`}>
          <div className="entity-meta">
            <span className="entity-id">ID: {user.id}</span>
            <span className="entity-name">{user.name}</span>
            <span className="key-tag">
              Key: {keyMode === "id" ? user.id : keyMode === "index" ? index : "random()"}
            </span>
          </div>
          
          <input
            type="text"
            className="row-input"
            value={draftNote}
            onChange={(e) => setDraftNote(e.target.value)}
            placeholder={`Type draft for ${user.name}...`}
          />

          <div style={{ fontSize: "0.72rem", color: "#64748b", textAlign: "right", minWidth: "90px" }}>
            Renders: <b style={{ color: "#38bdf8" }}>{renders.current}</b><br />
            {draftNote ? <span style={{ color: "#10b981" }}>Draft Dirty</span> : "Clean"}
          </div>
        </div>
      );
    }

    // TAB 1: Real-Time List Reconciler & State Shift Simulator
    function TabReconcilerSimulator() {
      const [users, setUsers] = useState(INITIAL_USERS);
      const [keyMode, setKeyMode] = useState("id"); // "id" | "index" | "random"
      const [filterActive, setFilterActive] = useState(false);
      const mutationCount = useRef(0);

      const visibleUsers = useMemo(() => {
        return filterActive ? users.filter(u => u.active) : users;
      }, [users, filterActive]);

      const handlePrepend = () => {
        mutationCount.current += 1;
        const newId = `usr_${Math.floor(100 + Math.random() * 900)}`;
        setUsers([{ id: newId, name: `New User (${newId})`, role: "Junior Dev", active: true }, ...users]);
      };

      const handleAppend = () => {
        mutationCount.current += 1;
        const newId = `usr_${Math.floor(100 + Math.random() * 900)}`;
        setUsers([...users, { id: newId, name: `New User (${newId})`, role: "QA Engineer", active: true }]);
      };

      const handleDeleteFirst = () => {
        if (users.length > 0) {
          mutationCount.current += 1;
          setUsers(users.slice(1));
        }
      };

      const handleReverse = () => {
        mutationCount.current += 1;
        setUsers([...users].reverse());
      };

      const handleShuffle = () => {
        mutationCount.current += 1;
        setUsers([...users].sort(() => Math.random() - 0.5));
      };

      const handleReset = () => {
        mutationCount.current += 1;
        setUsers(INITIAL_USERS);
        setFilterActive(false);
      };

      return (
        <div className="lab-grid">
          <div className="card">
            <div className="card-title">
              <span>Dynamic Collection View</span>
              <span className="badge">Mutations: {mutationCount.current}</span>
            </div>

            <div className="key-selector">
              <span style={{ fontSize: "0.82rem", fontWeight: "600", color: "#94a3b8" }}>Keying Strategy:</span>
              <button
                className={`key-option ${keyMode === "id" ? "selected" : ""}`}
                onClick={() => setKeyMode("id")}
              >
                key={`{user.id}`} (Stable Entity ID)
              </button>
              <button
                className={`key-option ${keyMode === "index" ? "selected" : ""}`}
                onClick={() => setKeyMode("index")}
              >
                key={`{index}`} (Positional Index)
              </button>
              <button
                className={`key-option ${keyMode === "random" ? "selected" : ""}`}
                onClick={() => setKeyMode("random")}
              >
                key={`{Math.random()}`} (Random Ephemeral)
              </button>
            </div>

            <div className="controls-panel">
              <button className="btn" onClick={handlePrepend}>➕ Prepend at Head</button>
              <button className="btn" onClick={handleAppend}>➕ Append at Tail</button>
              <button className="btn-danger btn" onClick={handleDeleteFirst}>🗑️ Delete First Row</button>
              <button className="btn" onClick={handleReverse}>🔄 Reverse Sort</button>
              <button className="btn" onClick={handleShuffle}>🔀 Shuffle Order</button>
              <button className="btn-warning btn" onClick={() => setFilterActive(!filterActive)}>
                {filterActive ? "👁️ Show All" : "🔍 Filter Active Only"}
              </button>
              <button className="btn" onClick={handleReset}>↺ Reset Data</button>
            </div>

            {keyMode === "index" && (
              <div className="alert-box alert-danger">
                ⚠️ <b>INDEX KEY ACTIVE:</b> Type draft notes in Row 1 ("Asha"), then click "Prepend at Head" or "Reverse Sort". Notice how Asha's draft sticks to the top physical slot rather than following Asha!
              </div>
            )}

            {keyMode === "random" && (
              <div className="alert-box alert-warning">
                ⚠️ <b>RANDOM KEY ACTIVE:</b> Try typing inside any input. Notice how typing even a single character forces an unmount and focus immediately drops!
              </div>
            )}

            {keyMode === "id" && (
              <div className="alert-box alert-success">
                ✅ <b>STABLE ENTITY ID ACTIVE:</b> Type draft notes in any row, then prepend, reverse, sort, or filter. Draft notes remain 100% attached to their respective user entities.
              </div>
            )}

            <div className="list-container">
              {visibleUsers.map((user, index) => {
                const appliedKey = keyMode === "id" ? user.id : keyMode === "index" ? index : Math.random();
                return (
                  <StatefulRowItem
                    key={appliedKey}
                    user={user}
                    index={index}
                    keyMode={keyMode}
                  />
                );
              })}
            </div>
          </div>

          <div className="card">
            <div className="card-title">
              <span>Fiber Reconciler Diagnostics</span>
              <span className="badge" style={{ background: "rgba(6,182,212,0.2)", borderColor: "var(--cyan)", color: "#67e8f9" }}>
                Live Inspector
              </span>
            </div>

            <div className="status-panel">
              <div style={{ color: "#38bdf8", fontWeight: "700", marginBottom: "8px" }}>
                CURRENT FIBER SIBLING STRUCTURE:
              </div>
              <table>
                <thead>
                  <tr>
                    <th>Slot #</th>
                    <th>Entity Name</th>
                    <th>Entity ID</th>
                    <th>Rendered Key</th>
                    <th>Fiber Strategy</th>
                  </tr>
                </thead>
                <tbody>
                  {visibleUsers.map((user, idx) => (
                    <tr key={user.id}>
                      <td>{idx}</td>
                      <td style={{ color: "#f8fafc", fontWeight: "600" }}>{user.name}</td>
                      <td style={{ color: "#a5b4fc" }}>{user.id}</td>
                      <td style={{ color: "#38bdf8", fontWeight: "700" }}>
                        {keyMode === "id" ? user.id : keyMode === "index" ? idx : `rand_${idx}`}
                      </td>
                      <td style={{ color: keyMode === "id" ? "#10b981" : keyMode === "index" ? "#f59e0b" : "#ef4444" }}>
                        {keyMode === "id" ? "Fiber Reused via ID" : keyMode === "index" ? "Bound to Position" : "Forced Remount"}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              <div style={{ marginTop: "20px", color: "#94a3b8" }}>
                <b style={{ color: "#e2e8f0" }}>Reconciliation Heuristic Takeaways:</b>
                <ul style={{ paddingLeft: "18px", marginTop: "6px" }}>
                  <li>React does not diff domain JS objects; it matches <code>(Type, Key)</code> against previous Fiber nodes.</li>
                  <li><code>key={'{index}'}</code> preserves Fiber identity at fixed array slots. When elements shift, state is inherited by the wrong domain record.</li>
                  <li><code>key={'{user.id}'}</code> allows React to execute $O(N)$ linear Map lookups, flawlessly preserving hooks and focus across all transformations.</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // TAB 2: Keyed Fragments (<React.Fragment key={...}>)
    function TabKeyedFragments() {
      const [terms, setTerms] = useState([
        { id: "t1", term: "React Element", desc: "Lightweight, immutable descriptor object created by JSX." },
        { id: "t2", term: "Fiber Node", desc: "Persistent runtime data structure tracking hooks, state, and DOM pointers." },
        { id: "t3", term: "Reconciliation", desc: "Algorithm computing minimal DOM operations across render cycles." }
      ]);
      const [expandedId, setExpandedId] = useState(null);

      const handleReverse = () => {
        setTerms([...terms].reverse());
      };

      return (
        <div className="lab-grid">
          <div className="card">
            <div className="card-title">
              <span>Keyed Fragment Multi-Sibling Output</span>
              <button className="btn" onClick={handleReverse}>🔄 Reverse Order</button>
            </div>

            <div className="alert-box alert-success">
              💡 <b>Pattern:</b> Each term outputs two sibling DOM nodes (<code>&lt;dt&gt;</code> and <code>&lt;dd&gt;</code>) along with an expandable drawer wrapped inside <code>&lt;React.Fragment key={`{item.id}`}&gt;</code>.
            </div>

            <dl style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
              {terms.map((item) => (
                <Fragment key={item.id}>
                  <dt 
                    onClick={() => setExpandedId(expandedId === item.id ? null : item.id)}
                    style={{ 
                      cursor: "pointer", 
                      fontWeight: "700", 
                      color: "#38bdf8", 
                      background: "rgba(15, 23, 42, 0.8)", 
                      padding: "10px 14px", 
                      borderRadius: "8px",
                      display: "flex",
                      justifyContent: "space-between"
                    }}
                  >
                    <span>{item.term} <span style={{ color: "#64748b", fontSize: "0.75rem" }}>({item.id})</span></span>
                    <span>{expandedId === item.id ? "▲ Collapse" : "▼ Expand Details"}</span>
                  </dt>
                  <dd style={{ marginLeft: "14px", color: "#cbd5e1", fontSize: "0.85rem", padding: "4px 0" }}>
                    {item.desc}
                  </dd>
                  {expandedId === item.id && (
                    <div style={{ background: "rgba(99, 102, 241, 0.15)", border: "1px solid var(--primary)", padding: "10px", borderRadius: "6px", fontSize: "0.8rem", color: "#c7d2fe" }}>
                      Expanded state preserved safely for <b>{item.term}</b> even after reversing list!
                    </div>
                  )}
                  <hr style={{ borderColor: "rgba(255,255,255,0.08)", margin: "4px 0" }} />
                </Fragment>
              ))}
            </dl>
          </div>

          <div className="card">
            <div className="card-title">
              <span>Shorthand Fragment Limitations</span>
            </div>
            <div className="status-panel">
              <div style={{ color: "#ef4444", fontWeight: "700" }}>
                ❌ BROKEN SHORTHAND SYNTAX:
              </div>
              <pre style={{ color: "#f87171", marginTop: "8px" }}>
{`// SYNTAX ERROR: Empty fragments cannot accept keys!
{items.map(item => (
  < key={item.id}>
    <dt>{item.term}</dt>
    <dd>{item.desc}</dd>
  </>
))}`}
              </pre>

              <div style={{ color: "#10b981", fontWeight: "700", marginTop: "20px" }}>
                ✅ ARCHITECTURALLY CORRECT:
              </div>
              <pre style={{ color: "#6ee7b7", marginTop: "8px" }}>
{`import { Fragment } from "react";

{items.map(item => (
  <Fragment key={item.id}>
    <dt>{item.term}</dt>
    <dd>{item.desc}</dd>
  </Fragment>
))}`}
              </pre>
            </div>
          </div>
        </div>
      );
    }

    // TAB 3: Pure In-Render Derivations Benchmark
    function TabPureDerivations() {
      const [search, setSearch] = useState("");
      const [sortBy, setSortBy] = useState("score");
      const [datasetSize, setDatasetSize] = useState(500);

      // Generate large dummy dataset
      const largeData = useMemo(() => {
        const list = [];
        for (let i = 1; i <= datasetSize; i++) {
          list.push({
            id: `rec_${i}`,
            title: `Enterprise Service Component #${i}`,
            score: Math.floor(Math.random() * 1000),
            latency: (Math.random() * 50).toFixed(2)
          });
        }
        return list;
      }, [datasetSize]);

      // Pure derivation in render (Zero useEffect overhead):
      const startTime = performance.now();
      const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        let res = q === "" ? largeData : largeData.filter(d => d.title.toLowerCase().includes(q));
        return [...res].sort((a, b) => b[sortBy] - a[sortBy]);
      }, [largeData, search, sortBy]);
      const derivationDuration = (performance.now() - startTime).toFixed(3);

      return (
        <div className="lab-grid">
          <div className="card">
            <div className="card-title">
              <span>Pure In-Render Derivation Benchmark</span>
              <span className="badge">{datasetSize} Items</span>
            </div>

            <div className="controls-panel">
              <input
                type="text"
                className="row-input"
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Live search across records..."
              />
              <select 
                value={sortBy} 
                onChange={e => setSortBy(e.target.value)}
                style={{ background: "#1e293b", color: "#fff", border: "1px solid #475569", padding: "8px", borderRadius: "6px" }}
              >
                <option value="score">Sort by Score</option>
                <option value="latency">Sort by Latency</option>
              </select>
              <button className="btn" onClick={() => setDatasetSize(datasetSize === 500 ? 2000 : 500)}>
                Toggle Size ({datasetSize === 500 ? "Switch to 2,000" : "Switch to 500"})
              </button>
            </div>

            <div className="alert-box alert-success">
              ⚡ Derivation calculated purely in render in <b>{derivationDuration}ms</b> without secondary <code>useEffect</code> or state lag!
            </div>

            <div className="list-container">
              {filtered.slice(0, 15).map(item => (
                <div key={item.id} className="list-row">
                  <span style={{ color: "#38bdf8", fontWeight: "700", fontFamily: "monospace" }}>{item.id}</span>
                  <span style={{ color: "#f8fafc", flex: 1, marginLeft: "10px" }}>{item.title}</span>
                  <span style={{ color: "#f59e0b", fontWeight: "600" }}>Score: {item.score}</span>
                  <span style={{ color: "#10b981", marginLeft: "10px", fontSize: "0.8rem" }}>{item.latency}ms</span>
                </div>
              ))}
              {filtered.length > 15 && (
                <div style={{ textAlign: "center", color: "#64748b", padding: "8px", fontSize: "0.85rem" }}>
                  Showing first 15 of {filtered.length} derived results.
                </div>
              )}
            </div>
          </div>

          <div className="card">
            <div className="card-title">
              <span>Anti-Pattern Comparison</span>
            </div>
            <div className="status-panel">
              <div style={{ color: "#f87171", fontWeight: "700" }}>
                ❌ WHY `useEffect` DERIVED STATE IS HARMFUL:
              </div>
              <ul style={{ paddingLeft: "18px", marginTop: "8px", lineHeight: "1.6" }}>
                <li><b>Render Lag:</b> Takes 2 full render passes (Render 1 with stale list $\rightarrow$ effect fires $\rightarrow$ Render 2 with updated list).</li>
                <li><b>Race Conditions:</b> Asynchronous state sets can resolve out of order during fast typing.</li>
                <li><b>Infinite Loop Risks:</b> Incorrect dependency array configurations trigger continuous loop cycles.</li>
              </ul>

              <div style={{ color: "#38bdf8", fontWeight: "700", marginTop: "16px" }}>
                ✅ PURE IN-RENDER STANDARD:
              </div>
              <p style={{ marginTop: "6px", color: "#cbd5e1" }}>
                For arrays up to ~5,000 items, JavaScript array methods (<code>.filter()</code>, <code>.sort()</code>) execute in under 1ms. Calculating in render guarantees atomic synchronization with zero state lag.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // MAIN APP CONTAINER
    function App() {
      const [activeTab, setActiveTab] = useState("reconciler");

      return (
        <div className="container">
          <header>
            <div>
              <h1>KPI 09 Part 04 — Rendering Collections & List Data</h1>
              <p style={{ color: "#94a3b8", fontSize: "0.85rem", marginTop: "4px" }}>
                Interactive Fiber Reconciler, Key Stability Lab & Multi-Sibling Diagnostics
              </p>
            </div>
            <span className="badge">Senior Architecture Standard</span>
          </header>

          <nav className="nav-tabs">
            <button
              className={`tab-btn ${activeTab === "reconciler" ? "active" : ""}`}
              onClick={() => setActiveTab("reconciler")}
            >
              🔬 Reconciler & Key Shift Simulator
            </button>
            <button
              className={`tab-btn ${activeTab === "fragments" ? "active" : ""}`}
              onClick={() => setActiveTab("fragments")}
            >
              🧩 Keyed Fragments Visualizer
            </button>
            <button
              className={`tab-btn ${activeTab === "derivation" ? "active" : ""}`}
              onClick={() => setActiveTab("derivation")}
            >
              ⚡ Pure In-Render Derivations
            </button>
          </nav>

          <main>
            {activeTab === "reconciler" && <TabReconcilerSimulator />}
            {activeTab === "fragments" && <TabKeyedFragments />}
            {activeTab === "derivation" && <TabPureDerivations />}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
