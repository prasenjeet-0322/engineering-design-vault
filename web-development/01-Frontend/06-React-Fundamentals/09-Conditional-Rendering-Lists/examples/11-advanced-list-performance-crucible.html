<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI 09 — Part 11: Advanced List Performance Crucible Diagnostic Lab</title>
  
  <!-- React 18 & Babel via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 24px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .header-title h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .header-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .badge-primary {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }
    
    .grid-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 16px;
      backdrop-filter: blur(12px);
    }
    
    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .metric-val {
      font-size: 20px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
      color: #38bdf8;
    }
    
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    
    @media (max-width: 1024px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
    
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      padding: 18px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 10px;
    }
    
    .panel-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    
    button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    button.active-toggle {
      background: rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.6);
      color: #93c5fd;
    }
    
    button.btn-primary {
      background: rgba(59, 130, 246, 0.25);
      border-color: rgba(59, 130, 246, 0.5);
      color: #93c5fd;
    }
    
    button.btn-emerald {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    
    button.btn-danger {
      background: rgba(244, 63, 94, 0.2);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fca5a5;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 12px;
    }
    
    /* Virtual List Scrollport */
    .virtual-viewport {
      height: 380px;
      overflow-y: auto;
      background: #070b12;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      position: relative;
    }
    
    .virtual-row {
      position: absolute;
      left: 0;
      width: 100%;
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      box-sizing: border-box;
      transition: background 0.1s ease;
    }
    
    .virtual-row:hover {
      background: rgba(255, 255, 255, 0.04);
    }
    
    .virtual-row.selected {
      background: rgba(59, 130, 246, 0.15);
      border-left: 3px solid var(--accent-blue);
    }

    .fiber-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #38bdf8;
    }

    .log-box {
      background: #070b12;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      height: 160px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useMemo, useCallback } = React;

    const ROW_HEIGHT = 48;
    const VIEWPORT_HEIGHT = 380;
    const OVERSCAN = 5;

    // Generator for large test datasets
    function generateDataset(size) {
      const items = [];
      const categories = ["Compute", "Storage", "Network", "Database", "Security"];
      for (let i = 1; i <= size; i++) {
        items.push({
          id: `node-${i}`,
          name: `Cluster Node #${i}`,
          category: categories[i % categories.length],
          price: 50 + (i % 200),
          status: i % 3 === 0 ? "Active" : "Idle"
        });
      }
      return items;
    }

    function PerformanceCrucibleLab() {
      // Dataset sizing: 100, 1,000, 5,000, 10,000, 50,000
      const [datasetSize, setDatasetSize] = useState(1000);
      const [items, setItems] = useState(() => generateDataset(1000));
      
      // Architecture Toggles
      const [useVirtualization, setUseVirtualization] = useState(true);
      const [useMemoizedRows, setUseMemoizedRows] = useState(true);
      const [useStableProps, setUseStableProps] = useState(true);
      const [useStableKeys, setUseStableKeys] = useState(true);

      // State
      const [selectedId, setSelectedId] = useState("node-1");
      const [filterQuery, setFilterQuery] = useState("");
      const [scrollTop, setScrollTop] = useState(0);

      // Performance Metrics Tracking
      const renderCountRef = useRef(0);
      renderCountRef.current += 1;

      const [metrics, setMetrics] = useState({
        transformMs: 0,
        renderDurationMs: 0,
        lastRenderedRowsCount: 0
      });

      // Handle dataset size change
      const handleSizeChange = (newSize) => {
        const t0 = performance.now();
        const data = generateDataset(newSize);
        setDatasetSize(newSize);
        setItems(data);
        const t1 = performance.now();
        setMetrics(m => ({ ...m, transformMs: (t1 - t0).toFixed(2) }));
      };

      // Filter Derivation
      const filteredItems = useMemo(() => {
        const t0 = performance.now();
        const result = items.filter(item => 
          item.name.toLowerCase().includes(filterQuery.toLowerCase()) ||
          item.category.toLowerCase().includes(filterQuery.toLowerCase())
        );
        const t1 = performance.now();
        return result;
      }, [items, filterQuery]);

      // Virtual Window Calculations
      const totalItems = filteredItems.length;
      const totalHeight = totalItems * ROW_HEIGHT;
      
      const { startIndex, endIndex, visibleItems, offsetY } = useMemo(() => {
        if (!useVirtualization) {
          return {
            startIndex: 0,
            endIndex: totalItems - 1,
            visibleItems: filteredItems,
            offsetY: 0
          };
        }

        const rawStart = Math.floor(scrollTop / ROW_HEIGHT);
        const count = Math.ceil(VIEWPORT_HEIGHT / ROW_HEIGHT);
        const start = Math.max(0, rawStart - OVERSCAN);
        const end = Math.min(totalItems - 1, rawStart + count + OVERSCAN);

        return {
          startIndex: start,
          endIndex: end,
          visibleItems: filteredItems.slice(start, end + 1),
          offsetY: start * ROW_HEIGHT
        };
      }, [useVirtualization, scrollTop, filteredItems, totalItems]);

      // Stable Handler
      const handleSelect = useCallback((id) => {
        const t0 = performance.now();
        setSelectedId(id);
        const t1 = performance.now();
        setMetrics(m => ({ ...m, renderDurationMs: (t1 - t0).toFixed(2) }));
      }, []);

      const handleScroll = (e) => {
        setScrollTop(e.target.scrollTop);
      };

      return (
        <div className="container">
          <header>
            <div className="header-title">
              <h1>Advanced List Performance Crucible Lab</h1>
              <p>Visualizing Virtual Windowing, Memoization Boundaries, Prop Stability & 60 FPS Budgets</p>
            </div>
            <span className="badge badge-primary">Level 06 · KPI 09 · Part 11</span>
          </header>

          {/* Performance Telemetry Bar */}
          <div className="grid-metrics">
            <div className="metric-card">
              <div className="metric-label">Logical Dataset</div>
              <div className="metric-val">{totalItems.toLocaleString()} items</div>
            </div>
            <div className="metric-card">
              <div className="metric-label">Mounted DOM Rows</div>
              <div className="metric-val" style={{ color: useVirtualization ? "#34d399" : "#f87171" }}>
                {visibleItems.length} rows
              </div>
            </div>
            <div className="metric-card">
              <div className="metric-label">Estimated DOM Nodes</div>
              <div className="metric-val">
                {(visibleItems.length * 4).toLocaleString()}
              </div>
            </div>
            <div className="metric-card">
              <div className="metric-label">Root Render Count</div>
              <div className="metric-val" style={{ color: "#a78bfa" }}>
                #{renderCountRef.current}
              </div>
            </div>
          </div>

          {/* Controls & Architecture Toggles */}
          <div className="grid-2">
            
            {/* Sizing & Mutation Controls */}
            <div className="panel">
              <div className="panel-header">
                <span className="panel-title">🕹️ Dataset & Mutation Triggers</span>
              </div>
              
              <div style={{ marginBottom: "12px" }}>
                <span style={{ fontSize: "12px", color: "var(--text-muted)" }}>Dataset Scale: </span>
                <div className="btn-group" style={{ marginTop: "6px" }}>
                  {[100, 1000, 5000, 10000, 50000].map(size => (
                    <button 
                      key={size} 
                      className={datasetSize === size ? "active-toggle" : ""}
                      onClick={() => handleSizeChange(size)}
                    >
                      {size.toLocaleString()}
                    </button>
                  ))}
                </div>
              </div>

              <div style={{ display: "flex", gap: "8px", marginBottom: "12px" }}>
                <input 
                  type="text" 
                  placeholder="Filter by name/category..." 
                  value={filterQuery}
                  onChange={e => setFilterQuery(e.target.value)}
                  style={{
                    flex: 1,
                    background: "#070b12",
                    border: "1px solid var(--card-border)",
                    color: "#fff",
                    padding: "6px 10px",
                    borderRadius: "6px",
                    fontSize: "12px"
                  }}
                />
                {filterQuery && (
                  <button onClick={() => setFilterQuery("")}>Clear</button>
                )}
              </div>

              <div className="btn-group">
                <button className="btn-primary" onClick={() => handleSelect(`node-${Math.floor(1 + Math.random() * 50)}`)}>
                  ⚡ Random Selection Update
                </button>
                <button className="btn-emerald" onClick={() => {
                  // Single item mutation with structural sharing
                  setItems(prev => prev.map(i => i.id === "node-1" ? { ...i, price: i.price + 1 } : i));
                }}>
                  🏷️ Modify Item #1 Price (+1)
                </button>
              </div>
            </div>

            {/* Architectural Strategy Toggles */}
            <div className="panel">
              <div className="panel-header">
                <span className="panel-title">⚙️ Architecture Optimization Toggles</span>
              </div>

              <div className="toggle-row">
                <span>1. DOM Virtualization (Windowing)</span>
                <button 
                  className={useVirtualization ? "btn-emerald" : "btn-danger"}
                  onClick={() => setUseVirtualization(!useVirtualization)}
                >
                  {useVirtualization ? "ON (Windowed ~30)" : "OFF (Full DOM Tree)"}
                </button>
              </div>

              <div className="toggle-row">
                <span>2. Row Memoization (`React.memo`)</span>
                <button 
                  className={useMemoizedRows ? "btn-emerald" : "btn-danger"}
                  onClick={() => setUseMemoizedRows(!useMemoizedRows)}
                >
                  {useMemoizedRows ? "ON (Bailout Enabled)" : "OFF (Always Rerender)"}
                </button>
              </div>

              <div className="toggle-row">
                <span>3. Prop Reference Stability</span>
                <button 
                  className={useStableProps ? "btn-emerald" : "btn-danger"}
                  onClick={() => setUseStableProps(!useStableProps)}
                >
                  {useStableProps ? "STABLE (Primitives)" : "UNSTABLE ({...item})"}
                </button>
              </div>

              <div className="toggle-row">
                <span>4. React Key Assignment</span>
                <button 
                  className={useStableKeys ? "btn-emerald" : "btn-danger"}
                  onClick={() => setUseStableKeys(!useStableKeys)}
                >
                  {useStableKeys ? "key={item.id}" : "key={index}"}
                </button>
              </div>
            </div>

          </div>

          {/* Virtual Scrollport Container */}
          <div className="panel" style={{ marginBottom: "20px" }}>
            <div className="panel-header">
              <span className="panel-title">
                🪟 Virtual Scrollport Window ({visibleItems.length} Active Fibers Mounted)
              </span>
              <span style={{ fontSize: "12px", color: "var(--text-muted)" }}>
                Render Range: [{startIndex} → {endIndex}] | Offset: {offsetY}px
              </span>
            </div>

            <div 
              className="virtual-viewport" 
              onScroll={handleScroll}
            >
              {/* Virtual spacer simulating total scroll height */}
              <div style={{ height: `${totalHeight}px`, width: "100%", position: "relative" }}>
                {visibleItems.map((item, localIdx) => {
                  const absoluteIndex = startIndex + localIdx;
                  const key = useStableKeys ? item.id : absoluteIndex;
                  const isSelected = selectedId === item.id;
                  const top = (startIndex + localIdx) * ROW_HEIGHT;

                  // Prop stability toggle simulation
                  const rowProps = useStableProps ? {
                    id: item.id,
                    name: item.name,
                    category: item.category,
                    price: item.price,
                    isSelected,
                    onSelect: handleSelect,
                    top
                  } : {
                    item: { ...item }, // Allocates fresh object, defeating React.memo!
                    isSelected,
                    onSelect: () => handleSelect(item.id),
                    top
                  };

                  return useMemoizedRows ? (
                    <MemoizedRow key={key} {...rowProps} />
                  ) : (
                    <UnmemoizedRow key={key} {...rowProps} />
                  );
                })}
              </div>
            </div>
          </div>

        </div>
      );
    }

    // Memoized Row
    const MemoizedRow = React.memo(function MemoizedRow(props) {
      const renderCount = useRef(0);
      renderCount.current += 1;

      const name = props.name || props.item?.name;
      const category = props.category || props.item?.category;
      const price = props.price || props.item?.price;
      const id = props.id || props.item?.id;

      return (
        <div 
          className={`virtual-row ${props.isSelected ? "selected" : ""}`}
          style={{ top: `${props.top}px` }}
          onClick={() => props.onSelect(id)}
        >
          <div style={{ display: "flex", gap: "12px", alignItems: "center" }}>
            <span style={{ fontFamily: "monospace", fontSize: "11px", color: "#64748b" }}>#{id}</span>
            <strong>{name}</strong>
            <span style={{ fontSize: "11px", color: "var(--text-muted)" }}>[{category}]</span>
          </div>
          <div style={{ display: "flex", gap: "12px", alignItems: "center" }}>
            <span style={{ fontWeight: "700", color: "#38bdf8" }}>${price}</span>
            <span className="fiber-tag">Renders: {renderCount.current}</span>
          </div>
        </div>
      );
    });

    // Unmemoized Row
    function UnmemoizedRow(props) {
      const renderCount = useRef(0);
      renderCount.current += 1;

      const name = props.name || props.item?.name;
      const category = props.category || props.item?.category;
      const price = props.price || props.item?.price;
      const id = props.id || props.item?.id;

      return (
        <div 
          className={`virtual-row ${props.isSelected ? "selected" : ""}`}
          style={{ top: `${props.top}px` }}
          onClick={() => props.onSelect(id)}
        >
          <div style={{ display: "flex", gap: "12px", alignItems: "center" }}>
            <span style={{ fontFamily: "monospace", fontSize: "11px", color: "#64748b" }}>#{id}</span>
            <strong>{name}</strong>
            <span style={{ fontSize: "11px", color: "var(--text-muted)" }}>[{category}]</span>
          </div>
          <div style={{ display: "flex", gap: "12px", alignItems: "center" }}>
            <span style={{ fontWeight: "700", color: "#38bdf8" }}>${price}</span>
            <span className="fiber-tag" style={{ color: "#fca5a5" }}>Renders: {renderCount.current}</span>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PerformanceCrucibleLab />);
  </script>
</body>
</html>
