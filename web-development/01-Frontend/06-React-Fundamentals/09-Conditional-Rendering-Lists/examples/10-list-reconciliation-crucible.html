<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI 09 — Part 10: List Reconciliation Crucible Diagnostic Lab</title>
  
  <!-- React 18 & Babel via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 24px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .header-title h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .header-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .badge-primary {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }
    
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    
    @media (max-width: 1024px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
    
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      padding: 18px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 10px;
    }
    
    .panel-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    button.btn-primary {
      background: rgba(59, 130, 246, 0.25);
      border-color: rgba(59, 130, 246, 0.5);
      color: #93c5fd;
    }
    
    button.btn-danger {
      background: rgba(244, 63, 94, 0.2);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fca5a5;
    }
    
    button.btn-emerald {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    
    .row-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .row-card:hover {
      background: rgba(15, 23, 42, 0.7);
      border-color: rgba(255, 255, 255, 0.15);
    }
    
    .fiber-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    
    .status-pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    .status-preserve { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .status-move { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .status-insert { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .status-delete { background: rgba(244, 63, 94, 0.2); color: #f87171; border: 1px solid rgba(244, 63, 94, 0.4); }

    .trace-box {
      background: #070b12;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.6;
      max-height: 280px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const INITIAL_ITEMS = [
      { id: "A", name: "Alpha Service", initialCount: 10 },
      { id: "B", name: "Beta Cluster",  initialCount: 20 },
      { id: "C", name: "Gamma Gateway", initialCount: 30 }
    ];

    function ReconciliationCrucibleLab() {
      const [items, setItems] = useState(INITIAL_ITEMS);
      const [domMutationCount, setDomMutationCount] = useState(0);
      const [useRandomKey, setUseRandomKey] = useState(false);
      const [activeDocId, setActiveDocId] = useState("doc-A");

      const [traceHistory, setTraceHistory] = useState([
        "🟢 Initial Tree Mounted: [A, B, C] -> 3 Fibers created with stable keys."
      ]);

      const addTrace = (msg) => {
        setTraceHistory(prev => [msg, ...prev.slice(0, 25)]);
      };

      // Actions
      const handleReorder = () => {
        setItems(prev => {
          if (prev.length < 3) return [...prev].reverse();
          const [first, second, third, ...rest] = prev;
          return [second, third, first, ...rest];
        });
        setDomMutationCount(c => c + 1);
        addTrace(`🔄 Reordered collection: [${items.map(i => i.id).join(", ")}] -> Triggered Fiber Map lookup & lastPlacedIndex update.`);
      };

      const handlePrepend = () => {
        const nextId = String.fromCharCode(65 + Math.floor(Math.random() * 26)) + Math.floor(Math.random() * 10);
        const newItem = { id: nextId, name: `Node ${nextId}`, initialCount: 0 };
        setItems(prev => [newItem, ...prev]);
        setDomMutationCount(c => c + 1);
        addTrace(`➕ Prepended item ${nextId} at index 0. Reconciler Pass 1 breaks; Pass 2 matches remaining.`);
      };

      const handleDeleteMiddle = () => {
        if (items.length <= 1) return;
        const target = items[1];
        setItems(prev => prev.filter((_, idx) => idx !== 1));
        setDomMutationCount(c => c + 1);
        addTrace(`❌ Deleted middle item ${target.id}. Old Fiber marked with DELETION.`);
      };

      const handleReset = () => {
        setItems(INITIAL_ITEMS);
        setUseRandomKey(false);
        setDomMutationCount(0);
        addTrace("♻️ Reset collection to initial baseline [A, B, C].");
      };

      return (
        <div className="container">
          <header>
            <div className="header-title">
              <h1>List Reconciliation Crucible Diagnostic Lab</h1>
              <p>Visualizing Fiber Linear Scan, Map Lookups, lastPlacedIndex & State Continuity</p>
            </div>
            <span className="badge badge-primary">Level 06 · KPI 09 · Part 10</span>
          </header>

          {/* Controls */}
          <div className="panel" style={{ marginBottom: "20px" }}>
            <div className="panel-header">
              <span className="panel-title">🕹️ Reconciler Action Trigger</span>
              <span style={{ fontSize: "12px", color: "var(--text-muted)" }}>
                Total DOM Mutations Tracked: <strong style={{ color: "#38bdf8" }}>{domMutationCount}</strong>
              </span>
            </div>
            <div className="btn-group">
              <button className="btn-primary" onClick={handleReorder}>
                🔄 Reorder Sequence
              </button>
              <button className="btn-emerald" onClick={handlePrepend}>
                ➕ Prepend Entity
              </button>
              <button className="btn-danger" onClick={handleDeleteMiddle}>
                ❌ Delete Middle Item
              </button>
              <button 
                className={useRandomKey ? "btn-danger" : ""}
                onClick={() => {
                  setUseRandomKey(!useRandomKey);
                  addTrace(useRandomKey ? "🔒 Restored stable keys." : "⚠️ ENABLED RANDOM KEYS: Every render forces 100% Fiber destruction!");
                }}
              >
                ⚠️ {useRandomKey ? "Disable Random Keys" : "Simulate key={Math.random()}"}
              </button>
              <button onClick={handleReset}>
                ♻️ Reset
              </button>
            </div>
          </div>

          {/* Comparison Grid */}
          <div className="grid-2">
            
            {/* Column A: Naive Index Keys */}
            <div className="panel">
              <div className="panel-header">
                <span className="panel-title" style={{ color: "#f87171" }}>
                  ❌ Strategy A: `key={index}` (Positional Slot Matching)
                </span>
                <span className="status-pill status-delete">Index Matching</span>
              </div>
              <p style={{ fontSize: "12px", color: "var(--text-muted)", marginBottom: "12px" }}>
                Fibers are matched strictly by array slot position. Counter state will appear to migrate to adjacent items during prepend/sort!
              </p>

              <div>
                {items.map((item, index) => (
                  <IndexKeyRow 
                    key={useRandomKey ? Math.random() : index} 
                    item={item} 
                    positionIndex={index} 
                  />
                ))}
              </div>
            </div>

            {/* Column B: Stable Domain Keys */}
            <div className="panel">
              <div className="panel-header">
                <span className="panel-title" style={{ color: "#34d399" }}>
                  ✅ Strategy B: `key={item.id}` (Fiber Identity Continuity)
                </span>
                <span className="status-pill status-preserve">Domain Matching</span>
              </div>
              <p style={{ fontSize: "12px", color: "var(--text-muted)", marginBottom: "12px" }}>
                Fibers are matched via stable entity keys. Local counter states and Fiber UUIDs remain 100% attached to their business entity!
              </p>

              <div>
                {items.map(item => (
                  <StableKeyRow 
                    key={useRandomKey ? Math.random() : item.id} 
                    item={item} 
                  />
                ))}
              </div>
            </div>

          </div>

          {/* Key Partitioning Demo & Reconciliation Trace */}
          <div className="grid-2">
            
            {/* Key Partitioning Sandbox */}
            <div className="panel">
              <div className="panel-header">
                <span className="panel-title">📑 Intentional Reset via Key Partitioning</span>
                <span className="status-pill status-move">key={activeDocId}</span>
              </div>
              <p style={{ fontSize: "12px", color: "var(--text-muted)", marginBottom: "10px" }}>
                Switching active documents changes the key, cleanly tearing down old editor state without stale leakage.
              </p>
              <div className="btn-group" style={{ marginBottom: "12px" }}>
                <button 
                  className={activeDocId === "doc-A" ? "btn-primary" : ""} 
                  onClick={() => setActiveDocId("doc-A")}
                >
                  Document A
                </button>
                <button 
                  className={activeDocId === "doc-B" ? "btn-primary" : ""} 
                  onClick={() => setActiveDocId("doc-B")}
                >
                  Document B
                </button>
              </div>

              {/* Keyed Editor */}
              <PartitionedEditor key={activeDocId} documentId={activeDocId} />
            </div>

            {/* Trace Stream */}
            <div className="panel">
              <div className="panel-header">
                <span className="panel-title">📜 Live Reconciliation Trace Log</span>
              </div>
              <div className="trace-box">
                {traceHistory.map((trace, idx) => (
                  <div key={idx} style={{ marginBottom: "4px" }}>
                    {trace}
                  </div>
                ))}
              </div>
            </div>

          </div>

        </div>
      );
    }

    function IndexKeyRow({ item, positionIndex }) {
      const fiberId = useRef(crypto.randomUUID().slice(0, 6));
      const [count, setCount] = useState(item.initialCount);

      return (
        <div className="row-card">
          <div>
            <strong style={{ color: "#f8fafc" }}>{item.name}</strong>
            <div style={{ fontSize: "11px", color: "var(--text-muted)", marginTop: "2px" }}>
              Slot: <span style={{ color: "#fca5a5" }}>#{positionIndex}</span> | Fiber: #{fiberId.current}
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
            <span style={{ fontSize: "14px", fontWeight: "700", color: "#38bdf8" }}>Count: {count}</span>
            <button onClick={() => setCount(c => c + 1)}>+1</button>
          </div>
        </div>
      );
    }

    function StableKeyRow({ item }) {
      const fiberId = useRef(crypto.randomUUID().slice(0, 6));
      const [count, setCount] = useState(item.initialCount);

      return (
        <div className="row-card">
          <div>
            <strong style={{ color: "#f8fafc" }}>{item.name}</strong>
            <div style={{ fontSize: "11px", color: "var(--text-muted)", marginTop: "2px" }}>
              Key: <span style={{ color: "#6ee7b7" }}>"{item.id}"</span> | Fiber: #{fiberId.current}
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
            <span style={{ fontSize: "14px", fontWeight: "700", color: "#38bdf8" }}>Count: {count}</span>
            <button onClick={() => setCount(c => c + 1)}>+1</button>
          </div>
        </div>
      );
    }

    function PartitionedEditor({ documentId }) {
      const fiberId = useRef(crypto.randomUUID().slice(0, 6));
      const [text, setText] = useState("");

      return (
        <div style={{ background: "rgba(15, 23, 42, 0.6)", padding: "12px", borderRadius: "8px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "8px", fontSize: "11px" }}>
            <span>Active Doc: <strong>{documentId}</strong></span>
            <span style={{ color: "#38bdf8" }}>Fiber: #{fiberId.current}</span>
          </div>
          <textarea
            rows="3"
            value={text}
            onChange={e => setText(e.target.value)}
            placeholder={`Type draft notes for ${documentId}...`}
            style={{
              width: "100%",
              background: "#070b12",
              border: "1px solid rgba(255,255,255,0.1)",
              borderRadius: "6px",
              color: "#f8fafc",
              padding: "8px",
              fontFamily: "inherit",
              fontSize: "12px",
              resize: "none"
            }}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ReconciliationCrucibleLab />);
  </script>
</body>
</html>
