<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI 09 — Part 09: List State Architecture & Entity Lifecycle Diagnostic Lab</title>
  
  <!-- React 18 & Babel via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 24px;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .header-title h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .header-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .badge-primary {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }
    
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    
    @media (max-width: 1024px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
    
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      padding: 18px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 10px;
    }
    
    .panel-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    button.btn-primary {
      background: rgba(59, 130, 246, 0.25);
      border-color: rgba(59, 130, 246, 0.5);
      color: #93c5fd;
    }
    button.btn-primary:hover:not(:disabled) {
      background: rgba(59, 130, 246, 0.4);
    }
    
    button.btn-danger {
      background: rgba(244, 63, 94, 0.2);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fca5a5;
    }
    button.btn-danger:hover:not(:disabled) {
      background: rgba(244, 63, 94, 0.35);
    }
    
    button.btn-emerald {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    
    input[type="text"], input[type="number"] {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    
    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--accent-cyan);
    }
    
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }
    
    .search-bar input {
      flex: 1;
    }
    
    /* List Item Row Card */
    .row-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .row-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(15, 23, 42, 0.7);
    }
    
    .row-card.selected {
      border-color: rgba(59, 130, 246, 0.5);
      background: rgba(59, 130, 246, 0.1);
    }
    
    .row-card.pending {
      opacity: 0.6;
      border-style: dashed;
      border-color: var(--accent-amber);
    }
    
    .row-card.corrupted {
      border-color: rgba(244, 63, 94, 0.6);
      background: rgba(244, 63, 94, 0.08);
    }
    
    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    
    .row-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .fiber-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #38bdf8;
    }
    
    .fiber-tag.mutated {
      color: #f43f5e;
      border-color: rgba(244, 63, 94, 0.4);
    }
    
    .row-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    
    .row-controls label {
      font-size: 11px;
      color: var(--text-muted);
    }
    
    .status-pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .status-dirty {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .status-synced {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    
    /* Telemetry Table */
    .telemetry-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
    }
    
    .telemetry-table th {
      background: rgba(15, 23, 42, 0.9);
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid var(--card-border);
      color: var(--text-muted);
    }
    
    .telemetry-table td {
      padding: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    
    .log-box {
      background: #070b12;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      height: 180px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.5;
    }
    
    .log-entry {
      margin-bottom: 4px;
      display: flex;
      gap: 8px;
    }
    .log-time { color: #64748b; }
    .log-info { color: #38bdf8; }
    .log-warn { color: #fbbf24; }
    .log-error { color: #f43f5e; }
    .log-success { color: #34d399; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useMemo } = React;

    const INITIAL_ITEMS = [
      { id: "sku-101", name: "Mechanical Keyboard", baselinePrice: 120 },
      { id: "sku-102", name: "Wireless Gaming Mouse", baselinePrice: 75 },
      { id: "sku-103", name: "4K UHD Monitor 27\"", baselinePrice: 380 },
      { id: "sku-104", name: "Noise Cancelling Headset", baselinePrice: 190 }
    ];

    function DiagnosticLab() {
      // Shared Canonical Domain Items
      const [items, setItems] = useState(INITIAL_ITEMS);
      const [filterQuery, setFilterQuery] = useState("");
      const [sortBy, setSortBy] = useState("none"); // "none" | "price_asc" | "price_desc"
      const [virtualWindowActive, setVirtualWindowActive] = useState(false);
      
      // Architecture B Collection Registries
      const [selectedIds, setSelectedIds] = useState(new Set(["sku-102"]));
      const [draftsById, setDraftsById] = useState({
        "sku-102": { draftPrice: 85, note: "Promo discount applied" }
      });
      const [operationsById, setOperationsById] = useState({});
      
      // Event Telemetry Log
      const [logs, setLogs] = useState([]);
      const addLog = (msg, level = "info") => {
        const time = new Date().toLocaleTimeString().split(" ")[0];
        setLogs(prev => [{ id: crypto.randomUUID(), time, msg, level }, ...prev.slice(0, 49)]);
      };

      // In-Render Derivation for Filtering & Sorting
      const visibleItems = useMemo(() => {
        let result = items.filter(item => 
          item.name.toLowerCase().includes(filterQuery.toLowerCase()) ||
          item.id.toLowerCase().includes(filterQuery.toLowerCase())
        );

        if (sortBy === "price_asc") {
          result = [...result].sort((a, b) => a.baselinePrice - b.baselinePrice);
        } else if (sortBy === "price_desc") {
          result = [...result].sort((a, b) => b.baselinePrice - a.baselinePrice);
        }

        // Simulate virtualization window (slice 0 to 2)
        if (virtualWindowActive) {
          result = result.slice(0, 2);
        }

        return result;
      }, [items, filterQuery, sortBy, virtualWindowActive]);

      // Mutations
      const handlePrepend = () => {
        const nextNum = Math.floor(100 + Math.random() * 900);
        const newItem = {
          id: `sku-${nextNum}`,
          name: `USB-C Docking Hub #${nextNum}`,
          baselinePrice: 95
        };
        setItems(prev => [newItem, ...prev]);
        addLog(`➕ Prepended item ${newItem.name} (id: ${newItem.id}) to start of list`, "success");
      };

      const handleSortToggle = () => {
        const nextSort = sortBy === "none" ? "price_asc" : sortBy === "price_asc" ? "price_desc" : "none";
        setSortBy(nextSort);
        addLog(`🔄 Changed sort strategy to "${nextSort}"`, "info");
      };

      const handleAsyncDelete = async (entityId) => {
        const requestId = crypto.randomUUID().slice(0, 6);
        addLog(`⚡ [Async Req #${requestId}] Dispatched deletion for ${entityId}`, "warn");

        setOperationsById(prev => ({
          ...prev,
          [entityId]: { requestId, type: "delete", status: "pending" }
        }));

        // Simulate 1200ms latency network call
        setTimeout(() => {
          // Rollback simulation chance or settle
          setItems(prev => prev.filter(i => i.id !== entityId));
          setOperationsById(prev => {
            const next = { ...prev };
            delete next[entityId];
            return next;
          });
          // Cleanup registries
          setSelectedIds(prev => {
            const next = new Set(prev);
            next.delete(entityId);
            return next;
          });
          setDraftsById(prev => {
            const next = { ...prev };
            delete next[entityId];
            return next;
          });
          addLog(`✅ [Async Req #${requestId}] Deletion settled successfully for ${entityId}`, "success");
        }, 1200);
      };

      return (
        <div className="container">
          <header>
            <div className="header-title">
              <h1>List State Architecture & Entity Lifecycle Diagnostic Lab</h1>
              <p>Visualizing Fiber Identity, 4 Orthogonal Lifetimes, State Registries & Reconciliation</p>
            </div>
            <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
              <span className="badge badge-primary">Level 06 · KPI 09 · Part 09</span>
            </div>
          </header>

          {/* Global List Controls */}
          <div className="panel" style={{ marginBottom: "20px" }}>
            <div className="panel-header">
              <span className="panel-title">🕹️ Global Collection Operations</span>
              <span style={{ fontSize: "12px", color: "var(--text-muted)" }}>
                Total Entities: {items.length} | Visible: {visibleItems.length}
              </span>
            </div>
            <div className="btn-group">
              <button className="btn-emerald" onClick={handlePrepend}>
                ➕ Prepend Entity
              </button>
              <button className="btn-primary" onClick={handleSortToggle}>
                🔄 Sort: {sortBy.toUpperCase()}
              </button>
              <button 
                className={virtualWindowActive ? "btn-danger" : ""}
                onClick={() => {
                  setVirtualWindowActive(!virtualWindowActive);
                  addLog(virtualWindowActive ? "🪟 Virtual Window Disabled (All rows mounted)" : "🪟 Virtual Window Enabled (Only first 2 rows mounted)", "warn");
                }}
              >
                🪟 {virtualWindowActive ? "Disable Virtualization" : "Simulate Virtual Window (Top 2)"}
              </button>
              <button onClick={() => {
                setItems(INITIAL_ITEMS);
                setFilterQuery("");
                setSortBy("none");
                setVirtualWindowActive(false);
                setDraftsById({ "sku-102": { draftPrice: 85, note: "Promo discount applied" } });
                setSelectedIds(new Set(["sku-102"]));
                addLog("♻️ Reset entire collection state to initial baseline", "info");
              }}>
                ♻️ Reset Collection
              </button>
            </div>

            <div className="search-bar">
              <span style={{ fontSize: "13px" }}>🔍 Search / Filter:</span>
              <input 
                type="text" 
                placeholder="Type to filter by name (e.g. 'Mouse', 'Keyboard')..." 
                value={filterQuery}
                onChange={e => {
                  setFilterQuery(e.target.value);
                  addLog(`🔎 Filter changed to: "${e.target.value}"`, "info");
                }}
              />
              {filterQuery && (
                <button onClick={() => setFilterQuery("")}>Clear Filter</button>
              )}
            </div>
          </div>

          {/* Comparison Grid */}
          <div className="grid-2">
            
            {/* Column A: Anti-Pattern (Row-Local State with Index Keys) */}
            <div className="panel">
              <div className="panel-header">
                <span className="panel-title" style={{ color: "#f87171" }}>
                  ❌ Architecture A: Row-Local State (`key={index}`)
                </span>
                <span className="status-pill status-dirty">Index Identity</span>
              </div>
              <p style={{ fontSize: "12px", color: "var(--text-muted)", marginBottom: "12px" }}>
                Drafts live inside row's local <code>useState</code>. Reordering/prepending shifts state to the wrong entity! Filtering destroys drafts on unmount.
              </p>

              <div>
                {visibleItems.map((item, index) => (
                  <AntiPatternRow 
                    key={index} 
                    item={item} 
                    positionIndex={index}
                    onDelete={() => handleAsyncDelete(item.id)}
                    isPending={operationsById[item.id]?.status === "pending"}
                    log={addLog}
                  />
                ))}
              </div>
            </div>

            {/* Column B: Production Architecture (Entity-Keyed Registry with Stable Keys) */}
            <div className="panel">
              <div className="panel-header">
                <span className="panel-title" style={{ color: "#34d399" }}>
                  ✅ Architecture B: Entity Registry (`key={item.id}`)
                </span>
                <span className="status-pill status-synced">Domain Identity</span>
              </div>
              <p style={{ fontSize: "12px", color: "var(--text-muted)", marginBottom: "12px" }}>
                Drafts and selection live in collection registries (<code>draftsById</code>, <code>selectedIds</code>). State survives reordering, filtering, and unmounting!
              </p>

              <div>
                {visibleItems.map(item => (
                  <ProductionRow
                    key={item.id}
                    item={item}
                    isSelected={selectedIds.has(item.id)}
                    draft={draftsById[item.id]}
                    isPending={operationsById[item.id]?.status === "pending"}
                    onToggleSelect={() => {
                      setSelectedIds(prev => {
                        const next = new Set(prev);
                        if (next.has(item.id)) next.delete(item.id);
                        else next.add(item.id);
                        return next;
                      });
                      addLog(`🔘 Toggled selection for entity ${item.id}`, "info");
                    }}
                    onDraftChange={(draftPrice, note) => {
                      setDraftsById(prev => ({
                        ...prev,
                        [item.id]: { draftPrice, note }
                      }));
                      addLog(`📝 Updated draft in registry for entity ${item.id}`, "info");
                    }}
                    onDelete={() => handleAsyncDelete(item.id)}
                    log={addLog}
                  />
                ))}
              </div>
            </div>

          </div>

          {/* Telemetry & Registry Inspector */}
          <div className="grid-2">
            
            {/* Live Collection Telemetry */}
            <div className="panel">
              <div className="panel-header">
                <span className="panel-title">📊 Entity Registry Telemetry Matrix</span>
              </div>
              <div style={{ overflowX: "auto" }}>
                <table className="telemetry-table">
                  <thead>
                    <tr>
                      <th>Entity ID</th>
                      <th>Baseline</th>
                      <th>Visible</th>
                      <th>Selected</th>
                      <th>Registry Draft</th>
                      <th>Async Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {items.map(item => {
                      const isVisible = visibleItems.some(v => v.id === item.id);
                      const isSelected = selectedIds.has(item.id);
                      const draft = draftsById[item.id];
                      const op = operationsById[item.id];
                      return (
                        <tr key={item.id}>
                          <td style={{ color: "#38bdf8" }}>{item.id}</td>
                          <td>${item.baselinePrice}</td>
                          <td>{isVisible ? "🟢 YES" : "🔴 HIDDEN"}</td>
                          <td>{isSelected ? "🔵 YES" : "⚪ NO"}</td>
                          <td>{draft ? `📝 $${draft.draftPrice} (${draft.note || "draft"})` : "—"}</td>
                          <td>{op ? `⚡ ${op.type} (${op.status})` : "idle"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Event Timeline */}
            <div className="panel">
              <div className="panel-header">
                <span className="panel-title">⏱️ Real-Time Lifecycle Event Stream</span>
                <button onClick={() => setLogs([])}>Clear</button>
              </div>
              <div className="log-box">
                {logs.length === 0 ? (
                  <div style={{ color: "#475569", textAlign: "center", padding: "20px" }}>
                    No events recorded yet. Perform actions above.
                  </div>
                ) : (
                  logs.map(l => (
                    <div key={l.id} className="log-entry">
                      <span className="log-time">[{l.time}]</span>
                      <span className={`log-${l.level}`}>{l.msg}</span>
                    </div>
                  ))
                )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    // ❌ FLAWED ROW: Row-local state with index identity
    function AntiPatternRow({ item, positionIndex, onDelete, isPending, log }) {
      const fiberId = useRef(crypto.randomUUID().slice(0, 6));
      const [localDraftPrice, setLocalDraftPrice] = useState(item.baselinePrice);
      const [localNote, setLocalNote] = useState("");
      const [localSelected, setLocalSelected] = useState(false);

      useEffect(() => {
        log(`🔴 [MOUNT-INDEX] Slot #${positionIndex} bound to Fiber [${fiberId.current}] for item ${item.id}`, "warn");
        return () => {
          log(`💀 [UNMOUNT-INDEX] Slot #${positionIndex} Fiber [${fiberId.current}] DESTROYED!`, "error");
        };
      }, []);

      const isDirty = localDraftPrice !== item.baselinePrice || localNote !== "";

      return (
        <div className={`row-card ${localSelected ? "selected" : ""} ${isPending ? "pending" : ""}`}>
          <div className="row-header">
            <div className="row-info">
              <input 
                type="checkbox" 
                checked={localSelected} 
                onChange={e => setLocalSelected(e.target.checked)} 
              />
              <strong>{item.name}</strong>
              <span className="fiber-tag mutated">Fiber: #{fiberId.current} (Slot {positionIndex})</span>
            </div>
            <div>
              {isDirty && <span className="status-pill status-dirty">Local Draft</span>}
              <button className="btn-danger" disabled={isPending} onClick={onDelete} style={{ marginLeft: "8px" }}>
                {isPending ? "..." : "Delete"}
              </button>
            </div>
          </div>

          <div className="row-controls">
            <label>Price ($): </label>
            <input 
              type="number" 
              style={{ width: "80px" }}
              value={localDraftPrice} 
              onChange={e => setLocalDraftPrice(Number(e.target.value))} 
            />
            <label>Note: </label>
            <input 
              type="text" 
              placeholder="Row-local note..." 
              style={{ flex: 1 }}
              value={localNote} 
              onChange={e => setLocalNote(e.target.value)} 
            />
          </div>
        </div>
      );
    }

    // ✅ ROBUST ROW: Pure projection reading from Entity Registries
    function ProductionRow({
      item,
      isSelected,
      draft,
      isPending,
      onToggleSelect,
      onDraftChange,
      onDelete,
      log
    }) {
      const fiberId = useRef(crypto.randomUUID().slice(0, 6));

      useEffect(() => {
        log(`🟢 [MOUNT-ENTITY] Fiber [${fiberId.current}] permanently matched to Entity ${item.id}`, "info");
        return () => {
          log(`🟡 [UNMOUNT-ENTITY] Fiber [${fiberId.current}] unmounted (Entity ${item.id} state preserved in Registry)`, "info");
        };
      }, [item.id]);

      const currentPrice = draft?.draftPrice ?? item.baselinePrice;
      const currentNote = draft?.note ?? "";
      const isDirty = draft !== undefined && (draft.draftPrice !== item.baselinePrice || draft.note !== "");

      return (
        <div className={`row-card ${isSelected ? "selected" : ""} ${isPending ? "pending" : ""}`}>
          <div className="row-header">
            <div className="row-info">
              <input 
                type="checkbox" 
                checked={isSelected} 
                onChange={onToggleSelect} 
              />
              <strong>{item.name}</strong>
              <span className="fiber-tag">Fiber: #{fiberId.current} | {item.id}</span>
            </div>
            <div>
              {isDirty ? (
                <span className="status-pill status-dirty">Registry Draft</span>
              ) : (
                <span className="status-pill status-synced">Synced</span>
              )}
              <button className="btn-danger" disabled={isPending} onClick={onDelete} style={{ marginLeft: "8px" }}>
                {isPending ? "..." : "Delete"}
              </button>
            </div>
          </div>

          <div className="row-controls">
            <label>Price ($): </label>
            <input 
              type="number" 
              style={{ width: "80px" }}
              value={currentPrice} 
              onChange={e => onDraftChange(Number(e.target.value), currentNote)} 
            />
            <label>Note: </label>
            <input 
              type="text" 
              placeholder="Registry-backed note..." 
              style={{ flex: 1 }}
              value={currentNote} 
              onChange={e => onDraftChange(currentPrice, e.target.value)} 
            />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<DiagnosticLab />);
  </script>
</body>
</html>
